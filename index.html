// [FIX 3] Zentrale ISO-Wochenfunktion (Montag-Start), genutzt überall
function isoWeekKey(date) {
  const dt = new Date(date);
  // ISO: Wochentag 1=Mo..7=So
  const dayOfWeek = dt.getDay() || 7;
  // Donnerstag dieser Woche → bestimmt das Jahr
  dt.setDate(dt.getDate() + 4 - dayOfWeek);
  const year = dt.getFullYear();
  const jan4 = new Date(year, 0, 4);
  const weekNum = Math.ceil(((dt - jan4) / 86400000 + 1) / 7);
  return `${year}-W${String(weekNum).padStart(2,"0")}`;
}

// [FIX 2] vol() – nur done===true Sätze; done===undefined (Seed-Daten) gelten als done
const isDone = s => s.done !== false;

const calcKcal = (type, durationMin, bodyWeightKg) =>

function calcStreak(sessions, cardio=[]) {
  const allDates = [...sessions.map(s=>s.date), ...cardio.map(c=>c.date)];
  if (!allDates.length) return 0;
  const days = [...new Set(allDates.map(d=>dayKey(d)))].sort((a,b)=>new Date(b)-new Date(a));
  let streak=0, cur=new Date(); cur.setHours(0,0,0,0);
  for (const d of days) {
    const dd=new Date(d); dd.setHours(0,0,0,0);
    if (Math.round((cur-dd)/86400000) <= 1) { streak++; cur=dd; } else break;
  }
  return streak;
}

// [FIX 3] Wochenstart Montag (DE/ISO)
function getWeekActivities(sessions, cardio=[]) {
  const now = new Date();
  const dow = now.getDay(); // 0=So
  const daysFromMon = dow === 0 ? 6 : dow - 1;
  const ws = new Date(now);
  ws.setDate(now.getDate() - daysFromMon);
  ws.setHours(0,0,0,0);
  return {
    sessions: sessions.filter(s => new Date(s.date) >= ws),
    cardio:   cardio.filter(c => new Date(c.date) >= ws),
  };
}

// [FIX 2] getPRs – nur done===true Sätze mit Gewicht > 0
function getPRs(sessions) {
  const p = {};
  sessions.forEach(s => s.sets.forEach(x => {
    if (isDone(x) && x.weight > 0 && (!p[x.eid] || x.weight > p[x.eid])) p[x.eid] = x.weight;
  }));
  return p;
}

      if (s.length < 4) return false;
      const ws = [...new Set(s.map(x => isoWeekKey(x.date)))].sort();
      let consec=0, max=0, prev=null;
      ws.forEach(w => {
        if (prev) {
          const [y1,n1] = [parseInt(prev.split("-W")[0]), parseInt(prev.split("-W")[1])];
          const [y2,n2] = [parseInt(w.split("-W")[0]),    parseInt(w.split("-W")[1])];
          // Aufeinanderfolgende ISO-Wochen (auch Jahreswechsel KW52→KW01)
          const consecutive = (y1===y2 && n2-n1===1) || (y2-y1===1 && n1>=52 && n2===1);
          consec = consecutive ? consec+1 : 1;

// PERSISTENCE
// ═══════════════════════════════════════════════════════
function usePersistedState(key, seed) {
  const [s, setS] = useState(() => {
    try {
      const v = localStorage.getItem("ft5_"+key);
      return v ? JSON.parse(v) : seed;
    } catch { return seed; }
  });
  const set = useCallback(u => {
    setS(prev => {
      const next = typeof u === "function" ? u(prev) : u;
      try { localStorage.setItem("ft5_"+key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [s, set];
}

// ═══════════════════════════════════════════════════════
// CHARTS
// ═══════════════════════════════════════════════════════
const LineChart = ({data, color=T.accent, height=72}) => {
  if (!data || data.length < 2) return (
    <div style={{height, display:"flex", alignItems:"center", justifyContent:"center", color:T.muted, fontSize:12}}>
      Zu wenig Daten
    </div>
  );
  const W=280, H=height, pad=8;
  const mn=Math.min(...data), mx=Math.max(...data), rng=mx-mn||0.1;
  const py = v => H-pad-((v-mn)/rng)*(H-pad*2);
  const pts = data.map((v,i) => `${(i/(data.length-1))*W},${py(v)}`).join(" ");
  const gid = `lc${color.replace(/[^a-z0-9]/gi,"")}${height}`;
  return (
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible"}}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.28"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon fill={`url(#${gid})`} points={`0,${H} ${pts} ${W},${H}`}/>
      <polyline fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points={pts}/>
      {data.map((v,i) => {
        const x=(i/(data.length-1))*W, y=py(v), last=i===data.length-1;
        return <circle key={i} cx={x} cy={y} r={last?5:2.5} fill={color} stroke={T.bg} strokeWidth={last?2:0}/>;
      })}
    </svg>
  );
};

const BarChart = ({data, labels, color=T.blue, height=80}) => {
  if (!data?.length) return null;
  const mx = Math.max(...data) || 1;
  return (
    <div style={{display:"flex", alignItems:"flex-end", gap:5, height}}>
      {data.map((v,i) => (
        <div key={i} style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:3}}>
          <div style={{
            background:`linear-gradient(to top,${color}99,${color}33)`,
            borderRadius:"4px 4px 0 0", width:"100%",
            height:`${(v/mx)*(height-18)}px`,
            border:`1px solid ${color}55`, minHeight:2,
          }}/>
          {labels && <div style={{fontSize:8, color:T.muted, textAlign:"center", lineHeight:1}}>{labels[i]}</div>}
        </div>
      ))}
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// REST TIMER
// ═══════════════════════════════════════════════════════
const RestTimer = ({seconds, onDone, onSkip}) => {
  const [left, setLeft] = useState(seconds);
  const ref = useRef(null);
  useEffect(() => {
    ref.current = setInterval(() => setLeft(p => {
      if (p <= 1) { clearInterval(ref.current); onDone(); return 0; }
      return p-1;
    }), 1000);
    return () => clearInterval(ref.current);
  }, []);
  const pct=(left/seconds)*100, r=44, circ=2*Math.PI*r, m=Math.floor(left/60), s=left%60;
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(7,7,15,0.93)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:300,backdropFilter:"blur(10px)"}}>
      <div style={{fontSize:11,color:T.sub,letterSpacing:2,marginBottom:24}}>PAUSE</div>
      <div style={{position:"relative",width:130,height:130,marginBottom:28}}>
        <svg width="130" height="130" style={{transform:"rotate(-90deg)"}}>
          <circle cx="65" cy="65" r={r} fill="none" stroke={T.border} strokeWidth="7"/>
          <circle cx="65" cy="65" r={r} fill="none" stroke={T.accent} strokeWidth="7"
            strokeDasharray={circ} strokeDashoffset={circ*(1-pct/100)} strokeLinecap="round"
            style={{transition:"stroke-dashoffset 1s linear"}}/>
        </svg>
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{fontSize:38,fontWeight:900,color:T.accent,fontVariantNumeric:"tabular-nums"}}>
            {m>0?`${m}:${s.toString().padStart(2,"0")}`:s}
          </div>
          <div style={{fontSize:10,color:T.muted}}>sek</div>
        </div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:24}}>
        {[-15,+15,+30].map(d => (
          <button key={d} onClick={()=>setLeft(l=>Math.max(0,l+d))} style={{
            background:T.bgAlt, color:d<0?T.red:T.green,
            border:`1px solid ${T.border}`, borderRadius:10,
            padding:"8px 14px", fontWeight:700, fontSize:13, cursor:"pointer",
          }}>{d>0?"+":""}{d}s</button>
        ))}
      </div>
      <div style={{display:"flex",gap:10}}>
        <Btn v="ghost" onClick={onSkip} style={{padding:"10px 24px"}}>Überspringen</Btn>
        <Btn onClick={onDone} style={{padding:"10px 28px"}}>Fertig ✓</Btn>
      </div>
    </div>
  );
};

const CardioScreen = ({cardio, onSave, settings}) => {
  const [view,setView]  = useState("log");
  const [type,setType]  = useState("Joggen");
  const [dur,setDur]    = useState("");
  const [dist,setDist]  = useState("");
  const [note,setNote]  = useState("");
  const [date,setDate]  = useState(new Date().toISOString().slice(0,16));

  const save = () => {
    const d = parseInt(dur);
    if (!d || d <= 0) return;
    const km = parseFloat(dist) || null;
    onSave({
      id:uid(), type,
      date: new Date(date).toISOString(),
      duration: d,
      distance: km && km > 0 ? km : null,
      note,
      kcal: calcKcal(type, d, settings.bodyWeight||75),
    });
    setDur(""); setDist(""); setNote("");
  };

  const totalKm   = cardio.reduce((s,c)=>s+(c.distance||0), 0);
  const totalMin  = cardio.reduce((s,c)=>s+(c.duration||0), 0);
  const totalKcal = cardio.reduce((s,c)=>s+(c.kcal||0),    0);

  // [FIX 6] Pace nur wenn Distanz > 0
  const durNum  = parseInt(dur)||0;
  const distNum = parseFloat(dist)||0;
  const pace    = durNum>0 && distNum>0 ? (durNum/distNum).toFixed(1) : null;

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px"}}>
        <div style={{fontSize:24,fontWeight:900,color:T.text,marginBottom:12}}>Aktivitäten</div>
        <div style={{display:"flex",gap:8}}>
          {[{v:"log",l:"➕ Erfassen"},{v:"history",l:"📋 Verlauf"},{v:"stats",l:"📊 Statistik"}].map(b=>(
            <button key={b.v} onClick={()=>setView(b.v)} style={{background:view===b.v?T.accent:T.bgCard,color:view===b.v?"#07070F":T.sub,border:`1px solid ${view===b.v?T.accent:T.border}`,borderRadius:9,padding:"7px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{b.l}</button>
          ))}
        </div>
      </div>

      {view==="log" && <>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
          {[{l:"TOTAL km",v:totalKm.toFixed(1),c:T.green},{l:"GESAMT MIN",v:totalMin,c:T.blue},{l:"KCAL (ca.)",v:Math.round(totalKcal),c:T.orange}].map(s=>(
            <Card key={s.l} style={{padding:12,textAlign:"center"}}>
              <div style={{fontSize:20,fontWeight:900,color:s.c}}>{s.v}</div>
              <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
            </Card>
          ))}
        </div>
        <Card>
          <Lbl>AKTIVITÄT ERFASSEN</Lbl>
          <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:12,paddingBottom:2}}>
            {CARDIO_TYPES.map(t=>(
              <button key={t} onClick={()=>setType(t)} style={{background:type===t?(CARDIO_COLOR[t]||T.accent):T.bgAlt,color:type===t?"#07070F":T.sub,border:`1px solid ${type===t?(CARDIO_COLOR[t]||T.accent):T.border}`,borderRadius:9,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
                {CARDIO_ICONS[t]} {t}
              </button>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><Lbl>DAUER (Minuten)</Lbl><Inp value={dur}  onChange={setDur}  placeholder="30" type="number"/></div>
            <div><Lbl>DISTANZ (km)</Lbl>   <Inp value={dist} onChange={setDist} placeholder="3.5" type="number"/></div>
          </div>
          <div style={{marginBottom:8}}><Lbl>DATUM & UHRZEIT</Lbl><Inp value={date} onChange={setDate} type="datetime-local"/></div>
          <div style={{marginBottom:12}}><Lbl>NOTIZ</Lbl><Inp value={note} onChange={setNote} placeholder="Strecke, Tempo, Wie war's?"/></div>

            <div style={{padding:"10px 12px",background:T.accentGlow,borderRadius:10,marginBottom:12,fontSize:12,color:T.accentDim}}>

  const [name,setName]=useState(plan?.name||"");
  const [desc,setDesc]=useState(plan?.desc||"");
  const [days,setDays]=useState(plan?.days||[]);
  const [activeDay,setActiveDay]=useState(0);
  const [showDB,setShowDB]=useState(false);

  const addDay   = () => { setDays(d=>[...d,{id:uid(),name:`Tag ${d.length+1}`,exercises:[]}]); setActiveDay(days.length); };
  const remDay   = i  => { setDays(d=>d.filter((_,j)=>j!==i)); setActiveDay(a=>Math.max(0,a-1)); };
  const updDayName=(i,v)=> setDays(d=>d.map((x,j)=>j===i?{...x,name:v}:x));
  const addEx    = ex  => { setDays(d=>d.map((x,i)=>i===activeDay?{...x,exercises:[...x.exercises,{eid:ex.id,sets:3,reps:10,weight:0,rest:90}]}:x)); setShowDB(false); };
  const remEx    = (di,ei) => setDays(d=>d.map((x,i)=>i===di?{...x,exercises:x.exercises.filter((_,j)=>j!==ei)}:x));
  const updEx    = (di,ei,f,v) => setDays(d=>d.map((x,i)=>i===di?{...x,exercises:x.exercises.map((e,j)=>j===ei?{...e,[f]:isNaN(Number(v))?v:Number(v)}:e)}:x));

  if (showDB) return (
    <div>
      <div style={{padding:"16px 16px 0",display:"flex",alignItems:"center",gap:10}}>
        <Btn v="ghost" onClick={()=>setShowDB(false)} style={{padding:"8px 14px"}}>← Zurück</Btn>
      </div>
      <ExerciseDBScreen onSelect={addEx} selectable selected={days[activeDay]?.exercises.map(e=>e.eid)||[]}/>
    </div>
  );

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"20px 0 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:20,fontWeight:900,color:T.text}}>{plan?"Bearbeiten":"Neuer Plan"}</div>
        <div style={{display:"flex",gap:8}}>
          <Btn v="ghost" onClick={onCancel} style={{padding:"8px 14px"}}>Abbruch</Btn>
          <Btn disabled={!name.trim()} onClick={()=>onSave({id:plan?.id||uid(),name,desc,days})} style={{padding:"8px 18px"}}>Speichern</Btn>
        </div>
      </div>
      <div style={{marginBottom:10}}><Lbl>PLANNAME</Lbl><Inp value={name} onChange={setName} placeholder="Mein Plan"/></div>
      <div style={{marginBottom:14}}><Lbl>BESCHREIBUNG</Lbl><Inp value={desc} onChange={setDesc} placeholder="Kurze Beschreibung..."/></div>
      <div style={{display:"flex",gap:7,overflowX:"auto",marginBottom:14,paddingBottom:2}}>
        {days.map((day,i)=>(
          <button key={day.id} onClick={()=>setActiveDay(i)} style={{background:activeDay===i?T.accent:T.bgCard,color:activeDay===i?"#07070F":T.sub,border:`1px solid ${activeDay===i?T.accent:T.border}`,borderRadius:9,padding:"6px 14px",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{day.name}</button>
        ))}
        <button onClick={addDay} style={{background:T.bgAlt,color:T.accent,border:`1px dashed ${T.accent}`,borderRadius:9,padding:"6px 14px",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Tag</button>
      </div>
      {days[activeDay] && (
        <Card>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <input value={days[activeDay].name} onChange={e=>updDayName(activeDay,e.target.value)}
              style={{background:"transparent",border:"none",outline:"none",fontSize:16,fontWeight:700,color:T.accent,flex:1}}/>
            <button onClick={()=>remDay(activeDay)} style={{background:"none",border:"none",cursor:"pointer",color:T.red,fontSize:18}}>🗑</button>
          </div>
          {/* [FIX 8] key=ex.eid+j statt nur j → stabil bei Umsortierung */}
          {days[activeDay].exercises.map((ex,j)=>{
            const e=EDB.find(x=>x.id===ex.eid);
            return (
              <div key={`${ex.eid}-${j}`} style={{background:T.bgAlt,borderRadius:12,padding:12,marginBottom:8,border:`1px solid ${T.border}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:T.text}}>{e?.name||"Unbekannte Übung"}</div>
                    <div style={{fontSize:11,color:T.sub}}>{e?.eq}</div>
                  </div>
                  <button onClick={()=>remEx(activeDay,j)} style={{background:"none",border:"none",cursor:"pointer",color:T.red,fontSize:16}}>✕</button>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
                  {[{l:"Sätze",f:"sets",v:ex.sets},{l:"Wdh",f:"reps",v:ex.reps},{l:"kg",f:"weight",v:ex.weight},{l:"Pause(s)",f:"rest",v:ex.rest}].map(fi=>(
                    <div key={fi.f}>
                      <div style={{fontSize:9,color:T.muted,textAlign:"center",marginBottom:3}}>{fi.l}</div>
                      <input type="number" value={fi.v} onChange={e=>updEx(activeDay,j,fi.f,e.target.value)}
                        style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,padding:"6px 4px",color:T.text,fontSize:14,fontWeight:700,width:"100%",textAlign:"center",boxSizing:"border-box"}}/>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
          <Btn v="secondary" onClick={()=>setShowDB(true)} full style={{marginTop:6}}>+ Übung hinzufügen</Btn>
        </Card>
      )}
    </div>
  );
};

            <div style={{fontSize:15,fontWeight:700,color:T.accent,marginBottom:10}}>{day.name}</div>

// WORKOUT SCREEN  [FIX 4 + FIX 5]
// ═══════════════════════════════════════════════════════
const WorkoutScreen = ({plans, onSave, preselectedPlanId}) => {
  const [phase,setPhase]   = useState(preselectedPlanId ? "preselect" : "select");
  const [planId,setPlanId] = useState(preselectedPlanId||null);
  const [dayId,setDayId]   = useState(null);
  const [sets,setSets]     = useState({});
  // [FIX: t0 als Ref, wird erst in start() gesetzt]
  const t0Ref              = useRef(null);
  const [elapsed,setElapsed]= useState(0);
  const [note,setNote]     = useState("");
  const [rest,setRest]     = useState(null);
  // [FIX 4] Warnung bei 0 abgeschlossenen Sätzen
  const [warnEmpty,setWarnEmpty] = useState(false);

  useEffect(() => {
    if (phase !== "active") return;
    const iv = setInterval(() => setElapsed(Math.floor((Date.now()-t0Ref.current)/1000)), 1000);
    return () => clearInterval(iv);
  }, [phase]);

  const start = (pId, dId) => {
    t0Ref.current = Date.now();
    setElapsed(0);
    setWarnEmpty(false);
    setPlanId(pId); setDayId(dId);
    const day = plans.find(p=>p.id===pId)?.days.find(d=>d.id===dId);
    if (!day) return;
    const init = {};
    day.exercises.forEach(ex => {
      init[ex.eid] = init[ex.eid] || [];
      init[ex.eid].push(...Array.from({length:ex.sets}, (_,i) => ({
        setN:i+1, reps:ex.reps, weight:ex.weight, done:false,
      })));
    });
    setSets(init);
    setPhase("active");
  };

  const toggle = (eid,idx,restSecs) => setSets(prev => {
    const upd = {...prev,[eid]:prev[eid].map((s,i)=>i===idx?{...s,done:!s.done}:s)};
    if (!prev[eid][idx].done && restSecs>0) setRest({secs:restSecs});
    return upd;
  });

  const upd    = (eid,idx,f,v) => setSets(p=>({...p,[eid]:p[eid].map((s,i)=>i===idx?{...s,[f]:parseFloat(v)||0}:s)}));
  const addSet = (eid,tmpl)    => setSets(p=>({...p,[eid]:[...p[eid],{setN:p[eid].length+1,reps:tmpl.reps,weight:tmpl.weight,done:false}]}));

  const finish = () => {
    const day = plans.find(p=>p.id===planId)?.days.find(d=>d.id===dayId);
    if (!day) return;
    // [FIX 4] nur done===true Sätze
    const allSets = [];
    day.exercises.forEach(ex => (sets[ex.eid]||[]).filter(s=>s.done).forEach(s => allSets.push({eid:ex.eid,...s})));
    // [FIX 4] Kein Speichern bei 0 Sätzen
    if (allSets.length === 0) { setWarnEmpty(true); return; }
    setWarnEmpty(false);
    onSave({id:uid(), planId, dayId, date:new Date().toISOString(), duration:Math.floor(elapsed/60), sets:allSets, note});
    setPhase("done");
  };

  if (phase==="done") return (
    <div style={{padding:"60px 24px",textAlign:"center"}}>
      <div style={{fontSize:80,marginBottom:20}}>🏆</div>
      <div style={{fontSize:30,fontWeight:900,color:T.accent,marginBottom:8}}>Stark gemacht!</div>
      <div style={{color:T.sub,fontSize:16,marginBottom:6}}>{fmt(elapsed)}</div>
      <div style={{color:T.muted,fontSize:13,marginBottom:40}}>
        {Object.values(sets).flat().filter(s=>s.done).length} Sätze · {Math.round(vol(Object.values(sets).flat())).toLocaleString()} kg
      </div>
      <Btn onClick={()=>setPhase("select")} full style={{padding:14}}>Neues Training</Btn>
    </div>
  );

  // [FIX 5] Wenn Plan vorausgewählt → Tage direkt anzeigen
  const preselectedPlan = planId ? plans.find(p=>p.id===planId) : null;
  if (phase==="select" || phase==="preselect") return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px",fontSize:24,fontWeight:900,color:T.text}}>Training starten</div>
      {/* Wenn planId vorausgewählt, zeige nur diesen Plan prominent */}
      {phase==="preselect" && preselectedPlan ? (
        <>
          <div style={{fontSize:11,color:T.sub,marginBottom:8,fontWeight:700,letterSpacing:1}}>
            {preselectedPlan.name.toUpperCase()}
          </div>
          {preselectedPlan.days.map(day=>(
            <Card key={day.id} onClick={()=>start(planId,day.id)} style={{marginBottom:8}} glow>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:16,fontWeight:700,color:T.text}}>{day.name}</div>
                  <div style={{fontSize:12,color:T.sub,marginTop:2}}>
                    {day.exercises.length} Übungen · {day.exercises.reduce((s,e)=>s+e.sets,0)} Sätze
                  </div>
                </div>
                <div style={{background:T.accent,color:"#07070F",fontWeight:900,padding:"9px 18px",borderRadius:10,fontSize:13}}>START</div>
              </div>
            </Card>
          ))}
          <Btn v="ghost" onClick={()=>setPhase("select")} style={{marginTop:10,width:"100%"}}>Anderen Plan wählen</Btn>
        </>
      ) : (
        plans.map(plan=>(
          <div key={plan.id} style={{marginBottom:16}}>
            <Lbl>{plan.name.toUpperCase()}</Lbl>
            {plan.days.map(day=>(
              <Card key={day.id} onClick={()=>start(plan.id,day.id)} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:16,fontWeight:700,color:T.text}}>{day.name}</div>
                    <div style={{fontSize:12,color:T.sub,marginTop:2}}>
                      {day.exercises.length} Übungen · {day.exercises.reduce((s,e)=>s+e.sets,0)} Sätze
                    </div>
                  </div>
                  <div style={{background:T.accent,color:"#07070F",fontWeight:900,padding:"9px 18px",borderRadius:10,fontSize:13}}>START</div>
                </div>
              </Card>
            ))}
          </div>
        ))
      )}
    </div>
  );

  // Active workout
  const plan = plans.find(p=>p.id===planId);
  const day  = plan?.days.find(d=>d.id===dayId);
  if (!plan||!day) return null; // [FIX 8] Guard

  const done  = Object.values(sets).flat().filter(s=>s.done).length;
  const total = Object.values(sets).flat().length;

  return (
    <div style={{padding:"0 16px 24px"}}>
      {rest&&<RestTimer seconds={rest.secs} onDone={()=>setRest(null)} onSkip={()=>setRest(null)}/>}

      {/* Sticky header */}
      <div style={{position:"sticky",top:0,background:T.bg,padding:"14px 0 10px",zIndex:10,borderBottom:`1px solid ${T.border}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div>
            <div style={{fontSize:11,color:T.sub}}>{plan.name} · {day.name}</div>
            <div style={{fontSize:34,fontWeight:900,color:T.accent,fontVariantNumeric:"tabular-nums"}}>{fmt(elapsed)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:T.sub}}>SÄTZE</div>
            <div style={{fontSize:24,fontWeight:800,color:T.text}}>{done}/{total}</div>
          </div>
        </div>
        <PBar value={done} max={total} h={4}/>
      </div>

      {day.exercises.map(planEx=>{
        const exercise = EDB.find(e=>e.id===planEx.eid);
        const exSets   = sets[planEx.eid]||[];
        const allDone  = exSets.length>0 && exSets.every(s=>s.done);
        return (
          <Card key={planEx.eid} style={{marginTop:12}} accent={allDone?T.accentDim:T.border}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div style={{flex:1}}>
                <div style={{fontSize:15,fontWeight:700,color:allDone?T.accentDim:T.text}}>
                  {exercise?.name||"?"}{allDone&&" ✓"}
                </div>
                <div style={{fontSize:11,color:T.sub}}>{exercise?.cat} · {exercise?.eq} · {planEx.rest}s</div>
                {planEx.note&&<div style={{fontSize:10,color:T.muted,marginTop:2}}>💡 {planEx.note}</div>}
              </div>
              <Badge color={CAT_COLOR[exercise?.cat]||T.accent}>{exercise?.cat||"?"}</Badge>
            </div>

            {exSets.map((s,i)=>(
              <div key={i} style={{display:"grid",gridTemplateColumns:"28px 1fr 12px 1fr 1fr 32px",alignItems:"center",gap:4,marginBottom:6,opacity:s.done?0.5:1}}>
                <div style={{width:26,height:26,borderRadius:7,background:s.done?T.accent:T.bgInput,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:s.done?"#07070F":T.muted,cursor:"pointer"}} onClick={()=>toggle(planEx.eid,i,planEx.rest)}>
                  {s.done?"✓":i+1}
                </div>
                <input type="number" value={s.weight} onChange={e=>upd(planEx.eid,i,"weight",e.target.value)}
                  style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 4px",color:T.text,fontSize:15,fontWeight:700,textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                <span style={{textAlign:"center",color:T.muted,fontSize:12}}>×</span>
                <input type="number" value={s.reps} onChange={e=>upd(planEx.eid,i,"reps",e.target.value)}
                  style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 4px",color:T.text,fontSize:15,fontWeight:700,textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                <div style={{textAlign:"center",fontSize:11,color:T.muted,fontWeight:600}}>
                  {s.weight>0 ? `${(s.weight*s.reps).toFixed(0)}` : "—"}
                </div>
                <button onClick={()=>toggle(planEx.eid,i,planEx.rest)} style={{width:30,height:30,borderRadius:8,border:"none",cursor:"pointer",background:s.done?T.accent+"33":T.bgAlt,color:s.done?T.accent:T.muted,fontSize:14}}>
                  {s.done?"✓":"○"}
                </button>
              </div>
            ))}
            <button onClick={()=>addSet(planEx.eid,planEx)} style={{background:"none",border:`1px dashed ${T.border}`,borderRadius:8,width:"100%",padding:6,color:T.muted,fontSize:11,cursor:"pointer",marginTop:2}}>
              + Satz
            </button>
          </Card>
        );
      })}

      <div style={{marginTop:16}}><Lbl>NOTIZ</Lbl><Inp value={note} onChange={setNote} placeholder="Wie war das Training?"/></div>

      {/* [FIX 4] Warnung bei 0 abgeschlossenen Sätzen */}
      {warnEmpty && (
        <div style={{marginTop:10,padding:"10px 14px",background:T.red+"22",borderRadius:10,border:`1px solid ${T.red}44`,fontSize:13,color:T.red}}>
          ⚠️ Bitte mindestens einen Satz abhaken, bevor du das Training abschließt.
        </div>
      )}

      <Btn onClick={finish} full style={{padding:16,marginTop:14,fontSize:16}}>Training abschließen ✓</Btn>
    </div>
  );
};

const ProgressScreen = ({sessions, plans, cardio, onDeleteSession}) => {
  const [view,setView]         = useState("overview");
  const [selEx,setSelEx]       = useState("e36");
  const [detailSess,setDetailSess] = useState(null);

  const usedEids  = useMemo(()=>[...new Set(sessions.flatMap(s=>s.sets.filter(isDone).map(x=>x.eid)))],[sessions]);
  const prs       = useMemo(()=>getPRs(sessions),[sessions]);
  const totalVol  = useMemo(()=>sessions.reduce((s,x)=>s+vol(x.sets),0),[sessions]);
  const exHistory = useMemo(()=>
    sessions
      .flatMap(s=>s.sets.filter(x=>isDone(x)&&x.eid===selEx&&x.weight>0).map(x=>({date:s.date,weight:x.weight,reps:x.reps})))
      .sort((a,b)=>new Date(a.date)-new Date(b.date)),
    [sessions,selEx]
  );

  // Session detail overlay
  if (detailSess) {
    const byEx = {};
    detailSess.sets.filter(isDone).forEach(s => { if (!byEx[s.eid]) byEx[s.eid]=[]; byEx[s.eid].push(s); });
    return (
      <div style={{position:"fixed",inset:0,background:T.bg,zIndex:200,overflowY:"auto"}}>
        <div style={{padding:"16px 16px 0",display:"flex",gap:10,alignItems:"center"}}>
          <Btn v="ghost" onClick={()=>setDetailSess(null)} style={{padding:"8px 14px"}}>← Zurück</Btn>
          <div style={{flex:1,fontSize:16,fontWeight:900,color:T.text}}>Trainingsdetails</div>
        </div>
        <div style={{padding:16}}>
          <Card glow style={{marginBottom:12}}>
            <div style={{fontSize:19,fontWeight:900,color:T.accent,marginBottom:4}}>
              {plans.find(p=>p.id===detailSess.planId)?.days.find(d=>d.id===detailSess.dayId)?.name||"Training"}
            </div>
            {detailSess.source&&<Badge color={T.orange} style={{marginBottom:8}}>{detailSess.source} Import</Badge>}
            <div style={{fontSize:12,color:T.sub,marginBottom:12}}>{fmtD(detailSess.date)}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
              {[{l:"DAUER",v:`${detailSess.duration}min`},{l:"SÄTZE",v:detailSess.sets.filter(isDone).length},{l:"VOLUMEN",v:`${(Math.round(vol(detailSess.sets)/100)/10).toFixed(1)}t`}].map(s=>(
                <div key={s.l} style={{textAlign:"center",padding:"10px 6px",background:T.bgAlt,borderRadius:10}}>
                  <div style={{fontSize:18,fontWeight:900,color:T.text}}>{s.v}</div>
                  <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
                </div>
              ))}
            </div>
            {detailSess.note&&<div style={{marginTop:12,padding:"10px 12px",background:T.accentGlow,borderRadius:10,fontSize:12,color:T.accentDim,fontStyle:"italic"}}>"{detailSess.note}"</div>}
          </Card>
          {Object.entries(byEx).map(([eid,exSets])=>{
            const ex=EDB.find(e=>e.id===eid);
            const best=Math.max(0,...exSets.map(s=>s.weight||0));
            return (
              <Card key={eid} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:T.text}}>{ex?.name||eid}</div>
                    <div style={{fontSize:11,color:T.sub}}>{ex?.cat}</div>
                  </div>
                  {best>0&&<div style={{textAlign:"right"}}><div style={{fontSize:13,fontWeight:700,color:T.orange}}>{best} kg top</div></div>}
                </div>
                {exSets.map((s,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:i<exSets.length-1?`1px solid ${T.border}`:"none"}}>
                    <span style={{fontSize:12,color:T.muted}}>Satz {s.setN}</span>
                    <span style={{fontSize:13,fontWeight:700,color:T.text}}>{s.weight>0?`${s.weight} kg × `:""}{s.reps} Wdh</span>
                  </div>
                ))}
              </Card>
            );
          })}
        </div>
      </div>
    );
  }

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px"}}>
        <div style={{fontSize:24,fontWeight:900,color:T.text,marginBottom:12}}>Fortschritt</div>
        <div style={{display:"flex",gap:7,overflowX:"auto",paddingBottom:2}}>
          {[{v:"overview",l:"📊 Übersicht"},{v:"exercises",l:"🏋 Übungen"},{v:"history",l:"📋 Verlauf"}].map(b=>(
            <button key={b.v} onClick={()=>setView(b.v)} style={{background:view===b.v?T.accent:T.bgCard,color:view===b.v?"#07070F":T.sub,border:`1px solid ${view===b.v?T.accent:T.border}`,borderRadius:9,padding:"7px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{b.l}</button>
          ))}
        </div>
      </div>

      {view==="overview" && <>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
          {[{l:"Kraft",v:sessions.length,c:T.accent},{l:"Cardio",v:cardio.length,c:T.green},{l:"Vol. ges.",v:`${Math.round(totalVol/1000)}t`,c:T.blue}].map(s=>(
            <Card key={s.l} style={{padding:12,textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:900,color:s.c}}>{s.v}</div>
              <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
            </Card>
          ))}
        </div>
        {sessions.length>1 && (
          <Card style={{marginBottom:12}}>
            <Lbl>TRAININGSVOLUMEN</Lbl>
            <LineChart data={sessions.slice(0,8).map(s=>vol(s.sets)).reverse()} color={T.blue} height={70}/>
          </Card>
        )}
      </>}

      {view==="exercises" && <>
        <Lbl>ÜBUNG WÄHLEN</Lbl>
        <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:14,paddingBottom:2}}>
          {usedEids.map(eid=>{
            const ex=EDB.find(e=>e.id===eid);
            if(!ex)return null;
            return (
              <button key={eid} onClick={()=>setSelEx(eid)} style={{background:selEx===eid?T.accent:T.bgCard,color:selEx===eid?"#07070F":T.sub,border:`1px solid ${selEx===eid?T.accent:T.border}`,borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{ex.name}</button>
            );
          })}
        </div>
        {selEx&&(
          <Card>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div>
                <div style={{fontSize:15,fontWeight:700,color:T.text}}>{EDB.find(e=>e.id===selEx)?.name}</div>
                <div style={{fontSize:11,color:T.sub}}>{EDB.find(e=>e.id===selEx)?.eq}</div>
              </div>
              {prs[selEx]&&<Badge color={T.orange}>🏆 {prs[selEx]} kg</Badge>}
            </div>
            {exHistory.length>1
              ? <>
                  <Lbl>GEWICHTSVERLAUF</Lbl>
                  <LineChart data={exHistory.map(h=>h.weight)} color={T.accent} height={80}/>
                  <div style={{display:"flex",gap:16,marginTop:10,fontSize:12,color:T.sub}}>
                    <span>Start: <b style={{color:T.text}}>{exHistory[0]?.weight} kg</b></span>
                    <span>Aktuell: <b style={{color:T.accent}}>{exHistory[exHistory.length-1]?.weight} kg</b></span>
                  </div>
                </>
              : <div style={{color:T.muted,fontSize:13,textAlign:"center",padding:"20px 0"}}>Zu wenig Daten.</div>
            }
          </Card>
        )}
      </>}

      {view==="history" && <>
        <Lbl>ALLE TRAININGS ({sessions.length})</Lbl>
        {sessions.length===0 && (
          <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16,fontSize:14}}>Noch keine Trainings.</div>
        )}
        {sessions.map(sess=>{
          const v   = vol(sess.sets);
          const dn  = plans.find(p=>p.id===sess.planId)?.days.find(d=>d.id===sess.dayId)?.name||"Training";
          return (
            <Card key={sess.id} style={{marginBottom:8,padding:0,overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"stretch"}}>
                <div onClick={()=>setDetailSess(sess)} style={{flex:1,padding:"12px 14px",cursor:"pointer"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div>
                      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:2}}>
                        <div style={{fontSize:14,fontWeight:700,color:T.text}}>{dn}</div>
                        {sess.source&&<Badge color={T.orange}>{sess.source}</Badge>}
                      </div>
                      <div style={{fontSize:12,color:T.sub}}>{fmtD(sess.date)}</div>
                      <div style={{fontSize:11,color:T.muted,marginTop:3}}>{sess.sets.filter(isDone).length} Sätze · {sess.duration} min</div>
                    </div>
                    <div style={{textAlign:"right",marginLeft:12}}>
                      <div style={{fontSize:15,fontWeight:800,color:T.accent}}>{Math.round(v).toLocaleString()} kg</div>
                      <div style={{fontSize:10,color:T.muted}}>Details →</div>
                    </div>
                  </div>
                </div>
                {/* [FIX: sichtbarer Lösch-Button] */}
                <button
                  onClick={e=>{ e.stopPropagation(); if(window.confirm(`"${dn}" wirklich löschen?`)) onDeleteSession(sess.id); }}
                  style={{background:T.red+"18",border:"none",borderLeft:`1px solid ${T.red}33`,cursor:"pointer",padding:"0 16px",color:T.red,fontSize:18,flexShrink:0,borderRadius:"0 18px 18px 0"}}
                >🗑</button>
              </div>
            </Card>
          );
        })}
      </>}
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// BODY SCREEN
// ═══════════════════════════════════════════════════════
const BodyScreen = ({metrics, settings, onSaveMetric, onUpdateSettings}) => {
  const [weight,setWeight]=useState("");
  const [waist,setWaist]=useState("");
  const [goalW,setGoalW]=useState(settings.weightGoal!=null?String(settings.weightGoal):"");

  const latest = metrics[metrics.length-1];
  const first  = metrics[0];
  const diff   = latest&&first ? (latest.weight-first.weight).toFixed(1) : null;

  const save = () => {
    const w = parseFloat(weight);
    if (!w || w <= 0) return;
    onSaveMetric({id:uid(), date:new Date().toISOString(), weight:w, waist:parseFloat(waist)||null});
    onUpdateSettings({bodyWeight:w});
    setWeight(""); setWaist("");
  };

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px",fontSize:24,fontWeight:900,color:T.text}}>Körperdaten</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
        {[
          {l:"AKTUELL",  v:latest?`${latest.weight}kg`:"—",  c:T.accent},
          {l:"ZIEL",     v:settings.weightGoal!=null?`${settings.weightGoal}kg`:"—", c:T.blue},
          {l:"DIFF",     v:diff!=null?`${parseFloat(diff)>0?"+":""}${diff}kg`:"—",   c:parseFloat(diff)>0?T.orange:T.green},
        ].map(s=>(
          <Card key={s.l} style={{padding:12,textAlign:"center"}}>
            <div style={{fontSize:18,fontWeight:900,color:s.c}}>{s.v}</div>
            <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
          </Card>
        ))}
      </div>
      {metrics.length>1 && <Card style={{marginBottom:12}}><Lbl>GEWICHTSVERLAUF</Lbl><LineChart data={metrics.map(m=>m.weight)} color={T.accent} height={90}/></Card>}
      <Card style={{marginBottom:12}}>
        <Lbl>NEUER EINTRAG</Lbl>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
          <div><Lbl>Gewicht (kg)</Lbl><Inp value={weight} onChange={setWeight} placeholder="80.5" type="number"/></div>
          <div><Lbl>Bauchumfang (cm)</Lbl><Inp value={waist} onChange={setWaist} placeholder="82" type="number"/></div>
        </div>
        <Btn onClick={save} disabled={!weight} full>Eintrag speichern</Btn>
      </Card>
      <Card style={{marginBottom:14}}>
        <Lbl>ZIELGEWICHT</Lbl>
        <div style={{display:"flex",gap:8}}>
          <Inp value={goalW} onChange={setGoalW} placeholder="75" type="number" style={{flex:1}}/>
          <Btn onClick={()=>{ const g=parseFloat(goalW); if(g>0) onUpdateSettings({weightGoal:g}); }} style={{padding:"10px 18px"}}>Setzen</Btn>
        </div>
      </Card>
      {metrics.length>0 && <>
        <Lbl>VERLAUF</Lbl>
        {[...metrics].reverse().slice(0,10).map(m=>(
          <div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",background:T.bgCard,borderRadius:10,marginBottom:6,border:`1px solid ${T.border}`}}>
            <div style={{fontSize:12,color:T.sub}}>{fmtD(m.date)}</div>
            <div style={{display:"flex",gap:14,alignItems:"center"}}>
              <span style={{fontSize:15,fontWeight:700,color:T.text}}>{m.weight} kg</span>
              {m.waist&&<span style={{fontSize:12,color:T.teal}}>{m.waist} cm</span>}
            </div>
          </div>
        ))}
      </>}
    </div>
  );
};

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px"}}>
        <div style={{fontSize:24,fontWeight:900,color:T.text}}>Achievements</div>
        <div style={{fontSize:13,color:T.sub,marginTop:4}}>{unlocked}/{achievements.length} freigeschaltet</div>
      </div>
      <Card style={{marginBottom:14}}>
        <PBar value={unlocked} max={achievements.length} color={T.gold}/>

        <Lbl color={T.gold}>FREIGESCHALTET ✓</Lbl>

          <div key={a.id} style={{display:"flex",alignItems:"center",gap:14,padding:"12px 14px",background:T.bgCard,borderRadius:14,marginBottom:8,border:`1px solid ${T.gold}44`}}>
            <span style={{fontSize:30}}>{a.icon}</span>
            <div><div style={{fontSize:14,fontWeight:700,color:T.gold}}>{a.name}</div><div style={{fontSize:11,color:T.sub,marginTop:2}}>{a.desc}</div></div>
            <span style={{marginLeft:"auto",color:T.gold}}>✓</span>
          </div>
        ))}
        <div style={{height:12}}/>
      </>}
      <Lbl>NOCH ZU ERREICHEN</Lbl>
      {achievements.filter(a=>!a.unlocked).map(a=>(
        <div key={a.id} style={{display:"flex",alignItems:"center",gap:14,padding:"12px 14px",background:T.bgCard,borderRadius:14,marginBottom:8,border:`1px solid ${T.border}`,opacity:0.55}}>
          <span style={{fontSize:30,filter:"grayscale(1)"}}>{a.icon}</span>
          <div><div style={{fontSize:14,fontWeight:700,color:T.sub}}>{a.name}</div><div style={{fontSize:11,color:T.muted,marginTop:2}}>{a.desc}</div></div>
          <span style={{marginLeft:"auto",color:T.muted}}>🔒</span>
        </div>
      ))}
    </div>
  );
};

// DASHBOARD
// ═══════════════════════════════════════════════════════
const DashboardScreen = ({sessions, plans, metrics, settings, cardio, streak, achievements, onStartWorkout, onGoTo}) => {
  const latest   = metrics[metrics.length-1];
  const {sessions:weekS, cardio:weekC} = useMemo(()=>getWeekActivities(sessions,cardio),[sessions,cardio]);
  const weekGoal = settings.weeklyGoal||3;
  const lastSession = sessions[0];
  const lastCardio  = cardio[0];
  const totalActivity = weekS.length + weekC.length;
  const newAch = achievements.filter(a=>a.unlocked).slice(-2);

  // ISO Mo=0..So=6 für Wochenkalender
  const DAYS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  const todayISO = (new Date().getDay()||7)-1;
  const isoDay   = d => { const wd=new Date(d).getDay(); return (wd||7)-1; };

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 16px"}}>
        <div style={{fontSize:12,color:T.sub,marginBottom:3}}>
          {new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}
        </div>
        <div style={{fontSize:26,fontWeight:900,color:T.text}}>Hey {settings.name||"Athlet"} <span style={{color:T.accent}}>⚡</span></div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:10,marginBottom:12}}>
        <Card style={{padding:"14px 18px",textAlign:"center",minWidth:86}} onClick={()=>onGoTo("achievements")}>
          <div style={{fontSize:28}}>🔥</div>
          <div style={{fontSize:26,fontWeight:900,color:T.orange}}>{streak}</div>
          <div style={{fontSize:9,color:T.muted,marginTop:2}}>STREAK</div>
        </Card>
        <Card glow={totalActivity>=weekGoal}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
            <div>
              <Lbl>DIESE WOCHE</Lbl>
              <div style={{fontSize:22,fontWeight:900,color:T.text}}>
                {totalActivity}<span style={{color:T.sub,fontSize:14,fontWeight:400}}> / {weekGoal}</span>
              </div>
            </div>
            <div style={{textAlign:"right",fontSize:11,color:T.muted}}>
              <div>{weekS.length} Kraft</div>
              <div>{weekC.length} Cardio</div>
            </div>
          </div>
          <div style={{display:"flex",gap:3,marginBottom:7}}>
            {DAYS.map((d,i)=>{
              const hasS=weekS.some(s=>isoDay(s.date)===i);
              const hasC=weekC.some(c=>isoDay(c.date)===i);
              return (
                <div key={d} style={{
                  flex:1,height:26,borderRadius:6,
                  background:hasS?T.accent:hasC?T.green:todayISO===i?T.accentGlow:T.bgInput,
                  border:`1.5px solid ${hasS?T.accent:hasC?T.green:todayISO===i?T.accentDim:T.border}`,
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:8,fontWeight:800,
                  color:hasS?"#07070F":hasC?"#07070F":todayISO===i?T.accent:T.muted,
                }}>{d}</div>
              );
            })}
          </div>
          <PBar value={totalActivity} max={weekGoal} h={4}/>
          {totalActivity>=weekGoal&&<div style={{marginTop:6,fontSize:11,color:T.accent,fontWeight:700}}>🏆 Wochenziel erreicht!</div>}
        </Card>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
        <Card style={{padding:12,textAlign:"center"}}><div style={{fontSize:20,fontWeight:900,color:T.accent}}>{sessions.length}</div><div style={{fontSize:9,color:T.muted,marginTop:2}}>KRAFT</div></Card>
        <Card style={{padding:12,textAlign:"center"}}><div style={{fontSize:20,fontWeight:900,color:T.green}}>{cardio.length}</div><div style={{fontSize:9,color:T.muted,marginTop:2}}>CARDIO</div></Card>
        <Card style={{padding:12,textAlign:"center"}} onClick={()=>onGoTo("achievements")}><div style={{fontSize:20,fontWeight:900,color:T.gold}}>{achievements.filter(a=>a.unlocked).length}</div><div style={{fontSize:9,color:T.muted,marginTop:2}}>BADGES</div></Card>
      </div>

      {newAch.length>0 && (
        <Card style={{marginBottom:12,background:`linear-gradient(135deg,${T.gold}15,${T.bgCard})`}} accent={T.gold}>
          <Lbl color={T.gold}>ZULETZT FREIGESCHALTET 🏆</Lbl>
          <div style={{display:"flex",gap:12}}>
            {newAch.map(a=>(
              <div key={a.id} style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:22}}>{a.icon}</span>
                <span style={{fontSize:12,fontWeight:700,color:T.gold}}>{a.name}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {lastSession && (
        <Card style={{marginBottom:10}}>
          <Lbl>LETZTES KRAFT-TRAINING</Lbl>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:3}}>
                {plans.find(p=>p.id===lastSession.planId)?.days.find(d=>d.id===lastSession.dayId)?.name||"Training"}
              </div>
              <div style={{fontSize:12,color:T.sub}}>
                {lastSession.sets.filter(isDone).length} Sätze · {lastSession.duration} min · {(Math.round(vol(lastSession.sets)/100)/10).toFixed(1)}t
              </div>
            </div>
            <div style={{fontSize:11,color:T.muted}}>{fmtDShort(lastSession.date)}</div>
          </div>
        </Card>
      )}

      {lastCardio && (
        <Card style={{marginBottom:12}}>
          <Lbl>LETZTE AKTIVITÄT</Lbl>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <span style={{fontSize:20}}>{CARDIO_ICONS[lastCardio.type]||"🏃"}</span>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:T.text}}>{lastCardio.type}</div>
                <div style={{fontSize:12,color:T.sub}}>
                  {lastCardio.duration} min{lastCardio.distance?` · ${lastCardio.distance} km`:""}
                </div>
              </div>
            </div>
            <div style={{fontSize:11,color:T.muted}}>{fmtDShort(lastCardio.date)}</div>
          </div>
        </Card>
      )}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Btn onClick={onStartWorkout} style={{padding:"14px 8px",fontSize:14,borderRadius:14}}>🏋 Kraft</Btn>
        <Btn v="teal" onClick={()=>onGoTo("cardio")} style={{padding:"14px 8px",fontSize:14,borderRadius:14}}>🏃 Cardio</Btn>
      </div>

      <div style={{marginTop:14,padding:"12px 14px",background:T.accentGlow,borderRadius:12,border:`1px solid ${T.accent}22`,fontSize:13,color:T.sub,lineHeight:1.6}}>
        <span style={{color:T.accent,fontWeight:700}}>💡 </span>
        {streak>=3
          ? `${streak} Tage am Stück – Körper passt sich an. Dranbleiben!`
          : sessions.length===0
            ? "Starte mit dem Ganzkörper-Plan aus deinem GAINSFIRE-Training."
            : `${sessions.length} Kraft + ${cardio.length} Cardio – gute Mischung macht dich stärker.`}
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// SETTINGS SCREEN  [FIX 7] App-Info korrigiert
// ═══════════════════════════════════════════════════════
const SettingsScreen = ({settings, onUpdate, sessions, metrics, plans, cardio, onReset}) => {
  const [weekGoal,setWeekGoal]=useState(String(settings.weeklyGoal||3));
  const [confirmReset,setConfirmReset]=useState(false);

  const totalVol = sessions.reduce((s,x)=>s+vol(x.sets),0);
  const streak   = calcStreak(sessions,cardio);

  const exportData = () => {
    const blob = new Blob(
      [JSON.stringify({sessions,metrics,plans,settings,cardio,v:5,exportedAt:new Date().toISOString()},null,2)],
      {type:"application/json"}
    );
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url;
    a.download=`fittrack-v5-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  };

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px",fontSize:24,fontWeight:900,color:T.text}}>Einstellungen</div>

      <Card style={{marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:52,height:52,borderRadius:16,background:T.accentGlow,border:`2px solid ${T.accent}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>💪</div>
          <div>
            <div style={{fontSize:18,fontWeight:900,color:T.text}}>{settings.name||"Athlet"}</div>
            <div style={{fontSize:12,color:T.sub}}>{settings.fitnessGoal||"Fitness"}</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginTop:14,paddingTop:14,borderTop:`1px solid ${T.border}`}}>
          {[{v:sessions.length,l:"Kraft",c:T.accent},{v:cardio.length,l:"Cardio",c:T.green},{v:`${streak}🔥`,l:"Streak",c:T.orange},{v:`${Math.round(totalVol/1000)}t`,l:"Volumen",c:T.blue}].map(s=>(
            <div key={s.l} style={{textAlign:"center"}}>
              <div style={{fontSize:18,fontWeight:900,color:s.c}}>{s.v}</div>
              <div style={{fontSize:9,color:T.muted}}>{s.l}</div>
            </div>
          ))}
        </div>
      </Card>

      <Card style={{marginBottom:12}}>
        <Lbl>TRAININGSZIEL</Lbl>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {["Muskelaufbau","Kraftzuwachs","Abnehmen","Fitness"].map(g=>(
            <button key={g} onClick={()=>onUpdate({fitnessGoal:g})} style={{background:settings.fitnessGoal===g?T.accent:T.bgInput,color:settings.fitnessGoal===g?"#07070F":T.sub,border:`1px solid ${settings.fitnessGoal===g?T.accent:T.border}`,borderRadius:9,padding:"8px 14px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{g}</button>
          ))}
        </div>
      </Card>

      <Card style={{marginBottom:12}}>
        <Lbl>WOCHENZIEL (Kraft + Cardio)</Lbl>
        <div style={{display:"flex",gap:8}}>
          <Inp value={weekGoal} onChange={setWeekGoal} type="number" style={{flex:1}}/>
          <Btn onClick={()=>{ const n=parseInt(weekGoal); if(n>0) onUpdate({weeklyGoal:n}); }} style={{padding:"10px 18px"}}>Setzen</Btn>
        </div>
      </Card>

      <Card style={{marginBottom:12}}>
        <Lbl>DATEN</Lbl>
        <Btn v="ghost" onClick={exportData} full style={{marginBottom:8}}>📤 Alle Daten exportieren (JSON)</Btn>
        <div style={{fontSize:11,color:T.muted}}>{sessions.length} Kraft · {cardio.length} Cardio · {metrics.length} Körper</div>
      </Card>

      <Card style={{marginBottom:12}}>
        <Lbl>ZURÜCKSETZEN</Lbl>
        {!confirmReset
          ? <Btn v="danger" onClick={()=>setConfirmReset(true)} full>⚠️ Alle Daten löschen</Btn>
          : <div>
              <div style={{fontSize:13,color:T.red,marginBottom:10}}>Wirklich alle Daten löschen?</div>
              <div style={{display:"flex",gap:8}}>
                <Btn v="ghost" onClick={()=>setConfirmReset(false)} style={{flex:1}}>Abbrechen</Btn>
                <Btn v="danger" onClick={()=>{onReset();setConfirmReset(false);}} style={{flex:1}}>Ja, löschen</Btn>
              </div>
            </div>
        }
      </Card>

      {/* [FIX 7] Korrekte App-Info */}
      <div style={{padding:14,background:T.bgAlt,borderRadius:14,border:`1px solid ${T.border}`}}>
        <div style={{fontSize:11,color:T.muted,lineHeight:1.8}}>
          <span style={{color:T.sub,fontWeight:700}}>ℹ️ FITTRACK v5.0</span><br/>
          React Web · JSX · localStorage<br/>
          <span style={{color:T.accentDim}}>Phase 5: GAINSFIRE-Import · Cardio-Tracking · Progressiver Plan</span>
        </div>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════
function App() {
  const [settings, setSettings] = usePersistedState("settings", DEFAULT_SETTINGS);
  const [sessions, setSessions] = usePersistedState("sessions", [MY_SESSION]);
  const [plans,    setPlans]    = usePersistedState("plans",    MY_PLANS);
  const [metrics,  setMetrics]  = usePersistedState("metrics",  []);
  const [cardio,   setCardio]   = usePersistedState("cardio",   SEED_CARDIO);
  const [tab,      setTab]      = useState("dashboard");
  const [showMore, setShowMore] = useState(false);
  // [FIX 5] Merken welcher Plan aus dem Plan-Screen vorausgewählt wurde
  const [preselectedPlanId, setPreselectedPlanId] = useState(null);

  // [FIX 6] metrics in Dependencies enthalten
  const streak       = useMemo(()=>calcStreak(sessions,cardio),                     [sessions,cardio]);
  const achievements = useMemo(()=>calcAchievements(sessions,metrics,streak,cardio),[sessions,metrics,streak,cardio]);

  const saveSession    = useCallback(s =>  { setSessions(p=>[s,...p]); setTab("progress"); }, []);
  const saveMetric     = useCallback(m =>  { setMetrics(p=>[...p,m]); },                      []);
  const saveCardio     = useCallback(c =>  { setCardio(p=>[c,...p]); },                        []);
  const updateSettings = useCallback(u =>  { setSettings(p=>({...p,...u})); },                 []);
  const resetAll       = useCallback(()=> { setSessions([]); setMetrics([]); setCardio([]); setSettings({...DEFAULT_SETTINGS,onboarded:false}); }, []);
  const finishOnboarding = useCallback(({name,goal,weeklyGoal,weight}) => {
    setSettings(p=>({...p,name,fitnessGoal:goal,weeklyGoal,onboarded:true,bodyWeight:weight||null}));
    if (weight) saveMetric({id:uid(),date:new Date().toISOString(),weight,waist:null});
  }, []);

  // [FIX 5] Plan vorauswählen und zu Workout navigieren
  const handleSelectPlan = useCallback(planId => {
    setPreselectedPlanId(planId);
    setTab("workout");
  }, []);

  if (!settings.onboarded) return <OnboardingScreen onDone={finishOnboarding}/>;

  const TABS = [
    {id:"dashboard", icon:"⌂",  label:"Home"},
    {id:"plans",     icon:"📋", label:"Pläne"},
    {id:"workout",   icon:"🏋", label:"Kraft"},
    {id:"cardio",    icon:"🏃", label:"Cardio"},
    {id:"progress",  icon:"📈", label:"Verlauf"},
    {id:"more",      icon:"⋯",  label:"Mehr"},
  ];
  const MORE = [
    {id:"body",         icon:"⚖",  label:"Körper"},
    {id:"achievements", icon:"🏆", label:"Badges"},
    {id:"exercises",    icon:"📚", label:"Übungen"},
    {id:"settings",     icon:"⚙",  label:"Einst."},
  ];

  // Beim Tab-Wechsel weg vom Workout: preselectedPlanId zurücksetzen
  const goTab = id => {
    if (id !== "workout") setPreselectedPlanId(null);
    setTab(id);
    setShowMore(false);
  };

  const Screen = () => {
    switch (tab) {
      case "dashboard":    return <DashboardScreen sessions={sessions} plans={plans} metrics={metrics} settings={settings} cardio={cardio} streak={streak} achievements={achievements} onStartWorkout={()=>goTab("workout")} onGoTo={goTab}/>;
      // [FIX 5] onSelectPlan mit ID
      case "plans":        return <PlansScreen plans={plans} setPlans={setPlans} onSelectPlan={handleSelectPlan}/>;
      // [FIX 5] preselectedPlanId übergeben
      case "workout":      return <WorkoutScreen plans={plans} onSave={saveSession} preselectedPlanId={preselectedPlanId}/>;
      case "cardio":       return <CardioScreen cardio={cardio} onSave={saveCardio} settings={settings}/>;
      case "progress":     return <ProgressScreen sessions={sessions} plans={plans} cardio={cardio} onDeleteSession={id=>setSessions(p=>p.filter(x=>x.id!==id))}/>;
      case "body":         return <BodyScreen metrics={metrics} settings={settings} onSaveMetric={saveMetric} onUpdateSettings={updateSettings}/>;
      case "achievements": return <AchievementsScreen sessions={sessions} metrics={metrics} streak={streak} cardio={cardio}/>;
      case "exercises":    return <ExerciseDBScreen/>;
      case "settings":     return <SettingsScreen sessions={sessions} metrics={metrics} plans={plans} settings={settings} cardio={cardio} onUpdate={updateSettings} onReset={resetAll}/>;
      default:             return null;
    }
  };

  const isMoreTab = MORE.some(m=>m.id===tab);

  return (
    <div style={{background:T.bg,minHeight:"100vh",maxWidth:390,margin:"0 auto",fontFamily:"-apple-system,'Helvetica Neue',sans-serif",color:T.text,position:"relative",boxShadow:"0 0 120px rgba(0,0,0,0.99)"}}>

      {/* Status bar */}
      <div style={{padding:"10px 20px 0",display:"flex",justifyContent:"space-between",fontSize:12,color:T.muted}}>
        <span style={{fontWeight:700}}>{new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}</span>
        <span style={{color:T.accentDim,fontWeight:800,letterSpacing:0.8}}>FITTRACK</span>
        <span>● ● ●</span>
      </div>

      {/* Screen */}
      <div style={{paddingBottom:74,minHeight:"calc(100vh - 44px)",overflowY:"auto"}}>
        <Screen/>
      </div>

      {/* "Mehr" drawer */}
      {showMore && <>
        <div style={{position:"fixed",bottom:74,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:390,background:T.bgCard,borderTop:`1px solid ${T.border}`,zIndex:99,borderRadius:"18px 18px 0 0",padding:"12px 16px 8px"}}>
          <div style={{textAlign:"center",marginBottom:10}}>
            <div style={{width:36,height:4,background:T.border,borderRadius:99,margin:"0 auto 8px"}}/>
            <div style={{fontSize:10,color:T.muted,fontWeight:700,letterSpacing:1}}>WEITERE FUNKTIONEN</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
            {MORE.map(item=>(
              <button key={item.id} onClick={()=>goTab(item.id)} style={{background:tab===item.id?T.accentGlow:T.bgAlt,border:`1px solid ${tab===item.id?T.accent:T.border}`,borderRadius:12,padding:"12px 4px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <span style={{fontSize:22}}>{item.icon}</span>
                <span style={{fontSize:9,fontWeight:700,color:tab===item.id?T.accent:T.sub}}>{item.label}</span>
              </button>
            ))}
          </div>
        </div>
        <div style={{position:"fixed",inset:0,zIndex:98}} onClick={()=>setShowMore(false)}/>
      </>}

      {/* Bottom nav */}
      <div style={{position:"fixed",bottom:0,width:"100%",maxWidth:390,background:T.bgCard,borderTop:`1px solid ${T.border}`,display:"flex",padding:"7px 0 14px",zIndex:100}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>{if(t.id==="more"){setShowMore(s=>!s);}else{goTab(t.id);}}} style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"4px 0"}}>
            <span style={{fontSize:18}}>{t.icon}</span>
            <span style={{fontSize:9,fontWeight:700,letterSpacing:0.3,color:(tab===t.id||(t.id==="more"&&isMoreTab))?T.accent:T.muted}}>{t.label}</span>
            {(tab===t.id||(t.id==="more"&&isMoreTab))&&<div style={{width:3,height:3,borderRadius:"50%",background:T.accent}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
