      </Card>

      {/* Goals */}
      <Card style={{marginBottom:12}}>
        <Lbl>TRAININGSZIEL</Lbl>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {["Muskelaufbau","Kraftzuwachs","Abnehmen","Fitness"].map(g=>(
            <button key={g} onClick={()=>onUpdate({fitnessGoal:g})} style={{background:settings.fitnessGoal===g?T.accent:T.bgInput,color:settings.fitnessGoal===g?"#07070F":T.sub,border:`1px solid ${settings.fitnessGoal===g?T.accent:T.border}`,borderRadius:9,padding:"8px 14px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{g}</button>
          ))}
        </div>
      </Card>

      <Card style={{marginBottom:12}}>
        <Lbl>WOCHENZIEL (Kraft + Cardio)</Lbl>
        <div style={{display:"flex",gap:8}}>
          <Inp value={weekGoal} onChange={setWeekGoal} type="number" style={{flex:1}}/>
          <Btn onClick={()=>{ const n=parseInt(weekGoal); if(n>0) onUpdate({weeklyGoal:n}); }} style={{padding:"10px 18px"}}>Setzen</Btn>
        </div>
      </Card>

      {/* ── Backup / Restore ──────────────────────────── */}
      <Card style={{marginBottom:12}}>
        <Lbl color={T.blue}>BACKUP & WIEDERHERSTELLUNG</Lbl>

        {/* Data summary */}
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
          {Object.entries(dataStats).map(([k,v])=>(
            <div key={k} style={{background:T.bgInput,borderRadius:8,padding:"5px 10px",fontSize:11}}>
              <span style={{color:T.text,fontWeight:700}}>{v}</span>
              <span style={{color:T.muted}}> {k}</span>
            </div>
          ))}
          <div style={{background:T.bgInput,borderRadius:8,padding:"5px 10px",fontSize:11}}>
            <span style={{color:T.teal,fontWeight:700}}>{lsUsageKB} KB</span>
            <span style={{color:T.muted}}> localStorage</span>
          </div>
        </div>

        {/* ── Cloud-Sync ─────────────────────────────── */}
        <div style={{height:1,background:T.border,margin:"14px 0"}}/>
        <Lbl color={T.blue}>CLOUD-SYNC</Lbl>
        <div style={{fontSize:11,color:T.muted,marginBottom:10,lineHeight:1.5}}>
          Gleicht deine Daten mit deinem eigenen Server ab. Ohne Eintrag bleibt die App rein lokal.
        </div>

        <div style={{marginBottom:8}}>
          <div style={{fontSize:10,color:T.muted,marginBottom:3}}>SERVER-ADRESSE</div>
          <input
            type="url"
            value={syncUrl}
            onChange={e=>setSyncUrl(e.target.value)}
            placeholder="https://app-sync....workers.dev"
            autoComplete="off"
            style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,
              padding:"8px 10px",color:T.text,fontSize:12,width:"100%",boxSizing:"border-box",outline:"none"}}/>
        </div>

        <div style={{marginBottom:8}}>
          <div style={{fontSize:10,color:T.muted,marginBottom:3}}>SYNC-PASSWORT</div>
          <input
            type="password"
            value={syncToken}
            onChange={e=>setSyncToken(e.target.value)}
            placeholder="Passwort aus dem Worker"
            autoComplete="new-password"
            style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,
              padding:"8px 10px",color:T.text,fontSize:12,width:"100%",boxSizing:"border-box",outline:"none"}}/>
        </div>

        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <Btn v="ghost" onClick={saveSyncCfg} style={{flex:1,fontSize:12,padding:"9px 0"}}>
            Speichern
          </Btn>
          <Btn onClick={runSyncNow} disabled={syncBusy} style={{flex:1,fontSize:12,padding:"9px 0"}}>
            {syncBusy ? "Läuft…" : "Jetzt abgleichen"}
          </Btn>
        </div>

        {/* Status line */}
        <div style={{
          padding:"8px 10px", borderRadius:8, fontSize:11, lineHeight:1.5,
          background: syncMsg?.error ? T.red+"14" : T.bgAlt,
          border:`1px solid ${syncMsg?.error ? T.red+"44" : T.border}`,
          color: syncMsg?.error ? T.red : T.sub,
          marginBottom:10,
        }}>
          {syncMsg?.text ||
            (syncMeta?.lastSync
              ? `Zuletzt abgeglichen: ${new Date(syncMeta.lastSync).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`
              : "Noch kein Abgleich durchgeführt")}
          {ftSync.isDirty() && (
            <div style={{color:T.orange,marginTop:3}}>Lokale Änderungen noch nicht hochgeladen</div>
          )}
        </div>

        {/* ── Snapshot-Browser: alte Cloud-Stände ── */}
        <div style={{fontSize:10,color:T.muted,marginBottom:6,lineHeight:1.5}}>
          Falls Trainings fehlen (z.B. durch ein verworfenes Training): hier alte Cloud-Stände
          durchsuchen. Gefundene Trainings werden ergänzt, nichts wird gelöscht.
        </div>
        <Btn v="ghost" onClick={loadSnapshotList} disabled={snapBusy} full style={{marginBottom:8,fontSize:12,padding:"9px 0"}}>
          {snapBusy ? "Lädt…" : "Alte Cloud-Stände durchsuchen"}
        </Btn>

        {snapMsg && (
          <div style={{
            padding:"8px 10px", borderRadius:8, fontSize:11, lineHeight:1.5, marginBottom:8,
            background: snapMsg.error ? T.red+"14" : T.green+"14",
            border:`1px solid ${snapMsg.error ? T.red+"44" : T.green+"44"}`,
            color: snapMsg.error ? T.red : T.green,
          }}>{snapMsg.text}</div>
        )}

        {snapList !== null && (
          <div style={{marginBottom:10}}>
            {snapList.length === 0 ? (
              <div style={{fontSize:12,color:T.muted,padding:"8px 0"}}>Keine gespeicherten Tagesstände gefunden.</div>
            ) : (
              <>
                <div style={{fontSize:10,color:T.muted,marginBottom:6}}>
                  {snapList.length} gespeicherte Tagesstände (letzte 60 Tage) · antippen zum Prüfen
                </div>
                <Btn onClick={mergeAllSnapshots} disabled={snapBusy} full style={{marginBottom:10,fontSize:12,padding:"9px 0"}}>
                  {snapBusy ? "Läuft…" : "Alle Snapshots durchsuchen & fehlende Trainings ergänzen"}
                </Btn>
                {snapList.map(day => {
                  const det = snapDetails[day];
                  return (
                    <div key={day} onClick={()=>inspectSnapshot(day)} style={{
                      display:"flex", justifyContent:"space-between", alignItems:"center",
                      padding:"9px 10px", borderRadius:8, marginBottom:5,
                      background:T.bgAlt, border:`1px solid ${T.border}`, cursor:"pointer",
                    }}>
                      <div>
                        <div style={{fontSize:13,fontWeight:700,color:T.text}}>{day}</div>
                        {det ? (
                          det.error ? (
                            <div style={{fontSize:10,color:T.red}}>{det.error}</div>
                          ) : det.empty ? (
                            <div style={{fontSize:10,color:T.muted}}>leer</div>
                          ) : (
                            <div style={{fontSize:10,color:T.sub}}>
                              {det.sessions} Trainings{det.lastDate ? ` · bis ${fmtDShort(det.lastDate)}` : ""}
                            </div>
                          )
                        ) : (
                          <div style={{fontSize:10,color:T.muted}}>Tippen zum Prüfen…</div>
                        )}
                      </div>
                      {det && !det.error && !det.empty && (
                        <button
                          onClick={e=>{e.stopPropagation(); restoreSnapshot(day);}}
                          disabled={snapBusy}
                          style={{
                            background:T.accent, color:"#07070F", border:"none", borderRadius:7,
                            padding:"7px 12px", fontSize:11, fontWeight:800, cursor:"pointer", flexShrink:0,
                          }}
                        >Ergänzen</button>
                      )}
                    </div>
                  );
                })}
              </>
            )}
          </div>
        )}

        {/* Export */}
        <Btn v="ghost" onClick={exportData} full style={{marginBottom:8}}>
          Backup exportieren (JSON)
        </Btn>

        {/* Import */}
        <Btn v="ghost" onClick={()=>importRef.current?.click()} full style={{marginBottom:8}}>
          Backup importieren
        </Btn>
        <input
          ref={importRef}
          type="file"
          accept=".json,application/json"
          onChange={handleImportFile}
          style={{display:"none"}}
        />

        {/* Status feedback */}
        {importStatus && (
          <div style={{
            padding:"10px 12px", borderRadius:10, fontSize:13, fontWeight:600,
            background: importStatus==="ok" ? T.green+"22" : T.red+"22",
            color:      importStatus==="ok" ? T.green       : T.red,
            border:`1px solid ${importStatus==="ok" ? T.green+"44" : T.red+"44"}`,

            {importStatus==="ok"
              ? "✓ Backup erfolgreich importiert – alle Daten wiederhergestellt"
              : importStatus}
          </div>
        )}

        <div style={{fontSize:11,color:T.muted,marginTop:8,lineHeight:1.6}}>
          Das Backup enthält alle Trainings, Cardio, Pläne, Körperdaten und eigene Übungen.
          Beim Import werden bestehende Daten vollständig ersetzt.
        </div>
      </Card>

      {/* Reset */}
      {/* ── Progressions- & Deload-Einstellungen ────────── */}
      <Card style={{marginBottom:12}}>
        <Lbl color={T.green}>PROGRESSION & DELOAD</Lbl>
        {(()=>{
          const ps    = settings.progressionSettings || DEFAULT_SETTINGS.progressionSettings;
          const upd_  = v => onUpdate({progressionSettings:{...ps,...v}});
          const deloadOn  = isDeloadActive(settings);
          const daysLeft  = deloadDaysRemaining(settings);
          const activeUntilStr = settings.activeDeloadUntil
            ? new Date(settings.activeDeloadUntil).toLocaleDateString("de-DE",{day:"numeric",month:"short"})
            : null;

          return(<>

            {/* ── Aktiver Deload-Status ────────────────────── */}
            {deloadOn ? (
              <div style={{padding:"12px 14px",background:T.orange+"18",borderRadius:12,
                border:`1px solid ${T.orange}44`,marginBottom:12}}>
                <div style={{fontSize:13,fontWeight:800,color:T.orange,marginBottom:4}}>
                  ⬇ Deload aktiv bis {activeUntilStr}
                </div>
                <div style={{fontSize:12,color:T.sub,marginBottom:10}}>
                  Noch {daysLeft} {daysLeft===1?"Tag":"Tage"} – leicht trainieren und sauber ausführen.
                </div>
                <Btn v="ghost" onClick={()=>onUpdate(endDeload())}
                  style={{fontSize:12,padding:"7px 14px",width:"100%"}}>
                  Deload jetzt beenden
                </Btn>
              </div>
            ) : (
              <Btn
                onClick={()=>onUpdate(startDeload(settings))}
                v="ghost"
                full
                style={{
                  marginBottom:12,fontSize:12,padding:"9px 14px",
                  border:`1px solid ${T.orange}55`,color:T.orange,
                }}
              >⬇ Deload starten (7 Tage)</Btn>
            )}

            {/* ── Progression Toggle ───────────────────────── */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontSize:13,color:T.sub}}>Automatische Vorschläge</span>
              <button onClick={()=>upd_({enabled:!ps.enabled})} style={{
                background:ps.enabled?T.green:T.bgInput,color:ps.enabled?"#07070F":T.muted,
                border:`1px solid ${ps.enabled?T.green:T.border}`,
                borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:700,cursor:"pointer",
              }}>{ps.enabled?"AN":"AUS"}</button>
            </div>

            {ps.enabled&&<>
              {/* Progressionsmodus */}
              <div style={{marginBottom:10}}>
                <div style={{fontSize:12,color:T.sub,marginBottom:4}}>Progressionsmodus</div>
                <div style={{display:"flex",gap:6}}>
                  {["conservative","normal","aggressive"].map(m=>(
                    <button key={m} onClick={()=>upd_({mode:m})} style={{
                      flex:1,background:ps.mode===m?T.accent:T.bgInput,
                      color:ps.mode===m?"#07070F":T.sub,
                      border:`1px solid ${ps.mode===m?T.accent:T.border}`,
                      borderRadius:8,padding:"6px 4px",fontSize:11,fontWeight:700,cursor:"pointer",
                    }}>{m==="conservative"?"Konservativ":m==="normal"?"Normal":"Aggressiv"}</button>
                  ))}
                </div>
              </div>

              {/* Ziel-Wdh-Bereich */}
              <div style={{marginBottom:10}}>
                <div style={{fontSize:12,color:T.sub,marginBottom:4}}>Ziel-Wdh-Bereich</div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <input type="number" value={ps.defaultRepRange?.min??8}
                    onChange={e=>{const n=parseInt(e.target.value);if(n>0&&n<99)upd_({defaultRepRange:{...ps.defaultRepRange,min:n}});}}
                    style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,padding:"6px 8px",color:T.text,fontSize:13,fontWeight:700,width:54,textAlign:"center",boxSizing:"border-box"}}/>
                  <span style={{color:T.muted,fontSize:12}}>–</span>
                  <input type="number" value={ps.defaultRepRange?.max??12}
                    onChange={e=>{const n=parseInt(e.target.value);if(n>0&&n<99)upd_({defaultRepRange:{...ps.defaultRepRange,max:n}});}}
                    style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,padding:"6px 8px",color:T.text,fontSize:13,fontWeight:700,width:54,textAlign:"center",boxSizing:"border-box"}}/>
                  <span style={{color:T.muted,fontSize:11}}>Wdh</span>
                </div>
              </div>

              {/* Deload Einstellungen */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:13,color:T.sub}}>Deload-Vorschläge</span>
                <button onClick={()=>upd_({deloadEnabled:!ps.deloadEnabled})} style={{
                  background:ps.deloadEnabled?T.orange:T.bgInput,color:ps.deloadEnabled?"#07070F":T.muted,
                  border:`1px solid ${ps.deloadEnabled?T.orange:T.border}`,
                  borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:700,cursor:"pointer",
                }}>{ps.deloadEnabled?"AN":"AUS"}</button>
              </div>

              {ps.deloadEnabled&&<>
                {/* Scheduled deload toggle */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <div>
                    <div style={{fontSize:13,color:T.sub}}>Fester Rhythmus</div>
                    <div style={{fontSize:10,color:T.muted,marginTop:1}}>alle X Wochen, unabhängig von Stagnation</div>
                  </div>
                  <button onClick={()=>upd_({scheduledDeloadEnabled:!(ps.scheduledDeloadEnabled??false)})} style={{
                    background:(ps.scheduledDeloadEnabled??false)?T.orange:T.bgInput,
                    color:(ps.scheduledDeloadEnabled??false)?"#07070F":T.muted,
                    border:`1px solid ${(ps.scheduledDeloadEnabled??false)?T.orange:T.border}`,
                    borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0,
                  }}>{(ps.scheduledDeloadEnabled??false)?"AN":"AUS"}</button>
                </div>

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                  <div>
                    <div style={{fontSize:10,color:(ps.scheduledDeloadEnabled??false)?T.muted:T.border,marginBottom:3}}>ALLE (WOCHEN)</div>
                    <input type="number" value={ps.deloadEveryWeeks??6} min="2" max="16"
                      disabled={!(ps.scheduledDeloadEnabled??false)}
                      onChange={e=>{const n=parseInt(e.target.value);if(n>=2&&n<=16)upd_({deloadEveryWeeks:n});}}
                      style={{background:T.bgInput,border:`1px solid ${(ps.scheduledDeloadEnabled??false)?T.border:T.border+"44"}`,borderRadius:8,padding:"6px 8px",color:(ps.scheduledDeloadEnabled??false)?T.text:T.muted,fontSize:13,fontWeight:700,width:"100%",textAlign:"center",boxSizing:"border-box"}}/>
                  </div>
                  <div>
                    <div style={{fontSize:10,color:T.muted,marginBottom:3}}>GEWICHT -(%)</div>
                    <input type="number" value={ps.deloadPercent??15} min="5" max="40"
                      onChange={e=>{const n=parseInt(e.target.value);if(n>=5&&n<=40)upd_({deloadPercent:n});}}
                      style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,padding:"6px 8px",color:T.text,fontSize:13,fontWeight:700,width:"100%",textAlign:"center",boxSizing:"border-box"}}/>
                  </div>
                </div>

                {/* Stagnation-Deload info */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <div>
                    <div style={{fontSize:13,color:T.sub}}>Stagnations-Deload</div>
                    <div style={{fontSize:10,color:T.muted,marginTop:1}}>bei ≥2 stagnierenden Hauptübungen</div>
                  </div>
                  <button onClick={()=>upd_({autoDeloadOnStagnation:!ps.autoDeloadOnStagnation})} style={{
                    background:ps.autoDeloadOnStagnation?T.orange:T.bgInput,
                    color:ps.autoDeloadOnStagnation?"#07070F":T.muted,
                    border:`1px solid ${ps.autoDeloadOnStagnation?T.orange:T.border}`,
                    borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0,
                  }}>{ps.autoDeloadOnStagnation?"AN":"AUS"}</button>
                </div>

                {/* Deload Strategie */}
                <div style={{marginBottom:8}}>
                  <div style={{fontSize:10,color:T.muted,marginBottom:4}}>STRATEGIE</div>
                  <div style={{display:"flex",gap:6}}>
                    {[
                      {v:"weight",l:"Gewicht ↓"},
                      {v:"sets",  l:"Sätze ↓"},
                      {v:"both",  l:"Beides ↓"},
                    ].map(s=>(
                      <button key={s.v} onClick={()=>upd_({deloadStrategy:s.v})} style={{
                        flex:1,background:(ps.deloadStrategy||"weight")===s.v?T.orange:T.bgInput,
                        color:(ps.deloadStrategy||"weight")===s.v?"#07070F":T.sub,
                        border:`1px solid ${(ps.deloadStrategy||"weight")===s.v?T.orange:T.border}`,
                        borderRadius:8,padding:"6px 4px",fontSize:11,fontWeight:700,cursor:"pointer",
                      }}>{s.l}</button>
                    ))}
                  </div>
                </div>

                {(ps.deloadStrategy==="sets"||ps.deloadStrategy==="both")&&(
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <div style={{fontSize:12,color:T.sub,flex:1}}>Satzreduktion (%)</div>
                    <input type="number" value={ps.volumeDeloadPercent??30} min="10" max="60"
                      onChange={e=>{const n=parseInt(e.target.value);if(n>=10&&n<=60)upd_({volumeDeloadPercent:n});}}
                      style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,padding:"6px 8px",color:T.text,fontSize:13,fontWeight:700,width:54,textAlign:"center",boxSizing:"border-box"}}/>
                    <span style={{fontSize:10,color:T.muted}}>%</span>
                  </div>
                )}
              </>}
            </>}
          </>);
        })()}
      </Card>

      {/* ── Timer-Einstellungen (Punkt 1+2) ──────────────── */}
      <Card style={{marginBottom:12}}>
        <Lbl color={T.blue}>TIMER & SOUND</Lbl>
        {[
          {key:"restTickStart",     label:"Pausen-Sound ab (Sek vor Ende)"},
          {key:"exerciseTickStart", label:"Übungs-Sound ab (Sek vor Ziel)"},
        ].map(({key,label})=>(
          <div key={key} style={{marginBottom:10}}>
            <div style={{fontSize:12,color:T.sub,marginBottom:4}}>{label}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {[5,10,15,20].map(v=>(
                <button key={v} onClick={()=>onUpdate({timerSettings:{
                  ...DEFAULT_SETTINGS.timerSettings,
                  ...(settings.timerSettings||{}), [key]:v,
                }})} style={{
                  background:(settings.timerSettings?.[key]??10)===v?T.accent:T.bgInput,
                  color:(settings.timerSettings?.[key]??10)===v?"#07070F":T.sub,
                  border:`1px solid ${(settings.timerSettings?.[key]??10)===v?T.accent:T.border}`,
                  borderRadius:8,padding:"7px 12px",fontSize:13,fontWeight:700,cursor:"pointer",
                }}>{v}s</button>
              ))}
              {/* Custom value */}
              <input type="number" min="1" max="60"
                value={settings.timerSettings?.[key]??10}
                onChange={e=>{const n=parseInt(e.target.value);if(n>0)onUpdate({timerSettings:{
                  ...DEFAULT_SETTINGS.timerSettings,...(settings.timerSettings||{}),[key]:n,
                }});}}
                style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,
                  padding:"7px 8px",color:T.text,fontSize:13,fontWeight:700,
                  width:54,textAlign:"center",boxSizing:"border-box"}}/>
            </div>
          </div>
        ))}
      </Card>

      {/* ── Standard-Pausen nach Gerät/Kategorie (Punkt 3) ── */}
      <Card style={{marginBottom:12}}>
        <Lbl color={T.blue}>STANDARD-PAUSEN (Sekunden)</Lbl>
        <div style={{fontSize:11,color:T.muted,marginBottom:10,lineHeight:1.5}}>
          Werden beim Hinzufügen von Übungen und bei „Pausen" im Plan-Editor verwendet.
        </div>
        {[
          {key:"warmup",    label:"Aufwärmen"},
          {key:"stretching",label:"Dehnung"},
          {key:"machine",   label:"Maschine"},
          {key:"cable",     label:"Kabel"},
          {key:"dumbbell",  label:"Kurzhantel"},
          {key:"barbell",   label:"Langhantel"},
          {key:"bodyweight",label:"Körpergewicht"},
          {key:"default",   label:"Sonstiges"},
        ].map(({key,label})=>{
          const val = (settings.restRules?.[key] ?? DEFAULT_SETTINGS.restRules[key]);
          return(
            <div key={key} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <div style={{flex:1,fontSize:13,color:T.sub}}>{label}</div>
              <input type="number" min="0" max="600" value={val}
                onChange={e=>{const n=parseInt(e.target.value);if(n>=0)onUpdate({restRules:{
                  ...DEFAULT_SETTINGS.restRules,...(settings.restRules||{}),[key]:n,
                }});}}
                style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,
                  padding:"6px 8px",color:T.text,fontSize:13,fontWeight:700,
                  width:64,textAlign:"center",boxSizing:"border-box"}}/>
              <span style={{fontSize:11,color:T.muted,width:18}}>s</span>
            </div>
          );
        })}
      </Card>

      <Card style={{marginBottom:12}}>
        <Lbl>ZURÜCKSETZEN</Lbl>
        {!confirmReset
          ? <Btn v="danger" onClick={()=>setConfirmReset(true)} full>Alle Daten löschen</Btn>
          : <div>
              <div style={{fontSize:13,color:T.red,marginBottom:10,lineHeight:1.5}}>
                Wirklich alle Daten unwiderruflich löschen?<br/>
                <span style={{fontSize:11,color:T.muted}}>Erstelle vorher ein Backup!</span>
              </div>
              <div style={{display:"flex",gap:8}}>
                <Btn v="ghost" onClick={()=>setConfirmReset(false)} style={{flex:1}}>Abbrechen</Btn>
                <Btn v="danger" onClick={()=>{onReset();setConfirmReset(false);}} style={{flex:1}}>Ja, löschen</Btn>
              </div>
            </div>
        }
      </Card>

      <div style={{padding:14,background:T.bgAlt,borderRadius:14,border:`1px solid ${T.border}`}}>
        <div style={{fontSize:11,color:T.muted,lineHeight:1.8}}>
          <span style={{color:T.sub,fontWeight:700}}>ℹ️ FITTRACK v6.0</span><br/>
          React Web · JSX · localStorage<br/>
          <span style={{color:T.accentDim}}>Backup-System · unitType · Bilder-Komprimierung · Cardio-Sort</span>
        </div>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════
function App() {
  const [settings, setSettings] = usePersistedState("settings", DEFAULT_SETTINGS);
  const [sessions, setSessions] = usePersistedState("sessions", SEED_SESSIONS);
  const [plans,    setPlans]    = usePersistedState("plans",    MY_PLANS);
  const [metrics,  setMetrics]  = usePersistedState("metrics",  []);
  const [cardio,   setCardio]   = usePersistedState("cardio",   SEED_CARDIO);
  // Custom exercises created by user
  const [customExercises, setCustomExercises] = usePersistedState("customExercises", []);
  // Overrides: {[exerciseId]: {desc, link, img}} for built-in exercises
  const [exerciseOverrides, setExerciseOverrides] = usePersistedState("exerciseOverrides", {});
  const [tab,      setTab]      = useState("dashboard");
  const [showMore, setShowMore] = useState(false);
  const [preselectedPlanId, setPreselectedPlanId] = useState(null);
  // Global rest timer – lives in App so it keeps running across all screens
  const [globalRest, setGlobalRest] = useState(null); // null | {secs, endAt}

  // Full exercise database = base + extra + user-created
  // allExercises are the raw entries; resolved = {...ex, ...overrides[ex.id]}
  const allExercises = useMemo(() => [...ALL_EDB_BASE, ...customExercises], [customExercises]);
  const resolveEx = useCallback(ex => ({...ex, ...(exerciseOverrides?.[ex.id]||{})}), [exerciseOverrides]);

  // Auto-expire deload when activeDeloadUntil is in the past
  useEffect(() => {
    if (settings.activeDeloadUntil && new Date(settings.activeDeloadUntil) <= new Date()) {
      setSettings(prev => ({...prev, activeDeloadUntil: null}));
    }
  }, [settings.activeDeloadUntil]); // re-check whenever the value changes

  // ── Cloud-Sync lifecycle ──────────────────────────────
  useEffect(() => {
    try {
      ftSync.installWatcher();
      if (!ftSync.isConfigured()) return;

      // Initial reconcile ~1s after start
      const t = setTimeout(() => {
        ftSync.run({ silent: true, onApplied: () => {
          window.location.reload();
        }}).catch(()=>{});
      }, 1000);

      // On leaving the app: quick upload. On return: reconcile.
      const onVis = () => {
        try {
          if (document.visibilityState === "hidden") {
            if (ftSync.isDirty()) ftSync.push().catch(()=>{});
          } else {
            ftSync.run({ silent: true, onApplied: () => {
              window.location.reload();
            }}).catch(()=>{});
          }
        } catch(_){}
      };
      document.addEventListener("visibilitychange", onVis);

      return () => {
        clearTimeout(t);
        document.removeEventListener("visibilitychange", onVis);
      };
    } catch (e) {
      console.warn("Sync init failed (app continues normally):", e);
    }
  }, []);

  const streak       = useMemo(()=>calcStreak(sessions,cardio),                     [sessions,cardio]);
  const achievements = useMemo(()=>calcAchievements(sessions,metrics,streak,cardio,allExercises),[sessions,metrics,streak,cardio,allExercises]);
  // Punkt 8: track which badge ids the user has already seen in overlay
  const [seenBadgeIds, setSeenBadgeIds] = usePersistedState("seenBadgeIds", []);
  const [newBadges,    setNewBadges]    = useState([]);

  const saveSession = useCallback(s => {
    // Badges BEFORE applying new session
    const prevSessions = sessions; // snapshot of current state (safe here, not inside setter)
    const newSessions  = [s, ...prevSessions];
    // Fix 2: compute streak with the new session already included
    const newStreak = calcStreak(newSessions, cardio);
    // Fix 1: badge detection OUTSIDE setSessions callback
    const newly = getNewlyUnlockedBadges(prevSessions, newSessions, metrics, newStreak, cardio, ACHIEVEMENT_DEFS, allExercises)
      .filter(b => !seenBadgeIds.includes(b.id));
    // Persist new sessions
    setSessions(newSessions);
    // Show newly unlocked badges (safe to call outside setter)
    if (newly.length > 0) {
      setNewBadges(newly);
      setSeenBadgeIds(ids => [...ids, ...newly.map(b => b.id)]);
    }
    // Sync immediately after finishing a workout – don't wait for the debounce.
    // A finished training is the single most important moment to not lose data.
    try {
      if (ftSync.isConfigured()) {
        ftSync.push().catch(() => { /* debounced retry will still fire */ });
      }
    } catch(_){}
    setTab("progress");
  }, [sessions, metrics, cardio, seenBadgeIds]);
  const saveMetric     = useCallback(m =>  { setMetrics(p=>[...p,m]); },                      []);
  const saveCardio     = useCallback(c =>  { setCardio(p=>[c,...p]); },                        []);
  const updateSettings = useCallback(u =>  { setSettings(p=>({...p,...u})); },                 []);
  const resetAll = useCallback(()=> {
    setSessions([]); setMetrics([]); setCardio([]);
    setCustomExercises([]); setExerciseOverrides({});
    setSettings({...DEFAULT_SETTINGS,onboarded:false});
  }, []);

  // Fix 4: Import handler – fully replaces all state from backup
  const importAll = useCallback(({settings:s, sessions:se, cardio:ca, plans:pl, metrics:me, customExercises:cx, exerciseOverrides:eo}) => {
    if (s)  setSettings(s);
    if (se) setSessions(se);
    if (ca) setCardio(ca);
    if (pl) setPlans(pl);
    if (me) setMetrics(me);
    if (cx) setCustomExercises(cx);
    if (eo) setExerciseOverrides(eo);
  }, []);
  const finishOnboarding = useCallback(({name,goal,weeklyGoal,weight}) => {
    setSettings(p=>({...p,name,fitnessGoal:goal,weeklyGoal,onboarded:true,bodyWeight:weight||null}));
    if (weight) saveMetric({id:uid(),date:new Date().toISOString(),weight,waist:null});
  }, []);

  const handleSelectPlan = useCallback(planId => {
    setPreselectedPlanId(planId);
    setTab("workout");
  }, []);

  if (!settings.onboarded) return <OnboardingScreen onDone={finishOnboarding} onImport={importAll}/>;

  const TABS = [
    {id:"dashboard", icon:"⌂",  label:"Home"},
    {id:"plans",     icon:"≡",  label:"Pläne"},
    {id:"workout",   icon:"↑",  label:"Kraft"},
    {id:"cardio",    icon:"↺",  label:"Cardio"},
    {id:"progress",  icon:"~",  label:"Verlauf"},
    {id:"more",      icon:"⋯",  label:"Mehr"},
  ];
  const MORE = [
    {id:"body",         icon:"◎", label:"Körper"},
    {id:"achievements", icon:"★", label:"Badges"},
    {id:"exercises",    icon:"≡", label:"Übungen"},
    {id:"settings",     icon:"≡", label:"Einst."},
  ];

  const goTab = id => {
    if (id !== "workout") setPreselectedPlanId(null);
    setTab(id);
    setShowMore(false);
  };

  // renderScreen: plain function (NOT inline component) to avoid React remount bug
  const renderScreen = () => {
    switch (tab) {
      case "dashboard":    return <DashboardScreen sessions={sessions} plans={plans} metrics={metrics} settings={settings} cardio={cardio} streak={streak} achievements={achievements} allExercises={allExercises} onStartWorkout={()=>goTab("workout")} onGoTo={goTab}/>;
      case "plans":        return <PlansScreen plans={plans} setPlans={setPlans} allExercises={allExercises} exerciseOverrides={exerciseOverrides} setExerciseOverrides={setExerciseOverrides} customExercises={customExercises} setCustomExercises={setCustomExercises} onSelectPlan={handleSelectPlan} settings={settings} sessions={sessions}/>;
      case "workout":      return <WorkoutScreen plans={plans} allExercises={allExercises} exerciseOverrides={exerciseOverrides} settings={settings} sessions={sessions} onSave={saveSession} preselectedPlanId={preselectedPlanId} globalRest={globalRest} setGlobalRest={setGlobalRest}/>;
      case "cardio":       return <CardioScreen cardio={cardio} onSave={saveCardio} settings={settings}/>;
      case "progress":     return <ProgressScreen sessions={sessions} plans={plans} cardio={cardio} allExercises={allExercises} exerciseOverrides={exerciseOverrides} settings={settings} onDeleteSession={id=>setSessions(p=>p.filter(x=>x.id!==id))}/>;
      case "body":         return <BodyScreen metrics={metrics} settings={settings} onSaveMetric={saveMetric} onUpdateSettings={updateSettings}/>;
      case "achievements": return <AchievementsScreen sessions={sessions} metrics={metrics} streak={streak} cardio={cardio} allExercises={allExercises}/>;
      case "exercises":    return <ExerciseDBScreen allExercises={allExercises} customExercises={customExercises} setCustomExercises={setCustomExercises} exerciseOverrides={exerciseOverrides} setExerciseOverrides={setExerciseOverrides} sessions={sessions}/>;
      case "settings":     return <SettingsScreen sessions={sessions} metrics={metrics} plans={plans} settings={settings} cardio={cardio} customExercises={customExercises} exerciseOverrides={exerciseOverrides} onUpdate={updateSettings} onReset={resetAll} onImport={importAll}/>;
      default:             return null;
    }
  };

  const isMoreTab = MORE.some(m=>m.id===tab);

  // Global rest timer overlay – defined as variable so it can be used in JSX below
  const restOverlay = globalRest ? (
    <RestTimer
      seconds={globalRest.secs}
      onDone={()=>setGlobalRest(null)}
      onSkip={()=>setGlobalRest(null)}
      tickStart={settings?.timerSettings?.restTickStart ?? 10}
    />
  ) : null;

  return (
    <div style={{background:T.bg,minHeight:"100vh",maxWidth:390,margin:"0 auto",fontFamily:"-apple-system,'Helvetica Neue',sans-serif",color:T.text,position:"relative",boxShadow:"0 0 120px rgba(0,0,0,0.99)"}}>
      <div style={{

            {restOverlay}
      <div style={{paddingBottom:74,minHeight:"calc(100vh - 40px)",overflowY:"auto"}}>
        {renderScreen()}
      </div>
      {/* Punkt 8: Badge unlock overlay after training */}
      {newBadges.length>0&&(
        <BadgeUnlockOverlay badges={newBadges} onClose={()=>setNewBadges([])}/>
      )}
      {showMore && <>
        <div style={{position:"fixed",bottom:74,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:390,background:T.bgCard,borderTop:`1px solid ${T.border}`,zIndex:99,borderRadius:"18px 18px 0 0",padding:"12px 16px 8px"}}>
          <div style={{textAlign:"center",marginBottom:10}}>
            <div style={{width:36,height:4,background:T.border,borderRadius:99,margin:"0 auto 8px"}}/>
            <div style={{fontSize:10,color:T.muted,fontWeight:700,letterSpacing:1}}>WEITERE FUNKTIONEN</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
            {MORE.map(item=>(
              <button key={item.id} onClick={()=>goTab(item.id)} style={{background:tab===item.id?T.accentGlow:T.bgAlt,border:`1px solid ${tab===item.id?T.accent:T.border}`,borderRadius:12,padding:"12px 4px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <span style={{fontSize:22}}>{item.icon}</span>
                <span style={{fontSize:9,fontWeight:700,color:tab===item.id?T.accent:T.sub}}>{item.label}</span>
              </button>
            ))}
          </div>
        </div>
        <div style={{position:"fixed",inset:0,zIndex:98}} onClick={()=>setShowMore(false)}/>
      </>}
      <div style={{position:"fixed",bottom:0,width:"100%",maxWidth:390,background:T.bgCard,borderTop:`1px solid ${T.border}44`,display:"flex",alignItems:"stretch",padding:"6px 0 env(safe-area-inset-bottom,10px)",zIndex:100}}>
        {TABS.map(t=>{
          const isActive = tab===t.id||(t.id==="more"&&isMoreTab);
          return (
            <button key={t.id} onClick={()=>{if(t.id==="more"){setShowMore(s=>!s);}else{goTab(t.id);}}}
              style={{
                flex:1, background:"none", border:"none", cursor:"pointer",
                display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
                gap:3, padding:"6px 2px 4px",
                position:"relative",
              }}>
              <span style={{
                fontSize: isActive ? 20 : 18,
                lineHeight:1,
                color: isActive ? T.accent : "#AAAACC",
                transition:"font-size 0.15s",
              }}>{t.icon}</span>
              <span style={{
                fontSize:9,
                fontWeight: isActive ? 800 : 500,
                letterSpacing: 0.2,
                color: isActive ? T.accent : "#AAAACC",
                lineHeight:1,
              }}>{t.label}</span>
              {isActive && (
                <div style={{width:4,height:4,borderRadius:"50%",background:T.accent,marginTop:1}}/>
              )}
              {!isActive && <div style={{width:4,height:4,marginTop:1}}/>}
              {globalRest && t.id==="workout" && !isActive && (
                <div style={{
                  position:"absolute",top:4,right:"calc(50% - 14px)",
                  width:7,height:7,borderRadius:"50%",
                  background:T.orange, boxShadow:`0 0 6px ${T.orange}`,
                  animation:"pulse 1s infinite",
                }}/>
              )}
            </button>
          );
        })}
      </div>
    </div>
