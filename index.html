// WORKOUT SCREEN  – mit localStorage Session-Recovery
// ═══════════════════════════════════════════════════════
const WS_KEY = "ft5_active_workout";

function saveWorkoutDraft(draft) {
  try { localStorage.setItem(WS_KEY, JSON.stringify(draft)); } catch {}
}
function loadWorkoutDraft() {
  try {
    const v = localStorage.getItem(WS_KEY);
    if (!v) return null;
    const d = JSON.parse(v);
    // Fix 6 migration: old drafts used eid as key (no "__"), discard them
    if (d?.sets && Object.keys(d.sets).some(k => !k.includes("__"))) {
      localStorage.removeItem(WS_KEY);
      return null;
    }
    return d;
  } catch { return null; }
}
function clearWorkoutDraft() {
  try { localStorage.removeItem(WS_KEY); } catch {}
}

const WorkoutScreen = ({plans, allExercises, exerciseOverrides, onSave, preselectedPlanId}) => {
  // Fix 3: only non-archived plans
  const activePlans = useMemo(() => (plans||[]).filter(p => !p.archived), [plans]);

  const draft = useMemo(() => loadWorkoutDraft(), []);
  const hasDraft = draft && draft.phase === "active";

  const [phase,setPhase]   = useState(() => hasDraft ? "active" : preselectedPlanId ? "preselect" : "select");
  const [planId,setPlanId] = useState(() => hasDraft ? draft.planId : (preselectedPlanId||null));
  const [dayId,setDayId]   = useState(() => hasDraft ? draft.dayId  : null);
  const [sets,setSets]     = useState(() => hasDraft ? (draft.sets||{}) : {});
  const [note,setNote]     = useState(() => hasDraft ? (draft.note||"") : "");
  const [rest,setRest]     = useState(null);
  const [warnEmpty,setWarnEmpty] = useState(false);
  // "confirm" phase: plan+day selected, user sees overview before officially starting
  const [confirmPlanId, setConfirmPlanId] = useState(null);
  const [confirmDayId,  setConfirmDayId]  = useState(null);

  const t0Ref    = useRef(null);
  const [elapsed,setElapsed] = useState(() => hasDraft ? (draft.elapsed||0) : 0);

  // Fix 2: sync preselectedPlanId prop changes without wiping active training
  const prevPreRef = useRef(preselectedPlanId);
  useEffect(() => {
    if (preselectedPlanId === prevPreRef.current) return;
    prevPreRef.current = preselectedPlanId;
    if (phase === "active" || phase === "done") return;
    if (preselectedPlanId) { setPlanId(preselectedPlanId); setPhase("preselect"); }
    else { setPhase("select"); }
  }, [preselectedPlanId]); // eslint-disable-line

  useEffect(() => {
    if (phase === "active" && t0Ref.current === null) {
      t0Ref.current = Date.now() - (elapsed * 1000);
    }
  }, [phase]);

  useEffect(() => {
    if (phase !== "active") return;
    const iv = setInterval(() => setElapsed(Math.floor((Date.now()-t0Ref.current)/1000)), 1000);
    return () => clearInterval(iv);
  }, [phase]);

  useEffect(() => {
    if (phase !== "active") return;
    saveWorkoutDraft({ phase:"active", planId, dayId, sets, note, elapsed });
  }, [phase, sets, note, elapsed, planId, dayId]);

  const start = (pId, dId) => {
    t0Ref.current = Date.now();
    setElapsed(0); setWarnEmpty(false);
    setPlanId(pId); setDayId(dId);
    const day = activePlans.find(p=>p.id===pId)?.days.find(d=>d.id===dId);
    if (!day) return;
    const init = {};
    // Fix 1: key by instance position so duplicate exercises stay separate
    day.exercises.forEach((ex, exIdx) => {
      const key = instKey(ex.eid, exIdx);
      init[key] = Array.from({length: ex.sets}, (_, i) => ({
        setN: i+1, reps: ex.reps, weight: ex.weight, done: false,
      }));
    });
    setSets(init); setPhase("active");
  };

  // Select a day → go to confirm screen first
  const selectDay = (pId, dId) => {
    setConfirmPlanId(pId);
    setConfirmDayId(dId);
    setPhase("confirm");
  };

  // Fix 1: ikey = instKey(eid, planExIdx) – unique per occurrence
  const toggle = (ikey, idx, restSecs) => setSets(prev => {
    if (!prev[ikey]?.[idx]) return prev;
    const upd = {...prev, [ikey]: prev[ikey].map((s,i) => i===idx ? {...s,done:!s.done} : s)};
    if (!prev[ikey][idx].done && restSecs>0) setRest({secs:restSecs});
    return upd;
  });
  const upd    = (ikey,idx,f,v) => setSets(p=>({...p,[ikey]:(p[ikey]||[]).map((s,i)=>i===idx?{...s,[f]:parseFloat(v)||0}:s)}));
  const addSet = (ikey,tmpl)    => setSets(p=>({...p,[ikey]:[...(p[ikey]||[]),{setN:(p[ikey]||[]).length+1,reps:tmpl.reps,weight:tmpl.weight,done:false}]}));

  const discardDraft = () => {
    clearWorkoutDraft(); t0Ref.current = null;
    setPlanId(preselectedPlanId||null);
    setDayId(null); setSets({}); setNote(""); setElapsed(0);
    setPhase(preselectedPlanId ? "preselect" : "select");
  };

  const finish = () => {
    const day = activePlans.find(p=>p.id===planId)?.days.find(d=>d.id===dayId);
    if (!day) return;
    const allSets = [];
    // Fix 1: iterate by instance key to keep duplicate exercises separate
    day.exercises.forEach((ex, exIdx) => {
      const key = instKey(ex.eid, exIdx);
      (sets[key]||[]).filter(s=>s.done).forEach(s => allSets.push({eid:ex.eid,...s}));
    });
    if (allSets.length === 0) { setWarnEmpty(true); return; }
    setWarnEmpty(false); clearWorkoutDraft();
    onSave({id:uid(), planId, dayId, date:new Date().toISOString(), duration:Math.floor(elapsed/60), sets:allSets, note});
    setPhase("done");
  };

  if (phase==="done") return (
    <div style={{padding:"60px 24px",textAlign:"center"}}>
      <div style={{fontSize:80,marginBottom:20}}>🏆</div>
      <div style={{fontSize:30,fontWeight:900,color:T.accent,marginBottom:8}}>Stark gemacht!</div>
      <div style={{color:T.sub,fontSize:16,marginBottom:6}}>{fmt(elapsed)}</div>
      <div style={{color:T.muted,fontSize:13,marginBottom:40}}>
        {Object.values(sets).flat().filter(s=>s.done).length} Sätze · {Math.round(vol(Object.values(sets).flat())).toLocaleString()} kg
      </div>
      <Btn onClick={()=>setPhase("select")} full style={{padding:14}}>Neues Training</Btn>
    </div>
  );

  const preselectedPlan = planId ? activePlans.find(p=>p.id===planId) : null;
  // ── Confirm screen ─────────────────────────────────────────────────
  if (phase === "confirm") {
    const cp  = activePlans.find(p=>p.id===confirmPlanId);
    const cd  = cp?.days.find(d=>d.id===confirmDayId);
    if (!cp || !cd) { setPhase("select"); return null; }
    const totalSets = cd.exercises.reduce((s,e)=>s+e.sets, 0);
    return (
      <div style={{padding:"0 16px 32px"}}>
        <div style={{padding:"22px 0 6px",display:"flex",alignItems:"center",gap:10}}>
          <Btn v="ghost" onClick={()=>setPhase(planId?"preselect":"select")} style={{padding:"8px 14px"}}>←</Btn>
          <div style={{fontSize:22,fontWeight:900,color:T.text}}>Bereit?</div>
        </div>

        {/* Plan + Day info */}
        <div style={{fontSize:12,color:T.sub,marginBottom:16,paddingLeft:2}}>{cp.name}</div>

        <Card style={{marginBottom:14}} glow>
          <div style={{fontSize:20,fontWeight:900,color:T.accent,marginBottom:6}}>{cd.name}</div>
          <div style={{display:"flex",gap:14,fontSize:13,color:T.sub,marginBottom:16}}>
            <span>🏋 {cd.exercises.length} Übungen</span>
            <span>📋 {totalSets} Sätze</span>
          </div>

          {/* Exercise list preview */}
          {cd.exercises.map((ex, i) => {
            const exercise = (allExercises||[]).find(e=>e.id===ex.eid);
            const override = exerciseOverrides?.[ex.eid] || {};
            const resolved = {...(exercise||{}), ...override};
            const unitType = resolved.unitType || "reps";
            return (
              <div key={instKey(ex.eid, i)} style={{
                display:"flex", justifyContent:"space-between", alignItems:"center",
                padding:"7px 0",
                borderBottom: i < cd.exercises.length-1 ? `1px solid ${T.border}` : "none",
              }}>
                <div>
                  <div style={{fontSize:13,fontWeight:600,color:T.text}}>{resolved.name||"?"}</div>
                  {resolved.trainingsnotiz && (
                    <div style={{fontSize:10,color:T.teal,marginTop:1}}>📌 {resolved.trainingsnotiz}</div>
                  )}
                  {ex.note && (
                    <div style={{fontSize:10,color:T.muted,marginTop:1}}>💡 {ex.note}</div>
                  )}
                </div>
                <div style={{textAlign:"right",flexShrink:0,marginLeft:12}}>
                  <span style={{fontSize:13,fontWeight:700,color:T.sub}}>
                    {ex.sets}×{fmtRepsVal(ex.reps, unitType)}
                  </span>
                  {ex.weight>0 && unitType==="reps" && (
                    <div style={{fontSize:11,color:T.muted}}>{ex.weight} kg</div>
                  )}
                </div>
              </div>
            );
          })}
        </Card>

        {/* The actual start button */}
        <Btn
          onClick={()=>start(confirmPlanId, confirmDayId)}
          full
          style={{padding:"18px 0", fontSize:18, borderRadius:16, letterSpacing:0.5}}
        >
          ▶ Training starten
        </Btn>

        <div style={{marginTop:10,textAlign:"center",fontSize:11,color:T.muted}}>
          Tippe „←" um einen anderen Tag zu wählen
        </div>
      </div>
    );
  }

  // ── Select / preselect screen ───────────────────────────────────────
  if (phase==="select" || phase==="preselect") return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px",fontSize:24,fontWeight:900,color:T.text}}>Training starten</div>

      {hasDraft && (() => {
        const dp = activePlans.find(p=>p.id===draft.planId);
        const dd = dp?.days.find(d=>d.id===draft.dayId);
        const dn = Object.values(draft.sets||{}).flat().filter(s=>s.done).length;
        return (
          <div style={{background:`${T.orange}18`,border:`1px solid ${T.orange}55`,borderRadius:14,padding:"14px 16px",marginBottom:16}}>
            <div style={{fontSize:12,color:T.orange,fontWeight:800,marginBottom:6}}>⚡ UNTERBROCHENES TRAINING</div>
            <div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:2}}>{dd?.name||"Training"}</div>
            <div style={{fontSize:12,color:T.sub,marginBottom:12}}>{dp?.name} · {dn} Sätze · {fmt(draft.elapsed||0)}</div>
            <div style={{display:"flex",gap:8}}>
              <Btn onClick={()=>setPhase("active")} style={{flex:2,padding:"10px 0",fontSize:14,borderRadius:10}}>▶ Fortsetzen</Btn>
              <Btn v="danger" onClick={discardDraft} style={{flex:1,padding:"10px 0",fontSize:13,borderRadius:10}}>Verwerfen</Btn>
            </div>
          </div>
        );
      })()}

      {phase==="preselect" && preselectedPlan ? (
        <>
          <div style={{fontSize:11,color:T.sub,marginBottom:8,fontWeight:700,letterSpacing:1}}>{preselectedPlan.name.toUpperCase()}</div>
          {preselectedPlan.days.map(day=>(
            <Card key={day.id} onClick={()=>selectDay(planId,day.id)} style={{marginBottom:8}} glow>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:16,fontWeight:700,color:T.text}}>{day.name}</div>
                  <div style={{fontSize:12,color:T.sub,marginTop:2}}>{day.exercises.length} Übungen · {day.exercises.reduce((s,e)=>s+e.sets,0)} Sätze</div>
                </div>
                <div style={{background:T.accent,color:"#07070F",fontWeight:900,padding:"9px 16px",borderRadius:10,fontSize:13}}>Wählen ›</div>
              </div>
            </Card>
          ))}
          <Btn v="ghost" onClick={()=>setPhase("select")} style={{marginTop:10,width:"100%"}}>Anderen Plan wählen</Btn>
        </>
      ) : activePlans.length===0 ? (
        <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16}}>
          Kein aktiver Plan vorhanden.<br/><span style={{fontSize:12}}>Erstelle einen Plan unter "Pläne".</span>
        </div>
      ) : (
        activePlans.map(plan=>(
          <div key={plan.id} style={{marginBottom:16}}>
            <Lbl>{plan.name.toUpperCase()}</Lbl>
            {plan.days.map(day=>(
              <Card key={day.id} onClick={()=>selectDay(plan.id,day.id)} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:16,fontWeight:700,color:T.text}}>{day.name}</div>
                    <div style={{fontSize:12,color:T.sub,marginTop:2}}>{day.exercises.length} Übungen · {day.exercises.reduce((s,e)=>s+e.sets,0)} Sätze</div>
                  </div>
                  <div style={{background:T.accent,color:"#07070F",fontWeight:900,padding:"9px 16px",borderRadius:10,fontSize:13}}>Wählen ›</div>
                </div>
              </Card>
            ))}
          </div>
        ))
      )}
    </div>
  );

  const plan = activePlans.find(p=>p.id===planId);
  const day  = plan?.days.find(d=>d.id===dayId);
  if (!plan||!day) return null;

  const done  = Object.values(sets).flat().filter(s=>s.done).length;
  const total = Object.values(sets).flat().length;

  return (
    <div style={{padding:"0 16px 24px"}}>
      {rest&&<RestTimer seconds={rest.secs} onDone={()=>setRest(null)} onSkip={()=>setRest(null)}/>}

      <div style={{position:"sticky",top:0,background:T.bg,padding:"14px 0 10px",zIndex:10,borderBottom:`1px solid ${T.border}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div>
            <div style={{fontSize:11,color:T.sub}}>{plan.name} · {day.name}</div>
            <div style={{fontSize:34,fontWeight:900,color:T.accent,fontVariantNumeric:"tabular-nums"}}>{fmt(elapsed)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:T.sub}}>SÄTZE</div>
            <div style={{fontSize:24,fontWeight:800,color:T.text}}>{done}/{total}</div>
          </div>
        </div>
        <PBar value={done} max={total} h={4}/>
        <div style={{fontSize:9,color:T.muted,textAlign:"right",marginTop:3,letterSpacing:0.5}}>💾 automatisch gespeichert</div>
      </div>

      {day.exercises.map((planEx, planExIdx) => (
        // Fix 1: WorkoutExerciseCard per instance – hooks valid, keys unique
        <WorkoutExerciseCard
          key={instKey(planEx.eid, planExIdx)}
          planEx={planEx}
          planExIdx={planExIdx}
          allExercises={allExercises}
          exerciseOverrides={exerciseOverrides}
          sets={sets}
          toggle={toggle}
          upd={upd}
          addSet={addSet}
        />
      ))}

      <div style={{marginTop:16}}><Lbl>NOTIZ</Lbl><Inp value={note} onChange={setNote} placeholder="Wie war das Training?"/></div>

      {warnEmpty && (
        <div style={{marginTop:10,padding:"10px 14px",background:T.red+"22",borderRadius:10,border:`1px solid ${T.red}44`,fontSize:13,color:T.red}}>
          ⚠️ Mindestens einen Satz abhaken bevor du das Training abschließt.
        </div>
      )}

      <Btn onClick={finish} full style={{padding:16,marginTop:14,fontSize:16}}>Training abschließen ✓</Btn>

      {/* Abbrechen – klein und dezent, mit Sicherheitsabfrage */}
      <button
        onClick={() => {
          const ok = window.confirm(
            "Training wirklich abbrechen?\n\nDie aktuelle Einheit wird NICHT gespeichert."
          );
          if (!ok) return;
          clearWorkoutDraft();
          t0Ref.current = null;
          setSets({}); setNote(""); setElapsed(0);
          setPlanId(null); setDayId(null);
          setPhase("select");
        }}
        style={{
          display:"block", width:"100%", marginTop:10,
          background:"none", border:"none", cursor:"pointer",
          color:T.muted, fontSize:12, padding:"8px 0",
          textDecoration:"underline", textUnderlineOffset:3,
        }}
      >
        Training abbrechen
      </button>
    </div>
  );
}

// PROGRESS SCREEN

const ProgressScreen = ({sessions, plans, cardio, allExercises, onDeleteSession}) => {
  const [view,setView]         = useState("overview");
  const [selEx,setSelEx]       = useState("e36");
  const [detailSess,setDetailSess] = useState(null);

  const usedEids  = useMemo(()=>[...new Set(sessions.flatMap(s=>s.sets.filter(isDone).map(x=>x.eid)))],[sessions]);
  const prs       = useMemo(()=>getPRs(sessions),[sessions]);
  const totalVol  = useMemo(()=>sessions.reduce((s,x)=>s+vol(x.sets),0),[sessions]);
  const exHistory = useMemo(()=>
    sessions
      .flatMap(s=>s.sets.filter(x=>isDone(x)&&x.eid===selEx&&x.weight>0).map(x=>({date:s.date,weight:x.weight,reps:x.reps})))
      .sort((a,b)=>new Date(a.date)-new Date(b.date)),
    [sessions,selEx]
  );

  // Session detail overlay
  if (detailSess) {
    const byEx = {};
    detailSess.sets.filter(isDone).forEach(s => { if (!byEx[s.eid]) byEx[s.eid]=[]; byEx[s.eid].push(s); });
    return (
      <div style={{position:"fixed",inset:0,background:T.bg,zIndex:200,overflowY:"auto"}}>
        <div style={{padding:"16px 16px 0",display:"flex",gap:10,alignItems:"center"}}>
          <Btn v="ghost" onClick={()=>setDetailSess(null)} style={{padding:"8px 14px"}}>← Zurück</Btn>
          <div style={{flex:1,fontSize:16,fontWeight:900,color:T.text}}>Trainingsdetails</div>
        </div>
        <div style={{padding:16}}>
          <Card glow style={{marginBottom:12}}>
            <div style={{fontSize:19,fontWeight:900,color:T.accent,marginBottom:4}}>
              {plans.find(p=>p.id===detailSess.planId)?.days.find(d=>d.id===detailSess.dayId)?.name||"Training"}
            </div>
            {detailSess.source&&<Badge color={T.orange} style={{marginBottom:8}}>{detailSess.source} Import</Badge>}
            <div style={{fontSize:12,color:T.sub,marginBottom:12}}>{fmtD(detailSess.date)}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
              {[{l:"DAUER",v:`${detailSess.duration}min`},{l:"SÄTZE",v:detailSess.sets.filter(isDone).length},{l:"VOLUMEN",v:`${(Math.round(vol(detailSess.sets)/100)/10).toFixed(1)}t`}].map(s=>(
                <div key={s.l} style={{textAlign:"center",padding:"10px 6px",background:T.bgAlt,borderRadius:10}}>
                  <div style={{fontSize:18,fontWeight:900,color:T.text}}>{s.v}</div>
                  <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
                </div>
              ))}
            </div>
            {detailSess.note&&<div style={{marginTop:12,padding:"10px 12px",background:T.accentGlow,borderRadius:10,fontSize:12,color:T.accentDim,fontStyle:"italic"}}>"{detailSess.note}"</div>}
          </Card>
          {Object.entries(byEx).map(([eid,exSets])=>{
            const ex=allExercises.find(e=>e.id===eid);
            const best=Math.max(0,...exSets.map(s=>s.weight||0));
            return (
              <Card key={eid} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:T.text}}>{ex?.name||eid}</div>
                    <div style={{fontSize:11,color:T.sub}}>{ex?.cat}</div>
                  </div>
                  {best>0&&<div style={{textAlign:"right"}}><div style={{fontSize:13,fontWeight:700,color:T.orange}}>{best} kg top</div></div>}
                </div>
                {exSets.map((s,i)=>(

// SETTINGS SCREEN – with full backup / import / restore
// ═══════════════════════════════════════════════════════
const SettingsScreen = ({
  settings, onUpdate,
  sessions, metrics, plans, cardio,
  customExercises, exerciseOverrides,
  onReset, onImport,
}) => {
  const [weekGoal,setWeekGoal] = useState(String(settings.weeklyGoal||3));
  const [confirmReset,setConfirmReset] = useState(false);
  const [importStatus,setImportStatus] = useState(null); // null | "ok" | "error" | string
  const importRef = useRef(null);

  const totalVol = useMemo(()=>sessions.reduce((s,x)=>s+vol(x.sets),0),[sessions]);
  const streak   = useMemo(()=>calcStreak(sessions,cardio),[sessions,cardio]);

  // ── Export ───────────────────────────────────────────
  const exportData = useCallback(() => {
    const payload = {
      _fittrack_version: 6,
      exportedAt: new Date().toISOString(),
      settings,
      sessions,
      cardio,
      plans,
      metrics,
      customExercises: customExercises || [],
      exerciseOverrides: exerciseOverrides || {},
    };
    try {
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href     = url;
      a.download = `fittrack-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    } catch(e) {
      console.error("Export failed", e);
    }
  }, [settings, sessions, cardio, plans, metrics, customExercises, exerciseOverrides]);

  // ── Import / Validate ────────────────────────────────
  const handleImportFile = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = ""; // reset so same file can be re-selected
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const raw = JSON.parse(ev.target.result);

        // Validation
        if (typeof raw !== "object" || !raw) throw new Error("Kein gültiges JSON-Objekt");
        if (!raw._fittrack_version) throw new Error("Keine FitTrack-Backup-Datei");

        // Normalise – older exports may miss some fields
        const imported = {
          settings:          (typeof raw.settings === "object" && raw.settings) ? raw.settings : {},
          sessions:          Array.isArray(raw.sessions)   ? raw.sessions   : [],
          cardio:            Array.isArray(raw.cardio)     ? raw.cardio     : [],
          plans:             Array.isArray(raw.plans)      ? raw.plans      : [],
          metrics:           Array.isArray(raw.metrics)    ? raw.metrics    : [],
          customExercises:   Array.isArray(raw.customExercises) ? raw.customExercises : [],
          exerciseOverrides: (typeof raw.exerciseOverrides === "object" && raw.exerciseOverrides) ? raw.exerciseOverrides : {},
        };

        // Sanity: sessions need id + date + sets
        const validSessions = imported.sessions.filter(s => s?.id && s?.date && Array.isArray(s?.sets));
        if (imported.sessions.length !== validSessions.length) {
          console.warn(`FitTrack import: ${imported.sessions.length - validSessions.length} ungültige Sessions übersprungen`);
        }
        imported.sessions = validSessions;

        // Sanity: plans need id + name + days
        imported.plans = imported.plans.filter(p => p?.id && p?.name && Array.isArray(p?.days));

        onImport({...imported, settings:{...DEFAULT_SETTINGS, ...imported.settings, onboarded:true}});
        setImportStatus("ok");
        setTimeout(()=>setImportStatus(null), 4000);
      } catch(err) {
        setImportStatus(`Fehler: ${err.message || "Ungültige Datei"}`);
        setTimeout(()=>setImportStatus(null), 6000);
      }
    };
    reader.onerror = () => {
      setImportStatus("Datei konnte nicht gelesen werden");
      setTimeout(()=>setImportStatus(null), 6000);
    };
    reader.readAsText(file);
  };

  const dataStats = {
    trainings: sessions.length,
    cardioAct: cardio.length,
    pläne:     plans.length,
    eigeneÜb:  (customExercises||[]).length,
    körper:    metrics.length,
  };
  const lsUsageKB = (() => {
    try {
      let total = 0;
      for(const k of Object.keys(localStorage)) {
        if (k.startsWith(LS_PREFIX)) total += (localStorage.getItem(k)||"").length;
      }
      return (total / 1024).toFixed(1);
    } catch { return "?"; }
  })();

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px",fontSize:24,fontWeight:900,color:T.text}}>Einstellungen</div>

      {/* Profile card */}
      <Card style={{marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:52,height:52,borderRadius:16,background:T.accentGlow,border:`2px solid ${T.accent}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>💪</div>
          <div>
            <div style={{fontSize:18,fontWeight:900,color:T.text}}>{settings.name||"Athlet"}</div>
            <div style={{fontSize:12,color:T.sub}}>{settings.fitnessGoal||"Fitness"}</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginTop:14,paddingTop:14,borderTop:`1px solid ${T.border}`}}>
          {[{v:sessions.length,l:"Kraft",c:T.accent},{v:cardio.length,l:"Cardio",c:T.green},{v:`${streak}🔥`,l:"Streak",c:T.orange},{v:`${Math.round(totalVol/1000)}t`,l:"Volumen",c:T.blue}].map(s=>(
            <div key={s.l} style={{textAlign:"center"}}>
              <div style={{fontSize:18,fontWeight:900,color:s.c}}>{s.v}</div>
              <div style={{fontSize:9,color:T.muted}}>{s.l}</div>
            </div>
          ))}
        </div>
      </Card>

      {/* Goals */}
      <Card style={{marginBottom:12}}>
        <Lbl>TRAININGSZIEL</Lbl>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {["Muskelaufbau","Kraftzuwachs","Abnehmen","Fitness"].map(g=>(
            <button key={g} onClick={()=>onUpdate({fitnessGoal:g})} style={{background:settings.fitnessGoal===g?T.accent:T.bgInput,color:settings.fitnessGoal===g?"#07070F":T.sub,border:`1px solid ${settings.fitnessGoal===g?T.accent:T.border}`,borderRadius:9,padding:"8px 14px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{g}</button>
          ))}
        </div>
      </Card>

      <Card style={{marginBottom:12}}>
        <Lbl>WOCHENZIEL (Kraft + Cardio)</Lbl>
        <div style={{display:"flex",gap:8}}>
          <Inp value={weekGoal} onChange={setWeekGoal} type="number" style={{flex:1}}/>
          <Btn onClick={()=>{ const n=parseInt(weekGoal); if(n>0) onUpdate({weeklyGoal:n}); }} style={{padding:"10px 18px"}}>Setzen</Btn>
        </div>
      </Card>

      {/* ── Backup / Restore ──────────────────────────── */}
      <Card style={{marginBottom:12}}>
        <Lbl color={T.blue}>BACKUP & WIEDERHERSTELLUNG</Lbl>

        {/* Data summary */}
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
          {Object.entries(dataStats).map(([k,v])=>(
            <div key={k} style={{background:T.bgInput,borderRadius:8,padding:"5px 10px",fontSize:11}}>
              <span style={{color:T.text,fontWeight:700}}>{v}</span>
              <span style={{color:T.muted}}> {k}</span>
            </div>
          ))}
          <div style={{background:T.bgInput,borderRadius:8,padding:"5px 10px",fontSize:11}}>
            <span style={{color:T.teal,fontWeight:700}}>{lsUsageKB} KB</span>
            <span style={{color:T.muted}}> localStorage</span>
          </div>
        </div>

        {/* Export */}
        <Btn v="ghost" onClick={exportData} full style={{marginBottom:8}}>
          📤 Backup exportieren (JSON)
        </Btn>

        {/* Import */}
        <Btn v="ghost" onClick={()=>importRef.current?.click()} full style={{marginBottom:8}}>
          📥 Backup importieren
        </Btn>
        <input
          ref={importRef}
          type="file"
          accept=".json,application/json"
          onChange={handleImportFile}
          style={{display:"none"}}
        />

        {/* Status feedback */}
        {importStatus && (
          <div style={{
            padding:"10px 12px", borderRadius:10, fontSize:13, fontWeight:600,
            background: importStatus==="ok" ? T.green+"22" : T.red+"22",
            color:      importStatus==="ok" ? T.green       : T.red,
            border:`1px solid ${importStatus==="ok" ? T.green+"44" : T.red+"44"}`,
          }}>
            {importStatus==="ok"
              ? "✓ Backup erfolgreich importiert – alle Daten wiederhergestellt"
              : importStatus}
          </div>
        )}

        <div style={{fontSize:11,color:T.muted,marginTop:8,lineHeight:1.6}}>
          Das Backup enthält alle Trainings, Cardio, Pläne, Körperdaten und eigene Übungen.
          Beim Import werden bestehende Daten vollständig ersetzt.
        </div>
      </Card>

      {/* Reset */}
      <Card style={{marginBottom:12}}>
        <Lbl>ZURÜCKSETZEN</Lbl>
        {!confirmReset
          ? <Btn v="danger" onClick={()=>setConfirmReset(true)} full>⚠️ Alle Daten löschen</Btn>
          : <div>
              <div style={{fontSize:13,color:T.red,marginBottom:10,lineHeight:1.5}}>
                Wirklich alle Daten unwiderruflich löschen?<br/>
                <span style={{fontSize:11,color:T.muted}}>Erstelle vorher ein Backup!</span>
              </div>
              <div style={{display:"flex",gap:8}}>
                <Btn v="ghost" onClick={()=>setConfirmReset(false)} style={{flex:1}}>Abbrechen</Btn>
                <Btn v="danger" onClick={()=>{onReset();setConfirmReset(false);}} style={{flex:1}}>Ja, löschen</Btn>
              </div>
            </div>
        }
      </Card>

      <div style={{padding:14,background:T.bgAlt,borderRadius:14,border:`1px solid ${T.border}`}}>
        <div style={{fontSize:11,color:T.muted,lineHeight:1.8}}>
          <span style={{color:T.sub,fontWeight:700}}>ℹ️ FITTRACK v6.0</span><br/>
          React Web · JSX · localStorage<br/>
          <span style={{color:T.accentDim}}>Backup-System · unitType · Bilder-Komprimierung · Cardio-Sort</span>
        </div>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════
function App() {
  const [settings, setSettings] = usePersistedState("settings", DEFAULT_SETTINGS);
  const [sessions, setSessions] = usePersistedState("sessions", SEED_SESSIONS);
  const [plans,    setPlans]    = usePersistedState("plans",    MY_PLANS);
  const [metrics,  setMetrics]  = usePersistedState("metrics",  []);
  const [cardio,   setCardio]   = usePersistedState("cardio",   SEED_CARDIO);
  // Custom exercises created by user
  const [customExercises, setCustomExercises] = usePersistedState("customExercises", []);
  // Overrides: {[exerciseId]: {desc, link, img}} for built-in exercises
  const [exerciseOverrides, setExerciseOverrides] = usePersistedState("exerciseOverrides", {});
  const [tab,      setTab]      = useState("dashboard");
  const [showMore, setShowMore] = useState(false);
  const [preselectedPlanId, setPreselectedPlanId] = useState(null);

  // Full exercise database = base + extra + user-created
  // allExercises are the raw entries; resolved = {...ex, ...overrides[ex.id]}
  const allExercises = useMemo(() => [...ALL_EDB_BASE, ...customExercises], [customExercises]);
  const resolveEx = useCallback(ex => ({...ex, ...(exerciseOverrides?.[ex.id]||{})}), [exerciseOverrides]);

  const streak       = useMemo(()=>calcStreak(sessions,cardio),                     [sessions,cardio]);
  const achievements = useMemo(()=>calcAchievements(sessions,metrics,streak,cardio),[sessions,metrics,streak,cardio]);

  const saveSession    = useCallback(s =>  { setSessions(p=>[s,...p]); setTab("progress"); }, []);
  const saveMetric     = useCallback(m =>  { setMetrics(p=>[...p,m]); },                      []);
  const saveCardio     = useCallback(c =>  { setCardio(p=>[c,...p]); },                        []);
  const updateSettings = useCallback(u =>  { setSettings(p=>({...p,...u})); },                 []);
  const resetAll = useCallback(()=> {
    setSessions([]); setMetrics([]); setCardio([]);
    setCustomExercises([]); setExerciseOverrides({});
    setSettings({...DEFAULT_SETTINGS,onboarded:false});
  }, []);

  // Fix 4: Import handler – fully replaces all state from backup
  const importAll = useCallback(({settings:s, sessions:se, cardio:ca, plans:pl, metrics:me, customExercises:cx, exerciseOverrides:eo}) => {
    if (s)  setSettings(s);
    if (se) setSessions(se);
    if (ca) setCardio(ca);
    if (pl) setPlans(pl);
    if (me) setMetrics(me);
    if (cx) setCustomExercises(cx);
    if (eo) setExerciseOverrides(eo);
  }, []);
  const finishOnboarding = useCallback(({name,goal,weeklyGoal,weight}) => {
    setSettings(p=>({...p,name,fitnessGoal:goal,weeklyGoal,onboarded:true,bodyWeight:weight||null}));
    if (weight) saveMetric({id:uid(),date:new Date().toISOString(),weight,waist:null});
  }, []);

  const handleSelectPlan = useCallback(planId => {
    setPreselectedPlanId(planId);
    setTab("workout");
  }, []);

  if (!settings.onboarded) return <OnboardingScreen onDone={finishOnboarding} onImport={importAll}/>;

  const TABS = [
    {id:"dashboard", icon:"⌂",  label:"Home"},
    {id:"plans",     icon:"📋", label:"Pläne"},
    {id:"workout",   icon:"🏋", label:"Kraft"},
    {id:"cardio",    icon:"🏃", label:"Cardio"},
    {id:"progress",  icon:"📈", label:"Verlauf"},
    {id:"more",      icon:"⋯",  label:"Mehr"},
  ];
  const MORE = [
    {id:"body",         icon:"⚖",  label:"Körper"},
    {id:"achievements", icon:"🏆", label:"Badges"},
    {id:"exercises",    icon:"📚", label:"Übungen"},
    {id:"settings",     icon:"⚙",  label:"Einst."},
  ];

  const goTab = id => {
    if (id !== "workout") setPreselectedPlanId(null);
    setTab(id);
    setShowMore(false);
  };

  const Screen = () => {
    switch (tab) {
      case "dashboard":    return <DashboardScreen sessions={sessions} plans={plans} metrics={metrics} settings={settings} cardio={cardio} streak={streak} achievements={achievements} allExercises={allExercises} onStartWorkout={()=>goTab("workout")} onGoTo={goTab}/>;
      case "plans":        return <PlansScreen plans={plans} setPlans={setPlans} allExercises={allExercises} exerciseOverrides={exerciseOverrides} setExerciseOverrides={setExerciseOverrides} customExercises={customExercises} setCustomExercises={setCustomExercises} onSelectPlan={handleSelectPlan}/>;
      case "workout":      return <WorkoutScreen plans={plans} allExercises={allExercises} exerciseOverrides={exerciseOverrides} onSave={saveSession} preselectedPlanId={preselectedPlanId}/>;
      case "cardio":       return <CardioScreen cardio={cardio} onSave={saveCardio} settings={settings}/>;
      case "progress":     return <ProgressScreen sessions={sessions} plans={plans} cardio={cardio} allExercises={allExercises} exerciseOverrides={exerciseOverrides} onDeleteSession={id=>setSessions(p=>p.filter(x=>x.id!==id))}/>;
      case "body":         return <BodyScreen metrics={metrics} settings={settings} onSaveMetric={saveMetric} onUpdateSettings={updateSettings}/>;
      case "achievements": return <AchievementsScreen sessions={sessions} metrics={metrics} streak={streak} cardio={cardio}/>;
      case "exercises":    return <ExerciseDBScreen allExercises={allExercises} customExercises={customExercises} setCustomExercises={setCustomExercises} exerciseOverrides={exerciseOverrides} setExerciseOverrides={setExerciseOverrides}/>;
      case "settings":     return <SettingsScreen sessions={sessions} metrics={metrics} plans={plans} settings={settings} cardio={cardio} customExercises={customExercises} exerciseOverrides={exerciseOverrides} onUpdate={updateSettings} onReset={resetAll} onImport={importAll}/>;
      default:             return null;
    }
  };

  const isMoreTab = MORE.some(m=>m.id===tab);

  return (
    <div style={{background:T.bg,minHeight:"100vh",maxWidth:390,margin:"0 auto",fontFamily:"-apple-system,'Helvetica Neue',sans-serif",color:T.text,position:"relative",boxShadow:"0 0 120px rgba(0,0,0,0.99)"}}>
      <div style={{padding:"10px 20px 0",display:"flex",justifyContent:"space-between",fontSize:12,color:T.muted}}>
        <span style={{fontWeight:700}}>{new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}</span>
        <span style={{color:T.accentDim,fontWeight:800,letterSpacing:0.8}}>FITTRACK</span>
        <span>● ● ●</span>
      </div>
      <div style={{paddingBottom:74,minHeight:"calc(100vh - 44px)",overflowY:"auto"}}>
        <Screen/>
      </div>
      {showMore && <>
        <div style={{position:"fixed",bottom:74,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:390,background:T.bgCard,borderTop:`1px solid ${T.border}`,zIndex:99,borderRadius:"18px 18px 0 0",padding:"12px 16px 8px"}}>
          <div style={{textAlign:"center",marginBottom:10}}>
            <div style={{width:36,height:4,background:T.border,borderRadius:99,margin:"0 auto 8px"}}/>
            <div style={{fontSize:10,color:T.muted,fontWeight:700,letterSpacing:1}}>WEITERE FUNKTIONEN</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
            {MORE.map(item=>(
              <button key={item.id} onClick={()=>goTab(item.id)} style={{background:tab===item.id?T.accentGlow:T.bgAlt,border:`1px solid ${tab===item.id?T.accent:T.border}`,borderRadius:12,padding:"12px 4px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <span style={{fontSize:22}}>{item.icon}</span>
                <span style={{fontSize:9,fontWeight:700,color:tab===item.id?T.accent:T.sub}}>{item.label}</span>
              </button>
            ))}
          </div>
        </div>
        <div style={{position:"fixed",inset:0,zIndex:98}} onClick={()=>setShowMore(false)}/>
      </>}
      <div style={{position:"fixed",bottom:0,width:"100%",maxWidth:390,background:T.bgCard,borderTop:`1px solid ${T.border}`,display:"flex",padding:"7px 0 14px",zIndex:100}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>{if(t.id==="more"){setShowMore(s=>!s);}else{goTab(t.id);}}} style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"4px 0"}}>
            <span style={{fontSize:18}}>{t.icon}</span>
            <span style={{fontSize:9,fontWeight:700,letterSpacing:0.3,color:(tab===t.id||(t.id==="more"&&isMoreTab))?T.accent:T.muted}}>{t.label}</span>
            {(tab===t.id||(t.id==="more"&&isMoreTab))&&<div style={{width:3,height:3,borderRadius:"50%",background:T.accent}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
