  if (!plan || plan.id!=="pg2") return null;
  return (
    <div style={{padding:"12px 14px",background:"#3090FF18",borderRadius:12,border:`1px solid ${T.blue}44`,marginTop:12,fontSize:13,color:T.sub,lineHeight:1.7}}>
      <div style={{color:T.blue,fontWeight:800,marginBottom:4}}>📈 PROGRESSIONSPRINZIP</div>
      <b style={{color:T.text}}>Ziel:</b> Alle Arbeitssätze sauber → dann +2,5 kg (Maschinen) / +5 kg (Beinpresse).<br/>
      <b style={{color:T.text}}>Deload:</b> Alle 4 Wochen 10% weniger Gewicht, gleiche Wdh.<br/>
      <b style={{color:T.text}}>Rotation:</b> Tag A → B → C → Pause → wiederholen.
    </div>
  );
};

const PlansScreen = ({plans, setPlans, allExercises, exerciseOverrides, setExerciseOverrides, customExercises, setCustomExercises, onSelectPlan, settings, sessions}) => {
  const [view,setView]     = useState("list"); // list | detail | edit
  const [showArchive,setShowArchive] = useState(false);
  const [sel,setSel]       = useState(null);
  const [editing,setEditing] = useState(null);

  // Fix 1: reset to list view if the selected plan no longer exists
  useEffect(() => {
    if (view === "detail" && sel && !plans.find(p => p.id === sel)) {
      setView("list"); setSel(null);
    }
  }, [view, sel, plans]);

  const activePlans   = plans.filter(p=>!p.archived);
  const archivedPlans = plans.filter(p=>p.archived);

  const save  = p => { setPlans(prev=>prev.some(x=>x.id===p.id)?prev.map(x=>x.id===p.id?p:x):[...prev,p]); setView("list"); };
  const del   = id => { if(!window.confirm("Plan wirklich löschen?")) return; setPlans(prev=>prev.filter(x=>x.id!==id)); setView("list"); };
  const archive = id => setPlans(prev=>prev.map(p=>p.id===id?{...p,archived:!p.archived}:p));
  const copy  = id => {
    const src = plans.find(p=>p.id===id);
    if (!src) return;
    const newPlan = {
      ...JSON.parse(JSON.stringify(src)),
      id: uid(),
      name: `${src.name} (Kopie)`,
      archived: false,
    };
    // New IDs for days
    newPlan.days = newPlan.days.map(d=>({...d,id:uid()}));
    setPlans(prev=>[...prev,newPlan]);
  };

  if (view==="edit") return (
    <PlanEditor
      plan={editing}
      allExercises={allExercises}
      exerciseOverrides={exerciseOverrides}
      setExerciseOverrides={setExerciseOverrides}
      customExercises={customExercises}
      setCustomExercises={setCustomExercises}
      onSave={save}
      onCancel={()=>setView(editing?"detail":"list")}
      settings={settings}
      sessions={sessions}
    />
  );

  if (view==="detail" && sel) {
    const plan = plans.find(p=>p.id===sel);
    // Fix 1: no setter during render — guard renders nothing; effect below resets
    if (!plan) return null;
    return (
      <div style={{padding:"0 16px 24px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"20px 0 14px"}}>
          <Btn v="ghost" onClick={()=>setView("list")} style={{padding:"8px 14px"}}>←</Btn>
          <div style={{flex:1,fontSize:18,fontWeight:900,color:T.text}}>{plan.name}</div>
          <Btn v="ghost" onClick={()=>{setEditing(plan);setView("edit");}} style={{padding:"8px 14px"}}>✎</Btn>
        </div>
        {plan.archived&&<Badge color={T.muted} style={{marginBottom:10}}>📦 Archiviert</Badge>}
        {plan.desc&&<div style={{fontSize:13,color:T.sub,marginBottom:4}}>{plan.desc}</div>}
        {plan.id==="pg2"&&<ProgressionTip plan={plan}/>}
        <div style={{height:12}}/>

        {plan.days.map(day=>(
          <Card key={day.id} style={{marginBottom:10}}>
            <div style={{fontSize:15,fontWeight:700,color:T.accent,marginBottom:10}}>{day.name}</div>
            {day.exercises.map((ex,i)=>{
              const e=allExercises.find(x=>x.id===ex.eid);
              const unitType = e?.unitType || "reps";
              return (
                <div key={`${ex.eid}-${i}`} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"8px 0",borderBottom:i<day.exercises.length-1?`1px solid ${T.border}`:"none"}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:T.text}}>{e?.name||"Unbekannte Übung"}</div>
                    <div style={{fontSize:11,color:T.sub}}>{e?.eq}{ex.note&&<span style={{color:T.muted}}> · {ex.note}</span>}</div>
                  </div>
                  <div style={{textAlign:"right",marginLeft:8}}>
                    <div style={{fontSize:13,fontWeight:700,color:T.text}}>
                      {ex.sets}×{fmtRepsVal(ex.reps, unitType)}{ex.weight>0&&unitType==="reps"?` @ ${ex.weight}kg`:""}
                    </div>
                    {ex.rest>0&&<div style={{fontSize:10,color:T.muted}}>{ex.rest}s Pause</div>}
                  </div>
                </div>
              );
            })}
          </Card>
        ))}

        {/* Action buttons */}
        <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
          <Btn v="ghost" onClick={()=>copy(plan.id)} style={{flex:1,padding:"10px 8px",fontSize:13}}>📋 Kopieren</Btn>
          <Btn v="ghost" onClick={()=>{archive(plan.id);setView("list");}} style={{flex:1,padding:"10px 8px",fontSize:13}}>
            {plan.archived?"📤 Aktivieren":"📦 Archivieren"}
          </Btn>
          <Btn v="danger" onClick={()=>del(plan.id)} style={{flex:1,padding:"10px 8px",fontSize:13}}>🗑 Löschen</Btn>
        </div>
        {!plan.archived&&(
          <Btn onClick={()=>onSelectPlan(plan.id)} full style={{padding:14,marginTop:10}}>▶ Trainieren</Btn>
        )}
      </div>
    );
  }

  // List view
  const renderPlan = plan => (
    <Card key={plan.id} onClick={()=>{setSel(plan.id);setView("detail");}} style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
            <div style={{fontSize:16,fontWeight:700,color:T.text}}>{plan.name}</div>
            {plan.id==="pg1"&&<Badge color={T.orange}>GAINSFIRE</Badge>}
          </div>
          <div style={{fontSize:12,color:T.sub,marginBottom:6}}>{plan.desc}</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <Badge color={T.blue}>{plan.days.length} {plan.days.length===1?"Tag":"Tage"}</Badge>
            <Badge color={T.purple}>{plan.days.reduce((s,d)=>s+d.exercises.length,0)} Übungen</Badge>
          </div>
        </div>
        <span style={{fontSize:22,color:T.muted,marginLeft:8}}>›</span>
      </div>
    </Card>
  );

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:24,fontWeight:900,color:T.text}}>Trainingspläne</div>
        <Btn v="secondary" onClick={()=>{setEditing(null);setView("edit");}} style={{padding:"8px 16px",fontSize:13}}>+ Neu</Btn>
      </div>

      {activePlans.length===0&&(
        <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16,marginBottom:12}}>Noch keine aktiven Pläne.</div>
      )}
      {activePlans.map(renderPlan)}

      {archivedPlans.length>0&&(
        <>
          <button onClick={()=>setShowArchive(s=>!s)} style={{background:"none",border:"none",cursor:"pointer",color:T.sub,fontSize:13,fontWeight:700,padding:"8px 0",width:"100%",textAlign:"left"}}>
            📦 Archiv ({archivedPlans.length}) {showArchive?"▲":"▼"}
          </button>
          {showArchive && archivedPlans.map(renderPlan)}
        </>
      )}
    </div>
  );
};

// ─────────────────────────────────────────────────────────────────────
// WorkoutExerciseCard – extracted so hooks (useState) are valid
// Fix: React.useState must not be called inside .map()
// ─────────────────────────────────────────────────────────────────────
const WorkoutExerciseCard = ({
  planEx, planExIdx, allExercises, exerciseOverrides,
  sets, setSets, toggle, upd, addSet, setExTimer, exTimer, settings, sessions,
}) => {
  const ikey     = instKey(planEx.eid, planExIdx);
  const exercise = (allExercises||[]).find(e=>e.id===planEx.eid);
  const override = exerciseOverrides?.[planEx.eid] || {};
  const resolved = {...(exercise||{}), ...override};
  const exSets   = sets[ikey]||[];
  const doneCount= exSets.filter(s=>s.done).length;
  const allDone  = exSets.length>0 && exSets.every(s=>s.done);
  const unitType = resolved.unitType || "reps";
  const isTimeBased = unitType === "secs" || unitType === "mins";
  const repLabel = repsFieldLabel(unitType);
  const hasExpandableInfo = !!(resolved.desc || resolved.link || resolved.img);
  const hasExtraInfo = hasExpandableInfo;
  const [showInfo, setShowInfo] = useState(false); // safe: called in component, not .map()
  // Punkt 9: auto-collapse on allDone, manual re-open stays open
  const [collapsed, setCollapsed]       = useState(false);
  const [manuallyOpened, setManuallyOpened] = useState(false);
  useEffect(() => {
    if (allDone && !manuallyOpened) setCollapsed(true);
    if (!allDone) { setCollapsed(false); setManuallyOpened(false); }
  }, [allDone]); // eslint-disable-line
  // Is the exercise timer currently running for this card?
  const isThisTimerActive = exTimer?.ikey === ikey;
  // Progression suggestion — skip if this planEx is a warmup position
  const ps = getProgressionSettings(settings);
  const isWarmupPosition = !!((planEx.note||"").toLowerCase().match(/eingewöhnung|warm[\s-]?up|aufwärm|warmup/));
  const suggestion = useMemo(() => {
    if (!ps.showSuggestionsInWorkout || isTimeBased || isWarmupPosition) return null;
    return calculateProgressionSuggestion(planEx, exercise, sessions||[], settings, allExercises);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [planEx?.eid, planExIdx, isWarmupPosition, sessions?.length, JSON.stringify(settings?.progressionSettings)]);

  // Apply suggestion to all sets of this exercise
  // Apply suggestion: update weight for all undone sets in one batched call.
  // If deload with set reduction (suggestedSets), also trim excess undone sets.
  const applySuggestion = () => {
    if (!suggestion) return;
    const ikey_ = instKey(planEx.eid, planExIdx);
    setSets(prev => {
      const curSets  = prev[ikey_] || [];
      let updated    = curSets.map(s =>
        s.done ? s : {
          ...s,
          weight: suggestion.suggestedWeight > 0 ? suggestion.suggestedWeight : s.weight,
        }
      );
      // For deload with set reduction: keep done sets + trim undone sets to target count
      if (suggestion.isDeload && suggestion.suggestedSets != null) {
        const doneSets  = updated.filter(s => s.done);
        const undoneSets= updated.filter(s => !s.done);
        const keepUndone= Math.max(0, suggestion.suggestedSets - doneSets.length);
        updated = [...doneSets, ...undoneSets.slice(0, keepUndone)];
        // Always keep at least 1 set total
        if (updated.length === 0 && curSets.length > 0) updated = [curSets[0]];
      }
      return { ...prev, [ikey_]: updated };
    });
  };


  return (
    <Card key={ikey} style={{marginTop:12}}
      accent={allDone ? T.accentDim : isThisTimerActive ? T.blue : T.border}>

      {/* ── Header – always visible ─────────────────────────── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:collapsed?0:6}}>
        <div style={{flex:1, cursor:collapsed?"pointer":"default"}} onClick={()=>{
          if(collapsed){setCollapsed(false);setManuallyOpened(true);}
        }}>
          <div style={{fontSize:15,fontWeight:700,color:allDone?T.accentDim:T.text,display:"flex",gap:6,alignItems:"center"}}>
            {resolved.name||"?"}
            {allDone && <span style={{fontSize:11,color:T.accentDim}}>✓</span>}
            {isThisTimerActive && <span style={{fontSize:11,color:T.blue,fontWeight:800}}>⏱</span>}
          </div>
          <div style={{fontSize:11,color:T.sub}}>
            {resolved.cat}{resolved.eq?` · ${resolved.eq}`:""}
            {planEx.rest>0&&` · ${planEx.rest}s Pause`}
            {/* Punkt 9: progress when collapsed */}
            {collapsed && exSets.length>0 && (
              <span style={{marginLeft:8,color:T.accentDim,fontWeight:700}}>
                {doneCount}/{exSets.length} Sätze
              </span>
            )}
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {hasExpandableInfo&&!collapsed&&(
            <button onClick={()=>setShowInfo(v=>!v)} style={{
              background:showInfo?T.blue+"33":T.bgAlt,
              border:`1px solid ${showInfo?T.blue+"88":T.border}`,
              borderRadius:7,padding:"3px 8px",cursor:"pointer",
              color:showInfo?T.blue:T.muted,fontSize:11,fontWeight:700,
            }}>ℹ</button>
          )}
          {/* Collapse toggle */}
          <button onClick={()=>{
            if(collapsed){setCollapsed(false);setManuallyOpened(true);}
            else setCollapsed(true);
          }} style={{background:"none",border:"none",cursor:"pointer",
            color:T.muted,fontSize:16,padding:"2px 4px",lineHeight:1}}>
            {collapsed?"▼":"▲"}
          </button>
          <Badge color={CAT_COLOR_EXT[resolved.cat]||T.accent}>{resolved.cat||"?"}</Badge>
        </div>
      </div>

      {/* ── Collapsible body ────────────────────────────────── */}
      {!collapsed && (<>

        {/* Trainingsnotiz */}
        {resolved.trainingsnotiz&&(
          <div style={{fontSize:11,color:T.teal,marginBottom:6,padding:"4px 8px",
            background:T.teal+"15",borderRadius:6,border:`1px solid ${T.teal}33`}}>
            📌 {resolved.trainingsnotiz}
          </div>
        )}
        {planEx.note&&(
          <div style={{fontSize:10,color:T.muted,marginBottom:6}}>💡 {planEx.note}</div>
        )}

        {/* ── Progression suggestion box ─────────────────── */}
        {suggestion&&(()=>{
          const repRange = getRepRangeForPlanExercise(planEx, settings);
          return (
          <div style={{
            marginBottom:8, padding:"8px 10px", borderRadius:10,
            background: suggestion.isDeload ? T.orange+"18" : T.teal+"18",
            border:`1px solid ${suggestion.isDeload ? T.orange+"55" : T.teal+"55"}`,
          }}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
              <div style={{flex:1}}>
                <div style={{fontSize:11,fontWeight:800,letterSpacing:0.3,marginBottom:2,
                  color: suggestion.isDeload ? T.orange : T.teal}}>
                  {suggestion.isDeload ? "⬇ DELOAD" : suggestion.action==="increase" ? "↑ PROGRESSION" : "→ HALTEN"}
                </div>
                <div style={{fontSize:12,color:suggestion.isDeload?T.orange:T.teal,fontWeight:700,marginBottom:2}}>
                  {suggestion.suggestedWeight>0 ? `${suggestion.suggestedWeight} kg` : "—"}
                  {" × "}{repRange.min}–{repRange.max} Wdh
                </div>
                <div style={{fontSize:10,color:T.sub}}>{suggestion.reason}</div>
                {suggestion.isDeload&&suggestion.suggestedSets!=null&&(
                  <div style={{fontSize:10,color:T.orange,marginTop:2,fontWeight:700}}>
                    → {suggestion.suggestedSets} Sätze empfohlen
                  </div>
                )}
              </div>
              <button
                onClick={applySuggestion}
                style={{
                  background: suggestion.isDeload ? T.orange : T.teal,
                  color:"#07070F", border:"none", borderRadius:7,
                  padding:"5px 10px", fontSize:11, fontWeight:800,
                  cursor:"pointer", flexShrink:0, whiteSpace:"nowrap",
                }}
              >Übernehmen</button>
            </div>
          </div>
          );
        })()}

        {/* Extra info badges */}
        {hasExtraInfo&&(
          <div style={{display:"flex",gap:5,marginBottom:6,flexWrap:"wrap"}}>
            {resolved.img&&<span style={{fontSize:10,color:T.purple,background:T.purple+"18",border:`1px solid ${T.purple}44`,borderRadius:5,padding:"1px 6px",fontWeight:700}}>🖼 Bild</span>}
            {resolved.desc&&<span style={{fontSize:10,color:T.blue,background:T.blue+"18",border:`1px solid ${T.blue}44`,borderRadius:5,padding:"1px 6px",fontWeight:700}}>📝 Info</span>}
            {resolved.link&&<span style={{fontSize:10,color:T.teal,background:T.teal+"18",border:`1px solid ${T.teal}44`,borderRadius:5,padding:"1px 6px",fontWeight:700}}>🎥 Video</span>}
          </div>
        )}

        {/* Expandable info panel */}
        {showInfo&&(
          <div style={{marginBottom:10,padding:"10px 12px",background:T.bgAlt,borderRadius:10,border:`1px solid ${T.border}`}}>
            {resolved.img&&<img src={resolved.img} alt={resolved.name} style={{width:"100%",borderRadius:8,maxHeight:160,objectFit:"cover",marginBottom:8}}/>}
            {resolved.desc&&<div style={{fontSize:12,color:T.sub,lineHeight:1.6,marginBottom:resolved.link?8:0}}>{resolved.desc}</div>}
            {resolved.link&&<a href={resolved.link} target="_blank" rel="noreferrer"
              style={{display:"flex",alignItems:"center",gap:6,padding:"7px 10px",background:T.bgCard,borderRadius:8,color:T.blue,fontSize:12,fontWeight:700,textDecoration:"none",marginTop:resolved.desc?6:0}}>
              🎥 Anleitungsvideo
            </a>}
          </div>
        )}

        {/* ── Set rows (Points 2,3,4,5,6,7) ──────────────── */}
        {exSets.map((s,i)=>{
          // Point 4: track extra (user-added) sets by planEx.sets
          // Bug 1 fix: extra sets identified ONLY by explicit flag, never by index
          // (index-based fallback caused prev-session extra sets to stay "extra" after carryover)
          const isExtra = s.extra === true;
          const startTimer = () => {
            const targetSecs = unitType==="mins" ? (s.reps||1)*60 : (s.reps||30);
            setExTimer({ikey, setIdx:i, targetSecs, restSecs:planEx.rest||0});
          };
          const handleDone = () => {
            if (isTimeBased && !s.done) {
              // Fix 5: prevent double-start if timer already running for this set
              if (isThisTimerActive && exTimer?.setIdx === i) return;
              startTimer();
            } else {
              toggle(ikey, i, planEx.rest);
            }
          };
          return (
            <div key={i} style={{
              display:"grid",
              // Point 2+3: no summary column, no left check – just [num] [fields…] [✓]
              gridTemplateColumns: isTimeBased ? "30px 1fr 38px" : "30px 1fr 24px 1fr 38px",
              alignItems:"center", gap:5, marginBottom:7,
              opacity:s.done ? 0.45 : 1,
            }}>

              {/* Set number badge – no click handler (Point 3: left check removed) */}
              <div style={{
                width:30, height:34, borderRadius:8,
                background: s.done ? T.accent+"22"
                  : isThisTimerActive && exTimer?.setIdx===i ? T.blue+"33"
                  : T.bgInput,
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:12, fontWeight:800,
                color: s.done ? T.accentDim
                  : isThisTimerActive && exTimer?.setIdx===i ? T.blue
                  : T.muted,
                border:`1px solid ${s.done ? T.accent+"44" : T.border}`,
              }}>
                {s.done ? "✓" : isThisTimerActive && exTimer?.setIdx===i ? "⏱" : i+1}
              </div>

              {isTimeBased ? (
                /* Point 7: time exercises – editable number input with Sek/Min unit label */
                <div style={{display:"flex", alignItems:"center", gap:4}}>
                  <input
                    type="number"
                    value={s.reps}
                    onChange={e => upd(ikey, i, "reps", e.target.value)}
                    style={{
                      background:T.bgInput, border:`1px solid ${T.teal}55`,
                      borderRadius:8, padding:"8px 6px",
                      color:T.teal, fontSize:15, fontWeight:700,
                      textAlign:"center", width:"100%", boxSizing:"border-box",
                    }}
                  />
                  <span style={{fontSize:11, color:T.teal, fontWeight:700, whiteSpace:"nowrap"}}>
                    {unitType==="mins" ? "Min" : "Sek"}
                  </span>
                </div>
              ) : (
                /* Point 2: no summary column – just weight × reps */
                <>
                  {/* Weight field with "kg" label */}
                  <div style={{display:"flex", alignItems:"center", gap:3}}>
                    <input
                      type="number"
                      value={s.weight}
                      onChange={e => upd(ikey, i, "weight", e.target.value)}
                      style={{
                        background:T.bgInput, border:`1px solid ${T.border}`,
                        borderRadius:8, padding:"8px 4px",
                        color:T.text, fontSize:15, fontWeight:700,
                        textAlign:"center", width:"100%", boxSizing:"border-box",
                      }}
                    />
                    <span style={{fontSize:10, color:T.muted, whiteSpace:"nowrap"}}>kg</span>
                  </div>
                  <span style={{textAlign:"center", color:T.muted, fontSize:12}}>×</span>
                  {/* Reps field with "Wdh" label */}
                  <div style={{display:"flex", alignItems:"center", gap:3}}>
                    <input
                      type="number"
                      value={s.reps}
                      onChange={e => upd(ikey, i, "reps", e.target.value)}
                      style={{
                        background:T.bgInput, border:`1px solid ${T.border}`,
                        borderRadius:8, padding:"8px 4px",
                        color:T.text, fontSize:15, fontWeight:700,
                        textAlign:"center", width:"100%", boxSizing:"border-box",
                      }}
                    />
                    <span style={{fontSize:10, color:T.muted, whiteSpace:"nowrap"}}>Wdh</span>
                  </div>
                </>
              )}

              {/* Point 3+5: right done/start button only, slightly larger touch target */}
              {/* Fix 6: clearer done button with better contrast + active state */}
              <button
                onClick={handleDone}
                aria-label={s.done ? "Satz abgeschlossen" : "Satz abschließen"}
                title={s.done ? "Abgeschlossen" : isTimeBased ? "Timer starten" : "Satz abhaken"}
                style={{
                  width:38, height:38, borderRadius:9, cursor:"pointer",
                  flexShrink:0,
                  border: s.done
                    ? `2px solid ${T.accent}`
                    : isTimeBased
                    ? `2px solid ${T.blue}88`
                    : `2px solid ${T.border}`,
                  background: s.done
                    ? T.accent+"33"
                    : isTimeBased && isThisTimerActive && exTimer?.setIdx===i
                    ? T.blue+"55"
                    : isTimeBased
                    ? T.blue+"22"
                    : T.bgInput,
                  color: s.done ? T.accent : isTimeBased ? T.blue : T.sub,
                  fontSize: s.done ? 16 : 18,
                  fontWeight:800,
                  transition:"background 0.15s, border-color 0.15s",
                }}
              >
                {s.done ? "✓" : isTimeBased ? "▶" : "○"}
              </button>
            </div>
          );
        })}

        {/* Point 4+6: + Satz button (left, prominent) + delete extra set button */}
        {(()=>{
          // Bug 1 fix: only sets explicitly marked extra:true are deletable extras
          const extraSets = exSets.filter(s => s.extra === true);
          const hasExtra  = extraSets.length > 0;
          return (
            <div style={{display:"flex", gap:6, marginTop:4}}>
              <button
                onClick={()=>addSet(ikey, {
                    reps:      planEx.reps,
                    weight:    planEx.weight,
                    planNote:  planEx.note  || null,
                    planExIdx: planExIdx,
                  })}
                style={{
                  background:T.accent+"22", border:`1px solid ${T.accent}55`,
                  borderRadius:8, padding:"7px 14px",
                  color:T.accent, fontSize:12, fontWeight:700,
                  cursor:"pointer", flexShrink:0,
                }}
              >+ Satz</button>
              {hasExtra && (
                <button
                  onClick={()=>{
                    // Remove last extra (undone preferred, else last)
                    setSets(prev => {
                      const cur = [...(prev[ikey]||[])];
                      // Find last undone extra set index
                      // Bug 1 fix: only delete sets explicitly marked extra:true
                      let target = -1;
                      for (let i=cur.length-1; i>=0; i--) {
                        if (cur[i].extra === true && !cur[i].done) { target=i; break; }
                      }
                      // Fallback: last extra set even if done
                      if (target === -1) {
                        for (let i=cur.length-1; i>=0; i--) {
                          if (cur[i].extra === true) { target=i; break; }
                        }
                      }
                      if (target === -1) return prev; // nothing to delete
                      const next = cur.filter((_,i)=>i!==target);
                      return {...prev, [ikey]: next};
                    });
                  }}
                  style={{
                    background:T.red+"22", border:`1px solid ${T.red}55`,
                    borderRadius:8, padding:"7px 10px",
                    color:T.red, fontSize:12, fontWeight:700,
                    cursor:"pointer", flexShrink:0,
                  }}
                >− Zusatz</button>
              )}
            </div>
          );
        })()}

      </>)}
    </Card>
  );
};
// ═══════════════════════════════════════════════════════
// WORKOUT SCREEN  – mit localStorage Session-Recovery
// ═══════════════════════════════════════════════════════
const WS_KEY = "ft5_active_workout";

function saveWorkoutDraft(draft) {
  try { localStorage.setItem(WS_KEY, JSON.stringify(draft)); } catch {}
}
function loadWorkoutDraft() {
  try {
    const v = localStorage.getItem(WS_KEY);
    if (!v) return null;
    const d = JSON.parse(v);
    // Fix 6 migration: old drafts used eid as key (no "__"), discard them
    if (d?.sets && Object.keys(d.sets).some(k => !k.includes("__"))) {
      localStorage.removeItem(WS_KEY);
      return null;
    }
    return d;
  } catch { return null; }
}
function clearWorkoutDraft() {
  try { localStorage.removeItem(WS_KEY); } catch {}
}

const WorkoutScreen = ({plans, allExercises, exerciseOverrides, settings, sessions, onSave, preselectedPlanId}) => {
  // Fix 3: only non-archived plans
  const activePlans = useMemo(() => (plans||[]).filter(p => !p.archived), [plans]);

  const draft = useMemo(() => loadWorkoutDraft(), []);
  const hasDraft = draft && draft.phase === "active";

  const [phase,setPhase]   = useState(() => hasDraft ? "active" : preselectedPlanId ? "preselect" : "select");
  const [planId,setPlanId] = useState(() => hasDraft ? draft.planId : (preselectedPlanId||null));
  const [dayId,setDayId]   = useState(() => hasDraft ? draft.dayId  : null);
  const [sets,setSets]     = useState(() => hasDraft ? (draft.sets||{}) : {});
  const [note,setNote]     = useState(() => hasDraft ? (draft.note||"") : "");
  const [rest,setRest]     = useState(null);
  // ExerciseTimer state: {ikey, setIdx, targetSecs} or null
  const [exTimer, setExTimer] = useState(null);
  const [warnEmpty,setWarnEmpty] = useState(false);
  // "confirm" phase: plan+day selected, user sees overview before officially starting
  const [confirmPlanId, setConfirmPlanId] = useState(null);
  const [confirmDayId,  setConfirmDayId]  = useState(null);

  // Fix 1: reset confirm phase if the selected plan/day no longer exists
  useEffect(() => {
    if (phase === "confirm") {
      const cp = activePlans.find(p => p.id === confirmPlanId);
      const cd = cp?.days.find(d => d.id === confirmDayId);
      if (!cp || !cd) { setPhase("select"); setConfirmPlanId(null); setConfirmDayId(null); }
    }
  }, [phase, confirmPlanId, confirmDayId, activePlans]);

  const t0Ref    = useRef(null);
  const [elapsed,setElapsed] = useState(() => hasDraft ? (draft.elapsed||0) : 0);

  // Fix 2: sync preselectedPlanId prop changes without wiping active training
  const prevPreRef = useRef(preselectedPlanId);
  useEffect(() => {
    if (preselectedPlanId === prevPreRef.current) return;
    prevPreRef.current = preselectedPlanId;
    if (phase === "active" || phase === "done") return;
    if (preselectedPlanId) { setPlanId(preselectedPlanId); setPhase("preselect"); }
    else { setPhase("select"); }
  }, [preselectedPlanId]); // eslint-disable-line

  useEffect(() => {
    if (phase === "active" && t0Ref.current === null) {
      t0Ref.current = Date.now() - (elapsed * 1000);
    }
  }, [phase]);

  useEffect(() => {
    if (phase !== "active") return;
    const iv = setInterval(() => setElapsed(Math.floor((Date.now()-t0Ref.current)/1000)), 1000);
    return () => clearInterval(iv);
  }, [phase]);

  useEffect(() => {
    if (phase !== "active") return;
    saveWorkoutDraft({ phase:"active", planId, dayId, sets, note, elapsed });
  }, [phase, sets, note, elapsed, planId, dayId]);

  // ── Helper: get last session's set values for an exercise position ──────────
  // Returns array of set objects ready to use as starting values, or null.
  const getLastSessionSetDefaults = (pId, dId, exIdx, eid) => {
    // Find most recent session with same plan+day
    const matching = [...sessions]
      .filter(s => s.planId === pId && s.dayId === dId)
      .sort((a,b) => new Date(b.date) - new Date(a.date));
    if (!matching.length) return null;
    const last = matching[0];

    // Carryover rule: include ALL sets for this exact position (warmup and worksets alike).
    // Warmup-sets ARE excluded from vol/PR/badge stats (isWarmupSet guards there),
    // but a user who changed a warmup weight deserves to see that change next session.
    //
    // Primary: exact planExIdx + eid match (preserves set-type separation)
    let exSets = last.sets.filter(s =>
      s.planExIdx === exIdx && s.eid === eid
    );
    // Fallback for old sessions without planExIdx: match eid only, same planExIdx or unknown
    if (!exSets.length) {
      exSets = last.sets.filter(s =>
        s.eid === eid && (s.planExIdx == null || s.planExIdx === exIdx)
      );
    }
    // Last resort: any set with matching eid (handles very old data)
    if (!exSets.length) {
      exSets = last.sets.filter(s => s.eid === eid);
    }
    if (!exSets.length) return null;

    // Return as fresh sets: done reset, extra cleared (previous extras become base sets).
    // isWarmup is propagated from the saved set so isWarmupSet() keeps working on carryover.
    return exSets.map((s, i) => ({
      setN:      i + 1,
      reps:      s.reps,
      weight:    s.weight,
      done:      false,
      planNote:  s.planNote  || null,
      planExIdx: exIdx,
      ...(s.isWarmup ? { isWarmup: true } : {}),
      // extra intentionally omitted → previous extra sets become normal base sets
    }));
  };

  const start = (pId, dId) => {
    t0Ref.current = Date.now();
    setElapsed(0); setWarnEmpty(false);
    setPlanId(pId); setDayId(dId);
    const day = activePlans.find(p=>p.id===pId)?.days.find(d=>d.id===dId);
    if (!day) return;
    const init = {};
    day.exercises.forEach((ex, exIdx) => {
      const key = instKey(ex.eid, exIdx);
      // Prefer last session values; fall back to plan defaults
      const lastDefaults = getLastSessionSetDefaults(pId, dId, exIdx, ex.eid);
      if (lastDefaults) {
        init[key] = lastDefaults;
      } else {
        init[key] = Array.from({length: ex.sets}, (_, i) => ({
          setN:      i + 1,
          reps:      ex.reps,
          weight:    ex.weight,
          done:      false,
          planNote:  ex.note || null,
          planExIdx: exIdx,
        }));
      }
    });
    setSets(init); setPhase("active");
  };

  // Select a day → go to confirm screen first
  const selectDay = (pId, dId) => {
    setConfirmPlanId(pId);
    setConfirmDayId(dId);
    setPhase("confirm");
  };

  // Fix 1: ikey = instKey(eid, planExIdx) – unique per occurrence
  const toggle = (ikey, idx, restSecs) => setSets(prev => {
    if (!prev[ikey]?.[idx]) return prev;
    const upd = {...prev, [ikey]: prev[ikey].map((s,i) => i===idx ? {...s,done:!s.done} : s)};
    if (!prev[ikey][idx].done && restSecs>0) setRest({secs:restSecs});
    return upd;
  });
  const upd    = (ikey,idx,f,v) => setSets(p=>({...p,[ikey]:(p[ikey]||[]).map((s,i)=>i===idx?{...s,[f]:parseFloat(v)||0}:s)}));
  // Fix 4: new sets carry metadata + extra:true so they are robustly identified
  const addSet = (ikey, tmpl) => setSets(p => {
    const cur = p[ikey] || [];
    const newSet = {
      setN:      cur.length + 1,
      reps:      tmpl.reps,
      weight:    tmpl.weight,
      done:      false,
      extra:     true,          // Fix 3: explicit marker
      planNote:  tmpl.planNote  || null,
      planExIdx: tmpl.planExIdx ?? null,
    };
    return { ...p, [ikey]: [...cur, newSet] };
  });

  const discardDraft = () => {
    clearWorkoutDraft(); t0Ref.current = null;
    setPlanId(preselectedPlanId||null);
    setDayId(null); setSets({}); setNote(""); setElapsed(0);
    setPhase(preselectedPlanId ? "preselect" : "select");
  };

  const finish = () => {
    const day = activePlans.find(p=>p.id===planId)?.days.find(d=>d.id===dayId);
    if (!day) return;
    const allSets = [];
    // Fix 1: iterate by instance key to keep duplicate exercises separate
    day.exercises.forEach((ex, exIdx) => {
      const key = instKey(ex.eid, exIdx);
      (sets[key]||[]).filter(s=>s.done).forEach(s => {
        const exercise = (allExercises||[]).find(e => e.id === ex.eid);
        const warmup   = isWarmupSet(s, exercise);
        allSets.push({
          eid:       ex.eid,
          setN:      s.setN,
          reps:      s.reps,
          weight:    s.weight,
          planNote:  s.planNote  ?? (ex.note || null),
          planExIdx: s.planExIdx ?? exIdx,
          ...(warmup      ? { isWarmup: true  } : {}),
          ...(s.extra     ? { extra:    true  } : {}),
        });
      });
    });
    if (allSets.length === 0) { setWarnEmpty(true); return; }
    setWarnEmpty(false); clearWorkoutDraft();
    onSave({id:uid(), planId, dayId, date:new Date().toISOString(), duration:Math.floor(elapsed/60), sets:allSets, note});
    setPhase("done");
  };

  if (phase==="done") return (
    <div style={{padding:"60px 24px",textAlign:"center"}}>
      <div style={{fontSize:80,marginBottom:20}}>🏆</div>
      <div style={{fontSize:30,fontWeight:900,color:T.accent,marginBottom:8}}>Stark gemacht!</div>
      <div style={{color:T.sub,fontSize:16,marginBottom:6}}>{fmt(elapsed)}</div>
      <div style={{color:T.muted,fontSize:13,marginBottom:40}}>
        {Object.values(sets).flat().filter(s=>s.done).length} Sätze · {Math.round(vol(Object.values(sets).flat(), allExercises)).toLocaleString()} kg
      </div>
      <Btn onClick={()=>setPhase("select")} full style={{padding:14}}>Neues Training</Btn>
    </div>
  );

  const preselectedPlan = planId ? activePlans.find(p=>p.id===planId) : null;
  // ── Confirm screen ─────────────────────────────────────────────────
  if (phase === "confirm") {
    const cp  = activePlans.find(p=>p.id===confirmPlanId);
    const cd  = cp?.days.find(d=>d.id===confirmDayId);
    // Fix 1: no setter during render — effect below handles the reset
    if (!cp || !cd) return null;
    const totalSets = cd.exercises.reduce((s,e)=>s+e.sets, 0);
    return (
      <div style={{padding:"0 16px 32px"}}>
        <div style={{padding:"22px 0 6px",display:"flex",alignItems:"center",gap:10}}>
          <Btn v="ghost" onClick={()=>setPhase(planId?"preselect":"select")} style={{padding:"8px 14px"}}>←</Btn>
          <div style={{fontSize:22,fontWeight:900,color:T.text}}>Bereit?</div>
        </div>

        {/* Plan + Day info */}
        <div style={{fontSize:12,color:T.sub,marginBottom:16,paddingLeft:2}}>{cp.name}</div>

        <Card style={{marginBottom:14}} glow>
          <div style={{fontSize:20,fontWeight:900,color:T.accent,marginBottom:6}}>{cd.name}</div>
          <div style={{display:"flex",gap:14,fontSize:13,color:T.sub,marginBottom:16}}>
            <span>🏋 {cd.exercises.length} Übungen</span>
            <span>📋 {totalSets} Sätze</span>
          </div>

          {/* Exercise list preview */}
          {cd.exercises.map((ex, i) => {
            const exercise = (allExercises||[]).find(e=>e.id===ex.eid);
            const override = exerciseOverrides?.[ex.eid] || {};
            const resolved = {...(exercise||{}), ...override};
            const unitType = resolved.unitType || "reps";
            return (
              <div key={instKey(ex.eid, i)} style={{
                display:"flex", justifyContent:"space-between", alignItems:"center",
                padding:"7px 0",
                borderBottom: i < cd.exercises.length-1 ? `1px solid ${T.border}` : "none",
              }}>
                <div>
                  <div style={{fontSize:13,fontWeight:600,color:T.text}}>{resolved.name||"?"}</div>
                  {resolved.trainingsnotiz && (
                    <div style={{fontSize:10,color:T.teal,marginTop:1}}>📌 {resolved.trainingsnotiz}</div>
                  )}
                  {ex.note && (
                    <div style={{fontSize:10,color:T.muted,marginTop:1}}>💡 {ex.note}</div>
                  )}
                </div>
                <div style={{textAlign:"right",flexShrink:0,marginLeft:12}}>
                  <span style={{fontSize:13,fontWeight:700,color:T.sub}}>
                    {ex.sets}×{fmtRepsVal(ex.reps, unitType)}
                  </span>
                  {ex.weight>0 && unitType==="reps" && (
                    <div style={{fontSize:11,color:T.muted}}>{ex.weight} kg</div>
                  )}
                </div>
              </div>
            );
          })}
        </Card>

        {/* The actual start button */}
        <Btn
          onClick={()=>start(confirmPlanId, confirmDayId)}
          full
          style={{padding:"18px 0", fontSize:18, borderRadius:16, letterSpacing:0.5}}
        >
          ▶ Training starten
        </Btn>

        <div style={{marginTop:10,textAlign:"center",fontSize:11,color:T.muted}}>
          Tippe „←" um einen anderen Tag zu wählen
        </div>
      </div>
    );
  }

  // ── Select / preselect screen ───────────────────────────────────────
  if (phase==="select" || phase==="preselect") return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px",fontSize:24,fontWeight:900,color:T.text}}>Training starten</div>

      {hasDraft && (() => {
        const dp = activePlans.find(p=>p.id===draft.planId);
        const dd = dp?.days.find(d=>d.id===draft.dayId);
        const dn = Object.values(draft.sets||{}).flat().filter(s=>s.done).length;
        return (
          <div style={{background:`${T.orange}18`,border:`1px solid ${T.orange}55`,borderRadius:14,padding:"14px 16px",marginBottom:16}}>
            <div style={{fontSize:12,color:T.orange,fontWeight:800,marginBottom:6}}>⚡ UNTERBROCHENES TRAINING</div>
            <div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:2}}>{dd?.name||"Training"}</div>
            <div style={{fontSize:12,color:T.sub,marginBottom:12}}>{dp?.name} · {dn} Sätze · {fmt(draft.elapsed||0)}</div>
            <div style={{display:"flex",gap:8}}>
              <Btn onClick={()=>setPhase("active")} style={{flex:2,padding:"10px 0",fontSize:14,borderRadius:10}}>▶ Fortsetzen</Btn>
              <Btn v="danger" onClick={discardDraft} style={{flex:1,padding:"10px 0",fontSize:13,borderRadius:10}}>Verwerfen</Btn>
            </div>
          </div>
        );
      })()}

      {phase==="preselect" && preselectedPlan ? (
        <>
          <div style={{fontSize:11,color:T.sub,marginBottom:8,fontWeight:700,letterSpacing:1}}>{preselectedPlan.name.toUpperCase()}</div>
          {preselectedPlan.days.map(day=>(
            <Card key={day.id} onClick={()=>selectDay(planId,day.id)} style={{marginBottom:8}} glow>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:16,fontWeight:700,color:T.text}}>{day.name}</div>
                  <div style={{fontSize:12,color:T.sub,marginTop:2}}>{day.exercises.length} Übungen · {day.exercises.reduce((s,e)=>s+e.sets,0)} Sätze</div>
                </div>
                <div style={{background:T.accent,color:"#07070F",fontWeight:900,padding:"9px 16px",borderRadius:10,fontSize:13}}>Wählen ›</div>
              </div>
            </Card>
          ))}
          <Btn v="ghost" onClick={()=>setPhase("select")} style={{marginTop:10,width:"100%"}}>Anderen Plan wählen</Btn>
        </>
      ) : activePlans.length===0 ? (
        <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16}}>
          Kein aktiver Plan vorhanden.<br/><span style={{fontSize:12}}>Erstelle einen Plan unter "Pläne".</span>
        </div>
      ) : (
        activePlans.map(plan=>(
          <div key={plan.id} style={{marginBottom:16}}>
            <Lbl>{plan.name.toUpperCase()}</Lbl>
            {plan.days.map(day=>(
              <Card key={day.id} onClick={()=>selectDay(plan.id,day.id)} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:16,fontWeight:700,color:T.text}}>{day.name}</div>
                    <div style={{fontSize:12,color:T.sub,marginTop:2}}>{day.exercises.length} Übungen · {day.exercises.reduce((s,e)=>s+e.sets,0)} Sätze</div>
                  </div>
                  <div style={{background:T.accent,color:"#07070F",fontWeight:900,padding:"9px 16px",borderRadius:10,fontSize:13}}>Wählen ›</div>
                </div>
              </Card>
            ))}
          </div>
        ))
      )}
    </div>
  );

  const plan = activePlans.find(p=>p.id===planId);
  const day  = plan?.days.find(d=>d.id===dayId);
  if (!plan||!day) return null;

  const done  = Object.values(sets).flat().filter(s=>s.done).length;
  const total = Object.values(sets).flat().length;

  return (
    <div style={{padding:"0 16px 24px"}}>
      {rest&&<RestTimer
          seconds={rest.secs}
          onDone={()=>setRest(null)}
          onSkip={()=>setRest(null)}
          tickStart={settings?.timerSettings?.restTickStart ?? 10}
        />}
        {/* Exercise timer overlay (Punkt 6) */}
        {exTimer&&<ExerciseTimer
          targetSecs={exTimer.targetSecs}
          tickStart={settings?.timerSettings?.exerciseTickStart ?? 10}
          onFinish={()=>{
            // Mark set done, optionally start rest
            const {ikey, setIdx, restSecs} = exTimer;
            setSets(prev=>{
              if(!prev[ikey]?.[setIdx]) return prev;
              const upd={...prev,[ikey]:prev[ikey].map((s,i)=>i===setIdx?{...s,done:true}:s)};
              return upd;
            });
            setExTimer(null);
            if(restSecs>0) setRest({secs:restSecs});
          }}
        />}

      <div style={{position:"sticky",top:0,background:T.bg,padding:"14px 0 10px",zIndex:10,borderBottom:`1px solid ${T.border}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div>
            <div style={{fontSize:11,color:T.sub}}>{plan.name} · {day.name}</div>
            <div style={{fontSize:34,fontWeight:900,color:T.accent,fontVariantNumeric:"tabular-nums"}}>{fmt(elapsed)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:T.sub}}>SÄTZE</div>
            <div style={{fontSize:24,fontWeight:800,color:T.text}}>{done}/{total}</div>
          </div>
        </div>
        <PBar value={done} max={total} h={4}/>
        <div style={{fontSize:9,color:T.muted,textAlign:"right",marginTop:3,letterSpacing:0.5}}>💾 automatisch gespeichert</div>
      </div>

      {day.exercises.map((planEx, planExIdx) => (
        // Fix 1: WorkoutExerciseCard per instance – hooks valid, keys unique
        <WorkoutExerciseCard
          key={instKey(planEx.eid, planExIdx)}
          planEx={planEx}
          planExIdx={planExIdx}
          allExercises={allExercises}
          exerciseOverrides={exerciseOverrides}
          sets={sets}
          setSets={setSets}
          toggle={toggle}
          upd={upd}
          addSet={addSet}
          setExTimer={setExTimer}
          exTimer={exTimer}
          settings={settings}
          sessions={sessions}
        />
      ))}

      <div style={{marginTop:16}}><Lbl>NOTIZ</Lbl><Inp value={note} onChange={setNote} placeholder="Wie war das Training?"/></div>

      {warnEmpty && (
        <div style={{marginTop:10,padding:"10px 14px",background:T.red+"22",borderRadius:10,border:`1px solid ${T.red}44`,fontSize:13,color:T.red}}>
          ⚠️ Mindestens einen Satz abhaken bevor du das Training abschließt.
        </div>
      )}

      <Btn onClick={finish} full style={{padding:16,marginTop:14,fontSize:16}}>Training abschließen ✓</Btn>

      {/* Abbrechen – klein und dezent, mit Sicherheitsabfrage */}
      <button
        onClick={() => {
          const ok = window.confirm(
            "Training wirklich abbrechen?\n\nDie aktuelle Einheit wird NICHT gespeichert."
          );
          if (!ok) return;
          clearWorkoutDraft();
          t0Ref.current = null;
          setSets({}); setNote(""); setElapsed(0);
          setPlanId(null); setDayId(null);
          setPhase("select");
        }}
        style={{
          display:"block", width:"100%", marginTop:10,
          background:"none", border:"none", cursor:"pointer",
          color:T.muted, fontSize:12, padding:"8px 0",
          textDecoration:"underline", textUnderlineOffset:3,
        }}
      >
        Training abbrechen
      </button>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// PROGRESS SCREEN  (Punkte 1–5, 9, 10)
// ═══════════════════════════════════════════════════════
const ProgressScreen = ({sessions, plans, cardio, allExercises, exerciseOverrides, settings, onDeleteSession}) => {
  const [view,setView]         = useState("overview");
  const [selEx,setSelEx]       = useState(null);
  const [detailSess,setDetailSess] = useState(null);

  // ── Pre-computed data ─────────────────────────────────
  const usedEids  = useMemo(()=>[...new Set(sessions.flatMap(s=>s.sets.filter(isDone).map(x=>x.eid)))],[sessions]);
  const prs       = useMemo(()=>getPRs(sessions,allExercises),[sessions,allExercises]);
  const totalVol  = useMemo(()=>sessions.reduce((s,x)=>s+vol(x.sets,allExercises),0),[sessions,allExercises]);
  const weekSets  = useMemo(()=>getWeeklySets(sessions,allExercises,1),[sessions,allExercises]);
  const sets4w    = useMemo(()=>getWeeklySets(sessions,allExercises,4),[sessions,allExercises]);
  const lastTrained=useMemo(()=>getLastTrainedDays(sessions,allExercises),[sessions,allExercises]);
  const summary   = useMemo(()=>buildWeeklySummary(sessions,cardio,allExercises),[sessions,cardio,allExercises]);
  const recs      = useMemo(()=>buildRecommendations(sessions,cardio,allExercises,calcStreak(sessions,cardio)),[sessions,cardio,allExercises]);
  // Progression tab data
  const deloadRec = useMemo(()=>detectDeloadRecommendation(sessions,settings),[sessions,settings]);
  const progData  = useMemo(()=>{
    if(!sessions||sessions.length<2) return [];
    const ps = getProgressionSettings(settings);
    const strengthEids=[...new Set(
      sessions.flatMap(s=>s.sets.filter(x=>isDone(x)&&(x.weight||0)>0).map(x=>x.eid))
    )];
    return strengthEids.slice(0,12).map(eid=>{
      const ex=(allExercises||[]).find(e=>e.id===eid);
      if(!ex||(ex.unitType&&ex.unitType!=="reps")) return null;
      const planEx={eid, weight:0, sets:3, reps:10};
      // Fix 2: use actual last-known weight so deload suggestion is non-zero
      const history=getExercisePerformanceHistory(eid, sessions, allExercises);
      const lastKnownWeight = history.length>0 ? (history[history.length-1].sets[0]?.weight||0) : 0;
      const planExWithWeight = {...planEx, weight: lastKnownWeight};
      const sug=calculateProgressionSuggestion(planExWithWeight,ex,sessions,settings,allExercises);
      const stag=detectExerciseStagnation(eid,sessions,settings,allExercises);
      return { eid, name:ex.name, cat:ex.cat, suggestion:sug, stagnation:stag };
    }).filter(Boolean);
  },[sessions,allExercises,settings]);

  // Selected exercise analytics
  const exObj     = useMemo(()=>selEx?(allExercises||[]).find(e=>e.id===selEx):null,[selEx,allExercises]);
  const exUnitType= exObj?.unitType||"reps";
  const isTimeEx  = exUnitType==="secs"||exUnitType==="mins";
  const exHistory = useMemo(()=>selEx?getExHistory(sessions,selEx,allExercises):[]   ,[sessions,selEx,allExercises]);
  const timeHist  = useMemo(()=>selEx?getTimeExHistory(sessions,selEx):[] ,[sessions,selEx]);

  // Trend analysis for selected exercise
  const exTrend = useMemo(()=>{
    if (!selEx || exHistory.length < 2) return null;
    const wt = exHistory.map(h=>h.weight);
    const rp = exHistory.map(h=>h.reps);
    const vl = exHistory.map(h=>h.vol);
    const rm = exHistory.map(h=>h.rm1);
    const now30 = exHistory.filter(h=>new Date(h.date)>new Date(Date.now()-30*86400000));
    return {
      weightPct:  pctChange(wt),
      repsPct:    pctChange(rp),
      volPct:     pctChange(vl),
      rm1Pct:     pctChange(rm),
      slope:      calcTrend(wt),
      bestSet:    getBestSet(sessions,selEx,allExercises),
      best1RM:    Math.max(0,...rm),
      last30Sets: now30.length,
      latestWt:   wt[wt.length-1],
      firstWt:    wt[0],
    };
  },[sessions,selEx,exHistory]);

  // Session detail overlay
  if (detailSess) {
    const byEx = {};
    detailSess.sets.filter(isDone).forEach(s=>{if(!byEx[s.eid])byEx[s.eid]=[];byEx[s.eid].push(s);});
    return (
      <div style={{position:"fixed",inset:0,background:T.bg,zIndex:200,overflowY:"auto"}}>
        <div style={{padding:"16px 16px 0",display:"flex",gap:10,alignItems:"center"}}>
          <Btn v="ghost" onClick={()=>setDetailSess(null)} style={{padding:"8px 14px"}}>← Zurück</Btn>
          <div style={{flex:1,fontSize:16,fontWeight:900,color:T.text}}>Trainingsdetails</div>
        </div>
        <div style={{padding:16}}>
          <Card glow style={{marginBottom:12}}>
            <div style={{fontSize:19,fontWeight:900,color:T.accent,marginBottom:4}}>
              {plans.find(p=>p.id===detailSess.planId)?.days.find(d=>d.id===detailSess.dayId)?.name||"Training"}
            </div>
            {detailSess.source&&<Badge color={T.orange} style={{marginBottom:8}}>{detailSess.source} Import</Badge>}
            <div style={{fontSize:12,color:T.sub,marginBottom:12}}>{fmtD(detailSess.date)}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
              {[{l:"DAUER",v:`${detailSess.duration}min`},{l:"SÄTZE",v:detailSess.sets.filter(isDone).length},{l:"VOLUMEN",v:`${(Math.round(vol(detailSess.sets,allExercises)/100)/10).toFixed(1)}t`}].map(s=>(
                <div key={s.l} style={{textAlign:"center",padding:"10px 6px",background:T.bgAlt,borderRadius:10}}>
                  <div style={{fontSize:18,fontWeight:900,color:T.text}}>{s.v}</div>
                  <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
                </div>
              ))}
            </div>
            {detailSess.note&&<div style={{marginTop:12,padding:"10px 12px",background:T.accentGlow,borderRadius:10,fontSize:12,color:T.accentDim,fontStyle:"italic"}}>"{detailSess.note}"</div>}
          </Card>
          {Object.entries(byEx).map(([eid,exSets])=>{
            const ex=(allExercises||[]).find(e=>e.id===eid);
            const best=Math.max(0,...exSets.map(s=>s.weight||0));
            return (
              <Card key={eid} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:T.text}}>{ex?.name||eid}</div>
                    <div style={{fontSize:11,color:T.sub}}>{ex?.cat}</div>
                  </div>
                  {best>0&&<div style={{fontSize:13,fontWeight:700,color:T.orange}}>{best} kg top</div>}
                </div>
                {exSets.map((s,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:i<exSets.length-1?`1px solid ${T.border}`:"none"}}>
                    <span style={{fontSize:12,color:T.muted}}>Satz {s.setN}</span>
                    <span style={{fontSize:13,fontWeight:700,color:T.text}}>{s.weight>0?`${s.weight} kg × `:""}{s.reps} Wdh</span>
                  </div>
                ))}
              </Card>
            );
          })}
        </div>
      </div>
    );
  }

  // ── Tab bar ─────────────────────────────────────────
  const tabs=[{v:"overview",l:"📊 Woche"},{v:"muscles",l:"💪 Muskeln"},{v:"exercises",l:"🏋 Übungen"},{v:"progress",l:"📈 Progression"},{v:"history",l:"📋 Verlauf"}];

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 10px"}}>
        <div style={{fontSize:24,fontWeight:900,color:T.text,marginBottom:12}}>Fortschritt</div>
        <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2}}>
          {tabs.map(b=>(
            <button key={b.v} onClick={()=>setView(b.v)} style={{background:view===b.v?T.accent:T.bgCard,color:view===b.v?"#07070F":T.sub,border:`1px solid ${view===b.v?T.accent:T.border}`,borderRadius:9,padding:"7px 13px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{b.l}</button>
          ))}
        </div>
      </div>

      {/* ── OVERVIEW TAB ─────────────────────────────── */}
      {view==="overview" && (<>
        {/* KPI row */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
          {[
            {l:"DIESE WOCHE",v:summary.sessionCount,c:T.accent},
            {l:"TRAINING MIN",v:summary.weekTime,c:T.blue},
            {l:"CARDIO MIN",v:summary.cardioMin,c:T.green},
          ].map(s=>(
            <Card key={s.l} style={{padding:12,textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:900,color:s.c}}>{s.v}</div>
              <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
            </Card>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          <Card style={{padding:12,textAlign:"center"}}>
            <div style={{fontSize:18,fontWeight:900,color:T.accent}}>{sessions.length}</div>
            <div style={{fontSize:9,color:T.muted,marginTop:2}}>GESAMT KRAFT</div>
          </Card>
          <Card style={{padding:12,textAlign:"center"}}>
            <div style={{fontSize:18,fontWeight:900,color:T.blue}}>{Math.round(totalVol/1000)} t</div>
            <div style={{fontSize:9,color:T.muted,marginTop:2}}>GESAMT VOLUMEN</div>
          </Card>
        </div>

        {/* Volume sparkline */}
        {sessions.length>2 && (
          <Card style={{marginBottom:12}}>
            <Lbl>VOLUMEN LETZTE 8 EINHEITEN</Lbl>
            <LineChart data={sessions.slice(0,8).map(s=>vol(s.sets,allExercises)).reverse()} color={T.blue} height={68}/>
          </Card>
        )}

        {/* Weekly summary coach card */}
        <Card style={{marginBottom:12,background:`linear-gradient(135deg,${T.accent}08,${T.bgCard})`}} glow>
          <Lbl color={T.accent}>WOCHEN-COACH</Lbl>
          {summary.topMuscle&&<div style={{fontSize:13,color:T.sub,marginBottom:6}}>
            Meist trainiert: <b style={{color:T.text}}>{summary.topMuscle}</b>
          </div>}
          {summary.neglected.length>0&&<div style={{fontSize:13,color:T.sub,marginBottom:6}}>
            Vernachlässigt: <b style={{color:T.orange}}>{summary.neglected.join(", ")}</b>
          </div>}
          {summary.mobilityMins>0&&<div style={{fontSize:13,color:T.sub,marginBottom:6}}>
            Mobility: <b style={{color:T.teal}}>{summary.mobilityMins} Min</b>
          </div>}
          <div style={{fontSize:12,color:T.muted}}>
            {summary.sessionCount} Training{summary.sessionCount!==1?"s":""}
            {summary.weekTime>0&&` · ${summary.weekTime} Min`}
            {summary.cardioMin>0&&` · ${summary.cardioMin} Min Cardio`}
          </div>
        </Card>

        {/* Recommendations */}
        {recs.length>0&&(
          <Card style={{marginBottom:12}}>
            <Lbl color={T.blue}>EMPFEHLUNGEN</Lbl>
            {recs.map((r,i)=>(
              <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"6px 0",borderBottom:i<recs.length-1?`1px solid ${T.border}`:"none"}}>
                <span style={{fontSize:16,flexShrink:0}}>{r.icon}</span>
                <div style={{fontSize:13,color:T.sub,lineHeight:1.5}}>{r.text}</div>
              </div>
            ))}
          </Card>
        )}

        {/* PRs overview */}
        {Object.keys(prs).length>0&&(
          <Card style={{marginBottom:12}}>
            <Lbl color={T.orange}>BESTLEISTUNGEN 🏆</Lbl>
            {Object.entries(prs).slice(0,5).map(([eid,kg])=>{
              const ex=(allExercises||[]).find(e=>e.id===eid);
              return(
                <div key={eid} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${T.border}`}}>
                  <span style={{fontSize:13,color:T.text}}>{ex?.name||eid}</span>
                  <Badge color={T.orange}>{kg} kg</Badge>
                </div>
              );
            })}
          </Card>
        )}
      </>)}

      {/* ── MUSCLES TAB ──────────────────────────────── */}
      {view==="muscles" && (<>
        {/* Push/Pull */}
        {(()=>{const pp=getPushPullRatio(sets4w);return pp&&(
          <Card style={{marginBottom:12}}>
            <Lbl>PUSH / PULL (4 Wochen)</Lbl>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
              <div style={{flex:pp.push,background:T.accent+"55",borderRadius:6,height:16,minWidth:4}}/>
              <div style={{flex:pp.pull,background:T.blue+"55",borderRadius:6,height:16,minWidth:4}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
              <span style={{color:T.accent}}>Push {pp.push}%</span>
              <span style={{color:T.blue}}>Pull {pp.pull}%</span>
            </div>
          </Card>
        );})()}

        {/* Muscle group bars */}
        <Card style={{marginBottom:12}}>
          <Lbl>SÄTZE PRO MUSKELGRUPPE (diese Woche)</Lbl>
          {Object.entries(MUSCLE_GROUPS).filter(([,mg])=>!mg.mobility).map(([cat,mg])=>{
            const sets=weekSets[cat]||0;
            const status=getMuscleStatus(sets,mg.targetSets);
            const days=lastTrained[cat];
            return(
              <div key={cat} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <div style={{fontSize:13,fontWeight:600,color:T.text}}>{cat}</div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    {status&&<span style={{fontSize:10,color:status.color,fontWeight:700}}>{status.label}</span>}
                    <span style={{fontSize:13,fontWeight:700,color:T.text}}>{sets}</span>
                  </div>
                </div>
                <PBar value={sets} max={mg.targetSets||1} color={status?.color||T.blue} h={6}/>
                {days!==undefined&&(
                  <div style={{fontSize:10,color:T.muted,marginTop:2}}>
                    Zuletzt: {days===0?"heute":days===1?"gestern":`vor ${days} Tagen`}
                    {" · "}{getRecoveryStatus(days).label}
                  </div>
                )}
              </div>
            );
          })}
        </Card>

        {/* Recovery status */}
        <Card style={{marginBottom:12}}>
          <Lbl>REGENERATIONS-STATUS</Lbl>
          {Object.entries(MUSCLE_GROUPS).filter(([,mg])=>!mg.mobility).map(([cat])=>{
            const days=lastTrained[cat];
            if(days===undefined)return null;
            const st=getRecoveryStatus(days);
            return(
              <div key={cat} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${T.border}`}}>
                <span style={{fontSize:13,color:T.text}}>{cat}</span>
                <span style={{fontSize:11,color:st.color,fontWeight:700}}>{st.label}</span>
              </div>
            );
          })}
        </Card>
      </>)}

      {/* ── EXERCISES TAB ────────────────────────────── */}
      {view==="exercises" && (<>
        <Lbl>ÜBUNG WÄHLEN</Lbl>
        <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:12,paddingBottom:2}}>
          {usedEids.map(eid=>{
            const ex=(allExercises||[]).find(e=>e.id===eid);
            if(!ex)return null;
            return(
              <button key={eid} onClick={()=>setSelEx(eid)} style={{background:selEx===eid?T.accent:T.bgCard,color:selEx===eid?"#07070F":T.sub,border:`1px solid ${selEx===eid?T.accent:T.border}`,borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{ex.name}</button>
            );
          })}
        </div>

        {selEx && exObj && (<>
          {/* Exercise header */}
          <Card style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div>
                <div style={{fontSize:16,fontWeight:900,color:T.text}}>{exObj.name}</div>
                <div style={{fontSize:11,color:T.sub}}>{exObj.cat} · {exObj.eq}</div>
              </div>
              {prs[selEx]&&<Badge color={T.orange}>🏆 {prs[selEx]} kg</Badge>}
            </div>

            {!isTimeEx && exTrend && (<>
              {/* Trend indicators */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:10}}>
                {[
                  {l:"GEWICHT",v:exTrend.latestWt?`${exTrend.latestWt} kg`:"—",pct:exTrend.weightPct,c:T.accent},
                  {l:"EST. 1RM", v:exTrend.best1RM>0?`${exTrend.best1RM} kg`:"—",pct:exTrend.rm1Pct,c:T.orange},
                  {l:"VOLUMEN",  v:exTrend.volPct!==null?`${exTrend.volPct>0?"+":""}${exTrend.volPct}%`:"—",pct:exTrend.volPct,c:T.blue},
                ].map(s=>(
                  <div key={s.l} style={{textAlign:"center",padding:"10px 6px",background:T.bgAlt,borderRadius:10}}>
                    <div style={{fontSize:14,fontWeight:900,color:s.c}}>{s.v}</div>
                    {s.pct!==null&&(
                      <div style={{fontSize:10,marginTop:2,color:s.pct>0?T.green:s.pct<0?T.red:T.muted,fontWeight:700}}>
                        {s.pct>0?"↑":"↓"} {Math.abs(s.pct)}%
                      </div>
                    )}
                    <div style={{fontSize:9,color:T.muted,marginTop:1}}>{s.l}</div>
                  </div>
                ))}
              </div>

              {/* Coaching insight */}
              {exTrend.weightPct!==null&&(
                <div style={{padding:"8px 10px",background:T.accentGlow,borderRadius:8,fontSize:12,color:T.accentDim,marginBottom:10}}>
                  {exTrend.weightPct>0
                    ? `📈 +${exTrend.weightPct}% stärker seit dem ersten Eintrag`
                    : exTrend.weightPct<0
                    ? `📉 ${exTrend.weightPct}% – Gewicht gesunken, Technik prüfen`
                    : `➡️ Gewicht stabil – bereit für den nächsten Schritt?`}
                </div>
              )}

              {/* Weight chart */}
              {exHistory.length>1&&(<>
                <Lbl>GEWICHTSVERLAUF</Lbl>
                <LineChart data={exHistory.map(h=>h.weight)} color={T.accent} height={80}/>
                <div style={{display:"flex",gap:16,marginTop:8,fontSize:12,color:T.sub}}>
                  <span>Start: <b style={{color:T.text}}>{exTrend.firstWt} kg</b></span>
                  <span>Aktuell: <b style={{color:T.accent}}>{exTrend.latestWt} kg</b></span>
                  {exTrend.slope>0.05&&<span style={{color:T.green,fontWeight:700}}>↑ Trend</span>}
                  {exTrend.slope<-0.05&&<span style={{color:T.red,fontWeight:700}}>↓ Trend</span>}
                </div>
              </>)}
            </>)}

            {/* Time exercise analysis (Punkt 5) */}
            {isTimeEx && timeHist.length>0&&(<>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                {[
                  {l:"BEST",     v:fmtRepsVal(Math.max(...timeHist.map(h=>h.reps)),exUnitType),c:T.green},
                  {l:"Ø DAUER",  v:fmtRepsVal(Math.round(timeHist.reduce((a,h)=>a+h.reps,0)/timeHist.length),exUnitType),c:T.blue},
                ].map(s=>(
                  <div key={s.l} style={{textAlign:"center",padding:"10px 6px",background:T.bgAlt,borderRadius:10}}>
                    <div style={{fontSize:16,fontWeight:900,color:s.c}}>{s.v}</div>
                    <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
                  </div>
                ))}
              </div>
              {timeHist.length>1&&(<>
                <Lbl>VERLAUF</Lbl>
                <LineChart data={timeHist.map(h=>h.reps)} color={T.teal} height={72}/>
                {(()=>{const pc=pctChange(timeHist.map(h=>h.reps));return pc!==null&&(
                  <div style={{fontSize:12,color:pc>0?T.green:T.muted,marginTop:6,fontWeight:700}}>
                    {pc>0?`↑ +${pc}% verbessert`:`→ ${pc}% verändert`} seit Beginn
                  </div>
                );})()}
              </>)}
            </>)}
          </Card>
        </>)}

        {!selEx&&usedEids.length>0&&(
          <div style={{textAlign:"center",padding:"30px 0",color:T.muted,fontSize:13}}>Übung antippen um Analyse zu sehen</div>
        )}
        {usedEids.length===0&&(
          <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16}}>Noch keine Trainingsdaten.</div>
        )}
      </>)}

      {/* ── PROGRESSION TAB ─────────────────────────── */}
      {view==="progress" && (<>
        {/* Deload recommendation */}
        {deloadRec&&(
          <Card style={{marginBottom:12,background:T.orange+"12",border:`1px solid ${T.orange}44`}}>
            <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
              <span style={{fontSize:22}}>⬇</span>
              <div>
                <div style={{fontSize:14,fontWeight:800,color:T.orange,marginBottom:4}}>Entlastung empfohlen</div>
                <div style={{fontSize:12,color:T.sub,lineHeight:1.5}}>{deloadRec.reason}</div>
                <div style={{fontSize:11,color:T.muted,marginTop:4}}>
                  {deloadRec.urgency==="active" ? "Aktiver Deload läuft" : "Nächste Einheit leichter trainieren"}
                </div>
              </div>
            </div>
          </Card>
        )}
        {!deloadRec&&(
          <Card style={{marginBottom:12,background:T.teal+"12",border:`1px solid ${T.teal}44`}}>
            <div style={{fontSize:13,color:T.teal,fontWeight:700}}>✅ Keine Entlastung nötig</div>
            <div style={{fontSize:11,color:T.sub,marginTop:2}}>Trainingsbelastung im grünen Bereich</div>
          </Card>
        )}

        {/* Per-exercise progression cards */}
        {progData.length===0&&(
          <div style={{textAlign:"center",padding:"30px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16}}>
            Noch zu wenig Trainingsdaten für Vorschläge.
          </div>
        )}
        {progData.map(item=>{
          const sug=item.suggestion;
          if(!sug) return null;
          const col=sug.isDeload?T.orange:sug.action==="increase"?T.green:T.sub;
          return(
            <Card key={item.eid} style={{marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:700,color:T.text}}>{item.name}</div>
                  <div style={{fontSize:11,color:T.sub,marginBottom:4}}>{item.cat}</div>
                  <div style={{fontSize:12,color:col,fontWeight:700}}>{sug.reason}</div>
                  {sug.action==="increase"&&(
                    <div style={{fontSize:11,color:T.green,marginTop:2}}>→ {sug.suggestedWeight} kg empfohlen</div>
                  )}
                  {sug.isDeload&&(
                    <div style={{fontSize:11,color:T.orange,marginTop:2}}>
                      {sug.suggestedWeight>0&&`→ ${sug.suggestedWeight} kg`}
                      {sug.suggestedSets!=null&&` · ${sug.suggestedSets} Sätze`}
                    </div>
                  )}
                </div>
                <Badge color={col} style={{flexShrink:0,marginTop:2}}>
                  {sug.isDeload?"Deload":sug.action==="increase"?"↑ Plus":"Halten"}
                </Badge>
              </div>
              {item.stagnation?.stagnating&&(
                <div style={{fontSize:10,color:T.muted,marginTop:4,borderTop:`1px solid ${T.border}`,paddingTop:4}}>
                  ⚠ Keine Steigerung seit {item.stagnation.sessionsChecked} Einheiten
                </div>
              )}
            </Card>
          );
        })}
      </>)}

      {/* ── HISTORY TAB ──────────────────────────────── */}
      {view==="history" && (<>
        <Lbl>ALLE TRAININGS ({sessions.length})</Lbl>
        {sessions.length===0&&(
          <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16,fontSize:14}}>Noch keine Trainings.</div>
        )}
        {sessions.map(sess=>{
          const v=vol(sess.sets,allExercises);
          const dn=plans.find(p=>p.id===sess.planId)?.days.find(d=>d.id===sess.dayId)?.name||"Training";
          return(
            <Card key={sess.id} style={{marginBottom:8,padding:0,overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"stretch"}}>
                <div onClick={()=>setDetailSess(sess)} style={{flex:1,padding:"12px 14px",cursor:"pointer"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div>
                      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:2}}>
                        <div style={{fontSize:14,fontWeight:700,color:T.text}}>{dn}</div>
                        {sess.source&&<Badge color={T.orange}>{sess.source}</Badge>}
                      </div>
                      <div style={{fontSize:12,color:T.sub}}>{fmtD(sess.date)}</div>
                      <div style={{fontSize:11,color:T.muted,marginTop:3}}>{sess.sets.filter(isDone).length} Sätze · {sess.duration} min</div>
                    </div>
                    <div style={{textAlign:"right",marginLeft:12}}>
                      <div style={{fontSize:15,fontWeight:800,color:T.accent}}>{Math.round(v).toLocaleString()} kg</div>
                      <div style={{fontSize:10,color:T.muted}}>Details →</div>
                    </div>
                  </div>
                </div>
                <button
                  onClick={e=>{e.stopPropagation();if(window.confirm(`"${dn}" wirklich löschen?`))onDeleteSession(sess.id);}}
                  style={{background:T.red+"18",border:"none",borderLeft:`1px solid ${T.red}33`,cursor:"pointer",padding:"0 16px",color:T.red,fontSize:18,flexShrink:0,borderRadius:"0 18px 18px 0"}}
                >🗑</button>
              </div>
            </Card>
          );
        })}
      </>)}
    </div>
  );
};


// ═══════════════════════════════════════════════════════
// BODY SCREEN
// ═══════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════
// BODY SCREEN  (Punkt 6 – erweiterte Körperdaten)
// ═══════════════════════════════════════════════════════
// Metric fields definition (reused in form + history)
const BODY_FIELDS = [
  { key:"weight",         label:"Gewicht",        unit:"kg", primary:true  },
  { key:"waist",          label:"Taille",         unit:"cm" },
  { key:"chest",          label:"Brust",          unit:"cm" },
  { key:"armLeft",        label:"Oberarm L",      unit:"cm" },
  { key:"armRight",       label:"Oberarm R",      unit:"cm" },
  { key:"hips",           label:"Hüfte",          unit:"cm" },
  { key:"thighLeft",      label:"Oberschenkel L", unit:"cm" },
  { key:"thighRight",     label:"Oberschenkel R", unit:"cm" },
  { key:"calfLeft",       label:"Wade L",         unit:"cm" },
  { key:"calfRight",      label:"Wade R",         unit:"cm" },
  { key:"bodyFat",        label:"Körperfett",     unit:"%"  },
];

const BodyScreen = ({metrics, settings, onSaveMetric, onUpdateSettings}) => {
  const blankForm = () => Object.fromEntries(BODY_FIELDS.map(f=>[f.key,""]));
  const [form, setForm]   = useState(blankForm);
  const [showAll, setShowAll] = useState(false);
  const [goalW, setGoalW] = useState(settings.weightGoal!=null?String(settings.weightGoal):"");
  const [selField, setSelField] = useState("weight");

  const latest = metrics[metrics.length-1] || {};
  const first  = metrics[0] || {};

  const save = () => {
    const w = parseFloat(form.weight);
    if (!w || w <= 0) return;
    const entry = { id:uid(), date:new Date().toISOString() };
    BODY_FIELDS.forEach(f=>{
      const v = parseFloat(form[f.key]);
      if (!isNaN(v) && v>0) entry[f.key]=v;
    });
    onSaveMetric(entry);
    onUpdateSettings({bodyWeight:w});
    setForm(blankForm());
  };

  const setF = (key,val) => setForm(p=>({...p,[key]:val}));

  // Diff for a field between first and latest entry
  const diff = key => {
    const l = latest[key], f = first[key];
    // Fix 7: use == null instead of !l so value 0 is handled correctly
    if (l == null || f == null || l === f) return null;
    const d = (l - f).toFixed(1);
    return { d, pos: parseFloat(d) > 0 };
  };

  const histData = useMemo(()=>
    [...metrics].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(m=>m[selField]||0).filter(v=>v>0),
    [metrics,selField]
  );

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px",fontSize:24,fontWeight:900,color:T.text}}>Körperdaten</div>

      {/* Quick stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
        {[
          {l:"GEWICHT",v:latest.weight?`${latest.weight} kg`:"—",c:T.accent},
          {l:"ZIEL",    v:settings.weightGoal!=null?`${settings.weightGoal} kg`:"—",c:T.blue},
          {l:"DIFF",    v:(()=>{const d=diff("weight");return d?`${d.pos?"+":""}${d.d} kg`:"—";})(),
                        c:(()=>{const d=diff("weight");return !d?T.muted:d.pos?T.orange:T.green;})()},
        ].map(s=>(
          <Card key={s.l} style={{padding:12,textAlign:"center"}}>
            <div style={{fontSize:16,fontWeight:900,color:s.c}}>{s.v}</div>
            <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
          </Card>
        ))}
      </div>

      {/* Chart for selected field */}
      {metrics.length>1&&(
        <Card style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <Lbl>{BODY_FIELDS.find(f=>f.key===selField)?.label.toUpperCase()} VERLAUF</Lbl>
            <select value={selField} onChange={e=>setSelField(e.target.value)}
              style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,padding:"4px 8px",color:T.text,fontSize:12,cursor:"pointer"}}>
              {BODY_FIELDS.filter(f=>metrics.some(m=>m[f.key])).map(f=>(
                <option key={f.key} value={f.key}>{f.label}</option>
              ))}
            </select>
          </div>
          {histData.length>1
            ? <LineChart data={histData} color={T.accent} height={88}/>
            : <div style={{fontSize:12,color:T.muted,textAlign:"center",padding:"16px 0"}}>Zu wenig Daten für diese Messung.</div>}
          {(()=>{const d=diff(selField);return d&&(
            <div style={{fontSize:12,marginTop:6,color:d.pos?T.orange:T.green,fontWeight:700}}>
              {d.pos?"↑":"↓"} {Math.abs(d.d)} {BODY_FIELDS.find(f=>f.key===selField)?.unit} seit Beginn
            </div>
          );})()}
        </Card>
      )}

      {/* New entry form */}
      <Card style={{marginBottom:12}}>
        <Lbl>NEUER EINTRAG</Lbl>
        {/* Primary: weight always visible */}
        <div style={{marginBottom:8}}>
          <Lbl>Gewicht (kg) *</Lbl>
          <Inp value={form.weight} onChange={v=>setF("weight",v)} placeholder="80.5" type="number"/>
        </div>
        {/* Optional fields – toggle */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
          {BODY_FIELDS.filter(f=>!f.primary).slice(0,showAll?undefined:3).map(f=>(
            <div key={f.key}>
              <Lbl>{f.label} ({f.unit})</Lbl>
              <Inp value={form[f.key]} onChange={v=>setF(f.key,v)} placeholder="0" type="number"/>
            </div>
          ))}
        </div>
        <button onClick={()=>setShowAll(s=>!s)}
          style={{background:"none",border:"none",cursor:"pointer",color:T.blue,fontSize:12,marginBottom:10,padding:0}}>
          {showAll?"▲ Weniger Felder":"▼ Mehr Felder..."}
        </button>
        <Btn onClick={save} disabled={!form.weight} full>Eintrag speichern</Btn>
      </Card>

      {/* Goal weight */}
      <Card style={{marginBottom:12}}>
        <Lbl>ZIELGEWICHT</Lbl>
        <div style={{display:"flex",gap:8}}>
          <Inp value={goalW} onChange={setGoalW} placeholder="75" type="number" style={{flex:1}}/>
          <Btn onClick={()=>{const g=parseFloat(goalW);if(g>0)onUpdateSettings({weightGoal:g});}} style={{padding:"10px 18px"}}>Setzen</Btn>
        </div>
      </Card>

      {/* Latest measurements overview */}
      {metrics.length>0&&(
        <Card style={{marginBottom:12}}>
          <Lbl>AKTUELLE MASSE</Lbl>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
            {BODY_FIELDS.filter(f=>latest[f.key]).map(f=>{
              const d=diff(f.key);
              return(
                <div key={f.key} style={{padding:"8px 10px",background:T.bgAlt,borderRadius:8}}>
                  <div style={{fontSize:10,color:T.muted,marginBottom:2}}>{f.label}</div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:14,fontWeight:700,color:T.text}}>{latest[f.key]} {f.unit}</span>
