const CardioScreen = ({cardio, onSave, settings}) => {
  const [view,setView]  = useState("log");
  const [type,setType]  = useState("Joggen");
  const [dur,setDur]    = useState("");
  const [dist,setDist]  = useState("");
  const [note,setNote]  = useState("");
  const [date,setDate]  = useState(new Date().toISOString().slice(0,16));

  // Fix 7: always sort newest first
  const sortedCardio = useMemo(()=>
    [...cardio].sort((a,b)=>new Date(b.date)-new Date(a.date)),
    [cardio]
  );

  const save = () => {
    const d = parseInt(dur);
    if (!d || d <= 0) return;
    const km = parseFloat(dist) || null;
    onSave({
      id:uid(), type,
      date: new Date(date).toISOString(),
      duration: d,
      distance: km && km > 0 ? km : null,
      note,
      kcal: calcKcal(type, d, settings.bodyWeight||75),
    });
    setDur(""); setDist(""); setNote("");
  };

  const totalKm   = cardio.reduce((s,c)=>s+(c.distance||0), 0);
  const totalMin  = cardio.reduce((s,c)=>s+(c.duration||0), 0);
  const totalKcal = cardio.reduce((s,c)=>s+(c.kcal||0),    0);

  // [FIX 6] Pace nur wenn Distanz > 0
  const durNum  = parseInt(dur)||0;
  const distNum = parseFloat(dist)||0;
  const pace    = durNum>0 && distNum>0 ? (durNum/distNum).toFixed(1) : null;

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px"}}>
        <div style={{fontSize:24,fontWeight:900,color:T.text,marginBottom:12}}>Aktivitäten</div>
        <div style={{display:"flex",gap:8}}>
          {[{v:"log",l:"Erfassen"},{v:"history",l:"Verlauf"},{v:"stats",l:"Statistik"}].map(b=>(
            <button key={b.v} onClick={()=>setView(b.v)} style={{background:view===b.v?T.accent:T.bgCard,color:view===b.v?"#07070F":T.sub,border:`1px solid ${view===b.v?T.accent:T.border}`,borderRadius:9,padding:"7px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{b.l}</button>
          ))}
        </div>
      </div>

      {view==="log" && <>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
          {[{l:"TOTAL km",v:totalKm.toFixed(1),c:T.green},{l:"GESAMT MIN",v:totalMin,c:T.blue},{l:"KCAL (ca.)",v:Math.round(totalKcal),c:T.orange}].map(s=>(
            <Card key={s.l} style={{padding:12,textAlign:"center"}}>
              <div style={{fontSize:20,fontWeight:900,color:s.c}}>{s.v}</div>
              <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
            </Card>
          ))}
        </div>
        <Card>
          <Lbl>AKTIVITÄT ERFASSEN</Lbl>
          <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:12,paddingBottom:2}}>
            {CARDIO_TYPES.map(t=>(
              <button key={t} onClick={()=>setType(t)} style={{background:type===t?(CARDIO_COLOR[t]||T.accent):T.bgAlt,color:type===t?"#07070F":T.sub,border:`1px solid ${type===t?(CARDIO_COLOR[t]||T.accent):T.border}`,borderRadius:9,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
                {CARDIO_ICONS[t]} {t}
              </button>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><Lbl>DAUER (Minuten)</Lbl><Inp value={dur}  onChange={setDur}  placeholder="30" type="number"/></div>
            <div><Lbl>DISTANZ (km)</Lbl>   <Inp value={dist} onChange={setDist} placeholder="3.5" type="number"/></div>
          </div>
          <div style={{marginBottom:8}}><Lbl>DATUM & UHRZEIT</Lbl><Inp value={date} onChange={setDate} type="datetime-local"/></div>
          <div style={{marginBottom:12}}><Lbl>NOTIZ</Lbl><Inp value={note} onChange={setNote} placeholder="Strecke, Tempo, Wie war's?"/></div>
          {durNum>0 && (
            <div style={{padding:"10px 12px",background:T.accentGlow,borderRadius:10,marginBottom:12,fontSize:12,color:T.accentDim}}>
              Geschätzte Energie: <b>{calcKcal(type,durNum,settings.bodyWeight||75)} kcal</b>
              {pace && <span> · Tempo: ~{pace} min/km</span>}
            </div>
          )}
          <Btn onClick={save} disabled={!dur} full>{CARDIO_ICONS[type]} {type} speichern</Btn>
        </Card>
      </>}

      {view==="history" && <>
        <Lbl>{sortedCardio.length} AKTIVITÄTEN</Lbl>
        {sortedCardio.length===0 && (
          <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16}}>Noch keine Aktivitäten. Los geht's!</div>
        )}
        {sortedCardio.map(c=>(
          <Card key={c.id} style={{marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                <div style={{width:40,height:40,borderRadius:12,background:`${CARDIO_COLOR[c.type]||T.green}22`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>
                  {CARDIO_ICONS[c.type]||"🏃"}
                </div>
                <div>
                  <div style={{fontSize:15,fontWeight:700,color:T.text}}>{c.type}</div>
                  <div style={{fontSize:12,color:T.sub,marginTop:2}}>{fmtDShort(c.date)}</div>
                  <div style={{display:"flex",gap:10,marginTop:4,fontSize:12,color:T.muted}}>
                    <span>{c.duration} min</span>
                    {c.distance&&<span>{c.distance} km</span>}
                    {c.kcal&&<span>{c.kcal} kcal</span>}
                  </div>
                  {c.note&&<div style={{fontSize:11,color:T.sub,marginTop:4,fontStyle:"italic"}}>"{c.note}"</div>}
                </div>
              </div>
              {c.distance&&<Badge color={CARDIO_COLOR[c.type]||T.green}>{c.distance} km</Badge>}
            </div>
          </Card>
        ))}
      </>}

      {view==="stats" && <>
        {CARDIO_TYPES.filter(t=>cardio.some(c=>c.type===t)).map(t=>{
          const entries=cardio.filter(c=>c.type===t);
          const km=entries.reduce((s,c)=>s+(c.distance||0),0);
          const min=entries.reduce((s,c)=>s+(c.duration||0),0);
          const kcal=entries.reduce((s,c)=>s+(c.kcal||0),0);
          return (
            <Card key={t} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <span style={{fontSize:22}}>{CARDIO_ICONS[t]}</span>
                  <span style={{fontSize:16,fontWeight:700,color:T.text}}>{t}</span>
                </div>
                <Badge color={CARDIO_COLOR[t]||T.green}>{entries.length}×</Badge>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                {[{l:"km",v:km.toFixed(1),c:T.green},{l:"min",v:min,c:T.blue},{l:"kcal",v:Math.round(kcal),c:T.orange}].map(s=>(
                  <div key={s.l} style={{textAlign:"center",padding:"8px 4px",background:T.bgAlt,borderRadius:8}}>
                    <div style={{fontSize:16,fontWeight:800,color:s.c}}>{s.v}</div>
                    <div style={{fontSize:9,color:T.muted}}>{s.l}</div>
                  </div>
                ))}
              </div>
            </Card>
          );
        })}
        {!cardio.some(c=>CARDIO_TYPES.includes(c.type)) && (
          <div style={{textAlign:"center",padding:"40px",color:T.muted}}>Noch keine Daten.</div>
        )}
      </>}
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// EXERCISE DB SCREEN
// Eigene Übungen: vollständig neu erstellen (in customExercises)
// Basis-Übungen:  Beschreibung/Link/Bild ergänzen (in exerciseOverrides)
// ═══════════════════════════════════════════════════════
const ExerciseDBScreen = ({
  allExercises,
  customExercises, setCustomExercises,
  exerciseOverrides, setExerciseOverrides,
  onSelect, selectable, selected=[],
  sessions=[],
  initialDetailId,   // Fix 1: open directly on this exercise id
}) => {
  const [cat,setCat]   = useState("Alle");
  const [search,setSearch] = useState("");
  // Fix 1: honour initialDetailId on mount
  const [mode,setMode] = useState(() => initialDetailId ? "detail" : "list");
  const [activeId,setActiveId] = useState(initialDetailId || null);

  const [fName,setFName] = useState("");
  const [fCat,setFCat]   = useState("Brust");
  const [fEq,setFEq]     = useState("Maschine");
  const [fDesc,setFDesc] = useState("");
  const [fLink,setFLink] = useState("");
  const [fImg,setFImg]   = useState(null);
  const [fNote,setFNote] = useState(""); // Fix 5: Trainingsnotiz (Kurznotiz)
  const [fUnitType,setFUnitType] = useState("reps"); // Messtyp: reps | secs | mins | reps+kg
  const [imgLoading,setImgLoading] = useState(false);
  const fileRef = useRef(null);

  // Resolve an exercise with any overrides applied
  const resolve = useCallback(ex => ({...ex, ...(exerciseOverrides?.[ex.id]||{})}), [exerciseOverrides]);

  // Fix 1: openEdit properly pre-fills form and sets activeId so back→detail works
  const openCreate = () => {
    setFName(""); setFCat("Brust"); setFEq("Maschine");
    setFDesc(""); setFLink(""); setFImg(null); setFNote(""); setFUnitType("reps");
    setActiveId(null); setMode("create");
  };

  const openEdit = useCallback(ex => {
    const resolved = resolve(ex);
    setFName(resolved.name || "");
    setFCat(resolved.cat  || "Brust");
    setFEq(resolved.eq    || "Maschine");
    setFDesc(resolved.desc || "");
    setFLink(resolved.link || "");
    setFImg(resolved.img   || null);
    setFNote(resolved.trainingsnotiz || ""); // Fix 5
    setFUnitType(resolved.unitType === "secs" ? "secs" : resolved.unitType === "mins" ? "mins" : resolved.unitType === "reps" ? "reps" : "reps+kg");
    setActiveId(ex.id);
    setMode("edit");
  }, [resolve]);

  const handleImg = e => {
    const f = e.target.files[0]; if (!f) return;
    setImgLoading(true);
    const r = new FileReader();
    r.onload = async ev => {
      try {
        const compressed = await compressImage(ev.target.result, 400, 0.72);
        setFImg(compressed);
      } catch {
        setFImg(ev.target.result); // fallback
      }
      setImgLoading(false);
    };
    r.onerror = () => setImgLoading(false);
    r.readAsDataURL(f);
  };

  const saveCreate = () => {
    if (!fName.trim()) return;
    const entry = {
      id:`cx${uid()}`, name:fName.trim(), cat:fCat, eq:fEq,
      muscle:fCat.toLowerCase(),
      unitType: (fUnitType==="reps+kg"||fUnitType==="reps") ? undefined : fUnitType,
      desc:fDesc.trim()||null, link:fLink.trim()||null, img:fImg||null,
      trainingsnotiz: fNote.trim()||null, // Fix 5
      custom:true,
    };
    setCustomExercises(p=>[...p, entry]);
    setMode("list");
  };

  const saveEdit = () => {
    const ex = allExercises.find(e=>e.id===activeId);
    if (!ex) return;

    if (ex.custom) {
      // Custom exercise: all fields editable
      if (!fName.trim()) return;
      const updated = {
        ...ex, name:fName.trim(), cat:fCat, eq:fEq,
        muscle:fCat.toLowerCase(),
        unitType: (fUnitType==="reps+kg"||fUnitType==="reps") ? undefined : fUnitType,
        desc:fDesc.trim()||null, link:fLink.trim()||null, img:fImg||null,
        trainingsnotiz: fNote.trim()||null, // Fix 5
      };
      setCustomExercises(p=>p.map(e=>e.id===activeId ? updated : e));
    } else {
      // Built-in exercise: store enrichment in overrides incl. trainingsnotiz
      const override = {
        desc: fDesc.trim()||null,
        link: fLink.trim()||null,
        img:  fImg||null,
        trainingsnotiz: fNote.trim()||null, // Fix 5
        unitType: (fUnitType==="reps+kg"||fUnitType==="reps") ? null : fUnitType,
      };
      const hasAny = override.desc || override.link || override.img || override.trainingsnotiz || override.unitType;
      if (hasAny) {
        setExerciseOverrides(prev=>({...prev, [activeId]: override}));
      } else {
        setExerciseOverrides(prev=>{ const n={...prev}; delete n[activeId]; return n; });
      }
    }
    setMode("detail");
  };

  const deleteCustom = id => {
    setCustomExercises(p=>p.filter(e=>e.id!==id));
    setMode("list");
  };

  const clearOverride = id => {
    setExerciseOverrides(prev=>{
      const next={...prev};
      delete next[id];
      return next;
    });
  };

  // ── DETAIL VIEW ──────────────────────────────────────
  if (mode==="detail" && activeId) {
    const base = allExercises.find(e=>e.id===activeId);
    if (!base) { setMode("list"); return null; }
    const ex = resolve(base);
    const hasOverride = !base.custom && exerciseOverrides?.[base.id];

    return (
      <div style={{padding:"0 16px 24px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"20px 0 12px"}}>
          <Btn v="ghost" onClick={()=>setMode("list")} style={{padding:"8px 14px"}}>←</Btn>
          <div style={{flex:1,fontSize:18,fontWeight:900,color:T.text}}>{ex.name}</div>
          <Btn v="ghost" onClick={()=>openEdit(base)} style={{padding:"8px 14px"}}>✎ Bearbeiten</Btn>
        </div>

        {ex.img&&(
          <img src={ex.img} alt={ex.name}
            style={{width:"100%",borderRadius:14,marginBottom:12,objectFit:"cover",maxHeight:220}}/>
        )}

        <Card style={{marginBottom:10}}>
          <div style={{display:"flex",gap:8,marginBottom:ex.desc?12:4,flexWrap:"wrap"}}>
            <Badge color={CAT_COLOR_EXT[ex.cat]||T.accent}>{ex.cat}</Badge>
            <Badge color={T.sub}>{ex.eq}</Badge>
            {ex.custom&&<Badge color={T.purple}>Eigene Übung</Badge>}
            {hasOverride&&<Badge color={T.teal}>Ergänzt</Badge>}
          </div>
          {ex.trainingsnotiz&&(
            <div style={{fontSize:12,color:T.teal,marginBottom:8,padding:"6px 10px",
              background:T.teal+"15",borderRadius:8,border:`1px solid ${T.teal}33`}}>
              Notiz: {ex.trainingsnotiz}
            </div>
          )}
          {ex.desc&&(
            <div style={{fontSize:14,color:T.sub,lineHeight:1.7,marginBottom:ex.link?12:0}}>
              {ex.desc}
            </div>
          )}
          {ex.link&&(
            <a href={ex.link} target="_blank" rel="noreferrer"
              style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",
                background:T.bgAlt,borderRadius:10,color:T.blue,fontSize:13,
                fontWeight:700,textDecoration:"none",marginTop:ex.desc?0:4}}>
              Video öffnen
            </a>
          )}
          {!ex.desc&&!ex.link&&!ex.img&&(
            <div style={{fontSize:13,color:T.muted,fontStyle:"italic"}}>
              Noch keine Beschreibung · tippe Bearbeiten um Infos hinzuzufügen
            </div>
          )}
        </Card>

        {/* Last training values */}
        {(()=>{
          const lastWork = getLastWorkSets(base.id, sessions);
          if (!lastWork || !lastWork.length) return null;
          const w = lastWork[0].weight;
          const repsArr = lastWork.map(s=>s.reps);
          const sameReps = repsArr.every(r=>r===repsArr[0]);
          return (
            <Card style={{marginBottom:10, border:`1px solid ${T.teal}44`}}>
              <div style={{fontSize:11,fontWeight:800,color:T.teal,marginBottom:8,letterSpacing:0.3}}>
                LETZTES TRAINING
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                {w > 0 && (
                  <div style={{textAlign:"center",flex:1}}>
                    <div style={{fontSize:20,fontWeight:900,color:T.text}}>{w}</div>
                    <div style={{fontSize:10,color:T.muted,fontWeight:700}}>KG</div>
                  </div>
                )}
                <div style={{textAlign:"center",flex:1}}>
                  <div style={{fontSize:20,fontWeight:900,color:T.text}}>
                    {sameReps ? repsArr[0] : `${Math.min(...repsArr)}–${Math.max(...repsArr)}`}
                  </div>
                  <div style={{fontSize:10,color:T.muted,fontWeight:700}}>WDH</div>
                </div>
                <div style={{textAlign:"center",flex:1}}>
                  <div style={{fontSize:20,fontWeight:900,color:T.text}}>{lastWork.length}</div>
                  <div style={{fontSize:10,color:T.muted,fontWeight:700}}>SÄTZE</div>
                </div>
              </div>
              {!sameReps && (
                <div style={{marginTop:8,display:"flex",gap:4,flexWrap:"wrap"}}>
                  {repsArr.map((r,i)=>(
                    <span key={i} style={{fontSize:12,color:T.sub,background:T.bgAlt,
                      borderRadius:6,padding:"2px 8px",fontWeight:600}}>
                      Satz {i+1}: {r} Wdh{w>0?` · ${w} kg`:""}
                    </span>
                  ))}
                </div>
              )}
            </Card>
          );
        })()}

        {/* Actions */}
        {selectable&&(
          <Btn onClick={()=>{onSelect&&onSelect(base);setMode("list");}} full style={{marginBottom:10}}>
            + Zum Plan hinzufügen
          </Btn>
        )}
        {hasOverride&&(
          <Btn v="ghost" onClick={()=>{clearOverride(base.id);}} full style={{marginBottom:8,fontSize:12}}>
            Ergänzungen zurücksetzen
          </Btn>
        )}
        {ex.custom&&(
          <Btn v="danger" onClick={()=>deleteCustom(ex.id)} full>Übung löschen</Btn>
        )}
      </div>
    );
  }

  // ── CREATE / EDIT FORM ───────────────────────────────
  if (mode==="create" || mode==="edit") {
    const isCreate = mode==="create";
    const base = !isCreate ? allExercises.find(e=>e.id===activeId) : null;
    const isBuiltIn = base && !base.custom;
    const EQ_OPTS=["Langhantel","Kurzhantel","Kabel","Maschine","Körpergewicht","Sonstiges"];

    return (
      <div style={{padding:"0 16px 24px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"20px 0 14px"}}>
          <Btn v="ghost" onClick={()=>setMode(isCreate?"list":"detail")} style={{padding:"8px 14px"}}>←</Btn>
          <div style={{flex:1,fontSize:18,fontWeight:900,color:T.text}}>
            {isCreate?"Neue Übung":"Übung bearbeiten"}
          </div>
        </div>

        {isBuiltIn&&(
          <div style={{padding:"10px 14px",background:T.blue+"18",borderRadius:10,marginBottom:14,
            border:`1px solid ${T.blue}44`,fontSize:12,color:T.sub}}>
            ℹ️ <b style={{color:T.text}}>Basis-Übung:</b> Name, Kategorie und Gerät sind fest.
            Du kannst Beschreibung, Link und Bild ergänzen.
          </div>
        )}

        <Card>
          {/* Name + Cat + Eq only for custom */}
          {!isBuiltIn&&<>
            <div style={{marginBottom:10}}>
              <Lbl>NAME *</Lbl>
              <Inp value={fName} onChange={setFName} placeholder="z.B. Schrägbank Kurzhantel"/>
            </div>
            <div style={{marginBottom:10}}>
              <Lbl>KATEGORIE</Lbl>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {ALL_CATS.filter(c=>c!=="Alle").map(c=>(
                  <button key={c} onClick={()=>setFCat(c)} style={{
                    background:fCat===c?(CAT_COLOR_EXT[c]||T.accent):T.bgInput,
                    color:fCat===c?"#07070F":T.sub,
                    border:`1px solid ${fCat===c?(CAT_COLOR_EXT[c]||T.accent):T.border}`,
                    borderRadius:8,padding:"6px 11px",fontSize:11,fontWeight:700,cursor:"pointer",
                  }}>{c}</button>
                ))}
              </div>
            </div>
            <div style={{marginBottom:12}}>
              <Lbl>GERÄT</Lbl>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {EQ_OPTS.map(e=>(
                  <button key={e} onClick={()=>setFEq(e)} style={{
                    background:fEq===e?T.accent:T.bgInput,
                    color:fEq===e?"#07070F":T.sub,
                    border:`1px solid ${fEq===e?T.accent:T.border}`,
                    borderRadius:8,padding:"6px 11px",fontSize:11,fontWeight:700,cursor:"pointer",
                  }}>{e}</button>
                ))}
              </div>
            </div>
          </>}

          {/* Messtyp – available for ALL exercises incl. built-ins */}
          <div style={{marginBottom:12}}>
            <Lbl>MESSTYP</Lbl>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>
              {[
                {v:"reps",      label:"Wdh",          desc:"Nur Wiederholungen (z.B. Kreisen, Dehnung)"},
                {v:"reps+kg",   label:"kg + Wdh",     desc:"Gewicht und Wiederholungen (Standard Krafttraining)"},
                {v:"secs",      label:"Sekunden",      desc:"Zeitbasiert in Sekunden (z.B. Plank, Dehnung)"},
                {v:"mins",      label:"Minuten",       desc:"Zeitbasiert in Minuten (z.B. Cardio)"},
              ].map(opt=>(
                <button key={opt.v} onClick={()=>setFUnitType(opt.v)} style={{
                  background: fUnitType===opt.v ? T.accent : T.bgInput,
                  color:      fUnitType===opt.v ? "#07070F" : T.sub,
                  border:     `1px solid ${fUnitType===opt.v ? T.accent : T.border}`,
                  borderRadius:8, padding:"7px 12px", fontSize:12, fontWeight:700, cursor:"pointer",
                }}>{opt.label}</button>
              ))}
            </div>
            <div style={{fontSize:10,color:T.muted,marginTop:5,lineHeight:1.5}}>
              {fUnitType==="reps"    && "Nur Wiederholungen – kein Gewichtsfeld (Kreisen, Stretching …)"}
              {fUnitType==="reps+kg" && "Gewicht × Wiederholungen – Standard für Kraftübungen"}
              {fUnitType==="secs"    && "Zeit in Sekunden – Feld zeigt Sekunden statt Wdh (Plank, Dehnung …)"}
              {fUnitType==="mins"    && "Zeit in Minuten – z.B. für Cardio-Einheiten im Training"}
            </div>
          </div>

          {/* Media fields – available for ALL exercises */}
          <div style={{marginBottom:10}}>
            <Lbl>BESCHREIBUNG</Lbl>
            {/* Fix 3: auto-resize */}
            <AutoTextarea value={fDesc} onChange={setFDesc}
              placeholder="Ausführung, Hinweise, Muskelgruppen..."/>
          </div>
          {/* Fix 5: Trainingsnotiz – kurze Notiz die beim Training immer sichtbar ist */}
          <div style={{marginBottom:10}}>
            <Lbl>TRAININGSNOTIZ (immer sichtbar)</Lbl>
            <Inp value={fNote} onChange={setFNote}
              placeholder="z.B. Sitzhöhe 4 · Griff eng · Lehne Stufe 3"/>
            <div style={{fontSize:10,color:T.muted,marginTop:4,lineHeight:1.5}}>
              Wird während jedes Trainings unter der Übung angezeigt.
            </div>
          </div>
          <div style={{marginBottom:12}}>
            <Lbl>VIDEO-LINK (YouTube, etc.)</Lbl>
            <Inp value={fLink} onChange={setFLink} placeholder="https://youtube.com/watch?v=..."/>
          </div>
          <div style={{marginBottom:16}}>
            <Lbl>BILD</Lbl>
            {fImg
              ? <div style={{position:"relative"}}>
                  <img src={fImg} alt="" style={{width:"100%",borderRadius:10,maxHeight:180,objectFit:"cover"}}/>
                  <button onClick={()=>setFImg(null)}
                    style={{position:"absolute",top:8,right:8,background:T.red,border:"none",
                      borderRadius:"50%",width:28,height:28,cursor:"pointer",color:"#fff",
                      fontWeight:900,fontSize:15}}>×</button>
                </div>
              : <div onClick={()=>!imgLoading&&fileRef.current?.click()}
                  style={{border:`1px dashed ${T.border}`,borderRadius:10,padding:"22px",
                    textAlign:"center",cursor:imgLoading?"default":"pointer",color:T.muted,fontSize:13}}>
                  {"Bild auswählen"}
                </div>
            }
            <input ref={fileRef} type="file" accept="image/*" onChange={handleImg} style={{display:"none"}}/>
          </div>

          <Btn onClick={isCreate?saveCreate:saveEdit}
            disabled={(!isBuiltIn&&!fName.trim())||imgLoading} full>
            {isCreate?"Übung erstellen":"Änderungen speichern"}
          </Btn>
        </Card>
      </div>
    );
  }

  // ── LIST VIEW ────────────────────────────────────────
  const filtered = allExercises.filter(e =>
    (cat==="Alle"||e.cat===cat) &&
    (e.name.toLowerCase().includes(search.toLowerCase())||
     e.eq.toLowerCase().includes(search.toLowerCase()))
  );

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"20px 0 12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:22,fontWeight:900,color:T.text}}>
            {selectable?"Übung wählen":"Übungsdatenbank"}
          </div>
          {!selectable&&(
            <Btn v="secondary" onClick={openCreate} style={{padding:"7px 14px",fontSize:12}}>+ Eigene</Btn>
          )}
        </div>
        <Inp value={search} onChange={setSearch} placeholder="Suchen…"/>
      </div>

      <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:10,paddingBottom:2}}>
        {ALL_CATS.map(c=>(
          <button key={c} onClick={()=>setCat(c)} style={{
            background:cat===c?(CAT_COLOR_EXT[c]||T.accent):T.bgCard,
            color:cat===c?"#07070F":T.sub,
            border:`1px solid ${cat===c?(CAT_COLOR_EXT[c]||T.accent):T.border}`,
            borderRadius:8,padding:"6px 12px",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",
          }}>{c}</button>
        ))}
      </div>

      <div style={{fontSize:11,color:T.muted,marginBottom:10}}>{filtered.length} Übungen</div>

      {filtered.map(ex=>{
        const resolved = resolve(ex);
        const sel = selected.includes(ex.id);
        const hasMedia = resolved.desc||resolved.link||resolved.img;
        const isEnriched = !ex.custom && exerciseOverrides?.[ex.id];
        return (
          <div key={ex.id} style={{
            display:"flex",alignItems:"center",gap:10,padding:"10px 12px",
            borderRadius:12,marginBottom:6,
            background:sel?T.accentGlow:T.bgCard,
            border:`1px solid ${sel?T.accent:T.border}`,
            transition:"all 0.12s",
          }}>
            <div style={{
              width:36,height:36,borderRadius:10,flexShrink:0,
              background:`${CAT_COLOR_EXT[ex.cat]||T.accent}22`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,
            }}>
              {{Brust:"·",Rücken:"·",Beine:"·",Schultern:"·",Arme:"·",Core:"·",Aufwärmen:"·",Dehnung:"·"}[ex.cat]||"•"}
            </div>

            {/* Main tap area */}
            <div style={{flex:1,minWidth:0,cursor:"pointer"}}
              onClick={()=>{
                if (selectable) { onSelect&&onSelect(ex); }
                else { setActiveId(ex.id); setMode("detail"); }
              }}>
              <div style={{fontSize:14,fontWeight:700,color:T.text,display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                {ex.name}
                {ex.custom&&<span style={{fontSize:9,color:T.purple,fontWeight:800,letterSpacing:0.3}}>EIGENE</span>}
                {isEnriched&&<span style={{fontSize:9,color:T.teal,fontWeight:800}}>+INFO</span>}
                {hasMedia&&!isEnriched&&!ex.custom&&<span style={{fontSize:11,color:T.muted}}>ℹ</span>}
              </div>
              <div style={{fontSize:11,color:T.sub,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                <span style={{color:CAT_COLOR_EXT[ex.cat]||T.accent}}>{ex.cat}</span> · {ex.eq}
              </div>
            </div>

            {/* Right side */}
            {selectable ? (
              <button onClick={()=>onSelect&&onSelect(ex)} style={{
                background:sel?T.accent:T.bgAlt,
                border:`1px solid ${sel?T.accent:T.border}`,
                borderRadius:8,width:32,height:32,cursor:"pointer",
                fontSize:16,color:sel?"#07070F":T.muted,flexShrink:0,
              }}>{sel?"✓":"+"}</button>
            ) : (
              <button onClick={()=>{setActiveId(ex.id);setMode("detail");}}
                style={{background:"none",border:"none",cursor:"pointer",color:T.muted,fontSize:18,padding:4}}>›</button>
            )}
          </div>
        );
      })}
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// PLAN EDITOR  – vollständig editierbar
// ═══════════════════════════════════════════════════════
const PlanEditor = ({plan, allExercises, exerciseOverrides, setExerciseOverrides, customExercises, setCustomExercises, onSave, onCancel, settings, sessions}) => {
  const [name,setName]=useState(plan?.name||"");
  const [desc,setDesc]=useState(plan?.desc||"");
  const [days,setDays]=useState(()=>JSON.parse(JSON.stringify(plan?.days||[])));
  const [activeDay,setActiveDay]=useState(0);
  const [showDB,setShowDB]=useState(false);
  // Which exercise ID is being info-edited from within the plan editor
  const [infoExId, setInfoExId] = useState(null);

  const addDay   = () => { setDays(d=>[...d,{id:uid(),name:`Tag ${d.length+1}`,exercises:[]}]); setActiveDay(days.length); };
  const remDay   = i  => { setDays(d=>d.filter((_,j)=>j!==i)); setActiveDay(a=>Math.max(0,a-1)); };
  const updDayName=(i,v)=> setDays(d=>d.map((x,j)=>j===i?{...x,name:v}:x));

  const addEx = ex => {
    const defaultRest = getDefaultRestForExercise(ex, settings);
    // Pre-fill from last real training session for this exercise (any plan)
    const lastWork = getLastWorkSets(ex.id, sessions||[]);
    const prefillWeight = lastWork ? lastWork[0].weight : 0;
    const prefillReps   = lastWork ? Math.min(...lastWork.map(s=>s.reps)) : 10;
    const prefillSets   = lastWork ? lastWork.length : 3;
    setDays(d=>d.map((x,i)=>i===activeDay
      ?{...x,exercises:[...x.exercises,{
          eid:ex.id, sets:prefillSets, reps:prefillReps,
          weight:prefillWeight, rest:defaultRest, note:"",
        }]}
      :x));
    setShowDB(false);
  };
  // Punkt 4: apply rest rules to all exercises in current day
  const applyRestRules = () => {
    if(!window.confirm("Pausen aller Übungen dieses Tages nach den Einstellungen überschreiben?")) return;
    setDays(d=>d.map((day,i)=>i===activeDay?{
      ...day,
      exercises:day.exercises.map(ex=>{
        const exercise=(allExercises||[]).find(e=>e.id===ex.eid);
        return {...ex, rest:getDefaultRestForExercise(exercise, settings)};
      }),
    }:day));
  };
  // Letztes Training übernehmen: weight + reps + sets aus echter letzter Session (planunabhängig)
  const applyLastSession = () => {
    if (!window.confirm(
      "Werte aus letztem Training übernehmen?\n\n" +
      "Gewicht, Wiederholungen und Satzanzahl werden für alle Übungen " +
      "dieses Tages aus dem jeweils letzten Training aktualisiert.\n\n" +
      "Übungen ohne Verlauf bleiben unverändert."
    )) return;
    setDays(d=>d.map((day,i)=>i!==activeDay?day:{
      ...day,
      exercises:day.exercises.map(ex=>{
        const lastWork = getLastWorkSets(ex.eid, sessions||[]);
        if (!lastWork || !lastWork.length) return ex;
        if (ex.isWarmup) {
          return {...ex, weight: lastWork[0].weight};
        }
        const newRows = lastWork.map((s, i) => ({
          reps: s.reps, weight: s.weight,
          isWarmup: i === 0 && ex.isWarmup,
        }));
        const minReps = Math.min(...newRows.map(r=>r.reps));
        return {
          ...ex,
          sets:    newRows.length,
          reps:    minReps,
          weight:  newRows[0].weight,
          setRows: newRows,
        };
      }),
    }));
  };

  const remEx    = (di,ei) => setDays(d=>d.map((x,i)=>i===di?{...x,exercises:x.exercises.filter((_,j)=>j!==ei)}:x));
  const updEx    = (di,ei,f,v) => setDays(d=>d.map((x,i)=>i===di?{
    ...x,exercises:x.exercises.map((e,j)=>j===ei?{...e,[f]:isNaN(Number(v))?v:Number(v)}:e)
  }:x));
  const updExNote   = (di,ei,v) => setDays(d=>d.map((x,i)=>i===di?{
    ...x,exercises:x.exercises.map((e,j)=>j===ei?{...e,note:v}:e)
  }:x));
  const toggleWarmup= (di,ei) => setDays(d=>d.map((x,i)=>i===di?{
    ...x,exercises:x.exercises.map((e,j)=>j===ei?{...e,isWarmup:!e.isWarmup}:e)
  }:x));

  // Per-set helpers
  // getSetRows: expand a plan exercise into editable set rows
  const getSetRows = ex => {
    const base = ex.setRows || [];
    const count = ex.sets || 1;
    return Array.from({length: count}, (_, i) => ({
      reps:     base[i]?.reps     ?? ex.reps   ?? 10,
      weight:   base[i]?.weight   ?? ex.weight  ?? 0,
      isWarmup: base[i]?.isWarmup ?? (i === 0 && ex.isWarmup) ?? false,
    }));
  };

  const updSetRow = (di, ei, si, field, val) => setDays(d => d.map((day, i) => {
    if (i !== di) return day;
    return {
      ...day,
      exercises: day.exercises.map((ex, j) => {
        if (j !== ei) return ex;
        const rows = getSetRows(ex);
        rows[si] = { ...rows[si], [field]: field === 'isWarmup' ? val : (parseFloat(val) || 0) };
        // Sync top-level sets/reps/weight from rows for backwards compat
        return {
          ...ex,
          sets:    rows.length,
          reps:    Math.min(...rows.map(r => r.reps)),
          weight:  rows[0]?.weight ?? ex.weight,
          isWarmup: rows[0]?.isWarmup ?? false,
          setRows: rows,
        };
      }),
    };
  }));

  const addSetRow = (di, ei) => setDays(d => d.map((day, i) => {
    if (i !== di) return day;
    return {
      ...day,
      exercises: day.exercises.map((ex, j) => {
        if (j !== ei) return ex;
        const rows = getSetRows(ex);
        const last = rows[rows.length - 1] || {reps: ex.reps||10, weight: ex.weight||0, isWarmup:false};
        const newRows = [...rows, {reps: last.reps, weight: last.weight, isWarmup: false}];
        return { ...ex, sets: newRows.length, setRows: newRows };
      }),
    };
  }));

  const removeSetRow = (di, ei, si) => setDays(d => d.map((day, i) => {
    if (i !== di) return day;
    return {
      ...day,
      exercises: day.exercises.map((ex, j) => {
        if (j !== ei) return ex;
        const rows = getSetRows(ex).filter((_, k) => k !== si);
        if (rows.length === 0) return ex; // keep at least 1
        return {
          ...ex,
          sets:    rows.length,
          reps:    Math.min(...rows.map(r => r.reps)),
          weight:  rows[0]?.weight ?? ex.weight,
          isWarmup: rows[0]?.isWarmup ?? false,
          setRows: rows,
        };
      }),
    };
  }));
  // Move exercise up/down
  const moveEx = (di,ei,dir) => setDays(d=>d.map((day,i)=>{
    if(i!==di) return day;
    const exs=[...day.exercises];
    const to=ei+dir;
    if(to<0||to>=exs.length) return day;
    [exs[ei],exs[to]]=[exs[to],exs[ei]];
    return {...day,exercises:exs};
  }));

  // Fix 1: Info/Edit overlay – passes initialDetailId so ExerciseDBScreen opens directly on this exercise
  if (infoExId) return (
    <div>
      <div style={{padding:"16px 16px 0",display:"flex",alignItems:"center",gap:10}}>
        <Btn v="ghost" onClick={()=>setInfoExId(null)} style={{padding:"8px 14px"}}>← Zurück zum Plan</Btn>
      </div>
      <ExerciseDBScreen
        allExercises={allExercises}
        customExercises={customExercises} setCustomExercises={setCustomExercises}
        exerciseOverrides={exerciseOverrides} setExerciseOverrides={setExerciseOverrides}
        selectable={false}
        initialDetailId={infoExId}
      />
    </div>
  );

  if (showDB) return (
    <div>
      <div style={{padding:"16px 16px 0",display:"flex",alignItems:"center",gap:10}}>
        <Btn v="ghost" onClick={()=>setShowDB(false)} style={{padding:"8px 14px"}}>← Zurück</Btn>
        <div style={{fontSize:16,fontWeight:700,color:T.text}}>Übung hinzufügen</div>
      </div>
      <ExerciseDBScreen
        allExercises={allExercises}
        onSelect={addEx} selectable
        selected={days[activeDay]?.exercises.map(e=>e.eid)||[]}
      />
    </div>
  );

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"20px 0 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:20,fontWeight:900,color:T.text}}>{plan?"Bearbeiten":"Neuer Plan"}</div>
        <div style={{display:"flex",gap:8}}>
          <Btn v="ghost" onClick={onCancel} style={{padding:"8px 14px"}}>Abbruch</Btn>
          <Btn disabled={!name.trim()} onClick={()=>onSave({
            id:plan?.id||uid(), name, desc, days,
            archived:plan?.archived||false,
          })} style={{padding:"8px 18px"}}>Speichern</Btn>
        </div>
      </div>

      <div style={{marginBottom:10}}><Lbl>PLANNAME</Lbl><Inp value={name} onChange={setName} placeholder="Mein Plan"/></div>
      <div style={{marginBottom:14}}><Lbl>BESCHREIBUNG</Lbl><Inp value={desc} onChange={setDesc} placeholder="Kurze Beschreibung..."/></div>

      {/* Day tabs */}
      <div style={{display:"flex",gap:7,overflowX:"auto",marginBottom:14,paddingBottom:2}}>
        {days.map((day,i)=>(
          <button key={day.id} onClick={()=>setActiveDay(i)} style={{background:activeDay===i?T.accent:T.bgCard,color:activeDay===i?"#07070F":T.sub,border:`1px solid ${activeDay===i?T.accent:T.border}`,borderRadius:9,padding:"6px 14px",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{day.name}</button>
        ))}
        <button onClick={addDay} style={{background:T.bgAlt,color:T.accent,border:`1px dashed ${T.accent}`,borderRadius:9,padding:"6px 14px",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Tag</button>
      </div>

      {days[activeDay] && (
        <Card>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <input value={days[activeDay].name} onChange={e=>updDayName(activeDay,e.target.value)}
              style={{background:"transparent",border:"none",outline:"none",fontSize:16,fontWeight:700,color:T.accent,flex:1}}/>
            <button onClick={()=>remDay(activeDay)} style={{background:"none",border:"none",cursor:"pointer",color:T.red,fontSize:18,padding:4}}>Löschen</button>
          </div>

          {/* Progression & Deload Hinweis */}
          {(()=>{
            const ps = getProgressionSettings(settings);
            if (ps.enabled) return null;
            return (
              <div style={{
                padding:"10px 12px", borderRadius:10, marginBottom:8,
                background:T.teal+"14", border:`1px solid ${T.teal}33`,
                display:"flex", alignItems:"center", gap:10,
              }}>
                <span style={{fontSize:16}}>↑</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:700,color:T.teal,marginBottom:1}}>
                    Progression & Deload deaktiviert
                  </div>
                  <div style={{fontSize:11,color:T.sub,lineHeight:1.4}}>
                    Aktiviere automatische Vorschläge unter <b style={{color:T.text}}>Mehr → Einstellungen → Progression & Deload</b>
                  </div>
                </div>
              </div>
            );
          })()}

          {days[activeDay].exercises.length===0&&(
            <div style={{textAlign:"center",padding:"20px 0",color:T.muted,fontSize:13,border:`1px dashed ${T.border}`,borderRadius:12,marginBottom:10}}>
              Noch keine Übungen
            </div>
          )}

          {days[activeDay].exercises.map((ex,j)=>{
            const e = allExercises.find(x=>x.id===ex.eid);
            const override = exerciseOverrides?.[ex.eid]||{};
            const resolved = {...(e||{}), ...override};
            const ut = resolved.unitType || "reps+kg";
            const isTimeBased = ut==="secs"||ut==="mins";
            const isRepsOnly  = ut==="reps";
            const rows = getSetRows(ex);
            const unitLabel = ut==="secs"?"Sek":ut==="mins"?"Min":"Wdh";
            const anyWarmup = rows.some(r=>r.isWarmup);

            return (
              <div key={`${ex.eid}-${j}`} style={{
                background:T.bgAlt, borderRadius:12, padding:12, marginBottom:8,
                border:`1px solid ${anyWarmup ? T.orange+"44" : T.border}`,
              }}>
                {/* ── Header ── */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <div style={{fontSize:14,fontWeight:700,color:T.text}}>{resolved.name||"Unbekannte Übung"}</div>
                      {anyWarmup&&<span style={{fontSize:9,fontWeight:800,color:T.orange,background:T.orange+"22",border:`1px solid ${T.orange}44`,borderRadius:4,padding:"1px 5px"}}>WARM</span>}
                    </div>
                    <div style={{fontSize:11,color:T.sub,marginTop:1}}>{e?.cat} · {e?.eq}</div>
                  </div>
                  <div style={{display:"flex",gap:4,flexShrink:0,marginLeft:6}}>
                    <button onClick={()=>setInfoExId(ex.eid)} title="Übungsdetails"
                      style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:6,
                        padding:"2px 8px",cursor:"pointer",color:T.blue,fontSize:12,fontWeight:700}}>ℹ</button>
                    <button onClick={()=>moveEx(activeDay,j,-1)} disabled={j===0}
                      style={{background:"none",border:`1px solid ${T.border}`,borderRadius:6,padding:"2px 7px",cursor:"pointer",color:j===0?T.muted:T.sub,fontSize:12}}>↑</button>
                    <button onClick={()=>moveEx(activeDay,j,+1)} disabled={j===days[activeDay].exercises.length-1}
                      style={{background:"none",border:`1px solid ${T.border}`,borderRadius:6,padding:"2px 7px",cursor:"pointer",color:j===days[activeDay].exercises.length-1?T.muted:T.sub,fontSize:12}}>↓</button>
                    <button onClick={()=>remEx(activeDay,j)}
                      style={{background:"none",border:"none",cursor:"pointer",color:T.red,fontSize:16,padding:"2px 4px"}}>✕</button>
                  </div>
                </div>

                {/* ── Pause & Note row ── */}
                <div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:5,flex:1}}>
                    <span style={{fontSize:11,color:T.muted,whiteSpace:"nowrap"}}>Pause</span>
                    <input type="number" value={ex.rest||0}
                      onChange={e=>updEx(activeDay,j,"rest",e.target.value)}
                      style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:7,
                        padding:"5px 6px",color:T.text,fontSize:13,fontWeight:700,
                        width:56,textAlign:"center",boxSizing:"border-box"}}/>
                    <span style={{fontSize:11,color:T.muted}}>Sek</span>
                  </div>
                  <div style={{flex:2}}>
                    <input value={ex.note||""} onChange={e=>updExNote(activeDay,j,e.target.value)}
                      placeholder="Notiz zur Übung…"
                      style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:7,
                        padding:"5px 8px",color:T.text,fontSize:12,width:"100%",
                        boxSizing:"border-box",outline:"none"}}/>
                  </div>
                </div>

                {/* ── Per-set rows ── */}
                {rows.map((row, si) => {
                  const warmupColor = row.isWarmup ? T.orange : null;
                  return (
                    <div key={si} style={{
                      display:"grid",
                      gridTemplateColumns: isTimeBased||isRepsOnly
                        ? "28px 1fr 32px 32px"
                        : "28px 1fr 20px 1fr 32px 32px",
                      gap:5, alignItems:"center", marginBottom:6,
                    }}>
                      {/* Set badge */}
                      <div style={{
                        width:28,height:32,borderRadius:7,fontSize:11,fontWeight:800,
                        display:"flex",alignItems:"center",justifyContent:"center",
                        background: row.isWarmup ? T.orange+"22" : T.bgInput,
                        color: row.isWarmup ? T.orange : T.muted,
                        border:`1px solid ${row.isWarmup ? T.orange+"55" : T.border}`,
                      }}>{si+1}</div>

                      {/* Fields */}
                      {isTimeBased ? (
                        <div style={{display:"flex",alignItems:"center",gap:4}}>
                          <input type="number" value={row.reps}
                            onChange={e=>updSetRow(activeDay,j,si,"reps",e.target.value)}
                            style={{background:T.bgInput,border:`1px solid ${T.teal}55`,borderRadius:7,
                              padding:"6px 4px",color:T.teal,fontSize:14,fontWeight:700,
                              textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                          <span style={{fontSize:11,color:T.teal,fontWeight:700,whiteSpace:"nowrap"}}>{unitLabel}</span>
                        </div>
                      ) : isRepsOnly ? (
                        <div style={{display:"flex",alignItems:"center",gap:4}}>
                          <input type="number" value={row.reps}
                            onChange={e=>updSetRow(activeDay,j,si,"reps",e.target.value)}
                            style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:7,
                              padding:"6px 4px",color:T.text,fontSize:14,fontWeight:700,
                              textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                          <span style={{fontSize:11,color:T.sub,fontWeight:700}}>Wdh</span>
                        </div>
                      ) : (<>
                        <div style={{display:"flex",alignItems:"center",gap:3}}>
                          <input type="number" value={row.weight}
                            onChange={e=>updSetRow(activeDay,j,si,"weight",e.target.value)}
                            style={{background:T.bgInput,border:`1px solid ${warmupColor ? T.orange+"55" : T.border}`,borderRadius:7,
                              padding:"6px 4px",color:warmupColor||T.text,fontSize:14,fontWeight:700,
                              textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                          <span style={{fontSize:11,color:T.sub,fontWeight:700}}>kg</span>
                        </div>
                        <span style={{textAlign:"center",color:T.muted,fontSize:12}}>×</span>
                        <div style={{display:"flex",alignItems:"center",gap:3}}>
                          <input type="number" value={row.reps}
                            onChange={e=>updSetRow(activeDay,j,si,"reps",e.target.value)}
                            style={{background:T.bgInput,border:`1px solid ${warmupColor ? T.orange+"55" : T.border}`,borderRadius:7,
                              padding:"6px 4px",color:warmupColor||T.text,fontSize:14,fontWeight:700,
                              textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                          <span style={{fontSize:11,color:T.sub,fontWeight:700}}>Wdh</span>
                        </div>
                      </>)}

                      {/* Warmup toggle */}
                      <button
                        onClick={()=>updSetRow(activeDay,j,si,"isWarmup",!row.isWarmup)}
                        title={row.isWarmup?"Als Arbeitssatz":"Als Warm-up-Satz"}
                        style={{
                          width:32,height:32,borderRadius:7,border:`1px solid ${row.isWarmup?T.orange:T.border}`,
                          background:row.isWarmup?T.orange+"33":T.bgInput,
                          color:row.isWarmup?T.orange:T.muted,
                          fontSize:13,cursor:"pointer",
                        }}>W</button>

                      {/* Remove set */}
                      <button
                        onClick={()=>removeSetRow(activeDay,j,si)}
                        title="Satz entfernen"
                        style={{
                          width:32,height:32,borderRadius:7,border:"none",
                          background:"none",color:T.muted,fontSize:15,cursor:"pointer",
                        }}>✕</button>
                    </div>
                  );
                })}

                {/* ── + Satz Button ── */}
                <button
                  onClick={()=>addSetRow(activeDay,j)}
                  style={{
                    width:"100%",marginTop:4,padding:"6px 0",
                    background:T.accent+"18",border:`1px dashed ${T.accent}55`,
                    borderRadius:8,color:T.accent,fontSize:12,fontWeight:700,cursor:"pointer",
                  }}>+ Satz</button>
              </div>
            );
          })}
          <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap"}}>
            <Btn v="secondary" onClick={()=>setShowDB(true)} style={{flex:"2 1 120px"}}>+ Übung hinzufügen</Btn>
            <Btn v="ghost" onClick={applyRestRules} style={{flex:"1 1 60px",fontSize:11,padding:"8px 4px"}}
              title="Pausen aller Übungen dieses Tages nach den Einstellungen setzen">
              Pausen
            </Btn>
            {(sessions||[]).length > 0 && (
              <Btn v="ghost" onClick={applyLastSession}
                style={{flex:"1 1 80px",fontSize:11,padding:"8px 4px",color:T.teal,borderColor:T.teal+"66"}}
                title="Gewicht, Wdh und Satzanzahl aus letztem Training übernehmen (planunabhängig)">
                Letztes Training
              </Btn>
            )}
          </div>
        </Card>
      )}
    </div>
  );
};
