    if (deloadCurrentlyActive && !deloadApplied) {
      const confirmed = window.confirm(
        "Deload angewendet?\n\nJa = Training wird als Deload-Einheit gespeichert (beeinflusst keine Progression).\nNein = Normales Training speichern."
      );
      sessionIsDeload      = confirmed;
      sessionDeloadApplied = confirmed;
    }

    onSave({
      id:uid(), planId, dayId,
      date:new Date().toISOString(),
      duration:Math.floor(elapsed/60),
      sets:allSets, note,
      ...(sessionIsDeload    ? { isDeload: true }      : {}),
      ...(sessionDeloadApplied ? { deloadApplied: true } : {}),
    });
    setPhase("done");
  };

  if (phase==="done") return (
    <div style={{padding:"60px 24px",textAlign:"center"}}>
      <div style={{fontSize:36,fontWeight:900,color:T.accent,marginBottom:16}}>Training abgeschlossen</div>
      <div style={{fontSize:30,fontWeight:900,color:T.accent,marginBottom:8}}>Stark gemacht!</div>
      <div style={{color:T.sub,fontSize:16,marginBottom:6}}>{fmt(elapsed)}</div>
      <div style={{color:T.muted,fontSize:13,marginBottom:40}}>
        {Object.values(sets).flat().filter(s=>s.done).length} Sätze · {Math.round(vol(Object.values(sets).flat())).toLocaleString()} kg
      </div>
      <Btn onClick={()=>setPhase("select")} full style={{padding:14}}>Neues Training</Btn>
    </div>
  );

  const preselectedPlan = planId ? activePlans.find(p=>p.id===planId) : null;
  // ── Confirm screen ─────────────────────────────────────────────────
  if (phase === "confirm") {
    const cp  = activePlans.find(p=>p.id===confirmPlanId);
    const cd  = cp?.days.find(d=>d.id===confirmDayId);
    if (!cp || !cd) { setPhase("select"); return null; }
    const totalSets = cd.exercises.reduce((s,e)=>s+e.sets, 0);
    return (
      <div style={{padding:"0 16px 32px"}}>
        <div style={{padding:"22px 0 6px",display:"flex",alignItems:"center",gap:10}}>
          <Btn v="ghost" onClick={()=>setPhase(planId?"preselect":"select")} style={{padding:"8px 14px"}}>←</Btn>
          <div style={{fontSize:22,fontWeight:900,color:T.text}}>Bereit?</div>
        </div>

        {/* Plan + Day info */}
        <div style={{fontSize:12,color:T.sub,marginBottom:16,paddingLeft:2}}>{cp.name}</div>

        <Card style={{marginBottom:14}} glow>
          <div style={{fontSize:20,fontWeight:900,color:T.accent,marginBottom:6}}>{cd.name}</div>
          <div style={{display:"flex",gap:14,fontSize:13,color:T.sub,marginBottom:16}}>
            <span>{cd.exercises.length} Übungen</span>
            <span>{totalSets} Sätze</span>
          </div>

          {/* Exercise list preview */}
          {cd.exercises.map((ex, i) => {
            const exercise = (allExercises||[]).find(e=>e.id===ex.eid);
            const override = exerciseOverrides?.[ex.eid] || {};
            const resolved = {...(exercise||{}), ...override};
            const unitType = resolved.unitType || "reps+kg"; // undefined = standard kg+Wdh
            return (
              <div key={instKey(ex.eid, i)} style={{
                display:"flex", justifyContent:"space-between", alignItems:"center",
                padding:"7px 0",
                borderBottom: i < cd.exercises.length-1 ? `1px solid ${T.border}` : "none",
              }}>
                <div>
                  <div style={{fontSize:13,fontWeight:600,color:T.text}}>{resolved.name||"?"}</div>
                  {resolved.trainingsnotiz && (
                    <div style={{fontSize:10,color:T.teal,marginTop:1}}>Notiz: {resolved.trainingsnotiz}</div>
                  )}
                  {ex.note && (
                    <div style={{fontSize:10,color:T.muted,marginTop:1}}>{ex.note}</div>
                  )}
                </div>
                <div style={{textAlign:"right",flexShrink:0,marginLeft:12}}>
                  <span style={{fontSize:13,fontWeight:700,color:T.sub}}>
                    {ex.sets}×{fmtRepsVal(ex.reps, unitType)}
                  </span>
                  {ex.weight>0 && unitType==="reps" && (
                    <div style={{fontSize:11,color:T.muted}}>{ex.weight} kg</div>
                  )}
                </div>
              </div>
            );
          })}
        </Card>

        {/* The actual start button */}
        <Btn
          onClick={()=>start(confirmPlanId, confirmDayId)}
          full
          style={{padding:"18px 0", fontSize:18, borderRadius:16, letterSpacing:0.5}}
        >
          ▶ Training starten
        </Btn>

        <div style={{marginTop:10,textAlign:"center",fontSize:11,color:T.muted}}>
          Tippe „←" um einen anderen Tag zu wählen
        </div>
      </div>
    );
  }

  // ── Select / preselect screen ───────────────────────────────────────
  if (phase==="select" || phase==="preselect") return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px",fontSize:24,fontWeight:900,color:T.text}}>Training starten</div>

      {hasDraft && (() => {
        const dp = activePlans.find(p=>p.id===draft.planId);
        const dd = dp?.days.find(d=>d.id===draft.dayId);
        const dn = Object.values(draft.sets||{}).flat().filter(s=>s.done).length;
        return (
          <div style={{background:`${T.orange}18`,border:`1px solid ${T.orange}55`,borderRadius:14,padding:"14px 16px",marginBottom:16}}>
            <div style={{fontSize:12,color:T.orange,fontWeight:800,marginBottom:6}}>UNTERBROCHENES TRAINING</div>
            <div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:2}}>{dd?.name||"Training"}</div>
            <div style={{fontSize:12,color:T.sub,marginBottom:12}}>{dp?.name} · {dn} Sätze · {fmt(draft.elapsed||0)}</div>
            <div style={{display:"flex",gap:8}}>
              <Btn onClick={()=>setPhase("active")} style={{flex:2,padding:"10px 0",fontSize:14,borderRadius:10}}>▶ Fortsetzen</Btn>
              <Btn v="danger" onClick={discardDraft} style={{flex:1,padding:"10px 0",fontSize:13,borderRadius:10}}>Verwerfen</Btn>
            </div>
          </div>
        );
      })()}

      {phase==="preselect" && preselectedPlan ? (
        <>
          <div style={{fontSize:11,color:T.sub,marginBottom:8,fontWeight:700,letterSpacing:1}}>{preselectedPlan.name.toUpperCase()}</div>
          {preselectedPlan.days.map(day=>(
            <Card key={day.id} onClick={()=>selectDay(planId,day.id)} style={{marginBottom:8}} glow>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:16,fontWeight:700,color:T.text}}>{day.name}</div>
                  <div style={{fontSize:12,color:T.sub,marginTop:2}}>{day.exercises.length} Übungen · {day.exercises.reduce((s,e)=>s+e.sets,0)} Sätze</div>
                </div>
                <div style={{background:T.accent,color:"#07070F",fontWeight:900,padding:"9px 16px",borderRadius:10,fontSize:13}}>Wählen ›</div>
              </div>
            </Card>
          ))}
          <Btn v="ghost" onClick={()=>setPhase("select")} style={{marginTop:10,width:"100%"}}>Anderen Plan wählen</Btn>
        </>
      ) : activePlans.length===0 ? (
        <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16}}>
          Kein aktiver Plan vorhanden.<br/><span style={{fontSize:12}}>Erstelle einen Plan unter "Pläne".</span>
        </div>
      ) : (
        activePlans.map(plan=>(
          <div key={plan.id} style={{marginBottom:16}}>
            <Lbl>{plan.name.toUpperCase()}</Lbl>
            {plan.days.map(day=>(
              <Card key={day.id} onClick={()=>selectDay(plan.id,day.id)} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:16,fontWeight:700,color:T.text}}>{day.name}</div>
                    <div style={{fontSize:12,color:T.sub,marginTop:2}}>{day.exercises.length} Übungen · {day.exercises.reduce((s,e)=>s+e.sets,0)} Sätze</div>
                  </div>
                  <div style={{background:T.accent,color:"#07070F",fontWeight:900,padding:"9px 16px",borderRadius:10,fontSize:13}}>Wählen ›</div>
                </div>
              </Card>
            ))}
          </div>
        ))
      )}
    </div>
  );

  const plan = activePlans.find(p=>p.id===planId);
  const day  = plan?.days.find(d=>d.id===dayId);
  if (!plan||!day) return null;

  const done  = Object.values(sets).flat().filter(s=>s.done).length;
  const total = Object.values(sets).flat().length;

  return (
    <div style={{padding:"0 16px 24px"}}>
      {/* RestTimer is now rendered globally in App so it persists across tab switches */}
        {/* Exercise timer overlay (Punkt 6) */}
        {exTimer&&<ExerciseTimer
          targetSecs={exTimer.targetSecs}
          tickStart={settings?.timerSettings?.exerciseTickStart ?? 10}
          onFinish={()=>{
            // Mark set done, optionally start rest
            const {ikey, setIdx, restSecs} = exTimer;
            setSets(prev=>{
              if(!prev[ikey]?.[setIdx]) return prev;
              const upd={...prev,[ikey]:prev[ikey].map((s,i)=>i===setIdx?{...s,done:true}:s)};
              return upd;
            });
            setExTimer(null);
            if(restSecs>0) setRest({secs:restSecs});
          }}
        />}

      <div style={{position:"sticky",top:0,background:T.bg,padding:"14px 0 10px",zIndex:10,borderBottom:`1px solid ${T.border}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div>
            <div style={{fontSize:11,color:T.sub}}>{plan.name} · {day.name}</div>
            <div style={{fontSize:34,fontWeight:900,color:T.accent,fontVariantNumeric:"tabular-nums"}}>{fmt(elapsed)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:T.sub}}>SÄTZE</div>
            <div style={{fontSize:24,fontWeight:800,color:T.text}}>{done}/{total}</div>
          </div>
        </div>
        <PBar value={done} max={total} h={4}/>
        <div style={{fontSize:9,color:T.muted,textAlign:"right",marginTop:3,letterSpacing:0.5}}> automatisch gespeichert</div>
      </div>

      {(()=>{
        // Group consecutive same-eid entries: warmup entries + work entries → one card
        const groups = [];
        day.exercises.forEach((planEx, planExIdx) => {
          const isWU = planEx.isWarmup ||
            (planEx.note||"").toLowerCase().includes("eingewöhnung") ||
            (planEx.note||"").toLowerCase().includes("warm-up") ||
            (planEx.note||"").toLowerCase().includes("warmup");
          const last = groups[groups.length-1];
          if (last && last.eid === planEx.eid) {
            if (isWU) last.warmupEntries.push({planEx, planExIdx});
            else      last.workEntries.push({planEx, planExIdx});
          } else {
            groups.push({
              eid: planEx.eid,
              warmupEntries: isWU ? [{planEx, planExIdx}] : [],
              workEntries:   isWU ? [] : [{planEx, planExIdx}],
            });
          }
        });
        return groups.map((group, gi) => (
          <WorkoutExerciseCard
            key={`group-${gi}-${group.eid}`}
            eid={group.eid}
            warmupEntries={group.warmupEntries}
            workEntries={group.workEntries}
            allExercises={allExercises}
            exerciseOverrides={exerciseOverrides}
            sets={sets}
            toggle={toggle}
            upd={upd}
            addSet={addSet}
            setExTimer={setExTimer}
            exTimer={exTimer}
            settings={settings}
            sessions={sessions}
            onDeloadApplied={()=>setDeloadApplied(true)}
          />
        ));
      })()}

      <div style={{marginTop:16}}><Lbl>NOTIZ</Lbl><Inp value={note} onChange={setNote} placeholder="Wie war das Training?"/></div>

      {warnEmpty && (
        <div style={{marginTop:10,padding:"10px 14px",background:T.red+"22",borderRadius:10,border:`1px solid ${T.red}44`,fontSize:13,color:T.red}}>
          Mindestens einen Satz abhaken bevor du das Training abschließt.
        </div>
      )}

      <Btn onClick={finish} full style={{padding:16,marginTop:14,fontSize:16}}>Training abschließen</Btn>

      {/* Abbrechen – klein und dezent, mit Sicherheitsabfrage */}
      <button
        onClick={() => {
          const ok = window.confirm(
            "Training wirklich abbrechen?\n\nDie aktuelle Einheit wird NICHT gespeichert."
          );
          if (!ok) return;
          clearWorkoutDraft();
          t0Ref.current = null;
          setSets({}); setNote(""); setElapsed(0);
          setPlanId(null); setDayId(null);
          setPhase("select");
        }}
        style={{
          display:"block", width:"100%", marginTop:10,
          background:"none", border:"none", cursor:"pointer",
          color:T.muted, fontSize:12, padding:"8px 0",
          textDecoration:"underline", textUnderlineOffset:3,
        }}
      >
        Training abbrechen
      </button>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// PROGRESS SCREEN  (Punkte 1–5, 9, 10)
// ═══════════════════════════════════════════════════════
const ProgressScreen = ({sessions, plans, cardio, allExercises, exerciseOverrides, settings, onDeleteSession}) => {
  const [view,setView]         = useState("overview");
  const [selEx,setSelEx]       = useState(null);
  const [detailSess,setDetailSess] = useState(null);
  // Collapsible UI states (must be top-level, not inside IIFEs)
  const [showVolChart,  setShowVolChart]  = useState(false);
  const [showAllRecs,   setShowAllRecs]   = useState(false);
  const [showExChart,   setShowExChart]   = useState(false);

  // ── Pre-computed data ─────────────────────────────────
  const usedEids  = useMemo(()=>[...new Set(sessions.flatMap(s=>s.sets.filter(isDone).map(x=>x.eid)))],[sessions]);
  const prs       = useMemo(()=>getPRs(sessions),[sessions]);
  const totalVol  = useMemo(()=>sessions.reduce((s,x)=>s+vol(x.sets),0),[sessions]);
  const weekSets  = useMemo(()=>getWeeklySets(sessions,allExercises,1),[sessions,allExercises]);
  const sets4w    = useMemo(()=>getWeeklySets(sessions,allExercises,4),[sessions,allExercises]);
  const lastTrained=useMemo(()=>getLastTrainedDays(sessions,allExercises),[sessions,allExercises]);
  const summary   = useMemo(()=>buildWeeklySummary(sessions,cardio,allExercises),[sessions,cardio,allExercises]);
  const recs      = useMemo(()=>buildRecommendations(sessions,cardio,allExercises,calcStreak(sessions,cardio)),[sessions,cardio,allExercises]);
  // Progression tab data
  const deloadRec = useMemo(()=>detectDeloadRecommendation(sessions,settings,plans,allExercises),[sessions,settings,plans,allExercises]);
  const progData  = useMemo(()=>{
    if(!sessions||sessions.length<2) return [];
    const ps = getProgressionSettings(settings);
    const strengthEids=[...new Set(
      sessions.flatMap(s=>s.sets.filter(x=>isDone(x)&&(x.weight||0)>0).map(x=>x.eid))
    )];
    return strengthEids.slice(0,12).map(eid=>{
      const ex=(allExercises||[]).find(e=>e.id===eid);
      if(!ex||(ex.unitType&&ex.unitType!=="reps")) return null;
      const planEx={eid, weight:0, sets:3, reps:10};
      // Fix 2: use actual last-known weight so deload suggestion is non-zero
      const history=getExercisePerformanceHistory(canonicalEid(eid), sessions);
      const lastKnownWeight = history.length>0 ? (history[history.length-1].sets[0]?.weight||0) : 0;
      const planExWithWeight = {...planEx, weight: lastKnownWeight};
      const sug=calculateProgressionSuggestion(planExWithWeight,ex,sessions,settings);
      const stag=detectExerciseStagnation(eid,sessions,settings);
      return { eid, name:ex.name, cat:ex.cat, suggestion:sug, stagnation:stag };
    }).filter(Boolean);
  },[sessions,allExercises,settings]);

  // Selected exercise analytics
  const exObj     = useMemo(()=>selEx?(allExercises||[]).find(e=>e.id===selEx):null,[selEx,allExercises]);
  const exUnitType= exObj?.unitType||"reps";
  const isTimeEx  = exUnitType==="secs"||exUnitType==="mins";
  const exHistory = useMemo(()=>selEx?getExHistory(sessions,selEx):[]   ,[sessions,selEx]);
  const timeHist  = useMemo(()=>selEx?getTimeExHistory(sessions,selEx):[] ,[sessions,selEx]);

  // Trend analysis for selected exercise
  const exTrend = useMemo(()=>{
    if (!selEx || exHistory.length < 2) return null;
    const wt = exHistory.map(h=>h.weight);
    const rp = exHistory.map(h=>h.reps);
    const vl = exHistory.map(h=>h.vol);
    const rm = exHistory.map(h=>h.rm1);
    const now30 = exHistory.filter(h=>new Date(h.date)>new Date(Date.now()-30*86400000));
    return {
      weightPct:  pctChange(wt),
      repsPct:    pctChange(rp),
      volPct:     pctChange(vl),
      rm1Pct:     pctChange(rm),
      slope:      calcTrend(wt),
      bestSet:    getBestSet(sessions,canonicalEid(selEx)),
      best1RM:    Math.max(0,...rm),
      last30Sets: now30.length,
      latestWt:   wt[wt.length-1],
      firstWt:    wt[0],
    };
  },[sessions,selEx,exHistory]);

  // Session detail overlay
  if (detailSess) {
    const byEx = {};
    detailSess.sets.filter(isDone).forEach(s=>{if(!byEx[s.eid])byEx[s.eid]=[];byEx[s.eid].push(s);});
    return (
      <div style={{position:"fixed",inset:0,background:T.bg,zIndex:200,overflowY:"auto"}}>
        <div style={{padding:"16px 16px 0",display:"flex",gap:10,alignItems:"center"}}>
          <Btn v="ghost" onClick={()=>setDetailSess(null)} style={{padding:"8px 14px"}}>← Zurück</Btn>
          <div style={{flex:1,fontSize:16,fontWeight:900,color:T.text}}>Trainingsdetails</div>
        </div>
        <div style={{padding:16}}>
          <Card glow style={{marginBottom:12}}>
            <div style={{fontSize:19,fontWeight:900,color:T.accent,marginBottom:4}}>
              {plans.find(p=>p.id===detailSess.planId)?.days.find(d=>d.id===detailSess.dayId)?.name||"Training"}
            </div>
            {detailSess.isDeload&&<Badge color={T.orange} style={{marginBottom:8}}>⬇ Deload</Badge>}
            {detailSess.source&&<Badge color={T.muted} style={{marginBottom:8}}>{detailSess.source} Import</Badge>}
            <div style={{fontSize:12,color:T.sub,marginBottom:12}}>{fmtD(detailSess.date)}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
              {[{l:"DAUER",v:`${detailSess.duration}min`},{l:"SÄTZE",v:detailSess.sets.filter(isDone).length},{l:"VOLUMEN",v:`${(Math.round(vol(detailSess.sets)/100)/10).toFixed(1)}t`}].map(s=>(
                <div key={s.l} style={{textAlign:"center",padding:"10px 6px",background:T.bgAlt,borderRadius:10}}>
                  <div style={{fontSize:18,fontWeight:900,color:T.text}}>{s.v}</div>
                  <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
                </div>
              ))}
            </div>
            {detailSess.note&&<div style={{marginTop:12,padding:"10px 12px",background:T.accentGlow,borderRadius:10,fontSize:12,color:T.accentDim,fontStyle:"italic"}}>"{detailSess.note}"</div>}
          </Card>
          {Object.entries(byEx).map(([eid,exSets])=>{
            const ex=(allExercises||[]).find(e=>e.id===eid);
            const best=Math.max(0,...exSets.map(s=>s.weight||0));
            return (
              <Card key={eid} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:T.text}}>{ex?.name||eid}</div>
                    <div style={{fontSize:11,color:T.sub}}>{ex?.cat}</div>
                  </div>
                  {best>0&&<div style={{fontSize:13,fontWeight:700,color:T.orange}}>{best} kg top</div>}
                </div>
                {exSets.map((s,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:i<exSets.length-1?`1px solid ${T.border}`:"none"}}>
                    <span style={{fontSize:12,color:T.muted}}>Satz {s.setN}</span>
                    <span style={{fontSize:13,fontWeight:700,color:T.text}}>{s.weight>0?`${s.weight} kg × `:""}{s.reps} Wdh</span>
                  </div>
                ))}
              </Card>
            );
          })}
        </div>
      </div>
    );
  }

  // ── Tab bar ─────────────────────────────────────────
  const tabs=[{v:"overview",l:"Woche"},{v:"muscles",l:"Muskeln"},{v:"exercises",l:"Übungen"},{v:"progress",l:"Progression"},{v:"history",l:"Verlauf"}];

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 10px"}}>
        <div style={{fontSize:24,fontWeight:900,color:T.text,marginBottom:12}}>Fortschritt</div>
        <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2}}>
          {tabs.map(b=>(
            <button key={b.v} onClick={()=>setView(b.v)} style={{background:view===b.v?T.accent:T.bgCard,color:view===b.v?"#07070F":T.sub,border:`1px solid ${view===b.v?T.accent:T.border}`,borderRadius:9,padding:"7px 13px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{b.l}</button>
          ))}
        </div>
      </div>

      {/* ── OVERVIEW TAB ─────────────────────────────── */}
      {view==="overview" && (<>
        {/* KPI row */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
          {[
            {l:"DIESE WOCHE",v:summary.sessionCount,c:T.accent},
            {l:"TRAINING MIN",v:summary.weekTime,c:T.blue},
            {l:"CARDIO MIN",v:summary.cardioMin,c:T.green},
          ].map(s=>(
            <Card key={s.l} style={{padding:12,textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:900,color:s.c}}>{s.v}</div>
              <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
            </Card>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          <Card style={{padding:12,textAlign:"center"}}>
            <div style={{fontSize:18,fontWeight:900,color:T.accent}}>{sessions.length}</div>
            <div style={{fontSize:9,color:T.muted,marginTop:2}}>GESAMT KRAFT</div>
          </Card>
          <Card style={{padding:12,textAlign:"center"}}>
            <div style={{fontSize:18,fontWeight:900,color:T.blue}}>{Math.round(totalVol/1000)} t</div>
            <div style={{fontSize:9,color:T.muted,marginTop:2}}>GESAMT VOLUMEN</div>
          </Card>
        </div>

        {/* Volume sparkline – compact */}
        {sessions.length>2 && (
          <Card style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <Lbl>VOLUMEN-VERLAUF</Lbl>
              <button onClick={()=>setShowVolChart(v=>!v)} style={{background:"none",border:"none",cursor:"pointer",fontSize:11,color:T.muted,padding:0}}>
                {showVolChart?"▲":"▼"}
              </button>
            </div>
            {showVolChart&&<LineChart data={sessions.slice(0,8).map(s=>vol(s.sets)).reverse()} color={T.blue} height={60}/>}
          </Card>
        )}

        {/* Weekly summary coach card */}
        <Card style={{marginBottom:12,background:`linear-gradient(135deg,${T.accent}08,${T.bgCard})`}} glow>
          <Lbl color={T.accent}>WOCHEN-COACH</Lbl>
          {summary.topMuscle&&<div style={{fontSize:13,color:T.sub,marginBottom:6}}>
            Meist trainiert: <b style={{color:T.text}}>{summary.topMuscle}</b>
          </div>}
          {summary.neglected.length>0&&<div style={{fontSize:13,color:T.sub,marginBottom:6}}>
            Vernachlässigt: <b style={{color:T.orange}}>{summary.neglected.join(", ")}</b>
          </div>}
          {summary.mobilityMins>0&&<div style={{fontSize:13,color:T.sub,marginBottom:6}}>
            Mobility: <b style={{color:T.teal}}>{summary.mobilityMins} Min</b>
          </div>}
          <div style={{fontSize:12,color:T.muted}}>
            {summary.sessionCount} Training{summary.sessionCount!==1?"s":""}
            {summary.weekTime>0&&` · ${summary.weekTime} Min`}
            {summary.cardioMin>0&&` · ${summary.cardioMin} Min Cardio`}
          </div>
        </Card>

        {/* Recommendations – max 1 visible, rest collapsible */}
        {recs.length>0&&(
          <Card style={{marginBottom:12}}>
            <Lbl color={T.blue}>HINWEIS</Lbl>
            {(showAllRecs ? recs : recs.slice(0,1)).map((r,i)=>(
              <div key={i} style={{fontSize:13,color:T.sub,lineHeight:1.5,padding:"4px 0",
                borderBottom:i<(showAllRecs?recs:recs.slice(0,1)).length-1?`1px solid ${T.border}`:"none"}}>
                {r.text}
              </div>
            ))}
            {recs.length>1&&(
              <button onClick={()=>setShowAllRecs(v=>!v)} style={{
                background:"none",border:"none",cursor:"pointer",
                fontSize:11,color:T.muted,marginTop:6,padding:0,
              }}>
                {showAllRecs ? "Weniger anzeigen ▲" : `${recs.length-1} weitere Hinweise ▼`}
              </button>
            )}
          </Card>
        )}

        {/* PRs overview */}
        {Object.keys(prs).length>0&&(
          <Card style={{marginBottom:12}}>
            <Lbl color={T.orange}>BESTLEISTUNGEN</Lbl>
            {Object.entries(prs).slice(0,5).map(([eid,kg])=>{
              const ex=(allExercises||[]).find(e=>e.id===eid);
              return(
                <div key={eid} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${T.border}`}}>
                  <span style={{fontSize:13,color:T.text}}>{ex?.name||eid}</span>
                  <Badge color={T.orange}>{kg} kg</Badge>
                </div>
              );
            })}
          </Card>
        )}
      </>)}

      {/* ── MUSCLES TAB ──────────────────────────────── */}
      {view==="muscles" && (<>
        {/* Push/Pull */}
        {(()=>{const pp=getPushPullRatio(sets4w);return pp&&(
          <Card style={{marginBottom:12}}>
            <Lbl>PUSH / PULL (4 Wochen)</Lbl>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
              <div style={{flex:pp.push,background:T.accent+"55",borderRadius:6,height:16,minWidth:4}}/>
              <div style={{flex:pp.pull,background:T.blue+"55",borderRadius:6,height:16,minWidth:4}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
              <span style={{color:T.accent}}>Push {pp.push}%</span>
              <span style={{color:T.blue}}>Pull {pp.pull}%</span>
            </div>
          </Card>
        );})()}

        {/* Muscle group bars */}
        <Card style={{marginBottom:12}}>
          <Lbl>SÄTZE PRO MUSKELGRUPPE (diese Woche)</Lbl>
          {Object.entries(MUSCLE_GROUPS).filter(([,mg])=>!mg.mobility&&!mg.legacy).map(([cat,mg])=>{
            const sets=weekSets[cat]||0;
            const status=getMuscleStatus(sets,mg.targetSets);
            const days=lastTrained[cat];
            return(
              <div key={cat} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <div style={{fontSize:13,fontWeight:600,color:T.text}}>{cat}</div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    {status&&<span style={{fontSize:10,color:status.color,fontWeight:700}}>{status.label}</span>}
                    <span style={{fontSize:13,fontWeight:700,color:T.text}}>{sets}</span>
                  </div>
                </div>
                <PBar value={sets} max={mg.targetSets||1} color={status?.color||T.blue} h={6}/>
                {days!==undefined&&(
                  <div style={{fontSize:10,color:T.muted,marginTop:2}}>
                    Zuletzt: {days===0?"heute":days===1?"gestern":`vor ${days} Tagen`}
                    {" · "}{getRecoveryStatus(days).label}
                  </div>
                )}
              </div>
            );
          })}
        </Card>

        {/* Recovery status */}
        <Card style={{marginBottom:12}}>
          <Lbl>REGENERATIONS-STATUS</Lbl>
          {Object.entries(MUSCLE_GROUPS).filter(([,mg])=>!mg.mobility&&!mg.legacy).map(([cat])=>{
            const days=lastTrained[cat];
            if(days===undefined)return null;
            const st=getRecoveryStatus(days);
            return(
              <div key={cat} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${T.border}`}}>
                <span style={{fontSize:13,color:T.text}}>{cat}</span>
                <span style={{fontSize:11,color:st.color,fontWeight:700}}>{st.label}</span>
              </div>
            );
          })}
        </Card>
      </>)}

      {/* ── EXERCISES TAB ────────────────────────────── */}
      {view==="exercises" && (<>
        <Lbl>ÜBUNG WÄHLEN</Lbl>
        <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:12,paddingBottom:2}}>
          {usedEids.map(eid=>{
            const ex=(allExercises||[]).find(e=>e.id===eid);
            if(!ex)return null;
            return(
              <button key={eid} onClick={()=>setSelEx(eid)} style={{background:selEx===eid?T.accent:T.bgCard,color:selEx===eid?"#07070F":T.sub,border:`1px solid ${selEx===eid?T.accent:T.border}`,borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{ex.name}</button>
            );
          })}
        </div>

        {selEx && exObj && (<>
          {/* Exercise header */}
          <Card style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div>
                <div style={{fontSize:16,fontWeight:900,color:T.text}}>{exObj.name}</div>
                <div style={{fontSize:11,color:T.sub}}>{exObj.cat} · {exObj.eq}</div>
              </div>
              {prs[selEx]&&<Badge color={T.orange}>{prs[selEx]} kg</Badge>}
            </div>

            {!isTimeEx && exTrend && (<>
                {/* Top stats – always visible */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:8}}>
                  {[
                    {l:"GEWICHT", v:exTrend.latestWt?`${exTrend.latestWt} kg`:"—", pct:exTrend.weightPct, c:T.accent},
                    {l:"1RM ca.",  v:exTrend.best1RM>0?`${exTrend.best1RM} kg`:"—",   pct:null, c:T.orange},
                    {l:"TREND",    v:exTrend.slope>0.05?"↑":exTrend.slope<-0.05?"↓":"→", pct:exTrend.weightPct, c:exTrend.slope>0.05?T.green:exTrend.slope<-0.05?T.red:T.muted},
                  ].map(s=>(
                    <div key={s.l} style={{textAlign:"center",padding:"9px 4px",background:T.bgAlt,borderRadius:9}}>
                      <div style={{fontSize:14,fontWeight:900,color:s.c}}>{s.v}</div>
                      {s.pct!==null&&s.pct!==0&&(
                        <div style={{fontSize:9,marginTop:1,color:s.pct>0?T.green:T.red,fontWeight:700}}>
                          {s.pct>0?"+":""}{s.pct}%
                        </div>
                      )}
                      <div style={{fontSize:9,color:T.muted,marginTop:1}}>{s.l}</div>
                    </div>
                  ))}
                </div>

                {/* Chart – collapsible */}
                {exHistory.length>1&&(
                  <button onClick={()=>setShowExChart(v=>!v)} style={{
                    background:"none",border:"none",cursor:"pointer",
                    fontSize:11,color:T.muted,padding:"2px 0",marginBottom:showExChart?8:0,
                  }}>
                    {showExChart ? "Verlauf ausblenden ▲" : "Gewichtsverlauf anzeigen ▼"}
                  </button>
                )}
                {showExChart && exHistory.length>1&&(
                  <LineChart data={exHistory.map(h=>h.weight)} color={T.accent} height={72}/>
                )}
              </>)}

            {/* Time exercise analysis (Punkt 5) */}
            {isTimeEx && timeHist.length>0&&(<>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                {[
                  {l:"BEST",     v:fmtRepsVal(Math.max(...timeHist.map(h=>h.reps)),exUnitType),c:T.green},
                  {l:"Ø DAUER",  v:fmtRepsVal(Math.round(timeHist.reduce((a,h)=>a+h.reps,0)/timeHist.length),exUnitType),c:T.blue},
                ].map(s=>(
                  <div key={s.l} style={{textAlign:"center",padding:"10px 6px",background:T.bgAlt,borderRadius:10}}>
                    <div style={{fontSize:16,fontWeight:900,color:s.c}}>{s.v}</div>
                    <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
                  </div>
                ))}
              </div>
              {timeHist.length>1&&(<>
                <Lbl>VERLAUF</Lbl>
                <LineChart data={timeHist.map(h=>h.reps)} color={T.teal} height={72}/>
                {(()=>{const pc=pctChange(timeHist.map(h=>h.reps));return pc!==null&&(
                  <div style={{fontSize:12,color:pc>0?T.green:T.muted,marginTop:6,fontWeight:700}}>
                    {pc>0?`↑ +${pc}% verbessert`:`→ ${pc}% verändert`} seit Beginn
                  </div>
                );})()}
              </>)}
            </>)}
          </Card>
        </>)}

        {!selEx&&usedEids.length>0&&(
          <div style={{textAlign:"center",padding:"30px 0",color:T.muted,fontSize:13}}>Übung antippen um Analyse zu sehen</div>
        )}
        {usedEids.length===0&&(
          <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16}}>Noch keine Trainingsdaten.</div>
        )}
      </>)}

      {/* ── PROGRESSION TAB ─────────────────────────── */}
      {view==="progress" && (<>
        {/* Deload recommendation */}
        {deloadRec&&(
          <Card style={{marginBottom:12,background:T.orange+"12",border:`1px solid ${T.orange}44`}}>
            <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
              <span style={{fontSize:22}}>"⬇"</span>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:800,color:T.orange,marginBottom:4}}>
                  {deloadRec.urgency==="active" ? "Deload aktiv" : "Entlastung empfohlen"}
                </div>
                <div style={{fontSize:12,color:T.sub,lineHeight:1.5}}>{deloadRec.reason}</div>
                {deloadRec.urgency==="stagnation" && deloadRec.stagnatingCount > 0 && (
                  <div style={{fontSize:11,color:T.orange,marginTop:4,fontWeight:700}}>
                    {deloadRec.stagnatingCount} Übungen zeigen keine Steigerung
                  </div>
                )}
                {deloadRec.urgency !== "active" && (
                  <div style={{fontSize:11,color:T.muted,marginTop:4}}>
                    Nächste Einheit mit reduziertem Gewicht oder weniger Sätzen trainieren
                  </div>
                )}
              </div>
            </div>
          </Card>
        )}
        {!deloadRec&&(
          <Card style={{marginBottom:12,background:T.teal+"12",border:`1px solid ${T.teal}44`}}>
            <div style={{fontSize:13,color:T.teal,fontWeight:700}}>Keine Entlastung nötig</div>
            <div style={{fontSize:11,color:T.sub,marginTop:2}}>Trainingsbelastung im grünen Bereich</div>
          </Card>
        )}

        {/* Per-exercise progression cards */}
        {progData.length===0&&(
          <div style={{textAlign:"center",padding:"30px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16}}>
            Noch zu wenig Trainingsdaten für Vorschläge.
          </div>
        )}
        {progData.map(item=>{
          const sug=item.suggestion;
          if(!sug) return null;
          const col=sug.isDeload?T.orange:sug.action==="increase"?T.green:T.sub;
          return(
            <Card key={item.eid} style={{marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:700,color:T.text}}>{item.name}</div>
                  <div style={{fontSize:11,color:T.sub,marginBottom:4}}>{item.cat}</div>
                  <div style={{fontSize:12,color:col,fontWeight:700}}>{sug.reason}</div>
                  {sug.action==="increase"&&(
                    <div style={{fontSize:11,color:T.green,marginTop:2}}>→ {sug.suggestedWeight} kg empfohlen</div>
                  )}
                  {sug.isDeload&&(
                    <div style={{fontSize:11,color:T.orange,marginTop:2}}>
                      {sug.suggestedWeight>0&&`→ ${sug.suggestedWeight} kg`}
                      {sug.suggestedSets!=null&&` · ${sug.suggestedSets} Sätze`}
                    </div>
                  )}
                </div>
                <Badge color={col} style={{flexShrink:0,marginTop:2}}>
                  {sug.isDeload?"Deload":sug.action==="increase"?"↑ Plus":"Halten"}
                </Badge>
              </div>
              {item.stagnation?.stagnating&&(
                <div style={{fontSize:10,color:T.muted,marginTop:4,borderTop:`1px solid ${T.border}`,paddingTop:4}}>
                  Keine Steigerung seit {item.stagnation.sessionsChecked} Einheiten
                </div>
              )}
            </Card>
          );
        })}
      </>)}

      {/* ── HISTORY TAB ──────────────────────────────── */}
      {view==="history" && (<>
        <Lbl>ALLE TRAININGS ({sessions.length})</Lbl>
        {sessions.length===0&&(
          <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16,fontSize:14}}>Noch keine Trainings.</div>
        )}
        {sessions.map(sess=>{
          const v=vol(sess.sets);
          const dn=(sess.isDeload?"⬇ ":"")+(plans.find(p=>p.id===sess.planId)?.days.find(d=>d.id===sess.dayId)?.name||"Training");
          return(
            <Card key={sess.id} style={{marginBottom:8,padding:0,overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"stretch"}}>
                <div onClick={()=>setDetailSess(sess)} style={{flex:1,padding:"12px 14px",cursor:"pointer"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div>
                      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:2}}>
                        <div style={{fontSize:14,fontWeight:700,color:T.text}}>{dn}</div>
                        {sess.source&&<Badge color={T.orange}>{sess.source}</Badge>}
                      </div>
                      <div style={{fontSize:12,color:T.sub}}>{fmtD(sess.date)}</div>
                      <div style={{fontSize:11,color:T.muted,marginTop:3}}>{sess.sets.filter(isDone).length} Sätze · {sess.duration} min</div>
                    </div>
                    <div style={{textAlign:"right",marginLeft:12}}>
                      <div style={{fontSize:15,fontWeight:800,color:T.accent}}>{Math.round(v).toLocaleString()} kg</div>
                      <div style={{fontSize:10,color:T.muted}}>Details →</div>
                    </div>
                  </div>
                </div>
                <button
                  onClick={e=>{e.stopPropagation();if(window.confirm(`"${dn}" wirklich löschen?`))onDeleteSession(sess.id);}}
                  style={{background:T.red+"18",border:"none",borderLeft:`1px solid ${T.red}33`,cursor:"pointer",padding:"0 16px",color:T.red,fontSize:18,flexShrink:0,borderRadius:"0 18px 18px 0"}}
                >Löschen</button>
              </div>
            </Card>
          );
        })}
      </>)}
    </div>
  );
};


// ═══════════════════════════════════════════════════════
// BODY SCREEN
// ═══════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════
// BODY SCREEN  (Punkt 6 – erweiterte Körperdaten)
// ═══════════════════════════════════════════════════════
// Metric fields definition (reused in form + history)
const BODY_FIELDS = [
  { key:"weight",         label:"Gewicht",        unit:"kg", primary:true  },
  { key:"waist",          label:"Taille",         unit:"cm" },
  { key:"chest",          label:"Brust",          unit:"cm" },
  { key:"armLeft",        label:"Oberarm L",      unit:"cm" },
  { key:"armRight",       label:"Oberarm R",      unit:"cm" },
  { key:"hips",           label:"Hüfte",          unit:"cm" },
  { key:"thighLeft",      label:"Oberschenkel L", unit:"cm" },
  { key:"thighRight",     label:"Oberschenkel R", unit:"cm" },
  { key:"calfLeft",       label:"Wade L",         unit:"cm" },
  { key:"calfRight",      label:"Wade R",         unit:"cm" },
  { key:"bodyFat",        label:"Körperfett",     unit:"%"  },
];

const BodyScreen = ({metrics, settings, onSaveMetric, onUpdateSettings}) => {
  const blankForm = () => Object.fromEntries(BODY_FIELDS.map(f=>[f.key,""]));
  const [form, setForm]   = useState(blankForm);
  const [showAll, setShowAll] = useState(false);
  const [goalW, setGoalW] = useState(settings.weightGoal!=null?String(settings.weightGoal):"");
  const [selField, setSelField] = useState("weight");

  const latest = metrics[metrics.length-1] || {};
  const first  = metrics[0] || {};

  const save = () => {
    const w = parseFloat(form.weight);
    if (!w || w <= 0) return;
    const entry = { id:uid(), date:new Date().toISOString() };
    BODY_FIELDS.forEach(f=>{
      const v = parseFloat(form[f.key]);
      if (!isNaN(v) && v>0) entry[f.key]=v;
    });
    onSaveMetric(entry);
    onUpdateSettings({bodyWeight:w});
    setForm(blankForm());
  };

  const setF = (key,val) => setForm(p=>({...p,[key]:val}));

  // Diff for a field between first and latest entry
  const diff = key => {
    const l = latest[key], f = first[key];
    // Fix 7: use == null instead of !l so value 0 is handled correctly
    if (l == null || f == null || l === f) return null;
    const d = (l - f).toFixed(1);
    return { d, pos: parseFloat(d) > 0 };
  };

  const histData = useMemo(()=>
    [...metrics].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(m=>m[selField]||0).filter(v=>v>0),
    [metrics,selField]
  );

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px",fontSize:24,fontWeight:900,color:T.text}}>Körperdaten</div>

      {/* Quick stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
        {[
          {l:"GEWICHT",v:latest.weight?`${latest.weight} kg`:"—",c:T.accent},
          {l:"ZIEL",    v:settings.weightGoal!=null?`${settings.weightGoal} kg`:"—",c:T.blue},
          {l:"DIFF",    v:(()=>{const d=diff("weight");return d?`${d.pos?"+":""}${d.d} kg`:"—";})(),
                        c:(()=>{const d=diff("weight");return !d?T.muted:d.pos?T.orange:T.green;})()},
        ].map(s=>(
          <Card key={s.l} style={{padding:12,textAlign:"center"}}>
            <div style={{fontSize:16,fontWeight:900,color:s.c}}>{s.v}</div>
            <div style={{fontSize:9,color:T.muted,marginTop:2}}>{s.l}</div>
          </Card>
        ))}
      </div>

      {/* Chart for selected field */}
      {metrics.length>1&&(
        <Card style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <Lbl>{BODY_FIELDS.find(f=>f.key===selField)?.label.toUpperCase()} VERLAUF</Lbl>
            <select value={selField} onChange={e=>setSelField(e.target.value)}
              style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,padding:"4px 8px",color:T.text,fontSize:12,cursor:"pointer"}}>
              {BODY_FIELDS.filter(f=>metrics.some(m=>m[f.key])).map(f=>(
                <option key={f.key} value={f.key}>{f.label}</option>
              ))}
            </select>
          </div>
          {histData.length>1
            ? <LineChart data={histData} color={T.accent} height={88}/>
            : <div style={{fontSize:12,color:T.muted,textAlign:"center",padding:"16px 0"}}>Zu wenig Daten für diese Messung.</div>}
          {(()=>{const d=diff(selField);return d&&(
            <div style={{fontSize:12,marginTop:6,color:d.pos?T.orange:T.green,fontWeight:700}}>
              {d.pos?"↑":"↓"} {Math.abs(d.d)} {BODY_FIELDS.find(f=>f.key===selField)?.unit} seit Beginn
            </div>
          );})()}
        </Card>
      )}

      {/* New entry form */}
      <Card style={{marginBottom:12}}>
        <Lbl>NEUER EINTRAG</Lbl>
        {/* Primary: weight always visible */}
        <div style={{marginBottom:8}}>
          <Lbl>Gewicht (kg) *</Lbl>
          <Inp value={form.weight} onChange={v=>setF("weight",v)} placeholder="80.5" type="number"/>
        </div>
        {/* Optional fields – toggle */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
          {BODY_FIELDS.filter(f=>!f.primary).slice(0,showAll?undefined:3).map(f=>(
            <div key={f.key}>
              <Lbl>{f.label} ({f.unit})</Lbl>
              <Inp value={form[f.key]} onChange={v=>setF(f.key,v)} placeholder="0" type="number"/>
            </div>
          ))}
        </div>
        <button onClick={()=>setShowAll(s=>!s)}
          style={{background:"none",border:"none",cursor:"pointer",color:T.blue,fontSize:12,marginBottom:10,padding:0}}>
          {showAll?"▲ Weniger Felder":"▼ Mehr Felder..."}
        </button>
        <Btn onClick={save} disabled={!form.weight} full>Eintrag speichern</Btn>
      </Card>

      {/* Goal weight */}
      <Card style={{marginBottom:12}}>
        <Lbl>ZIELGEWICHT</Lbl>
        <div style={{display:"flex",gap:8}}>
          <Inp value={goalW} onChange={setGoalW} placeholder="75" type="number" style={{flex:1}}/>
          <Btn onClick={()=>{const g=parseFloat(goalW);if(g>0)onUpdateSettings({weightGoal:g});}} style={{padding:"10px 18px"}}>Setzen</Btn>
        </div>
      </Card>

      {/* Latest measurements overview */}
      {metrics.length>0&&(
        <Card style={{marginBottom:12}}>
          <Lbl>AKTUELLE MASSE</Lbl>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
            {BODY_FIELDS.filter(f=>latest[f.key]).map(f=>{
              const d=diff(f.key);
              return(
                <div key={f.key} style={{padding:"8px 10px",background:T.bgAlt,borderRadius:8}}>
                  <div style={{fontSize:10,color:T.muted,marginBottom:2}}>{f.label}</div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:14,fontWeight:700,color:T.text}}>{latest[f.key]} {f.unit}</span>
                    {d&&<span style={{fontSize:10,fontWeight:700,color:d.pos?T.orange:T.green}}>{d.pos?"+":""}{d.d}</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </Card>
      )}

      {/* History */}
      {metrics.length>0&&(
        <Card>
          <Lbl>VERLAUF</Lbl>
          {[...metrics].reverse().slice(0,8).map(m=>(
            <div key={m.id} style={{padding:"8px 0",borderBottom:`1px solid ${T.border}`}}>
              <div style={{fontSize:11,color:T.sub,marginBottom:4}}>{fmtD(m.date)}</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {BODY_FIELDS.filter(f=>m[f.key]).map(f=>(
                  <span key={f.key} style={{fontSize:12,color:T.text,background:T.bgAlt,padding:"2px 8px",borderRadius:6}}>
                    {f.label}: <b>{m[f.key]}</b> {f.unit}
                  </span>
                ))}
              </div>
            </div>
          ))}
        </Card>
      )}
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// BADGE UNLOCK OVERLAY  (Punkt 8)
// ═══════════════════════════════════════════════════════
const BadgeUnlockOverlay = ({badges, onClose}) => {
  const [idx, setIdx] = useState(0);
  if (!badges||badges.length===0) return null;
  const b = badges[idx];
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(7,7,15,0.92)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:400,backdropFilter:"blur(10px)"}}>
      <div style={{background:T.bgCard,borderRadius:24,padding:"32px 24px",maxWidth:320,width:"calc(100% - 48px)",textAlign:"center",border:`2px solid ${T.gold}55`,boxShadow:`0 0 60px ${T.gold}22`}}>
        <div style={{fontSize:11,color:T.gold,fontWeight:800,letterSpacing:2,marginBottom:16}}>NEUES ACHIEVEMENT</div>
        <div style={{fontSize:64,marginBottom:12}}>{b.icon}</div>
        <div style={{fontSize:22,fontWeight:900,color:T.gold,marginBottom:8}}>{b.name}</div>
        <div style={{fontSize:14,color:T.sub,lineHeight:1.6,marginBottom:24}}>{b.desc}</div>

        {/* Pagination dots */}
        {badges.length>1&&(
          <div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:16}}>
            {badges.map((_,i)=>(
              <div key={i} style={{width:i===idx?16:7,height:7,borderRadius:99,background:i===idx?T.gold:T.border,transition:"all 0.3s",cursor:"pointer"}}
                onClick={()=>setIdx(i)}/>
            ))}
          </div>
        )}

        {idx<badges.length-1
          ? <Btn onClick={()=>setIdx(i=>i+1)} full v="gold" style={{marginBottom:8}}>Weiter →</Btn>
          : <Btn onClick={onClose} full v="gold">Abschließen</Btn>
        }
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// ACHIEVEMENTS SCREEN  (Punkt 7)
// ═══════════════════════════════════════════════════════
const AchievementsScreen = ({sessions, metrics, streak, cardio, allExercises=[]}) => {
  const achievements = useMemo(
    ()=>calcAchievements(sessions,metrics,streak,cardio,allExercises),
    [sessions,metrics,streak,cardio,allExercises]
  );
  const unlocked = achievements.filter(a=>a.unlocked);
  const locked   = achievements.filter(a=>!a.unlocked);

  // Group by category
  const cats=[...new Set(ACHIEVEMENT_DEFS.map(a=>a.cat))];

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px"}}>
        <div style={{fontSize:24,fontWeight:900,color:T.text}}>Achievements</div>
        <div style={{fontSize:13,color:T.sub,marginTop:4}}>{unlocked.length}/{achievements.length} freigeschaltet</div>
      </div>
      <Card style={{marginBottom:14}}>
        <PBar value={unlocked.length} max={achievements.length} color={T.gold}/>
        <div style={{fontSize:11,color:T.muted,marginTop:6}}>{Math.round(unlocked.length/achievements.length*100)}% abgeschlossen</div>
      </Card>

      {cats.map(cat=>{
        const catAch=achievements.filter(a=>a.cat===cat);
        const catUnlocked=catAch.filter(a=>a.unlocked);
        if(catAch.length===0)return null;
        return(
          <div key={cat} style={{marginBottom:14}}>
            <Lbl color={catUnlocked.length===catAch.length?T.gold:T.muted}>
              {cat.toUpperCase()} {catUnlocked.length}/{catAch.length}
            </Lbl>
            {catAch.map(a=>(
              <div key={a.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:T.bgCard,borderRadius:12,marginBottom:6,border:`1px solid ${a.unlocked?T.gold+"44":T.border}`,opacity:a.unlocked?1:0.5}}>
                <span style={{fontSize:26,filter:a.unlocked?"none":"grayscale(1)"}}>{a.icon}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700,color:a.unlocked?T.gold:T.sub}}>{a.name}</div>
                  <div style={{fontSize:11,color:T.muted,marginTop:1}}>{a.desc}</div>
                </div>
                {a.unlocked?<span style={{color:T.gold,fontSize:14}}>✓</span>:<span style={{color:T.muted,fontSize:12}}>–</span>}
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
};


// ═══════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════
const DashboardScreen = ({sessions, plans, metrics, settings, cardio, streak, achievements, allExercises, onStartWorkout, onGoTo}) => {
  const {sessions:weekS, cardio:weekC} = useMemo(()=>getWeekActivities(sessions,cardio),[sessions,cardio]);
  const weekGoal      = settings.weeklyGoal||3;
  const lastSession   = sessions[0];
  const lastCardio    = cardio[0];
  const totalActivity = weekS.length + weekC.length;
  const newAchCount   = achievements.filter(a=>a.unlocked).length;
  const newAchLatest  = achievements.filter(a=>a.unlocked).slice(-1)[0];

  const DAYS     = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  const todayISO = (new Date().getDay()||7)-1;
  const isoDay   = d => { const wd=new Date(d).getDay(); return (wd||7)-1; };

  return (
    <div style={{padding:"0 16px 24px"}}>
      {/* Header */}
      <div style={{padding:"20px 0 14px"}}>
        <div style={{fontSize:12,color:T.muted,marginBottom:2}}>
          {new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}
        </div>
        <div style={{fontSize:24,fontWeight:900,color:T.text}}>{settings.name||"Athlet"}</div>
      </div>

      {/* Nächstes Training – primäre Aktion */}
      {(()=>{
        const rec = getNextABRecommendation(plans, sessions);
        if (!rec) return (
          <Btn onClick={onStartWorkout} full style={{padding:"15px 8px",fontSize:15,borderRadius:14,marginBottom:12}}>Training starten</Btn>
        );
        return (
          <Card style={{marginBottom:12, background:`linear-gradient(135deg,${T.accent}10,${T.bgCard})`, border:`1px solid ${T.accent}44`}}
            onClick={()=>onGoTo("workout")}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:10,color:T.accent,fontWeight:800,letterSpacing:0.5,marginBottom:3}}>NÄCHSTES TRAINING</div>
                <div style={{fontSize:18,fontWeight:900,color:T.text,marginBottom:1}}>{rec.dayName}</div>
                <div style={{fontSize:11,color:T.muted}}>{rec.planName}</div>
              </div>
              <div style={{background:T.accent,color:"#07070F",borderRadius:10,padding:"9px 16px",fontSize:14,fontWeight:800,flexShrink:0}}>Starten</div>
            </div>
          </Card>
        );
      })()}

      {/* Woche – Kalender + Zähler */}
      <Card glow={totalActivity>=weekGoal} style={{marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}>
          <Lbl>DIESE WOCHE</Lbl>
          <div style={{fontSize:18,fontWeight:900,color:T.text}}>
            {totalActivity}<span style={{color:T.muted,fontSize:12,fontWeight:400}}> / {weekGoal}</span>
          </div>
        </div>
        <div style={{display:"flex",gap:3,marginBottom:6}}>
          {DAYS.map((d,i)=>{
            const hasS=weekS.some(s=>isoDay(s.date)===i);
            const hasC=weekC.some(c=>isoDay(c.date)===i);
            return (
              <div key={d} style={{
                flex:1,height:24,borderRadius:5,
                background:hasS?T.accent:hasC?T.green:todayISO===i?T.accentGlow:T.bgInput,
                border:`1px solid ${hasS?T.accent:hasC?T.green:todayISO===i?T.accentDim:T.border}`,
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:7,fontWeight:800,
                color:hasS?"#07070F":hasC?"#07070F":todayISO===i?T.accent:T.muted,
              }}>{d}</div>
            );
          })}
        </div>
        <PBar value={totalActivity} max={weekGoal} h={3}/>
        {totalActivity>=weekGoal&&<div style={{marginTop:5,fontSize:11,color:T.accent,fontWeight:700}}>Wochenziel erreicht</div>}
      </Card>

      {/* Letztes Training */}
      {lastSession && (
        <Card style={{marginBottom:8}} onClick={()=>onGoTo("progress")}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <Lbl>LETZTES TRAINING</Lbl>
              <div style={{fontSize:14,fontWeight:700,color:T.text,marginTop:2}}>
                {plans.find(p=>p.id===lastSession.planId)?.days.find(d=>d.id===lastSession.dayId)?.name||"Training"}
              </div>
              <div style={{fontSize:11,color:T.muted,marginTop:1}}>
                {lastSession.sets.filter(isDone).length} Sätze · {lastSession.duration} min · {(Math.round(vol(lastSession.sets)/100)/10).toFixed(1)} t
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:11,color:T.muted}}>{fmtDShort(lastSession.date)}</div>
              {lastSession.isDeload&&<Badge color={T.orange} style={{marginTop:4}}>Deload</Badge>}
            </div>
          </div>
        </Card>
      )}

      {/* Schnellstart Cardio */}
      {lastCardio && (
        <Card style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <Lbl>LETZTE CARDIO</Lbl>
              <div style={{fontSize:13,fontWeight:600,color:T.text,marginTop:2}}>
                {lastCardio.type} · {lastCardio.duration} min{lastCardio.distance?` · ${lastCardio.distance} km`:""}
              </div>
            </div>
            <div style={{fontSize:11,color:T.muted}}>{fmtDShort(lastCardio.date)}</div>
          </div>
        </Card>
      )}

      {/* Quick-Actions */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        <Btn onClick={onStartWorkout} style={{padding:"11px 8px",fontSize:13,borderRadius:12}}>Kraft</Btn>
        <Btn v="teal" onClick={()=>onGoTo("cardio")} style={{padding:"11px 8px",fontSize:13,borderRadius:12}}>Cardio</Btn>
      </div>

      {/* Diese Woche: Minuten + Volumen */}
      {(()=>{
        const weekMinutes = weekS.reduce((s,x)=>s+(x.duration||0),0);
        const weekVol     = weekS.reduce((s,x)=>s+vol(x.sets||[]),0);
        return (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            <Card style={{padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:26,fontWeight:900,color:T.blue,lineHeight:1}}>{weekMinutes}</div>
              <div style={{fontSize:9,color:T.muted,marginTop:4,letterSpacing:1}}>MIN DIESE WOCHE</div>
            </Card>
            <Card style={{padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:26,fontWeight:900,color:T.teal,lineHeight:1}}>
                {weekVol>=1000?(weekVol/1000).toFixed(1)+"t":Math.round(weekVol)+"kg"}
              </div>
              <div style={{fontSize:9,color:T.muted,marginTop:4,letterSpacing:1}}>VOLUMEN DIESE WOCHE</div>
            </Card>
          </div>
        );
      })()}

      {/* Trainings-Insights */}
      {(()=>{
        if (weekS.length === 0) return null;

        // ── 1. Stärkste Übung: best weight improvement vs. previous week ──
        const prevWeekCutoff = new Date(); prevWeekCutoff.setDate(prevWeekCutoff.getDate()-14);
        const thisWeekCutoff = new Date(); thisWeekCutoff.setDate(thisWeekCutoff.getDate()-7);

        const prevSessions = sessions.filter(s =>
          !s.isDeload &&
          new Date(s.date) >= prevWeekCutoff &&
          new Date(s.date) < thisWeekCutoff
        );

        // Best weight per exercise in each period
        const bestOf = sessArr => {
          const best = {};
          sessArr.forEach(s => s.sets.forEach(x => {
            if (!isDone(x) || isWarmupSet(x) || (x.weight||0)<=0) return;
            const cid = canonicalEid(x.eid);
            if (!best[cid] || x.weight > best[cid]) best[cid] = x.weight;
          }));
          return best;
        };

        const thisWeekBest = bestOf(weekS);
        const prevWeekBest = bestOf(prevSessions);

        // Find biggest improvement
        let topImprove = null;
        Object.entries(thisWeekBest).forEach(([cid, wt]) => {
          const prev = prevWeekBest[cid];
          if (!prev || wt <= prev) return;
          const diff = wt - prev;
          if (!topImprove || diff > topImprove.diff) {
            const exName = (allExercises||[]).find(e=>e.id===cid)?.name || cid;
            topImprove = { name: exName, diff, wt };
          }
        });

        // ── 2. Volumen vs. Vorwoche ──────────────────────────────────────
        const thisVol = weekS.reduce((s,x)=>s+vol(x.sets||[]),0);
        const prevVol = prevSessions.reduce((s,x)=>s+vol(x.sets||[]),0);
        const volPct  = prevVol > 0 ? Math.round((thisVol - prevVol) / prevVol * 100) : null;

        return (
          <Card style={{marginBottom:0}}>
            <Lbl>TRAININGS-INSIGHTS</Lbl>
            {/* Stärkste Übung */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              paddingBottom:volPct!==null?"10px 0":0,
              borderBottom:volPct!==null?`1px solid ${T.border}`:"none",
              marginBottom:volPct!==null?10:0}}>
              <div>
                <div style={{fontSize:11,color:T.muted,marginBottom:2}}>Stärkste Übung</div>
                {topImprove ? (
                  <div style={{fontSize:13,fontWeight:700,color:T.text}}>{topImprove.name}</div>
                ) : (
                  <div style={{fontSize:12,color:T.muted}}>Noch keine neue Bestleistung</div>
                )}
              </div>
              {topImprove && (
                <div style={{fontSize:15,fontWeight:900,color:T.green}}>+{topImprove.diff} kg</div>
              )}
            </div>
            {/* Volumen vs. Vorwoche */}
            {volPct !== null && (
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:11,color:T.muted}}>Volumen vs. Vorwoche</div>
                <div style={{
                  fontSize:15,fontWeight:900,
                  color: volPct > 0 ? T.green : volPct < -5 ? T.orange : T.muted
                }}>
                  {volPct > 0 ? "+" : ""}{volPct}%
                </div>
              </div>
            )}
          </Card>
        );
      })()}
    </div>
  );
};

// SETTINGS SCREEN – with full backup / import / restore
// ═══════════════════════════════════════════════════════
const SettingsScreen = ({
  settings, onUpdate,
  sessions, metrics, plans, cardio,
  customExercises, exerciseOverrides,
  onReset, onImport,
}) => {
  const [weekGoal,setWeekGoal] = useState(String(settings.weeklyGoal||3));
  const [confirmReset,setConfirmReset] = useState(false);
  const [importStatus,setImportStatus] = useState(null); // null | "ok" | "error" | string
  const importRef = useRef(null);

  // ── Cloud-Sync state ──────────────────────────────────
  const [syncUrl,   setSyncUrl]   = useState(() => ftSync.getCfg()?.url   || "https://app-sync.scorti1989.workers.dev");
  const [syncToken, setSyncToken] = useState(() => ftSync.getCfg()?.token || "");
  const [syncMsg,   setSyncMsg]   = useState(null);   // {text, error}
  const [syncBusy,  setSyncBusy]  = useState(false);
  const [syncMeta,  setSyncMeta]  = useState(() => ftSync.getMeta());

  useEffect(() => {
    const off = ftSync.onStatus((text, error) => {
      setSyncMsg({ text, error: !!error });
      setSyncMeta(ftSync.getMeta());
    });
    return off;
  }, []);

  const saveSyncCfg = () => {
    ftSync.setCfg({ url: syncUrl.trim(), token: syncToken.trim() });
    setSyncMsg({ text: "Konfiguration gespeichert", error: false });
  };

  const runSyncNow = async () => {
    ftSync.setCfg({ url: syncUrl.trim(), token: syncToken.trim() });
    setSyncBusy(true);
    setSyncMsg({ text: "Abgleich läuft…", error: false });
    try {
      const r = await ftSync.run({
        onApplied: () => { window.location.reload(); },
      });
      setSyncMeta(ftSync.getMeta());
      if (r?.error) setSyncMsg({ text: r.error, error: true });
    } catch (e) {
      setSyncMsg({ text: e?.message || "Sync fehlgeschlagen", error: true });
    } finally {
      setSyncBusy(false);
    }
  };

  // ── Snapshot-Browser: alte Tagesstände einsehen & wiederherstellen ──────
  const [snapList,    setSnapList]    = useState(null);   // null = nicht geladen, [] = geladen leer, [...] = Daten
  const [snapBusy,    setSnapBusy]    = useState(false);
  const [snapDetails, setSnapDetails] = useState({});     // { "2026-07-29": {sessions:12, latestDate:"..."} }
  const [snapMsg,     setSnapMsg]     = useState(null);

  const loadSnapshotList = async () => {
    ftSync.setCfg({ url: syncUrl.trim(), token: syncToken.trim() });
    setSnapBusy(true);
    setSnapMsg(null);
    try {
      const days = await ftSync.listSnapshots();
      const sorted = [...days].sort((a,b)=> b.localeCompare(a)); // neueste zuerst
      setSnapList(sorted);
      // Aktuellen Stand (heute, ohne &snap=) auch mit auflisten
      const currentCount = (sessions||[]).length;
      setSnapDetails(prev => ({ ...prev, __current: { sessions: currentCount } }));
    } catch (e) {
      setSnapMsg({ text: e?.message || "Snapshot-Liste konnte nicht geladen werden", error: true });
    } finally {
      setSnapBusy(false);
    }
  };

  const inspectSnapshot = async day => {
    if (snapDetails[day]) return; // schon geladen
    try {
      const data = await ftSync.pull(day);
      if (data?.empty) {
        setSnapDetails(prev => ({ ...prev, [day]: { sessions: 0, empty: true } }));
        return;
      }
      const sess = data?.sessions || [];
      const dates = sess.map(s=>s.date).sort();
      setSnapDetails(prev => ({
        ...prev,
        [day]: {
          sessions: sess.length,
          firstDate: dates[0] || null,
          lastDate:  dates[dates.length-1] || null,
        },
      }));
    } catch (e) {
      setSnapDetails(prev => ({ ...prev, [day]: { error: e?.message || "Fehler" } }));
    }
  };

  // Merge-Helfer: Sessions/Cardio anhand von id (Fallback: date+planId+Satzanzahl) dedupliziert zusammenführen
  const mergeById = (existing, incoming, idKey="id") => {
    const map = new Map();
    (existing||[]).forEach(item => {
      const key = item[idKey] || `${item.date}__${item.planId||""}__${(item.sets||[]).length}`;
      map.set(key, item);
    });
    (incoming||[]).forEach(item => {
      const key = item[idKey] || `${item.date}__${item.planId||""}__${(item.sets||[]).length}`;
      // Bei Konflikt: den mit mehr abgehakten Sätzen behalten (vollständigeres Training gewinnt)
      const prev = map.get(key);
      if (!prev) { map.set(key, item); return; }
      const prevDone = (prev.sets||[]).filter(s=>s.done).length;
      const newDone  = (item.sets||[]).filter(s=>s.done).length;
      if (newDone > prevDone) map.set(key, item);
    });
    return [...map.values()].sort((a,b)=>new Date(b.date)-new Date(a.date));
  };

  const restoreSnapshot = async day => {
    if (!window.confirm(
      `Snapshot vom ${day} in den aktuellen Stand einfügen?\n\n` +
      "Trainings aus diesem Snapshot werden zu deinen bestehenden Trainings HINZUGEFÜGT.\n" +
      "Bereits vorhandene Trainings (gleiches Datum) bleiben unverändert oder werden " +
      "durch die vollständigere Version ersetzt. Nichts wird gelöscht."
    )) return;
    setSnapBusy(true);
    try {
      const data = await ftSync.pull(day);
      if (!data || data.empty) {
        setSnapMsg({ text: "Dieser Snapshot ist leer.", error: true });
        return;
      }
      const mergedSessions = mergeById(sessions, data.sessions||[]);
      const mergedCardio   = mergeById(cardio,   data.cardio||[]);
      const added = mergedSessions.length - (sessions||[]).length;
      const imported = {
        settings:          settings,
        sessions:          mergedSessions,
        cardio:            mergedCardio,
        plans:              plans,
        metrics:           metrics,
        customExercises:   customExercises,
        exerciseOverrides: exerciseOverrides,
      };
      onImport(imported);
      setSnapMsg({
        text: added > 0
          ? `${added} Training${added===1?"":"s"} aus dem ${day}-Snapshot hinzugefügt. Insgesamt jetzt ${mergedSessions.length} Trainings.`
          : `Keine neuen Trainings in diesem Snapshot – alles bereits vorhanden.`,
        error: false,
      });
    } catch (e) {
      setSnapMsg({ text: e?.message || "Zusammenführen fehlgeschlagen", error: true });
    } finally {
      setSnapBusy(false);
    }
  };

  // Alle 60 Tages-Snapshots durchgehen und alles zusammenführen (Vollständig-Wiederherstellung)
  const mergeAllSnapshots = async () => {
    if (!snapList || !snapList.length) return;
    if (!window.confirm(
      `Alle ${snapList.length} gespeicherten Tagesstände durchsuchen und fehlende Trainings ergänzen?\n\n` +
      "Das kann einige Sekunden dauern. Nichts wird gelöscht, nur ergänzt."
    )) return;
    setSnapBusy(true);
    setSnapMsg({ text: "Durchsuche alle Snapshots…", error: false });
    try {
      let runningSessions = sessions || [];
      let runningCardio   = cardio   || [];
      let scanned = 0;

      // Zuerst den AKTUELLEN Server-Stand einbeziehen (ohne &snap=) –
      // der kann Trainings enthalten, die noch nicht in einem Tages-Snapshot
      // gesichert wurden (z.B. Trainings von heute/kürzlich).
      try {
        const current = await ftSync.pull();
        if (current && !current.empty) {
          runningSessions = mergeById(runningSessions, current.sessions||[]);
          runningCardio   = mergeById(runningCardio,   current.cardio||[]);
        }
      } catch(_) { /* aktueller Stand nicht erreichbar – Snapshots trotzdem durchsuchen */ }

      for (const day of snapList) {
        try {
          const data = await ftSync.pull(day);
          if (data && !data.empty) {
            runningSessions = mergeById(runningSessions, data.sessions||[]);
            runningCardio   = mergeById(runningCardio,   data.cardio||[]);
          }
        } catch(_) { /* einzelner Snapshot-Fehler stoppt den Gesamtlauf nicht */ }
        scanned++;
        setSnapMsg({ text: `Durchsuche Snapshots… (${scanned}/${snapList.length})`, error: false });
      }
      const added = runningSessions.length - (sessions||[]).length;
      onImport({
        settings, plans, metrics, customExercises, exerciseOverrides,
        sessions: runningSessions,
        cardio:   runningCardio,
      });
      setSnapMsg({
        text: added > 0
          ? `Fertig: ${added} fehlende Training${added===1?"":"s"} aus ${snapList.length} Snapshots ergänzt. Insgesamt jetzt ${runningSessions.length} Trainings.`
          : `Fertig: alle ${snapList.length} Snapshots durchsucht, keine fehlenden Trainings gefunden.`,
        error: false,
      });
    } catch (e) {
      setSnapMsg({ text: e?.message || "Zusammenführen fehlgeschlagen", error: true });
    } finally {
      setSnapBusy(false);
    }
  };

  const totalVol = useMemo(()=>sessions.reduce((s,x)=>s+vol(x.sets),0),[sessions]);
  const streak   = useMemo(()=>calcStreak(sessions,cardio),[sessions,cardio]);

          settings:          (typeof raw.settings === "object" && raw.settings) ? raw.settings : {},
          sessions:          Array.isArray(raw.sessions)   ? raw.sessions   : [],
          cardio:            Array.isArray(raw.cardio)     ? raw.cardio     : [],

          exerciseOverrides: (typeof raw.exerciseOverrides === "object" && raw.exerciseOverrides) ? raw.exerciseOverrides : {},
        };

        // Sanity: sessions need id + date + sets
        const validSessions = imported.sessions.filter(s => s?.id && s?.date && Array.isArray(s?.sets));
        if (imported.sessions.length !== validSessions.length) {
          console.warn(`FitTrack import: ${imported.sessions.length - validSessions.length} ungültige Sessions übersprungen`);
        }
        imported.sessions = validSessions;

      }

  };

    try {
      let total = 0;
      for(const k of Object.keys(localStorage)) {
        if (k.startsWith(LS_PREFIX)) total += (localStorage.getItem(k)||"").length;
      }
      return (total / 1024).toFixed(1);
    } catch { return "?"; }
  })();
