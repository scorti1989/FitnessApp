const CARDIO_TYPES=["Joggen","Spazieren","Radfahren","Schwimmen","HIIT","Anderes"];

const CARDIO_MET={Joggen:9.8,Spazieren:3.5,Radfahren:7.5,Schwimmen:8.0,HIIT:12.0,Anderes:5.0};

const uid     = () => `${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
// Unique key per plan-exercise instance (fixes duplicate-exercise bug)
// Exercise ID aliases – duplicate exercises that should aggregate together
const CANONICAL_EID = {
  "e38": "e13",  // Latziehen zur Brust → Lat Pulldown (gleiche Übung)
  "e39": "e14",  // Rudern Seilzug eng  → Sitzrudern (sehr ähnlich, gleiche Muskeln)
};
// Resolve canonical ID for analytics (so old sessions with e38/e39 still count)
const canonicalEid = id => CANONICAL_EID[id] || id;

// Format: "eid__planIndex" e.g. "e36__0" and "e36__4" for warmup vs. worksets
const instKey = (eid, idx) => `${eid}__${idx}`;

// Central warmup-set guard used by all analytics.
// Returns true when a set should be EXCLUDED from strength analysis.
function isWarmupSet(set) {
  if (!set) return false;
  if (set.isWarmup) return true;
  const note = (set.planNote || set.note || '').toLowerCase();
  return note.includes('eingewöhnung') || note.includes('warm-up') || note.includes('warmup') || note.includes('warm');
}

// Central work-set guard: done, has weight, not warmup.
function isWorkSet(set) {
  return isDone(set) && (set.weight || 0) > 0 && !isWarmupSet(set);
}
const fmt     = s  => `${Math.floor(s/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;
const fmtD    = d  => new Date(d).toLocaleDateString("de-DE",{day:"numeric",month:"short",year:"numeric"});
const fmtDShort=d  => new Date(d).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
const dayKey  = d  => new Date(d).toDateString();

// [FIX 3] Zentrale ISO-Wochenfunktion (Montag-Start), genutzt überall
function isoWeekKey(date) {
  const dt = new Date(date);
  // ISO: Wochentag 1=Mo..7=So
  const dayOfWeek = dt.getDay() || 7;
  // Donnerstag dieser Woche → bestimmt das Jahr
  dt.setDate(dt.getDate() + 4 - dayOfWeek);
  const year = dt.getFullYear();
  const jan4 = new Date(year, 0, 4);
  const weekNum = Math.ceil(((dt - jan4) / 86400000 + 1) / 7);
  return `${year}-W${String(weekNum).padStart(2,"0")}`;
}

const isDone = s => s.done !== false;

// vol() sums weight×reps for strength sets only (weight>0 = rep-based)
// Time exercises have weight=0 so they contribute 0 naturally, but
// we explicitly guard to make intent clear.
const vol = sets => (Array.isArray(sets) ? sets : [])
  .filter(x => isDone(x) && (x.weight||0) > 0 && !isWarmupSet(x))
  .reduce((sum, x) => sum + (x.weight||0) * (x.reps||0), 0);

const calcKcal = (type, durationMin, bodyWeightKg) =>
  Math.round((CARDIO_MET[type]||5) * ((bodyWeightKg||75)/60) * (durationMin/60) * 60);

function calcStreak(sessions, cardio=[]) {
  const allDates = [...sessions.map(s=>s.date), ...cardio.map(c=>c.date)];
  if (!allDates.length) return 0;
  const days = [...new Set(allDates.map(d=>dayKey(d)))].sort((a,b)=>new Date(b)-new Date(a));
  let streak=0, cur=new Date(); cur.setHours(0,0,0,0);
  for (const d of days) {
    const dd=new Date(d); dd.setHours(0,0,0,0);
    if (Math.round((cur-dd)/86400000) <= 1) { streak++; cur=dd; } else break;
  }
  return streak;
}

// [FIX 3] Wochenstart Montag (DE/ISO)
function getWeekActivities(sessions, cardio=[]) {
  const now = new Date();
  const dow = now.getDay(); // 0=So
  const daysFromMon = dow === 0 ? 6 : dow - 1;
  const ws = new Date(now);
  ws.setDate(now.getDate() - daysFromMon);
  ws.setHours(0,0,0,0);
  return {
    sessions: sessions.filter(s => new Date(s.date) >= ws),
    cardio:   cardio.filter(c => new Date(c.date) >= ws),
  };
}

// [FIX 2] getPRs – nur done===true Sätze mit Gewicht > 0
function getPRs(sessions) {
  const p = {};
  (sessions||[]).filter(s => !s.isDeload).forEach(s => s.sets.forEach(x => {
    if (!isWorkSet(x)) return;
    const ceid = canonicalEid(x.eid);
    if (!p[ceid] || x.weight > p[ceid]) p[ceid] = x.weight;
  }));
  return p;
}

// Resolve muscle contribution for one set (primary +1, secondary +0.5)
// Returns { [muscleName]: weightedCount }
function getMuscleContribution(eid, allExercises) {
  const profile = MUSCLE_PROFILE[canonicalEid(eid)];
  if (profile) {
    const result = {};
    (profile.primary||[]).forEach(m => { result[m] = (result[m]||0) + 1.0; });
    (profile.secondary||[]).forEach(m => { result[m] = (result[m]||0) + 0.5; });
    return result;
  }
  // Fallback: use exercise cat as primary
  const cat = (allExercises||[]).find(e=>e.id===eid)?.cat;
  if (cat && MUSCLE_GROUPS[cat]) return { [cat]: 1.0 };
  return {};
}

// Estimated 1RM using Epley formula
function calc1RM(weight, reps) {
  if (!weight || weight <= 0 || !reps || reps <= 0) return 0;
  return +(weight * (1 + reps / 30)).toFixed(1);
}

// Get all strength (weight>0, non-time) history for one exercise
function getExHistory(sessions, eid) {
  const rows = [];
  const lookupEids = new Set([eid, ...Object.entries(CANONICAL_EID)
    .filter(([,v]) => v === eid).map(([k]) => k)]);
  (sessions||[]).filter(s => !s.isDeload).forEach(s => {
    s.sets.filter(x => isWorkSet(x) && lookupEids.has(x.eid)).forEach(x => {
      rows.push({ date:s.date, weight:x.weight, reps:x.reps,
                  vol:x.weight*x.reps, rm1:calc1RM(x.weight,x.reps) });
    });
  });
  return rows.sort((a,b)=>new Date(a.date)-new Date(b.date));
}

// Get time-exercise history (unitType secs/mins) for one exercise
function getTimeExHistory(sessions, eid) {
  const rows = [];
  sessions.forEach(s => {
    s.sets.filter(x => isDone(x) && x.eid===eid && x.reps>0 && (!x.weight||x.weight===0)).forEach(x => {
      rows.push({ date:s.date, reps:x.reps });
    });
  });
  return rows.sort((a,b)=>new Date(a.date)-new Date(b.date));
}

// Linear trend slope (positive = improving)
function calcTrend(values) {
  if (values.length < 2) return 0;
  const n = values.length;
  const xMean = (n-1)/2;
  const yMean = values.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  values.forEach((y,x)=>{ num+=(x-xMean)*(y-yMean); den+=(x-xMean)**2; });
  return den===0 ? 0 : num/den;
}

// % change between first and last value
function pctChange(arr) {
  if (arr.length < 2 || arr[0]===0) return null;
  return +((arr[arr.length-1]-arr[0])/arr[0]*100).toFixed(1);
}

// Best set for an exercise
function getBestSet(sessions, eid) {
  let best = null;
  const lookupEids = new Set([eid, ...Object.entries(CANONICAL_EID)
    .filter(([,v]) => v === eid).map(([k]) => k)]);
  (sessions||[]).filter(s => !s.isDeload).forEach(s =>
    s.sets.filter(x => isWorkSet(x) && lookupEids.has(x.eid)).forEach(x => {
      if (!best || x.weight > best.weight) best = {...x, eid, date:s.date};
    })
  );
  return best;
}

// Weekly set count per muscle group (last N weeks, default 1).
// Uses getMuscleContribution so primary muscles get +1.0 and secondary get +0.5 per set.
function getWeeklySets(sessions, allExercises, weeksBack=1) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - weeksBack*7);
  const counts = {};
  Object.keys(MUSCLE_GROUPS).forEach(k => { counts[k]=0; });
  sessions
    .filter(s => new Date(s.date) >= cutoff && !s.isDeload)
    .forEach(s => s.sets.filter(x => isDone(x) && !isWarmupSet(x)).forEach(x => {
      const contrib = getMuscleContribution(x.eid, allExercises);
      Object.entries(contrib).forEach(([muscle, weight]) => {
        if (counts[muscle] !== undefined) counts[muscle] += weight;
      });
    }));
  return counts;
}

// Muscle status label
function getMuscleStatus(sets, target) {
  if (target===0) return null;
  const ratio = sets/target;
  if (ratio >= 1.4) return { label:"Sehr hoch", color:T.orange };
  if (ratio >= 0.8) return { label:"Optimal",   color:T.green  };
  if (ratio >= 0.4) return { label:"Niedrig",   color:T.blue   };
  return               { label:"Vernachlässigt",color:T.red    };
}

// Push/Pull ratios. Trizeps counts toward Push, Bizeps toward Pull.
function getPushPullRatio(sets) {
  const push = (sets.Brust||0) + (sets.Schultern||0) + (sets.Trizeps||0);
  const pull = (sets.Rücken||0) + (sets.Bizeps||0);
  const total = push+pull;
  if (total===0) return null;
  return { push:+(push/total*100).toFixed(0), pull:+(pull/total*100).toFixed(0) };
}

// Days since each muscle group was last trained.
// Uses getMuscleContribution: a muscle is considered trained if it received
// any contribution (primary or secondary) from a completed work set.
function getLastTrainedDays(sessions, allExercises) {
  const last = {};
  [...sessions]
    .sort((a,b)=>new Date(b.date)-new Date(a.date))
    .forEach(s => {
      const d = Math.floor((Date.now()-new Date(s.date))/86400000);
      s.sets.filter(x => isDone(x) && !isWarmupSet(x)).forEach(x => {
        const contrib = getMuscleContribution(x.eid, allExercises);
        Object.keys(contrib).forEach(muscle => {
          if (last[muscle] === undefined) last[muscle] = d;
        });
      });
    });
  return last;
}

// Recovery status per muscle group
function getRecoveryStatus(daysSince) {
  if (daysSince === undefined) return { label:"Nicht trainiert", color:T.muted };
  if (daysSince < 1) return { label:"Heute trainiert – erholen",  color:T.orange };
  if (daysSince < 2) return { label:"Gestern – Erholung läuft",   color:T.blue   };
  if (daysSince < 4) return { label:"Bereit für nächste Einheit", color:T.green  };
  return                    { label:"Lange nicht trainiert",       color:T.red    };
}

// Weekly summary: volume, sessions, top muscle, records, cardio time
function buildWeeklySummary(sessions, cardio, allExercises) {
  const { sessions:ws, cardio:wc } = getWeekActivities(sessions, cardio);
  const weekVol   = ws.reduce((s,x)=>s+vol(x.sets),0);
  const weekTime  = ws.reduce((s,x)=>s+(x.duration||0),0);
  const cardioMin = wc.reduce((s,c)=>s+(c.duration||0),0);
  const setCounts = getWeeklySets(sessions, allExercises, 1);
  const topMuscle = Object.entries(setCounts)
    .filter(([k])=>MUSCLE_GROUPS[k]&&!MUSCLE_GROUPS[k].mobility&&!MUSCLE_GROUPS[k].legacy)
    .sort((a,b)=>b[1]-a[1])[0];
  const neglected = Object.entries(setCounts)
    .filter(([k,v])=>MUSCLE_GROUPS[k]&&!MUSCLE_GROUPS[k].mobility&&!MUSCLE_GROUPS[k].legacy&&MUSCLE_GROUPS[k].targetSets>0&&v===0)
    .map(([k])=>k);
  const mobilityMins = ws.reduce((s,sess)=>{
    return s + sess.sets.filter(isDone).reduce((a,x)=>{
      const ex=(allExercises||[]).find(e=>e.id===x.eid);
      if(ex?.cat==="Dehnung"||ex?.cat==="Aufwärmen") return a+(x.reps||0);
      return a;
    },0);
  },0) / 60; // Fix 4: divide ONCE after outer reduce (secs→mins)
  return { weekVol, weekTime, cardioMin, topMuscle:topMuscle?.[0]||null,
           neglected, mobilityMins:+mobilityMins.toFixed(1),
           sessionCount:ws.length };
}

// Motivational recommendations (Punkt 10)
function buildRecommendations(sessions, cardio, allExercises, streak) {
  const tips = [];
  const sets4w = getWeeklySets(sessions, allExercises, 4);
  const { sessions:ws } = getWeekActivities(sessions, cardio);

  // Muscle imbalance
  const pushSets  = (sets4w.Brust||0)+(sets4w.Schultern||0);
  const pullSets  = sets4w.Rücken||0;
  if (pushSets > pullSets*1.5 && pullSets > 0)
    tips.push({ icon:"!", text:"Du trainierst Push-Muskeln deutlich mehr als Pull. Mehr Rückenübungen wären ausgewogen." });
  else if (pullSets > pushSets*1.5 && pushSets > 0)
    tips.push({ icon:"!", text:"Viel Rücken-Training – mehr Brust/Schulter würde das Gleichgewicht verbessern." });

  if ((sets4w.Beine||0) === 0 && sessions.length > 3)
    tips.push({ icon:"–", text:"Beine wurden kaum trainiert. Ein Bein-Tag würde die Balance deutlich verbessern." });

  if (streak >= 7)
    tips.push({ icon:"↑", text:`${streak} Tage Serie – Ausnahme Konsistenz! Weiter so.` });
  else if (streak >= 3)
    tips.push({ icon:"↑", text:`${streak} Tage am Stück – starker Start. Dranbleiben!` });

  if (ws.length >= 4)
    tips.push({ icon:"✓", text:"Sehr gute Woche – Wochenziel bereits erreicht oder übertroffen." });

  const cardioMin = cardio.filter(c=>{
    const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-7);
    return new Date(c.date)>=cutoff;
  }).reduce((s,c)=>s+(c.duration||0),0);
  if (cardioMin >= 90)
    tips.push({ icon:"↺", text:`${cardioMin} Minuten Cardio diese Woche – top Ausdauerarbeit.` });
  else if (cardioMin === 0 && sessions.length > 2)
    tips.push({ icon:"–", text:"Kein Cardio diese Woche. Schon 20 Minuten verbessern Regeneration und Ausdauer." });

  if (tips.length === 0)
    tips.push({ icon:"✓", text:"Starke Trainingsbasis. Bleib konstant und steigere das Gewicht schrittweise." });

  return tips.slice(0,4);
}

// Newly unlocked badges (for overlay after session save)
function getNewlyUnlockedBadges(prevSessions, newSessions, metrics, streak, cardio, allDefs, allExercises=[]) {
  const before = new Set(allDefs.filter(a=>a.check(prevSessions,metrics,streak,cardio,allExercises)).map(a=>a.id));
  return allDefs.filter(a=>!before.has(a.id) && a.check(newSessions,metrics,streak,cardio,allExercises));
}

// ═══════════════════════════════════════════════════════
// PROGRESSION & DELOAD HELPERS
// ═══════════════════════════════════════════════════════

// Return merged progressionSettings with safe defaults
function getProgressionSettings(settings) {
  return {
    ...DEFAULT_SETTINGS.progressionSettings,
    ...(settings?.progressionSettings || {}),
    defaultRepRange: {
      ...DEFAULT_SETTINGS.progressionSettings.defaultRepRange,
      ...(settings?.progressionSettings?.defaultRepRange || {}),
    },
    incrementRules: {
      ...DEFAULT_SETTINGS.progressionSettings.incrementRules,
      ...(settings?.progressionSettings?.incrementRules || {}),
    },
  };
}

// Weight increment for an exercise based on its equipment
function getIncrementForExercise(exercise, settings) {
  const ps = getProgressionSettings(settings);
  const eq = exercise?.eq || "";
  if (eq === "Maschine")      return ps.incrementRules.machine;
  if (eq === "Kabel")         return ps.incrementRules.cable;
  if (eq === "Kurzhantel")    return ps.incrementRules.dumbbell;
  if (eq === "Langhantel")    return ps.incrementRules.barbell;
  if (eq === "Körpergewicht") return ps.incrementRules.bodyweight;
  return ps.incrementRules.default;
}

// Rep range for a given plan exercise (uses plan override or global settings)
function getRepRangeForPlanExercise(planExercise, settings) {
  const ps = getProgressionSettings(settings);
  return {
    min: planExercise?.repRangeMin ?? ps.defaultRepRange.min,
    max: planExercise?.repRangeMax ?? ps.defaultRepRange.max,
  };
}

// Round weight to nearest increment (e.g. 41.3 → 41.5 for 2.5 increment)
function roundWeight(weight, increment) {
  if (!increment || increment <= 0) return weight;
  return Math.round(weight / increment) * increment;
}

// Apply deload percentage to a weight
function applyDeloadToWeight(weight, settings, exercise) {
  const ps = getProgressionSettings(settings);
  if (!weight || weight <= 0) return 0;
  const factor = 1 - (ps.deloadPercent / 100);
  // Use device-specific increment when exercise is provided, else fall back to default
  const inc = exercise
    ? getIncrementForExercise(exercise, settings)
    : (ps.incrementRules?.default || 2.5);
  return roundWeight(weight * factor, inc);
}

// Central set-reduction for deload strategy "sets" and "both"
// Returns new set count, minimum 1.
function applyDeloadToSets(originalSets, reductionPercent) {
  if (!originalSets || originalSets < 1) return 1;
  const reduced = Math.floor(originalSets * (1 - reductionPercent / 100));
  return Math.max(1, reduced);
}

// Start a deload: sets lastDeloadDate + activeDeloadUntil in settings
// Returns the partial settings update to pass to onUpdate
function startDeload(settings) {
  const now = new Date();
  const until = new Date(now);
  until.setDate(until.getDate() + 7);
  return {
    lastDeloadDate:    now.toISOString(),
    activeDeloadUntil: until.toISOString(),
  };
}

// End a deload early
function endDeload() {
  return {
    activeDeloadUntil: null,
  };
}

// Is a deload currently active?
function isDeloadActive(settings) {
  if (!settings?.activeDeloadUntil) return false;
  return new Date(settings.activeDeloadUntil) > new Date();
}

// How many days remain in an active deload (0 if none)
function deloadDaysRemaining(settings) {
  if (!isDeloadActive(settings)) return 0;
  const ms = new Date(settings.activeDeloadUntil) - new Date();
  return Math.max(0, Math.ceil(ms / 86400000));
}

// Get strength history for one exercise – EXCLUDES warmup sets.
// Warmup detection (two independent guards – both must be absent to include a set):
//   1. planNote contains "eingewöhnung" or "warm" (copied from planEx.note in start())
//   2. Old sessions without planNote: sets whose weight is clearly the lowest weight
//      for that exercise in the same session are treated as warmup (heuristic).
function getExercisePerformanceHistory(eid, sessions) {
  if (!eid || !sessions?.length) return [];
  // Also include sessions where sets were recorded under alias IDs (e.g. e38 → e13)
  const lookupEids = new Set([eid, ...Object.entries(CANONICAL_EID)
    .filter(([,v]) => v === eid).map(([k]) => k)]);
  const history = [];

  [...sessions]
    .filter(sess => !sess.isDeload)
    .sort((a,b) => new Date(a.date) - new Date(b.date))
    .forEach(sess => {
      const allEidSets = sess.sets.filter(s =>
        isDone(s) && lookupEids.has(s.eid) && (s.weight||0) > 0
      );
      if (!allEidSets.length) return;

      // Use central isWarmupSet guard; fall back to weight-heuristic for old sessions
      const weights = [...new Set(allEidSets.map(s => s.weight))].sort((a,b)=>a-b);
      const minWeight = weights[0];
      const hasMultipleWeights = weights.length > 1;

      const workSets = allEidSets.filter(s => {
        if (isWarmupSet(s)) return false;
        if (hasMultipleWeights && s.weight === minWeight) return false;
        return true;
      });

      if (workSets.length > 0) {
        history.push({
          date: sess.date,
          sets: workSets.map(s => ({ weight:s.weight, reps:s.reps||0 })),
        });
      }
    });

  return history;
}

// Returns the most recent WORK sets (warmups excluded) for an exercise across ALL sessions.
// Plan-independent: works for any plan, so switching plans still picks up last real values.
function getLastWorkSets(eid, sessions) {
  if (!eid || !sessions?.length) return null;
  const lookupEids = new Set([eid, ...Object.entries(CANONICAL_EID)
    .filter(([,v]) => v === eid).map(([k]) => k)]);
  const sorted = [...sessions]
    .filter(sess => !sess.isDeload)
    .sort((a,b) => new Date(b.date) - new Date(a.date));
  for (const sess of sorted) {
    const allEid = (sess.sets||[]).filter(s => lookupEids.has(s.eid) && (s.weight||0) > 0);
    if (!allEid.length) continue;
    const weights = [...new Set(allEid.map(s=>s.weight))].sort((a,b)=>a-b);
    const minW    = weights[0];
    const multi   = weights.length > 1;
    const work = allEid.filter(s => {
      if (isWarmupSet(s)) return false;
      if (multi && s.weight === minW) return false;
      return true;
    });
    if (work.length) return work;
  }
  return null;
}

// Core algorithm: calculate progression suggestion for one exercise
// Returns: { action, suggestedWeight, suggestedReps, reason, isDeload, confidence }
function calculateProgressionSuggestion(planExercise, exercise, sessions, settings) {
  const ps = getProgressionSettings(settings);
  if (!ps.enabled) return null;

  const unitType = exercise?.unitType || "reps";
  // Only for strength (rep-based) exercises
  if (unitType !== "reps") return null;
  // Skip bodyweight exercises (increment = 0)
  const increment = getIncrementForExercise(exercise, settings);
  const repRange  = getRepRangeForPlanExercise(planExercise, settings);
  const eid       = planExercise?.eid;
  if (!eid) return null;
  const ceid = canonicalEid(eid);

  const history = getExercisePerformanceHistory(ceid, sessions);
  if (history.length < (ps.minSessionsBeforeSuggestion || 2)) return null;

  // Check if deload is active
  if (isDeloadActive(settings) && ps.deloadEnabled) {
    const strategy   = ps.deloadStrategy || "weight";
    // Use last known weight from history if planExercise.weight is 0
    const history_   = getExercisePerformanceHistory(eid, sessions);
    const baseWeight = (planExercise?.weight || 0) > 0
      ? planExercise.weight
      : (history_.length > 0 ? (history_[history_.length-1].sets[0]?.weight || 0) : 0);
    const deloadWt   = (strategy === "sets")
      ? baseWeight                                        // sets strategy: weight unchanged
      : applyDeloadToWeight(baseWeight, settings, exercise);        // weight / both: reduce weight
    const deloadSets = (strategy === "weight")
      ? (planExercise?.sets || 3)                         // weight strategy: sets unchanged
      : applyDeloadToSets(planExercise?.sets || 3, ps.volumeDeloadPercent || 30);
    const strategyLabel =
      strategy === "weight" ? `-${ps.deloadPercent}% Gewicht` :
      strategy === "sets"   ? `-${ps.volumeDeloadPercent}% Sätze` :
                              `-${ps.deloadPercent}% Gewicht & weniger Sätze`;
    return {
      action:          "deload",
      suggestedWeight: deloadWt,
      suggestedReps:   repRange.min,
      suggestedSets:   deloadSets,
      reason:          `Entlastungswoche aktiv – ${strategyLabel}`,
      isDeload:        true,
      confidence:      "high",
    };
  }

  // Last session's work sets for this exercise
  const lastSession = history[history.length - 1];
  const lastSets    = lastSession.sets;
  if (!lastSets.length) return null;

  const lastWeight = lastSets[0].weight;
  const minReps    = Math.min(...lastSets.map(s => s.reps));
  const avgReps    = lastSets.reduce((a,s)=>a+s.reps,0) / lastSets.length;

  // Check stagnation (last 2–3 sessions same or declining weight)
  const stagnation = detectExerciseStagnation(ceid, sessions, settings);

  // ── DELOAD recommendation based on stagnation ──────────────
  if (stagnation?.stagnating && ps.deloadEnabled && ps.autoDeloadOnStagnation) {
    const strategy_  = ps.deloadStrategy || "weight";
    const deloadWt_  = strategy_ === "sets"
      ? lastWeight
      : (applyDeloadToWeight(lastWeight, settings, exercise) || lastWeight);
    const deloadSets_= strategy_ === "weight"
      ? (planExercise?.sets || 3)
      : applyDeloadToSets(planExercise?.sets || 3, ps.volumeDeloadPercent || 30);
    return {
      action:          "deload",
      suggestedWeight: deloadWt_,
      suggestedReps:   repRange.min,
      suggestedSets:   deloadSets_,
      reason:          "Leichte Woche empfohlen – frisch wieder einsteigen",
      isDeload:        true,
      confidence:      "medium",
    };
  }

  // ── PROGRESSION logic by mode ───────────────────────────────
  const mode = ps.mode || "normal";
  let readyToProgress = false;

  if (mode === "conservative") {
    // All sets must reach the upper rep range target
    readyToProgress = minReps >= repRange.max;
  } else if (mode === "aggressive") {
    // Most sets (≥ 60%) at or above lower rep range target
    const setsAboveMin = lastSets.filter(s => s.reps >= repRange.min).length;
    readyToProgress = setsAboveMin / lastSets.length >= 0.6 && avgReps >= repRange.min;
  } else {
    // normal: average reps ≥ upper range, minimum reps ≥ lower range
    readyToProgress = avgReps >= repRange.max && minReps >= repRange.min;
  }

  if (readyToProgress && increment > 0) {
    const newWeight = roundWeight(lastWeight + increment, increment);
    return {
      action:          "increase",
      suggestedWeight: newWeight,
      suggestedReps:   repRange.min,
      reason:          `Zielbereich erreicht – +${increment} kg bereit`,
      isDeload:        false,
      confidence:      "high",
    };
  }

  // Not ready to progress and not stagnating → no suggestion needed
  return null;
}

// Detect stagnation for ONE exercise over the last 3 sessions.
// Only counts work sets (warmup-filtered by getExercisePerformanceHistory).
// An exercise stagnates when:
//   – weight has not increased over 3 sessions, AND
//   – minimum reps per session have not increased (or have declined)
function detectExerciseStagnation(eid, sessions, settings) {
  const history = getExercisePerformanceHistory(canonicalEid(eid), sessions);
  if (history.length < 3) return { stagnating: false };
  const last3   = history.slice(-3);
  const weights = last3.map(h => h.sets[0]?.weight || 0);
  const minReps = last3.map(h => Math.min(...(h.sets||[]).map(s => s.reps || 0)));
  // Weight not higher than 3 sessions ago AND reps not improving
  const noWeightProgress = weights[2] <= weights[0];
  const noRepProgress    = minReps[2] <= minReps[0];
  return {
    stagnating:      noWeightProgress && noRepProgress,
    sessionsChecked: last3.length,
    weightTrend:     weights[2] - weights[0],
    repTrend:        minReps[2] - minReps[0],
  };
}

// Detect global stagnation: how many main exercises are stagnating?
// "Main" = strength exercises that have at least 3 sessions of work-set history.
// Returns { stagnatingCount, total, stagnatingEids }
function detectGlobalStagnation(plans, sessions, allExercises, settings) {
  if (!plans?.length || !sessions?.length) return { stagnatingCount: 0, total: 0 };

  // Collect unique eids from active plan exercises (non-warmup, non-time, with weight)
  const seenEids = new Set();
  for (const plan of plans) {
    if (plan.archived) continue;
    for (const day of (plan.days || [])) {
      for (const ex of (day.exercises || [])) {
        if (ex.isWarmup) continue;
        const fullEx = (allExercises || []).find(e => e.id === ex.eid);
        if (!fullEx) continue;
        const ut = fullEx.unitType;
        // Skip time-based and reps-only (no weight). undefined/"reps+kg" = normal strength
        if (ut === "secs" || ut === "mins" || ut === "reps") continue;
        seenEids.add(ex.eid);
      }
    }
  }

  let stagnatingCount = 0;
  const stagnatingEids = [];
  for (const eid of seenEids) {
    const hist = getExercisePerformanceHistory(canonicalEid(eid), sessions);
    if (hist.length < 3) continue;
    const result = detectExerciseStagnation(canonicalEid(eid), sessions, settings);
    if (result.stagnating) {
      stagnatingCount++;
      stagnatingEids.push(eid);
    }
  }

  return { stagnatingCount, total: seenEids.size, stagnatingEids };
}

// Detect whether a global deload is recommended.
// Priority:
//   1. Active deload → always confirm
//   2. Scheduled deload (only when scheduledDeloadEnabled === true)
//   3. Stagnation-based deload (when autoDeloadOnStagnation === true and ≥2 exercises stagnate)
function detectDeloadRecommendation(sessions, settings, plans, allExercises) {
  const ps = getProgressionSettings(settings);
  if (!ps.deloadEnabled) return null;

  // 1. Already in active deload
  if (isDeloadActive(settings)) {
    const daysLeft = deloadDaysRemaining(settings);
    return {
      recommend: true,
      reason:    `Aktiver Deload – noch ${daysLeft} ${daysLeft === 1 ? "Tag" : "Tage"}.`,
      urgency:   "active",
    };
  }

  // 2. Scheduled deload – only when explicitly enabled
  if (ps.scheduledDeloadEnabled) {
    const now = Date.now();
    if (settings?.lastDeloadDate) {
      const weeksSince = (now - new Date(settings.lastDeloadDate)) / (7 * 86400000);
      if (weeksSince >= ps.deloadEveryWeeks) {
        return {
          recommend: true,
          reason:    `${Math.round(weeksSince)} Wochen seit letzter Entlastung – planmäßige Deload-Woche.`,
          urgency:   "scheduled",
        };
      }
    }
  }

  // 3. Stagnation-based deload
  if (ps.autoDeloadOnStagnation && plans?.length && allExercises?.length) {
    const global = detectGlobalStagnation(plans, sessions, allExercises, settings);
    if (global.stagnatingCount >= 2) {
      return {
        recommend: true,
        reason:    "Deload empfohlen: Mehrere Hauptübungen stagnieren. Eine leichte Woche mit ca. 15\u202f% weniger Gewicht oder 30\u202f% weniger Sätzen kann helfen.",
        urgency:   "stagnation",
        stagnatingCount: global.stagnatingCount,
      };
    }
  }

  return null;
}

// A/B-Rotation: find the recommended next plan+day based on last session
// Works for any set of active plans, not just hardcoded pg_ab
function getNextABRecommendation(plans, sessions) {
  const activePlans = (plans||[]).filter(p => !p.archived);
  if (!activePlans.length) return null;

  // Collect all plan+day combinations
  const slots = [];
  for (const plan of activePlans) {
    for (const day of (plan.days||[])) {
      slots.push({ planId: plan.id, dayId: day.id, planName: plan.name, dayName: day.name });
    }
  }
  if (!slots.length) return null;
  if (slots.length === 1) return slots[0]; // only one option

  // Find the last session that matches any slot
  const sortedSessions = [...(sessions||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const lastMatch = sortedSessions.find(s =>
    slots.some(sl => sl.planId === s.planId && sl.dayId === s.dayId)
  );
  if (!lastMatch) return slots[0]; // no history – start with first

  // Find the slot after the last one used
  const lastIdx = slots.findIndex(sl => sl.planId===lastMatch.planId && sl.dayId===lastMatch.dayId);
  const nextIdx = (lastIdx + 1) % slots.length;
  return slots[nextIdx];
}

  }));
}

// Default = "reps".  Warm-up/Dehnung use "secs" or special.
const UNIT_LABELS = { reps:"Wdh", secs:"Sek", mins:"Min" };

function getUnitType(eid, allExercises) {
  const ex = allExercises?.find(e=>e.id===eid);
  if (!ex) return "reps";
  return ex.unitType || "reps";
}

// Format a reps/time value for display
function fmtRepsVal(val, unitType) {
  if (!val && val !== 0) return "—";
  switch(unitType) {
    case "secs": return `${val} Sek`;
    case "mins": return `${val} Min`;
    default:     return `${val} Wdh`;
  }
}

// Label for the field in WorkoutScreen
function repsFieldLabel(unitType) {
  return UNIT_LABELS[unitType] || "Wdh";
}

// Helper: return default rest (secs) for an exercise based on settings rules
function getDefaultRestForExercise(exercise, settings) {
  const rules = { ...DEFAULT_SETTINGS.restRules, ...(settings?.restRules || {}) };
  if (!exercise) return rules.default;
  const cat = exercise.cat || "";
  const eq  = exercise.eq  || "";
  if (cat === "Aufwärmen") return rules.warmup;
  if (cat === "Dehnung")   return rules.stretching;
  if (eq  === "Maschine")  return rules.machine;
  if (eq  === "Kabel")     return rules.cable;
  if (eq  === "Kurzhantel")return rules.dumbbell;
  if (eq  === "Langhantel")return rules.barbell;
  if (eq  === "Körpergewicht") return rules.bodyweight;
  return rules.default;
}

// Merge settings with defaults (for backward-compat with old backups)
function mergeWithDefaults(saved) {
  const ps = DEFAULT_SETTINGS.progressionSettings;
  return {
    ...DEFAULT_SETTINGS,
    ...saved,
    timerSettings: { ...DEFAULT_SETTINGS.timerSettings, ...(saved?.timerSettings || {}) },
    restRules:     { ...DEFAULT_SETTINGS.restRules,     ...(saved?.restRules     || {}) },
    progressionSettings: {
      ...ps,
      ...(saved?.progressionSettings || {}),
      defaultRepRange: { ...ps.defaultRepRange,  ...(saved?.progressionSettings?.defaultRepRange  || {}) },
      incrementRules:  { ...ps.incrementRules,   ...(saved?.progressionSettings?.incrementRules   || {}) },
    },
  };
}

// IMAGE COMPRESSION (Fix 5)
// Canvas-based resize to max 400px, JPEG quality 0.72
// ═══════════════════════════════════════════════════════
function compressImage(dataUrl, maxPx=400, quality=0.72) {
  return new Promise((resolve) => {
    try {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const ratio  = Math.min(maxPx/img.width, maxPx/img.height, 1);
        canvas.width  = Math.round(img.width  * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => resolve(dataUrl); // fallback: original
      img.src = dataUrl;
    } catch {
      resolve(dataUrl);
    }
  });
}

const LS_PREFIX = "ft5_";

function lsGet(key, fallback) {
  try {
    const v = localStorage.getItem(LS_PREFIX + key);
    if (!v) return fallback;
    const parsed = JSON.parse(v);
    // Fix 1: deep-merge settings so new fields are always present
    if (key === "settings") return mergeWithDefaults(parsed);
    // Merge built-in images into exerciseOverrides (without overwriting user data)
    if (key === "exerciseOverrides") {
      const merged = {...BUILTIN_IMG_OVERRIDES};
      for (const [k,v] of Object.entries(parsed||{})) {
        merged[k] = {...(BUILTIN_IMG_OVERRIDES[k]||{}), ...v};
      }
      return merged;
    }
    return parsed;
  } catch {
    return fallback;
  }
}

function lsSet(key, value) {
  try {
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    return true;
  } catch (e) {
    // QuotaExceededError or similar – show a brief console warning
    console.warn("FitTrack: localStorage write failed for key:", key, e?.name);
    return false;
  }
}

function usePersistedState(key, seed) {
  const [s, setS] = useState(() => lsGet(key, seed));
  const set = useCallback(u => {
    setS(prev => {
      const next = typeof u === "function" ? u(prev) : u;
      lsSet(key, next);
      return next;
    });
  }, [key]);
  return [s, set];
}

const Card = ({children, style={}, onClick, glow, accent:ac}) => (
  <div onClick={onClick} style={{
    background:T.bgCard, borderRadius:18,
    border:`1px solid ${glow ? T.accentDim+"80" : ac||T.border}`,
    padding:16, cursor:onClick?"pointer":"default",
    transition:"transform 0.12s",
    boxShadow:glow?`0 0 28px ${T.accentGlow}`:"none",
    ...style,
  }}
    onMouseEnter={e=>onClick&&(e.currentTarget.style.transform="translateY(-2px)")}
    onMouseLeave={e=>onClick&&(e.currentTarget.style.transform="none")}
  >{children}</div>
);

const Btn = ({children, onClick, v="primary", style={}, disabled, full}) => {
  const V = {
    primary:   {background:T.accent,  color:"#07070F", border:"none"},
    secondary: {background:"transparent", color:T.accent, border:`1.5px solid ${T.accent}`},
    ghost:     {background:T.bgAlt,   color:T.text,    border:`1px solid ${T.border}`},
    danger:    {background:T.red+"22",color:T.red,     border:`1px solid ${T.red}44`},
    teal:      {background:T.teal+"22",color:T.teal,   border:`1px solid ${T.teal}44`},
    gold:      {background:T.gold+"22",color:T.gold,   border:`1px solid ${T.gold}44`},
  };
  return (
    <button onClick={onClick} disabled={disabled} style={{
      ...V[v], padding:"11px 18px", borderRadius:12, fontWeight:700, fontSize:14,
      cursor:disabled?"not-allowed":"pointer", opacity:disabled?0.45:1,
      transition:"all 0.13s", letterSpacing:0.3, width:full?"100%":"auto",
      display:"inline-flex", alignItems:"center", justifyContent:"center", gap:6,
      ...style,
    }}>{children}</button>
  );
};

const Inp = ({value, onChange, placeholder, type="text", style={}}) => (

const PBar = ({value, max, color=T.accent, h=6}) => (
  <div style={{background:T.bgInput, borderRadius:99, height:h, overflow:"hidden"}}>
    <div style={{
      background:color,
      width:`${Math.min(100, max>0 ? (value/max)*100 : 0)}%`,
      height:"100%", borderRadius:99, transition:"width 0.6s ease",
    }}/>
  </div>
);

// Fix 3: Auto-resize textarea – grows with content, no internal scroll
const AutoTextarea = ({value, onChange, placeholder, style={}}) => {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }, [value]);
  return (
    <textarea
      ref={ref}
      value={value}
      onChange={e => onChange(e.target.value)}
      placeholder={placeholder}
      rows={3}
      style={{
        background:T.bgInput, border:`1px solid ${T.border}`, borderRadius:10,
        padding:"10px 14px", color:T.text, fontSize:14, width:"100%",
        minHeight:80, outline:"none", resize:"none", overflow:"hidden",
        boxSizing:"border-box", fontFamily:"inherit", lineHeight:1.6,
        ...style,
      }}
    />
  );
};

const LineChart = ({data, color=T.accent, height=72}) => {
  if (!data || data.length < 2) return (
    <div style={{height, display:"flex", alignItems:"center", justifyContent:"center", color:T.muted, fontSize:12}}>
      Zu wenig Daten
    </div>
  );
  const W=280, H=height, pad=8;
  const mn=Math.min(...data), mx=Math.max(...data), rng=mx-mn||0.1;
  const py = v => H-pad-((v-mn)/rng)*(H-pad*2);
  const pts = data.map((v,i) => `${(i/(data.length-1))*W},${py(v)}`).join(" ");
  const gid = `lc${color.replace(/[^a-z0-9]/gi,"")}${height}`;
  return (
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible"}}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.28"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon fill={`url(#${gid})`} points={`0,${H} ${pts} ${W},${H}`}/>
      <polyline fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points={pts}/>
      {data.map((v,i) => {
        const x=(i/(data.length-1))*W, y=py(v), last=i===data.length-1;
        return <circle key={i} cx={x} cy={y} r={last?5:2.5} fill={color} stroke={T.bg} strokeWidth={last?2:0}/>;
      })}
    </svg>
  );
};

const BarChart = ({data, labels, color=T.blue, height=80}) => {
  if (!data?.length) return null;
  const mx = Math.max(...data) || 1;
  return (

};

// ─────────────────────────────────────────────────────────────────────
// AUDIO ENGINE – Web Audio API, offline, kein externes File
// ─────────────────────────────────────────────────────────────────────
const AudioEngine = (() => {
  let ctx = null;

  const getCtx = () => {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { return null; }
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  };

  // Einzelner Ton: freq Hz, dur Sekunden, vol 0-1
  const tone = (freq, dur, vol = 0.45, delay = 0) => {
    const c = getCtx(); if (!c) return;
    const t   = c.currentTime + delay;
    const osc = c.createOscillator();
    const g   = c.createGain();
    osc.connect(g); g.connect(c.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.05);
  };

  return {
    // Kurzer hoher Tick – 10-Sekunden-Countdown
    tick: () => tone(1050, 0.10, 0.38),

    // "Los!"-Gong wenn Pause vorbei (zwei Töne, leicht harmonisch)
    done: () => {
      tone(660, 0.30, 0.55, 0.0);
      tone(880, 0.45, 0.40, 0.08);
    },

    // Drei kurze Beeps – Signal dass Übungszeit überschritten wurde
    tripleBeep: () => {
      tone(1100, 0.08, 0.35, 0.00);
      tone(1100, 0.08, 0.35, 0.18);
      tone(1100, 0.08, 0.35, 0.36);
    },
  };
})();

// ─────────────────────────────────────────────────────────────────────
// REST TIMER – mit Ticks ab 10 Sek und Gong am Ende
// ─────────────────────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────────────
// RestTimer – compact top overlay (Punkt 5)
// tickStart: seconds before end where beeping begins (from settings)
// ─────────────────────────────────────────────────────────────────────
const RestTimer = ({seconds, onDone, onSkip, tickStart=10}) => {
  // Use a timestamp-based approach so the timer stays accurate when the user
  // switches tabs or leaves the app. endAt is the absolute finish time.
  const endAt    = useRef(Date.now() + seconds * 1000);
  const [left, setLeft] = useState(seconds);
  const intervalRef = useRef(null);
  const ticked   = useRef(new Set());
  const doneFired= useRef(false);

  useEffect(() => {
    // Re-request notification permission so we can alert when in background
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    intervalRef.current = setInterval(() => {
      const remaining = Math.round((endAt.current - Date.now()) / 1000);
      const next = Math.max(0, remaining);
      setLeft(next);

      // Ticks in final tickStart seconds
      if (next > 0 && next <= tickStart && !ticked.current.has(next)) {
        ticked.current.add(next);
        AudioEngine.tick();
      }
      // Done – fire once
      if (next <= 0 && !doneFired.current) {
        doneFired.current = true;
        clearInterval(intervalRef.current);
        AudioEngine.done();
        // Notify even if app is in background
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification('FitTrack', {
              body: 'Pause vorbei – nächster Satz!',
              icon: APP_ICON_URI,
              silent: true, // AudioEngine already played the sound
            });
          } catch(_) {}
        }
        onDone();
      }
    }, 500); // poll twice per second for accuracy after tab switch
    return () => clearInterval(intervalRef.current);
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  const adjust = delta => {
    setLeft(l => {
      const next = Math.max(0, l + delta);
      ticked.current = new Set([...ticked.current].filter(v => v > next));
      return next;
    });
  };

  const pct  = (left / seconds) * 100;
  const r    = 30;
  const circ = 2 * Math.PI * r;
  const m    = Math.floor(left / 60);
  const s    = left % 60;
  const nearEnd = left <= tickStart;

  // Punkt 1: larger compact overlay – big clock left (~45% width), stacked buttons right
  const sz   = 104;   // SVG canvas size
  const rr   = 44;    // ring radius – significantly larger than before
  const circR= 2 * Math.PI * rr;

  return (
    <div style={{
      position:"fixed", top:76, left:12, right:12,
      background:T.bgCard, borderRadius:20,
      border:`2px solid ${nearEnd ? T.orange : T.accent}77`,
      boxShadow:"0 10px 48px rgba(0,0,0,0.78)",
      zIndex:300, padding:"14px 14px 12px",
    }}>
      <div style={{display:"flex", alignItems:"center", gap:12}}>

        {/* ── Left: large circular timer ── */}
        <div style={{position:"relative", width:sz, height:sz, flexShrink:0}}>
          <svg width={sz} height={sz} style={{transform:"rotate(-90deg)"}}>
            <circle cx={sz/2} cy={sz/2} r={rr} fill="none" stroke={T.border} strokeWidth="7"/>
            <circle cx={sz/2} cy={sz/2} r={rr} fill="none"
              stroke={nearEnd ? T.orange : T.accent} strokeWidth="7"
              strokeDasharray={circR}
              strokeDashoffset={circR * (1 - Math.max(0, pct) / 100)}
              strokeLinecap="round"
              style={{transition:"stroke-dashoffset 1s linear, stroke 0.4s"}}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
            <div style={{fontSize:28,fontWeight:900,fontVariantNumeric:"tabular-nums",lineHeight:1,
              color:nearEnd?T.orange:T.accent}}>
              {m>0?`${m}:${s.toString().padStart(2,"0")}`:s}
            </div>
            <div style={{fontSize:10,color:T.muted,marginTop:2,letterSpacing:1}}>PAUSE</div>
          </div>
        </div>

        {/* ── Right: adjust + skip + done (stacked) ── */}
        <div style={{flex:1, display:"flex", flexDirection:"column", gap:6}}>
          <div style={{display:"flex",gap:5}}>
            {[-15,+15,+30].map(d=>(
              <button key={d} onClick={()=>adjust(d)} style={{
                flex:1, background:T.bgAlt,
                color:d<0?T.red:T.green,
                border:`1px solid ${d<0?T.red+"55":T.green+"55"}`,
                borderRadius:8, padding:"7px 0",
                fontWeight:700, fontSize:12, cursor:"pointer",
              }}>{d>0?"+":""}{d}s</button>
            ))}
          </div>
          <Btn v="ghost" onClick={onSkip}
            style={{padding:"7px 0",fontSize:13,width:"100%"}}>
            Überspringen
          </Btn>
          <Btn onClick={()=>{AudioEngine.done();onDone();}}
            style={{padding:"9px 0",fontSize:14,width:"100%",fontWeight:800}}>
            Fertig ✓
          </Btn>
        </div>

      </div>
    </div>
  );
};

// ─────────────────────────────────────────────────────────────────────
// ExerciseTimer – for unitType "secs"/"mins" exercises (Punkt 6+7)
// Counts DOWN to zero, then counts UP showing overtime.
// Does NOT auto-complete the set – user taps "Satz beenden".
// tickStart: seconds before zero where beeps start.
// ─────────────────────────────────────────────────────────────────────
const ExerciseTimer = ({targetSecs, onFinish, tickStart=10}) => {
  const [elapsed, setElapsed] = useState(0);
  const intervalRef = useRef(null);
  const ticked      = useRef(new Set());
  const donePlayed  = useRef(false);

  useEffect(() => {
    intervalRef.current = setInterval(() => {
      setElapsed(prev => {
        const next = prev + 1;
        const remaining = targetSecs - next;
        const overtime  = next > targetSecs;

        // Ticks in final tickStart seconds BEFORE target (countdown warning)
        if (!overtime && remaining > 0 && remaining <= tickStart && !ticked.current.has(remaining)) {
          ticked.current.add(remaining);
          AudioEngine.tick();
        }
        // Done sound exactly when target is reached (once)
        if (next === targetSecs && !donePlayed.current) {
          donePlayed.current = true;
          AudioEngine.done();
        }
        // Triple beep every 30s AFTER target – signals how much extra time achieved
        if (overtime && (next - targetSecs) % 30 === 0 && !ticked.current.has(next)) {
          ticked.current.add(next);
          AudioEngine.tripleBeep();
        }
        return next;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  const remaining  = targetSecs - elapsed;
  const overtime   = elapsed > targetSecs;
  const displayVal = overtime ? elapsed - targetSecs : Math.abs(remaining);
  const dm = Math.floor(displayVal / 60);
  const ds = displayVal % 60;
  const timeStr = dm > 0
    ? `${dm}:${ds.toString().padStart(2,"0")}`
    : `${ds}`;
  const pct = Math.min(100, (elapsed / targetSecs) * 100);
  const r = 30, circ = 2*Math.PI*r;
  const nearEnd = !overtime && remaining > 0 && remaining <= tickStart;

  return (
    <div style={{
      position:"fixed", top:80, left:16, right:16,
      background:T.bgCard, borderRadius:18,
      border:`2px solid ${overtime ? T.green : nearEnd ? T.orange : T.blue}66`,
      boxShadow:"0 8px 40px rgba(0,0,0,0.7)",
      zIndex:300, padding:"14px 16px 12px",
    }}>
      <div style={{display:"flex", alignItems:"center", gap:14}}>
        <div style={{position:"relative", width:72, height:72, flexShrink:0}}>
          <svg width="72" height="72" style={{transform:"rotate(-90deg)"}}>
            <circle cx="36" cy="36" r={r} fill="none" stroke={T.border} strokeWidth="5"/>
            <circle cx="36" cy="36" r={r} fill="none"
              stroke={overtime ? T.green : nearEnd ? T.orange : T.blue}
              strokeWidth="5" strokeDasharray={circ}
              strokeDashoffset={circ * (1 - pct / 100)}
              strokeLinecap="round"
              style={{transition:"stroke-dashoffset 0.9s linear, stroke 0.4s"}}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <div style={{fontSize:9,color:T.muted,lineHeight:1,marginBottom:1}}>
              {overtime?"OVER":"ÜBUNG"}
            </div>
            <div style={{fontSize:18,fontWeight:900,fontVariantNumeric:"tabular-nums",lineHeight:1,
              color: overtime ? T.green : nearEnd ? T.orange : T.blue}}>
              {overtime ? `+${timeStr}` : timeStr}
            </div>
          </div>
        </div>

        <div style={{flex:1}}>
          <div style={{fontSize:12,color:T.sub,marginBottom:6}}>
            Ziel: {fmtRepsVal(targetSecs,"secs")}
            {overtime && <span style={{color:T.green,marginLeft:8,fontWeight:700}}>Ziel erreicht ✓</span>}
          </div>
          <Btn onClick={onFinish}
            v={overtime ? "teal" : "secondary"}
            full style={{padding:"9px 0",fontSize:13}}>
            {overtime ? "Satz beenden ✓" : "Satz jetzt beenden"}
          </Btn>
        </div>
      </div>
    </div>
  );
};

const OnboardingScreen = ({onDone, onImport}) => {
  const [step,setStep]   = useState(0);
  const [name,setName]   = useState("");
  const [goal,setGoal]   = useState("");
  const [days,setDays]   = useState(3);
  const [weight,setWeight] = useState("");
  // Backup-Import state
  const [importState, setImportState] = useState(null); // null | "loading" | "ok" | "error"
  const [importMsg,   setImportMsg]   = useState("");
  const importRef = useRef(null);

  const handleImportFile = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = "";
    setImportState("loading");
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const raw = JSON.parse(ev.target.result);
        if (typeof raw !== "object" || !raw)        throw new Error("Kein gültiges JSON");
        if (!raw._fittrack_version)                  throw new Error("Keine FitTrack-Backup-Datei");

        const imported = {
          settings:          (typeof raw.settings === "object" && raw.settings) ? raw.settings : {},
          sessions:          Array.isArray(raw.sessions)          ? raw.sessions          : [],
          cardio:            Array.isArray(raw.cardio)            ? raw.cardio            : [],
          plans:             Array.isArray(raw.plans)             ? raw.plans             : [],
          metrics:           Array.isArray(raw.metrics)           ? raw.metrics           : [],
          customExercises:   Array.isArray(raw.customExercises)   ? raw.customExercises   : [],
          exerciseOverrides: (typeof raw.exerciseOverrides === "object" && raw.exerciseOverrides)
                               ? raw.exerciseOverrides : {},
        };
        imported.sessions = imported.sessions.filter(s => s?.id && s?.date && Array.isArray(s?.sets));
        imported.plans    = imported.plans.filter(p => p?.id && p?.name && Array.isArray(p?.days));
        // Mark as onboarded so the app opens normally after import
        // Punkt 10: deep-merge timerSettings + restRules on import
        imported.settings = mergeWithDefaults({...imported.settings, onboarded: true});

        onImport(imported);
        setImportState("ok");
        setImportMsg(`${imported.sessions.length} Trainings, ${imported.plans.length} Pläne wiederhergestellt.`);
      } catch(err) {
        setImportState("error");
        setImportMsg(err.message || "Ungültige Datei");
      }
    };
    reader.onerror = () => { setImportState("error"); setImportMsg("Datei konnte nicht gelesen werden"); };
    reader.readAsText(file);
  };

  const steps = [
    {
      title:"Willkommen bei FitTrack",
      sub:"Privates Trainings-Tagebuch. Offline, nur für dich.",
      content:(
        <div>
          <Lbl>DEIN NAME (optional)</Lbl>
          <Inp value={name} onChange={setName} placeholder="z.B. Max"/>

          {/* ── Backup wiederherstellen ── */}
          <div style={{marginTop:28}}>
            <div style={{
              height:1, background:T.border, marginBottom:20,
              position:"relative",
            }}>
              <span style={{
                position:"absolute", top:-9, left:"50%", transform:"translateX(-50%)",
                background:T.bg, padding:"0 10px",
                fontSize:11, color:T.muted, fontWeight:700, letterSpacing:1,
              }}>ODER</span>
            </div>

            <div style={{
              border:`1px solid ${T.border}`, borderRadius:14,
              padding:"16px 16px 14px",
              background:T.bgAlt,
            }}>
              <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:4}}>
                Backup wiederherstellen
              </div>
              <div style={{fontSize:12,color:T.sub,marginBottom:14,lineHeight:1.6}}>
                Hast du bereits Daten aus FitTrack? Lade deine Backup-Datei (.json) hoch –
                alle Trainings, Pläne und Einstellungen werden sofort wiederhergestellt.
              </div>

              <Btn v="secondary" onClick={()=>importRef.current?.click()} full
                style={{fontSize:13,padding:"10px 0"}}>
                Backup-Datei hochladen
              </Btn>
              <input
                ref={importRef}
                type="file"
                accept=".json,application/json"
                onChange={handleImportFile}
                style={{display:"none"}}
              />

              {/* Status */}
              {importState === "loading" && (
                <div style={{marginTop:10,fontSize:12,color:T.sub,textAlign:"center"}}>
                  Lade Backup…
                </div>
              )}
              {importState === "ok" && (
                <div style={{
                  marginTop:10,padding:"10px 12px",borderRadius:10,fontSize:12,
                  background:T.green+"18",color:T.green,border:`1px solid ${T.green}44`,
                  lineHeight:1.5,
                }}>
                  ✓ Backup erfolgreich importiert!<br/>
                  <span style={{color:T.sub}}>{importMsg}</span>
                </div>
              )}
              {importState === "error" && (
                <div style={{
                  marginTop:10,padding:"10px 12px",borderRadius:10,fontSize:12,
                  background:T.red+"18",color:T.red,border:`1px solid ${T.red}44`,
                }}>
                  ✗ {importMsg}
                </div>
              )}
            </div>
          </div>
        </div>
      ),
    },
    {
      title:"Was ist dein Ziel?",
      sub:"Wähle deinen Fokus.",
      content:(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {[{id:"Muskelaufbau",icon:"→",desc:"Masse aufbauen"},{id:"Kraftzuwachs",icon:"🏋",desc:"Stärker werden"},{id:"Abnehmen",icon:"🔥",desc:"Fett verbrennen"},{id:"Fitness",icon:"⚡",desc:"Fit bleiben"}].map(g=>(
            <div key={g.id} onClick={()=>setGoal(g.id)} style={{background:goal===g.id?T.accentGlow:T.bgAlt,border:`2px solid ${goal===g.id?T.accent:T.border}`,borderRadius:14,padding:"14px 12px",cursor:"pointer",textAlign:"center",transition:"all 0.15s"}}>
              <div style={{fontSize:28,marginBottom:6}}>{g.icon}</div>
              <div style={{fontSize:13,fontWeight:700,color:goal===g.id?T.accent:T.text}}>{g.id}</div>
            </div>
          ))}
        </div>
      ),
    },
    {
      title:"Trainings pro Woche?",
      sub:"Realistisch starten.",
      content:(
        <div>
          <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:20}}>
            {[2,3,4,5,6].map(d=>(
              <button key={d} onClick={()=>setDays(d)} style={{width:52,height:52,borderRadius:12,fontWeight:900,fontSize:20,background:days===d?T.accent:T.bgAlt,color:days===d?"#07070F":T.sub,border:`2px solid ${days===d?T.accent:T.border}`,cursor:"pointer"}}>{d}</button>
            ))}
          </div>
          <div style={{textAlign:"center",color:T.sub,fontSize:13}}>{["","","Einsteiger","Solide","Optimal","Fortgeschritten","Profi"][days]}</div>
        </div>
      ),
    },
    {
      title:"Startgewicht",
      sub:"Optional – jederzeit änderbar.",
      content:(
        <div>
          <Lbl>GEWICHT (kg)</Lbl>
          <Inp value={weight} onChange={setWeight} placeholder="80.0" type="number"/>
          <div style={{marginTop:10,fontSize:12,color:T.muted}}>Lokal gespeichert. Kein Account nötig.</div>
        </div>
      ),
    },
  ];

  const cur=steps[step], isLast=step===steps.length-1;
  const canNext = step===0 || (step===1 && goal) || step>=2;

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",padding:"40px 24px 32px",background:T.bg}}>
      <div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:40}}>
        {steps.map((_,i)=><div key={i} style={{height:4,borderRadius:99,transition:"all 0.3s",width:i===step?24:8,background:i<=step?T.accent:T.border}}/>)}
      </div>
      <div style={{flex:1}}>
        <div style={{fontSize:26,fontWeight:900,color:T.text,marginBottom:8}}>{cur.title}</div>
        <div style={{fontSize:14,color:T.sub,marginBottom:32,lineHeight:1.6}}>{cur.sub}</div>
        {cur.content}
      </div>

      {/* Buttons – beim erfolgreichen Import wird "Weiter" durch einen Hinweis ersetzt */}
      {importState === "ok" ? (
        <div style={{marginTop:32,textAlign:"center"}}>
          <div style={{fontSize:13,color:T.sub,marginBottom:12}}>
            Die App öffnet sich automatisch mit deinen Daten.
          </div>
          <div style={{fontSize:12,color:T.muted}}>
            Falls die App nicht reagiert, tippe kurz auf eine andere Seite.
          </div>
        </div>
      ) : (
        <div style={{display:"flex",gap:10,marginTop:32}}>
          {step>0&&<Btn v="ghost" onClick={()=>setStep(s=>s-1)} style={{flex:1}}>← Zurück</Btn>}
          <Btn
            onClick={isLast
              ? ()=>onDone({name:name||"Athlet",goal:goal||"Fitness",weeklyGoal:days,weight:parseFloat(weight)||null})
              : ()=>setStep(s=>s+1)}
            disabled={!canNext}
            style={{flex:2,padding:14,fontSize:16}}
          >{"Los geht's!"}</Btn>
        </div>
      )}
    </div>
  );
};

// CARDIO SCREEN
