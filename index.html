      setCustomExercises(p=>p.map(e=>e.id===activeId ? updated : e));
    } else {
      // Built-in exercise: store enrichment in overrides incl. trainingsnotiz
      const override = {
        desc: fDesc.trim()||null,
        link: fLink.trim()||null,
        img:  fImg||null,
        trainingsnotiz: fNote.trim()||null, // Fix 5
        unitType: (fUnitType==="reps+kg"||fUnitType==="reps") ? null : fUnitType,
      };
      const hasAny = override.desc || override.link || override.img || override.trainingsnotiz || override.unitType;
      if (hasAny) {
        setExerciseOverrides(prev=>({...prev, [activeId]: override}));
      } else {
        setExerciseOverrides(prev=>{ const n={...prev}; delete n[activeId]; return n; });
      }
    }
    setMode("detail");
  };

  const deleteCustom = id => {
    setCustomExercises(p=>p.filter(e=>e.id!==id));
    setMode("list");
  };

  const clearOverride = id => {
    setExerciseOverrides(prev=>{
      const next={...prev};
      delete next[id];
      return next;
    });
  };

  // ── DETAIL VIEW ──────────────────────────────────────
  if (mode==="detail" && activeId) {
    const base = allExercises.find(e=>e.id===activeId);
    if (!base) { setMode("list"); return null; }
    const ex = resolve(base);
    const hasOverride = !base.custom && exerciseOverrides?.[base.id];

    return (
      <div style={{padding:"0 16px 24px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"20px 0 12px"}}>
          <Btn v="ghost" onClick={()=>setMode("list")} style={{padding:"8px 14px"}}>←</Btn>
          <div style={{flex:1,fontSize:18,fontWeight:900,color:T.text}}>{ex.name}</div>
          <Btn v="ghost" onClick={()=>openEdit(base)} style={{padding:"8px 14px"}}>✎ Bearbeiten</Btn>
        </div>

        {ex.img&&(
          <img src={ex.img} alt={ex.name}
            style={{width:"100%",borderRadius:14,marginBottom:12,objectFit:"cover",maxHeight:220}}/>
        )}

        <Card style={{marginBottom:10}}>
          <div style={{display:"flex",gap:8,marginBottom:ex.desc?12:4,flexWrap:"wrap"}}>
            <Badge color={CAT_COLOR_EXT[ex.cat]||T.accent}>{ex.cat}</Badge>
            <Badge color={T.sub}>{ex.eq}</Badge>
            {ex.custom&&<Badge color={T.purple}>Eigene Übung</Badge>}
            {hasOverride&&<Badge color={T.teal}>Ergänzt</Badge>}
          </div>
          {ex.trainingsnotiz&&(
            <div style={{fontSize:12,color:T.teal,marginBottom:8,padding:"6px 10px",
              background:T.teal+"15",borderRadius:8,border:`1px solid ${T.teal}33`}}>
              Notiz: {ex.trainingsnotiz}
            </div>
          )}
          {ex.desc&&(
            <div style={{fontSize:14,color:T.sub,lineHeight:1.7,marginBottom:ex.link?12:0}}>
              {ex.desc}
            </div>
          )}
          {ex.link&&(
            <a href={ex.link} target="_blank" rel="noreferrer"
              style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",
                background:T.bgAlt,borderRadius:10,color:T.blue,fontSize:13,
                fontWeight:700,textDecoration:"none",marginTop:ex.desc?0:4}}>
              Video öffnen
            </a>
          )}
          {!ex.desc&&!ex.link&&!ex.img&&(
            <div style={{fontSize:13,color:T.muted,fontStyle:"italic"}}>
              Noch keine Beschreibung · tippe Bearbeiten um Infos hinzuzufügen
            </div>
          )}
        </Card>

        {/* Last training values */}
        {(()=>{
          const lastWork = getLastWorkSets(base.id, sessions);
          if (!lastWork || !lastWork.length) return null;
          const w = lastWork[0].weight;
          const repsArr = lastWork.map(s=>s.reps);
          const sameReps = repsArr.every(r=>r===repsArr[0]);
          return (
            <Card style={{marginBottom:10, border:`1px solid ${T.teal}44`}}>
              <div style={{fontSize:11,fontWeight:800,color:T.teal,marginBottom:8,letterSpacing:0.3}}>
                LETZTES TRAINING
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                {w > 0 && (
                  <div style={{textAlign:"center",flex:1}}>
                    <div style={{fontSize:20,fontWeight:900,color:T.text}}>{w}</div>
                    <div style={{fontSize:10,color:T.muted,fontWeight:700}}>KG</div>
                  </div>
                )}
                <div style={{textAlign:"center",flex:1}}>
                  <div style={{fontSize:20,fontWeight:900,color:T.text}}>
                    {sameReps ? repsArr[0] : `${Math.min(...repsArr)}–${Math.max(...repsArr)}`}
                  </div>
                  <div style={{fontSize:10,color:T.muted,fontWeight:700}}>WDH</div>
                </div>
                <div style={{textAlign:"center",flex:1}}>
                  <div style={{fontSize:20,fontWeight:900,color:T.text}}>{lastWork.length}</div>
                  <div style={{fontSize:10,color:T.muted,fontWeight:700}}>SÄTZE</div>
                </div>
              </div>
              {!sameReps && (
                <div style={{marginTop:8,display:"flex",gap:4,flexWrap:"wrap"}}>
                  {repsArr.map((r,i)=>(
                    <span key={i} style={{fontSize:12,color:T.sub,background:T.bgAlt,
                      borderRadius:6,padding:"2px 8px",fontWeight:600}}>
                      Satz {i+1}: {r} Wdh{w>0?` · ${w} kg`:""}
                    </span>
                  ))}
                </div>
              )}
            </Card>
          );
        })()}

        {/* Actions */}
        {selectable&&(
          <Btn onClick={()=>{onSelect&&onSelect(base);setMode("list");}} full style={{marginBottom:10}}>
            + Zum Plan hinzufügen
          </Btn>
        )}
        {hasOverride&&(
          <Btn v="ghost" onClick={()=>{clearOverride(base.id);}} full style={{marginBottom:8,fontSize:12}}>
            Ergänzungen zurücksetzen
          </Btn>
        )}
        {ex.custom&&(
          <Btn v="danger" onClick={()=>deleteCustom(ex.id)} full>Übung löschen</Btn>
        )}
      </div>
    );
  }

  // ── CREATE / EDIT FORM ───────────────────────────────
  if (mode==="create" || mode==="edit") {
    const isCreate = mode==="create";
    const base = !isCreate ? allExercises.find(e=>e.id===activeId) : null;
    const isBuiltIn = base && !base.custom;
    const EQ_OPTS=["Langhantel","Kurzhantel","Kabel","Maschine","Körpergewicht","Sonstiges"];

    return (
      <div style={{padding:"0 16px 24px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"20px 0 14px"}}>
          <Btn v="ghost" onClick={()=>setMode(isCreate?"list":"detail")} style={{padding:"8px 14px"}}>←</Btn>
          <div style={{flex:1,fontSize:18,fontWeight:900,color:T.text}}>
            {isCreate?"Neue Übung":"Übung bearbeiten"}
          </div>
        </div>

        {isBuiltIn&&(
          <div style={{padding:"10px 14px",background:T.blue+"18",borderRadius:10,marginBottom:14,
            border:`1px solid ${T.blue}44`,fontSize:12,color:T.sub}}>
            ℹ️ <b style={{color:T.text}}>Basis-Übung:</b> Name, Kategorie und Gerät sind fest.
            Du kannst Beschreibung, Link und Bild ergänzen.
          </div>
        )}

        <Card>
          {/* Name + Cat + Eq only for custom */}
          {!isBuiltIn&&<>
            <div style={{marginBottom:10}}>
              <Lbl>NAME *</Lbl>
              <Inp value={fName} onChange={setFName} placeholder="z.B. Schrägbank Kurzhantel"/>
            </div>
            <div style={{marginBottom:10}}>
              <Lbl>KATEGORIE</Lbl>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {ALL_CATS.filter(c=>c!=="Alle").map(c=>(
                  <button key={c} onClick={()=>setFCat(c)} style={{
                    background:fCat===c?(CAT_COLOR_EXT[c]||T.accent):T.bgInput,
                    color:fCat===c?"#07070F":T.sub,
                    border:`1px solid ${fCat===c?(CAT_COLOR_EXT[c]||T.accent):T.border}`,
                    borderRadius:8,padding:"6px 11px",fontSize:11,fontWeight:700,cursor:"pointer",
                  }}>{c}</button>
                ))}
              </div>
            </div>
            <div style={{marginBottom:12}}>
              <Lbl>GERÄT</Lbl>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {EQ_OPTS.map(e=>(
                  <button key={e} onClick={()=>setFEq(e)} style={{
                    background:fEq===e?T.accent:T.bgInput,
                    color:fEq===e?"#07070F":T.sub,
                    border:`1px solid ${fEq===e?T.accent:T.border}`,
                    borderRadius:8,padding:"6px 11px",fontSize:11,fontWeight:700,cursor:"pointer",
                  }}>{e}</button>
                ))}
              </div>
            </div>
          </>}

          {/* Messtyp – available for ALL exercises incl. built-ins */}
          <div style={{marginBottom:12}}>
            <Lbl>MESSTYP</Lbl>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>
              {[
                {v:"reps",      label:"Wdh",          desc:"Nur Wiederholungen (z.B. Kreisen, Dehnung)"},
                {v:"reps+kg",   label:"kg + Wdh",     desc:"Gewicht und Wiederholungen (Standard Krafttraining)"},
                {v:"secs",      label:"Sekunden",      desc:"Zeitbasiert in Sekunden (z.B. Plank, Dehnung)"},
                {v:"mins",      label:"Minuten",       desc:"Zeitbasiert in Minuten (z.B. Cardio)"},
              ].map(opt=>(
                <button key={opt.v} onClick={()=>setFUnitType(opt.v)} style={{
                  background: fUnitType===opt.v ? T.accent : T.bgInput,
                  color:      fUnitType===opt.v ? "#07070F" : T.sub,
                  border:     `1px solid ${fUnitType===opt.v ? T.accent : T.border}`,
                  borderRadius:8, padding:"7px 12px", fontSize:12, fontWeight:700, cursor:"pointer",
                }}>{opt.label}</button>
              ))}
            </div>
            <div style={{fontSize:10,color:T.muted,marginTop:5,lineHeight:1.5}}>
              {fUnitType==="reps"    && "Nur Wiederholungen – kein Gewichtsfeld (Kreisen, Stretching …)"}
              {fUnitType==="reps+kg" && "Gewicht × Wiederholungen – Standard für Kraftübungen"}
              {fUnitType==="secs"    && "Zeit in Sekunden – Feld zeigt Sekunden statt Wdh (Plank, Dehnung …)"}
              {fUnitType==="mins"    && "Zeit in Minuten – z.B. für Cardio-Einheiten im Training"}
            </div>
          </div>

          {/* Media fields – available for ALL exercises */}
          <div style={{marginBottom:10}}>
            <Lbl>BESCHREIBUNG</Lbl>
            {/* Fix 3: auto-resize */}
            <AutoTextarea value={fDesc} onChange={setFDesc}
              placeholder="Ausführung, Hinweise, Muskelgruppen..."/>
          </div>
          {/* Fix 5: Trainingsnotiz – kurze Notiz die beim Training immer sichtbar ist */}
          <div style={{marginBottom:10}}>
            <Lbl>TRAININGSNOTIZ (immer sichtbar)</Lbl>
            <Inp value={fNote} onChange={setFNote}
              placeholder="z.B. Sitzhöhe 4 · Griff eng · Lehne Stufe 3"/>
            <div style={{fontSize:10,color:T.muted,marginTop:4,lineHeight:1.5}}>
              Wird während jedes Trainings unter der Übung angezeigt.
            </div>
          </div>
          <div style={{marginBottom:12}}>
            <Lbl>VIDEO-LINK (YouTube, etc.)</Lbl>
            <Inp value={fLink} onChange={setFLink} placeholder="https://youtube.com/watch?v=..."/>
          </div>
          <div style={{marginBottom:16}}>
            <Lbl>BILD</Lbl>
            {fImg
              ? <div style={{position:"relative"}}>
                  <img src={fImg} alt="" style={{width:"100%",borderRadius:10,maxHeight:180,objectFit:"cover"}}/>
                  <button onClick={()=>setFImg(null)}
                    style={{position:"absolute",top:8,right:8,background:T.red,border:"none",
                      borderRadius:"50%",width:28,height:28,cursor:"pointer",color:"#fff",
                      fontWeight:900,fontSize:15}}>×</button>
                </div>
              : <div onClick={()=>!imgLoading&&fileRef.current?.click()}
                  style={{border:`1px dashed ${T.border}`,borderRadius:10,padding:"22px",
                    textAlign:"center",cursor:imgLoading?"default":"pointer",color:T.muted,fontSize:13}}>
                  {"Bild auswählen"}
                </div>
            }
            <input ref={fileRef} type="file" accept="image/*" onChange={handleImg} style={{display:"none"}}/>
          </div>

          <Btn onClick={isCreate?saveCreate:saveEdit}
            disabled={(!isBuiltIn&&!fName.trim())||imgLoading} full>
            {isCreate?"Übung erstellen":"Änderungen speichern"}
          </Btn>
        </Card>
      </div>
    );
  }

  // ── LIST VIEW ────────────────────────────────────────
  const filtered = allExercises.filter(e =>
    (cat==="Alle"||e.cat===cat) &&
    (e.name.toLowerCase().includes(search.toLowerCase())||
     e.eq.toLowerCase().includes(search.toLowerCase()))
  );

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"20px 0 12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:22,fontWeight:900,color:T.text}}>
            {selectable?"Übung wählen":"Übungsdatenbank"}
          </div>
          {!selectable&&(
            <Btn v="secondary" onClick={openCreate} style={{padding:"7px 14px",fontSize:12}}>+ Eigene</Btn>
          )}
        </div>
        <Inp value={search} onChange={setSearch} placeholder="Suchen…"/>
      </div>

      <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:10,paddingBottom:2}}>
        {ALL_CATS.map(c=>(
          <button key={c} onClick={()=>setCat(c)} style={{
            background:cat===c?(CAT_COLOR_EXT[c]||T.accent):T.bgCard,
            color:cat===c?"#07070F":T.sub,
            border:`1px solid ${cat===c?(CAT_COLOR_EXT[c]||T.accent):T.border}`,
            borderRadius:8,padding:"6px 12px",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",
          }}>{c}</button>
        ))}
      </div>

      <div style={{fontSize:11,color:T.muted,marginBottom:10}}>{filtered.length} Übungen</div>

      {filtered.map(ex=>{
        const resolved = resolve(ex);
        const sel = selected.includes(ex.id);
        const hasMedia = resolved.desc||resolved.link||resolved.img;
        const isEnriched = !ex.custom && exerciseOverrides?.[ex.id];
        return (
          <div key={ex.id} style={{
            display:"flex",alignItems:"center",gap:10,padding:"10px 12px",
            borderRadius:12,marginBottom:6,
            background:sel?T.accentGlow:T.bgCard,
            border:`1px solid ${sel?T.accent:T.border}`,
            transition:"all 0.12s",
          }}>
            <div style={{
              width:36,height:36,borderRadius:10,flexShrink:0,
              background:`${CAT_COLOR_EXT[ex.cat]||T.accent}22`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,
            }}>
              {{Brust:"·",Rücken:"·",Beine:"·",Schultern:"·",Arme:"·",Core:"·",Aufwärmen:"·",Dehnung:"·"}[ex.cat]||"•"}
            </div>

            {/* Main tap area */}
            <div style={{flex:1,minWidth:0,cursor:"pointer"}}
              onClick={()=>{
                if (selectable) { onSelect&&onSelect(ex); }
                else { setActiveId(ex.id); setMode("detail"); }
              }}>
              <div style={{fontSize:14,fontWeight:700,color:T.text,display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                {ex.name}
                {ex.custom&&<span style={{fontSize:9,color:T.purple,fontWeight:800,letterSpacing:0.3}}>EIGENE</span>}
                {isEnriched&&<span style={{fontSize:9,color:T.teal,fontWeight:800}}>+INFO</span>}
                {hasMedia&&!isEnriched&&!ex.custom&&<span style={{fontSize:11,color:T.muted}}>ℹ</span>}
              </div>
              <div style={{fontSize:11,color:T.sub,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                <span style={{color:CAT_COLOR_EXT[ex.cat]||T.accent}}>{ex.cat}</span> · {ex.eq}
              </div>
            </div>

            {/* Right side */}
            {selectable ? (
              <button onClick={()=>onSelect&&onSelect(ex)} style={{
                background:sel?T.accent:T.bgAlt,
                border:`1px solid ${sel?T.accent:T.border}`,
                borderRadius:8,width:32,height:32,cursor:"pointer",
                fontSize:16,color:sel?"#07070F":T.muted,flexShrink:0,
              }}>{sel?"✓":"+"}</button>
            ) : (
              <button onClick={()=>{setActiveId(ex.id);setMode("detail");}}
                style={{background:"none",border:"none",cursor:"pointer",color:T.muted,fontSize:18,padding:4}}>›</button>
            )}
          </div>
        );
      })}
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// PLAN EDITOR  – vollständig editierbar
// ═══════════════════════════════════════════════════════
const PlanEditor = ({plan, allExercises, exerciseOverrides, setExerciseOverrides, customExercises, setCustomExercises, onSave, onCancel, settings, sessions}) => {
  const [name,setName]=useState(plan?.name||"");
  const [desc,setDesc]=useState(plan?.desc||"");
  const [days,setDays]=useState(()=>JSON.parse(JSON.stringify(plan?.days||[])));
  const [activeDay,setActiveDay]=useState(0);
  const [showDB,setShowDB]=useState(false);
  // Which exercise ID is being info-edited from within the plan editor
  const [infoExId, setInfoExId] = useState(null);

  const addDay   = () => { setDays(d=>[...d,{id:uid(),name:`Tag ${d.length+1}`,exercises:[]}]); setActiveDay(days.length); };
  const remDay   = i  => { setDays(d=>d.filter((_,j)=>j!==i)); setActiveDay(a=>Math.max(0,a-1)); };
  const updDayName=(i,v)=> setDays(d=>d.map((x,j)=>j===i?{...x,name:v}:x));

  const addEx = ex => {
    const defaultRest = getDefaultRestForExercise(ex, settings);
    // Pre-fill from last real training session for this exercise (any plan)
    const lastWork = getLastWorkSets(ex.id, sessions||[]);
    const prefillWeight = lastWork ? lastWork[0].weight : 0;
    const prefillReps   = lastWork ? Math.min(...lastWork.map(s=>s.reps)) : 10;
    const prefillSets   = lastWork ? lastWork.length : 3;
    setDays(d=>d.map((x,i)=>i===activeDay
      ?{...x,exercises:[...x.exercises,{
          eid:ex.id, sets:prefillSets, reps:prefillReps,
          weight:prefillWeight, rest:defaultRest, note:"",
        }]}
      :x));
    setShowDB(false);
  };
  // Punkt 4: apply rest rules to all exercises in current day
  const applyRestRules = () => {
    if(!window.confirm("Pausen aller Übungen dieses Tages nach den Einstellungen überschreiben?")) return;
    setDays(d=>d.map((day,i)=>i===activeDay?{
      ...day,
      exercises:day.exercises.map(ex=>{
        const exercise=(allExercises||[]).find(e=>e.id===ex.eid);
        return {...ex, rest:getDefaultRestForExercise(exercise, settings)};
      }),
    }:day));
  };
  // Letztes Training übernehmen: weight + reps + sets aus echter letzter Session (planunabhängig)
  const applyLastSession = () => {
    if (!window.confirm(
      "Werte aus letztem Training übernehmen?\n\n" +
      "Gewicht, Wiederholungen und Satzanzahl werden für alle Übungen " +
      "dieses Tages aus dem jeweils letzten Training aktualisiert.\n\n" +
      "Übungen ohne Verlauf bleiben unverändert."
    )) return;
    setDays(d=>d.map((day,i)=>i!==activeDay?day:{
      ...day,
      exercises:day.exercises.map(ex=>{
        const lastWork = getLastWorkSets(ex.eid, sessions||[]);
        if (!lastWork || !lastWork.length) return ex;
        if (ex.isWarmup) {
          return {...ex, weight: lastWork[0].weight};
        }
        const newRows = lastWork.map((s, i) => ({
          reps: s.reps, weight: s.weight,
          isWarmup: i === 0 && ex.isWarmup,
        }));
        const minReps = Math.min(...newRows.map(r=>r.reps));
        return {
          ...ex,
          sets:    newRows.length,
          reps:    minReps,
          weight:  newRows[0].weight,
          setRows: newRows,
        };
      }),
    }));
  };

  const remEx    = (di,ei) => setDays(d=>d.map((x,i)=>i===di?{...x,exercises:x.exercises.filter((_,j)=>j!==ei)}:x));
  const updEx    = (di,ei,f,v) => setDays(d=>d.map((x,i)=>i===di?{
    ...x,exercises:x.exercises.map((e,j)=>j===ei?{...e,[f]:isNaN(Number(v))?v:Number(v)}:e)
  }:x));
  const updExNote   = (di,ei,v) => setDays(d=>d.map((x,i)=>i===di?{
    ...x,exercises:x.exercises.map((e,j)=>j===ei?{...e,note:v}:e)
  }:x));
  const toggleWarmup= (di,ei) => setDays(d=>d.map((x,i)=>i===di?{
    ...x,exercises:x.exercises.map((e,j)=>j===ei?{...e,isWarmup:!e.isWarmup}:e)
  }:x));

  // Per-set helpers
  // getSetRows: expand a plan exercise into editable set rows
  const getSetRows = ex => {
    const base = ex.setRows || [];
    const count = ex.sets || 1;
    return Array.from({length: count}, (_, i) => ({
      reps:     base[i]?.reps     ?? ex.reps   ?? 10,
      weight:   base[i]?.weight   ?? ex.weight  ?? 0,
      isWarmup: base[i]?.isWarmup ?? (i === 0 && ex.isWarmup) ?? false,
    }));
  };

  const updSetRow = (di, ei, si, field, val) => setDays(d => d.map((day, i) => {
    if (i !== di) return day;
    return {
      ...day,
      exercises: day.exercises.map((ex, j) => {
        if (j !== ei) return ex;
        const rows = getSetRows(ex);
        rows[si] = { ...rows[si], [field]: field === 'isWarmup' ? val : (parseFloat(val) || 0) };
        // Sync top-level sets/reps/weight from rows for backwards compat
        return {
          ...ex,
          sets:    rows.length,
          reps:    Math.min(...rows.map(r => r.reps)),
          weight:  rows[0]?.weight ?? ex.weight,
          isWarmup: rows[0]?.isWarmup ?? false,
          setRows: rows,
        };
      }),
    };
  }));

  const addSetRow = (di, ei) => setDays(d => d.map((day, i) => {
    if (i !== di) return day;
    return {
      ...day,
      exercises: day.exercises.map((ex, j) => {
        if (j !== ei) return ex;
        const rows = getSetRows(ex);
        const last = rows[rows.length - 1] || {reps: ex.reps||10, weight: ex.weight||0, isWarmup:false};
        const newRows = [...rows, {reps: last.reps, weight: last.weight, isWarmup: false}];
        return { ...ex, sets: newRows.length, setRows: newRows };
      }),
    };
  }));

  const removeSetRow = (di, ei, si) => setDays(d => d.map((day, i) => {
    if (i !== di) return day;
    return {
      ...day,
      exercises: day.exercises.map((ex, j) => {
        if (j !== ei) return ex;
        const rows = getSetRows(ex).filter((_, k) => k !== si);
        if (rows.length === 0) return ex; // keep at least 1
        return {
          ...ex,
          sets:    rows.length,
          reps:    Math.min(...rows.map(r => r.reps)),
          weight:  rows[0]?.weight ?? ex.weight,
          isWarmup: rows[0]?.isWarmup ?? false,
          setRows: rows,
        };
      }),
    };
  }));
  // Move exercise up/down
  const moveEx = (di,ei,dir) => setDays(d=>d.map((day,i)=>{
    if(i!==di) return day;
    const exs=[...day.exercises];
    const to=ei+dir;
    if(to<0||to>=exs.length) return day;
    [exs[ei],exs[to]]=[exs[to],exs[ei]];
    return {...day,exercises:exs};
  }));

  // Fix 1: Info/Edit overlay – passes initialDetailId so ExerciseDBScreen opens directly on this exercise
  if (infoExId) return (
    <div>
      <div style={{padding:"16px 16px 0",display:"flex",alignItems:"center",gap:10}}>
        <Btn v="ghost" onClick={()=>setInfoExId(null)} style={{padding:"8px 14px"}}>← Zurück zum Plan</Btn>
      </div>
      <ExerciseDBScreen
        allExercises={allExercises}
        customExercises={customExercises} setCustomExercises={setCustomExercises}
        exerciseOverrides={exerciseOverrides} setExerciseOverrides={setExerciseOverrides}
        selectable={false}
        initialDetailId={infoExId}
      />
    </div>
  );

  if (showDB) return (
    <div>
      <div style={{padding:"16px 16px 0",display:"flex",alignItems:"center",gap:10}}>
        <Btn v="ghost" onClick={()=>setShowDB(false)} style={{padding:"8px 14px"}}>← Zurück</Btn>
        <div style={{fontSize:16,fontWeight:700,color:T.text}}>Übung hinzufügen</div>
      </div>
      <ExerciseDBScreen
        allExercises={allExercises}
        onSelect={addEx} selectable
        selected={days[activeDay]?.exercises.map(e=>e.eid)||[]}
      />
    </div>
  );

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"20px 0 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:20,fontWeight:900,color:T.text}}>{plan?"Bearbeiten":"Neuer Plan"}</div>
        <div style={{display:"flex",gap:8}}>
          <Btn v="ghost" onClick={onCancel} style={{padding:"8px 14px"}}>Abbruch</Btn>
          <Btn disabled={!name.trim()} onClick={()=>onSave({
            id:plan?.id||uid(), name, desc, days,
            archived:plan?.archived||false,
          })} style={{padding:"8px 18px"}}>Speichern</Btn>
        </div>
      </div>

      <div style={{marginBottom:10}}><Lbl>PLANNAME</Lbl><Inp value={name} onChange={setName} placeholder="Mein Plan"/></div>
      <div style={{marginBottom:14}}><Lbl>BESCHREIBUNG</Lbl><Inp value={desc} onChange={setDesc} placeholder="Kurze Beschreibung..."/></div>

      {/* Day tabs */}
      <div style={{display:"flex",gap:7,overflowX:"auto",marginBottom:14,paddingBottom:2}}>
        {days.map((day,i)=>(
          <button key={day.id} onClick={()=>setActiveDay(i)} style={{background:activeDay===i?T.accent:T.bgCard,color:activeDay===i?"#07070F":T.sub,border:`1px solid ${activeDay===i?T.accent:T.border}`,borderRadius:9,padding:"6px 14px",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{day.name}</button>
        ))}
        <button onClick={addDay} style={{background:T.bgAlt,color:T.accent,border:`1px dashed ${T.accent}`,borderRadius:9,padding:"6px 14px",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Tag</button>
      </div>

      {days[activeDay] && (
        <Card>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <input value={days[activeDay].name} onChange={e=>updDayName(activeDay,e.target.value)}
              style={{background:"transparent",border:"none",outline:"none",fontSize:16,fontWeight:700,color:T.accent,flex:1}}/>
            <button onClick={()=>remDay(activeDay)} style={{background:"none",border:"none",cursor:"pointer",color:T.red,fontSize:18,padding:4}}>Löschen</button>
          </div>

          {/* Progression & Deload Hinweis */}
          {(()=>{
            const ps = getProgressionSettings(settings);
            if (ps.enabled) return null;
            return (
              <div style={{
                padding:"10px 12px", borderRadius:10, marginBottom:8,
                background:T.teal+"14", border:`1px solid ${T.teal}33`,
                display:"flex", alignItems:"center", gap:10,
              }}>
                <span style={{fontSize:16}}>↑</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:700,color:T.teal,marginBottom:1}}>
                    Progression & Deload deaktiviert
                  </div>
                  <div style={{fontSize:11,color:T.sub,lineHeight:1.4}}>
                    Aktiviere automatische Vorschläge unter <b style={{color:T.text}}>Mehr → Einstellungen → Progression & Deload</b>
                  </div>
                </div>
              </div>
            );
          })()}

          {days[activeDay].exercises.length===0&&(
            <div style={{textAlign:"center",padding:"20px 0",color:T.muted,fontSize:13,border:`1px dashed ${T.border}`,borderRadius:12,marginBottom:10}}>
              Noch keine Übungen
            </div>
          )}

          {days[activeDay].exercises.map((ex,j)=>{
            const e = allExercises.find(x=>x.id===ex.eid);
            const override = exerciseOverrides?.[ex.eid]||{};
            const resolved = {...(e||{}), ...override};
            const ut = resolved.unitType || "reps+kg";
            const isTimeBased = ut==="secs"||ut==="mins";
            const isRepsOnly  = ut==="reps";
            const rows = getSetRows(ex);
            const unitLabel = ut==="secs"?"Sek":ut==="mins"?"Min":"Wdh";
            const anyWarmup = rows.some(r=>r.isWarmup);

            return (
              <div key={`${ex.eid}-${j}`} style={{
                background:T.bgAlt, borderRadius:12, padding:12, marginBottom:8,
                border:`1px solid ${anyWarmup ? T.orange+"44" : T.border}`,
              }}>
                {/* ── Header ── */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <div style={{fontSize:14,fontWeight:700,color:T.text}}>{resolved.name||"Unbekannte Übung"}</div>
                      {anyWarmup&&<span style={{fontSize:9,fontWeight:800,color:T.orange,background:T.orange+"22",border:`1px solid ${T.orange}44`,borderRadius:4,padding:"1px 5px"}}>WARM</span>}
                    </div>
                    <div style={{fontSize:11,color:T.sub,marginTop:1}}>{e?.cat} · {e?.eq}</div>
                  </div>
                  <div style={{display:"flex",gap:4,flexShrink:0,marginLeft:6}}>
                    <button onClick={()=>setInfoExId(ex.eid)} title="Übungsdetails"
                      style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:6,
                        padding:"2px 8px",cursor:"pointer",color:T.blue,fontSize:12,fontWeight:700}}>ℹ</button>
                    <button onClick={()=>moveEx(activeDay,j,-1)} disabled={j===0}
                      style={{background:"none",border:`1px solid ${T.border}`,borderRadius:6,padding:"2px 7px",cursor:"pointer",color:j===0?T.muted:T.sub,fontSize:12}}>↑</button>
                    <button onClick={()=>moveEx(activeDay,j,+1)} disabled={j===days[activeDay].exercises.length-1}
                      style={{background:"none",border:`1px solid ${T.border}`,borderRadius:6,padding:"2px 7px",cursor:"pointer",color:j===days[activeDay].exercises.length-1?T.muted:T.sub,fontSize:12}}>↓</button>
                    <button onClick={()=>remEx(activeDay,j)}
                      style={{background:"none",border:"none",cursor:"pointer",color:T.red,fontSize:16,padding:"2px 4px"}}>✕</button>
                  </div>
                </div>

                {/* ── Pause & Note row ── */}
                <div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:5,flex:1}}>
                    <span style={{fontSize:11,color:T.muted,whiteSpace:"nowrap"}}>Pause</span>
                    <input type="number" value={ex.rest||0}
                      onChange={e=>updEx(activeDay,j,"rest",e.target.value)}
                      style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:7,
                        padding:"5px 6px",color:T.text,fontSize:13,fontWeight:700,
                        width:56,textAlign:"center",boxSizing:"border-box"}}/>
                    <span style={{fontSize:11,color:T.muted}}>Sek</span>
                  </div>
                  <div style={{flex:2}}>
                    <input value={ex.note||""} onChange={e=>updExNote(activeDay,j,e.target.value)}
                      placeholder="Notiz zur Übung…"
                      style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:7,
                        padding:"5px 8px",color:T.text,fontSize:12,width:"100%",
                        boxSizing:"border-box",outline:"none"}}/>
                  </div>
                </div>

                {/* ── Per-set rows ── */}
                {rows.map((row, si) => {
                  const warmupColor = row.isWarmup ? T.orange : null;
                  return (
                    <div key={si} style={{
                      display:"grid",
                      gridTemplateColumns: isTimeBased||isRepsOnly
                        ? "28px 1fr 32px 32px"
                        : "28px 1fr 20px 1fr 32px 32px",
                      gap:5, alignItems:"center", marginBottom:6,
                    }}>
                      {/* Set badge */}
                      <div style={{
                        width:28,height:32,borderRadius:7,fontSize:11,fontWeight:800,
                        display:"flex",alignItems:"center",justifyContent:"center",
                        background: row.isWarmup ? T.orange+"22" : T.bgInput,
                        color: row.isWarmup ? T.orange : T.muted,
                        border:`1px solid ${row.isWarmup ? T.orange+"55" : T.border}`,
                      }}>{si+1}</div>

                      {/* Fields */}
                      {isTimeBased ? (
                        <div style={{display:"flex",alignItems:"center",gap:4}}>
                          <input type="number" value={row.reps}
                            onChange={e=>updSetRow(activeDay,j,si,"reps",e.target.value)}
                            style={{background:T.bgInput,border:`1px solid ${T.teal}55`,borderRadius:7,
                              padding:"6px 4px",color:T.teal,fontSize:14,fontWeight:700,
                              textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                          <span style={{fontSize:11,color:T.teal,fontWeight:700,whiteSpace:"nowrap"}}>{unitLabel}</span>
                        </div>
                      ) : isRepsOnly ? (
                        <div style={{display:"flex",alignItems:"center",gap:4}}>
                          <input type="number" value={row.reps}
                            onChange={e=>updSetRow(activeDay,j,si,"reps",e.target.value)}
                            style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:7,
                              padding:"6px 4px",color:T.text,fontSize:14,fontWeight:700,
                              textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                          <span style={{fontSize:11,color:T.sub,fontWeight:700}}>Wdh</span>
                        </div>
                      ) : (<>
                        <div style={{display:"flex",alignItems:"center",gap:3}}>
                          <input type="number" value={row.weight}
                            onChange={e=>updSetRow(activeDay,j,si,"weight",e.target.value)}
                            style={{background:T.bgInput,border:`1px solid ${warmupColor ? T.orange+"55" : T.border}`,borderRadius:7,
                              padding:"6px 4px",color:warmupColor||T.text,fontSize:14,fontWeight:700,
                              textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                          <span style={{fontSize:11,color:T.sub,fontWeight:700}}>kg</span>
                        </div>
                        <span style={{textAlign:"center",color:T.muted,fontSize:12}}>×</span>
                        <div style={{display:"flex",alignItems:"center",gap:3}}>
                          <input type="number" value={row.reps}
                            onChange={e=>updSetRow(activeDay,j,si,"reps",e.target.value)}
                            style={{background:T.bgInput,border:`1px solid ${warmupColor ? T.orange+"55" : T.border}`,borderRadius:7,
                              padding:"6px 4px",color:warmupColor||T.text,fontSize:14,fontWeight:700,
                              textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                          <span style={{fontSize:11,color:T.sub,fontWeight:700}}>Wdh</span>
                        </div>
                      </>)}

                      {/* Warmup toggle */}
                      <button
                        onClick={()=>updSetRow(activeDay,j,si,"isWarmup",!row.isWarmup)}
                        title={row.isWarmup?"Als Arbeitssatz":"Als Warm-up-Satz"}
                        style={{
                          width:32,height:32,borderRadius:7,border:`1px solid ${row.isWarmup?T.orange:T.border}`,
                          background:row.isWarmup?T.orange+"33":T.bgInput,
                          color:row.isWarmup?T.orange:T.muted,
                          fontSize:13,cursor:"pointer",
                        }}>W</button>

                      {/* Remove set */}
                      <button
                        onClick={()=>removeSetRow(activeDay,j,si)}
                        title="Satz entfernen"
                        style={{
                          width:32,height:32,borderRadius:7,border:"none",
                          background:"none",color:T.muted,fontSize:15,cursor:"pointer",
                        }}>✕</button>
                    </div>
                  );
                })}

                {/* ── + Satz Button ── */}
                <button
                  onClick={()=>addSetRow(activeDay,j)}
                  style={{
                    width:"100%",marginTop:4,padding:"6px 0",
                    background:T.accent+"18",border:`1px dashed ${T.accent}55`,
                    borderRadius:8,color:T.accent,fontSize:12,fontWeight:700,cursor:"pointer",
                  }}>+ Satz</button>
              </div>
            );
          })}
          <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap"}}>
            <Btn v="secondary" onClick={()=>setShowDB(true)} style={{flex:"2 1 120px"}}>+ Übung hinzufügen</Btn>
            <Btn v="ghost" onClick={applyRestRules} style={{flex:"1 1 60px",fontSize:11,padding:"8px 4px"}}
              title="Pausen aller Übungen dieses Tages nach den Einstellungen setzen">
              Pausen
            </Btn>
            {(sessions||[]).length > 0 && (
              <Btn v="ghost" onClick={applyLastSession}
                style={{flex:"1 1 80px",fontSize:11,padding:"8px 4px",color:T.teal,borderColor:T.teal+"66"}}
                title="Gewicht, Wdh und Satzanzahl aus letztem Training übernehmen (planunabhängig)">
                Letztes Training
              </Btn>
            )}
          </div>
        </Card>
      )}
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// PLANS SCREEN  – mit Archiv, Kopieren, vollem Edit
// ═══════════════════════════════════════════════════════
const ProgressionTip = ({plan}) => {
  if (!plan || plan.id!=="pg2") return null;
  return (
    <div style={{padding:"12px 14px",background:"#3090FF18",borderRadius:12,border:`1px solid ${T.blue}44`,marginTop:12,fontSize:13,color:T.sub,lineHeight:1.7}}>
      <div style={{color:T.blue,fontWeight:800,marginBottom:4}}>PROGRESSIONSPRINZIP</div>
      <b style={{color:T.text}}>Ziel:</b> Alle Arbeitssätze sauber → dann +2,5 kg (Maschinen) / +5 kg (Beinpresse).<br/>
      <b style={{color:T.text}}>Deload:</b> Alle 4 Wochen 10% weniger Gewicht, gleiche Wdh.<br/>
      <b style={{color:T.text}}>Rotation:</b> Tag A → B → C → Pause → wiederholen.
    </div>
  );
};

const PlansScreen = ({plans, setPlans, allExercises, exerciseOverrides, setExerciseOverrides, customExercises, setCustomExercises, onSelectPlan, settings, sessions}) => {
  const [view,setView]     = useState("list"); // list | detail | edit
  const [showArchive,setShowArchive] = useState(false);
  const [sel,setSel]       = useState(null);
  const [editing,setEditing] = useState(null);

  const activePlans   = plans.filter(p=>!p.archived);
  const archivedPlans = plans.filter(p=>p.archived);

  const save  = p => { setPlans(prev=>prev.some(x=>x.id===p.id)?prev.map(x=>x.id===p.id?p:x):[...prev,p]); setView("list"); };
  const del   = id => { if(!window.confirm("Plan wirklich löschen?")) return; setPlans(prev=>prev.filter(x=>x.id!==id)); setView("list"); };
  const archive = id => setPlans(prev=>prev.map(p=>p.id===id?{...p,archived:!p.archived}:p));
  const copy  = id => {
    const src = plans.find(p=>p.id===id);
    if (!src) return;
    const newPlan = {
      ...JSON.parse(JSON.stringify(src)),
      id: uid(),
      name: `${src.name} (Kopie)`,
      archived: false,
    };
    // New IDs for days
    newPlan.days = newPlan.days.map(d=>({...d,id:uid()}));
    setPlans(prev=>[...prev,newPlan]);
  };

  if (view==="edit") return (
    <PlanEditor
      plan={editing}
      allExercises={allExercises}
      exerciseOverrides={exerciseOverrides}
      setExerciseOverrides={setExerciseOverrides}
      customExercises={customExercises}
      setCustomExercises={setCustomExercises}
      onSave={save}
      onCancel={()=>setView(editing?"detail":"list")}
      settings={settings}
      sessions={sessions}
    />
  );

  if (view==="detail" && sel) {
    const plan = plans.find(p=>p.id===sel);
    if (!plan) { setView("list"); return null; }
    return (
      <div style={{padding:"0 16px 24px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"20px 0 14px"}}>
          <Btn v="ghost" onClick={()=>setView("list")} style={{padding:"8px 14px"}}>←</Btn>
          <div style={{flex:1,fontSize:18,fontWeight:900,color:T.text}}>{plan.name}</div>
          <Btn v="ghost" onClick={()=>{setEditing(plan);setView("edit");}} style={{padding:"8px 14px"}}>✎</Btn>
        </div>
        {plan.archived&&<Badge color={T.muted} style={{marginBottom:10}}>Archiviert</Badge>}
        {plan.desc&&<div style={{fontSize:13,color:T.sub,marginBottom:4}}>{plan.desc}</div>}
        {plan.id==="pg2"&&<ProgressionTip plan={plan}/>}
        <div style={{height:12}}/>

        {plan.days.map(day=>(
          <Card key={day.id} style={{marginBottom:10}}>
            <div style={{fontSize:15,fontWeight:700,color:T.accent,marginBottom:10}}>{day.name}</div>
            {day.exercises.map((ex,i)=>{
              const e=allExercises.find(x=>x.id===ex.eid);
              const unitType = e?.unitType || "reps";
              return (
                <div key={`${ex.eid}-${i}`} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"8px 0",borderBottom:i<day.exercises.length-1?`1px solid ${T.border}`:"none"}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:T.text}}>{e?.name||"Unbekannte Übung"}</div>
                    <div style={{fontSize:11,color:T.sub}}>{e?.eq}{ex.note&&<span style={{color:T.muted}}> · {ex.note}</span>}</div>
                  </div>
                  <div style={{textAlign:"right",marginLeft:8}}>
                    <div style={{fontSize:13,fontWeight:700,color:T.text}}>
                      {ex.sets}×{fmtRepsVal(ex.reps, unitType)}{ex.weight>0&&unitType==="reps"?` @ ${ex.weight}kg`:""}
                    </div>
                    {ex.rest>0&&<div style={{fontSize:10,color:T.muted}}>{ex.rest}s Pause</div>}
                  </div>
                </div>
              );
            })}
          </Card>
        ))}

        {/* Action buttons */}
        <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
          <Btn v="ghost" onClick={()=>copy(plan.id)} style={{flex:1,padding:"10px 8px",fontSize:13}}>Kopieren</Btn>
          <Btn v="ghost" onClick={()=>{archive(plan.id);setView("list");}} style={{flex:1,padding:"10px 8px",fontSize:13}}>
            {plan.archived?"Aktivieren":"Archivieren"}
          </Btn>
          <Btn v="danger" onClick={()=>del(plan.id)} style={{flex:1,padding:"10px 8px",fontSize:13}}>Löschen</Btn>
        </div>
        {!plan.archived&&(
          <Btn onClick={()=>onSelectPlan(plan.id)} full style={{padding:14,marginTop:10}}>▶ Trainieren</Btn>
        )}
      </div>
    );
  }

  // List view
  const renderPlan = plan => (
    <Card key={plan.id} onClick={()=>{setSel(plan.id);setView("detail");}} style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
            <div style={{fontSize:16,fontWeight:700,color:T.text}}>{plan.name}</div>
            {plan.id==="pg1"&&<Badge color={T.orange}>GAINSFIRE</Badge>}
          </div>
          <div style={{fontSize:12,color:T.sub,marginBottom:6}}>{plan.desc}</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <Badge color={T.blue}>{plan.days.length} {plan.days.length===1?"Tag":"Tage"}</Badge>
            <Badge color={T.purple}>{plan.days.reduce((s,d)=>s+d.exercises.length,0)} Übungen</Badge>
          </div>
        </div>
        <span style={{fontSize:22,color:T.muted,marginLeft:8}}>›</span>
      </div>
    </Card>
  );

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"22px 0 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:24,fontWeight:900,color:T.text}}>Trainingspläne</div>
        <Btn v="secondary" onClick={()=>{setEditing(null);setView("edit");}} style={{padding:"8px 16px",fontSize:13}}>+ Neu</Btn>
      </div>

      {activePlans.length===0&&(
        <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16,marginBottom:12}}>Noch keine aktiven Pläne.</div>
      )}
      {activePlans.map(renderPlan)}

      {archivedPlans.length>0&&(
        <>
          <button onClick={()=>setShowArchive(s=>!s)} style={{background:"none",border:"none",cursor:"pointer",color:T.sub,fontSize:13,fontWeight:700,padding:"8px 0",width:"100%",textAlign:"left"}}>
            Archiv ({archivedPlans.length}) {showArchive?"▲":"▼"}
          </button>
          {showArchive && archivedPlans.map(renderPlan)}
        </>
      )}
    </div>
  );
};

// ─────────────────────────────────────────────────────────────────────
// WorkoutExerciseCard – extracted so hooks (useState) are valid
// Fix: React.useState must not be called inside .map()
// ─────────────────────────────────────────────────────────────────────
const WorkoutExerciseCard = ({
  // New grouped props
  eid, warmupEntries=[], workEntries=[],
  // Legacy single-entry props (kept for backward compat, derived below)
  planEx: _planExLegacy, planExIdx: _planExIdxLegacy,
  allExercises, exerciseOverrides,
  sets, toggle, upd, addSet, setExTimer, exTimer, settings, sessions,
  onDeloadApplied,
}) => {
  // Derive primary (work) entry – first work entry, or first warmup if no work entries
  const primaryEntry = workEntries[0] || warmupEntries[0] || {planEx:_planExLegacy, planExIdx:_planExIdxLegacy};
  const planEx    = primaryEntry.planEx;
  const planExIdx = primaryEntry.planExIdx;

  // All entries combined for done-counting
  const allEntries = [...warmupEntries, ...workEntries];
  const allIkeys   = allEntries.map(e => instKey(e.planEx.eid, e.planExIdx));

  const ikey     = instKey(planEx.eid, planExIdx);
  const exercise = (allExercises||[]).find(e=>e.id===(eid||planEx.eid));
  const override = exerciseOverrides?.[eid||planEx.eid] || {};
  const resolved = {...(exercise||{}), ...override};

  // Sets for the primary work entry (used for suggestion, deload etc.)
  const exSets   = sets[ikey]||[];
  // All sets across all entries in this group
  const allGroupSets = allIkeys.flatMap(k => sets[k]||[]);
  const doneCount= allGroupSets.filter(s=>s.done).length;
  const totalSets= allGroupSets.length;
  const allDone  = totalSets>0 && allGroupSets.every(s=>s.done);

  const unitType = resolved.unitType || "reps+kg";
  const isTimeBased  = unitType === "secs" || unitType === "mins";
  const isRepsOnly   = unitType === "reps";
  // incr kept for potential other uses
  const incr = (() => {
    const rules = settings?.progressionSettings?.incrementRules || {};
    const eq = (exercise?.eq||"").toLowerCase();
    if (eq.includes("maschine"))   return rules.machine   ?? 2.5;
    if (eq.includes("kabel"))      return rules.cable     ?? 2.5;
    if (eq.includes("kurkhantel")) return rules.dumbbell  ?? 1;
    if (eq.includes("langhantel")) return rules.barbell   ?? 2.5;
    return rules.default ?? 2.5;
  })();
  const repLabel = repsFieldLabel(unitType);
  const hasExpandableInfo = !!(resolved.desc || resolved.link || resolved.img);
  const hasExtraInfo = hasExpandableInfo;
  const [showInfo, setShowInfo] = useState(false); // safe: called in component, not .map()
  // Deload hint: local editable weight, null = use calculated value
  const [deloadWeightEdit, setDeloadWeightEdit] = useState(null);
  const deloadActive = isDeloadActive(settings);
  const isWarmup = planEx?.isWarmup || false;
  // Calculate deload weight for this exercise
  const deloadWeight = useMemo(() => {
    if (!deloadActive || isWarmup || isTimeBased || isRepsOnly) return null;
    // Base: first undone set's current weight → last real work sets → plan weight
    const undone = exSets.find(s => !s.done && !s.isWarmup);
    const base = (undone?.weight > 0 ? undone.weight : 0)
      || (getLastWorkSets(planEx.eid, sessions||[])||[])[0]?.weight
      || planEx.weight
      || 0;
    if (base <= 0) return null;
    return applyDeloadToWeight(base, settings, exercise);
  }, [deloadActive, isWarmup, isTimeBased, isRepsOnly, planEx.eid, planEx.weight,
      exSets.map(s=>s.weight).join(), sessions?.length,
      JSON.stringify(settings?.progressionSettings)]);
  // Track if Übernehmen was clicked (for session.deloadApplied)
  const [deloadApplied, setDeloadApplied] = useState(false);
  // Punkt 9: auto-collapse on allDone, manual re-open stays open
  const [collapsed, setCollapsed]       = useState(false);
  const [manuallyOpened, setManuallyOpened] = useState(false);
  useEffect(() => {
    if (allDone && !manuallyOpened) setCollapsed(true);
    if (!allDone) { setCollapsed(false); setManuallyOpened(false); }
  }, [allDone]); // eslint-disable-line
  // Is the exercise timer currently running for this card?
  const isThisTimerActive = exTimer?.ikey === ikey;
  // Progression suggestion (only for strength exercises, computed once)
  const ps = getProgressionSettings(settings);
  const suggestion = useMemo(() => {
    if (!ps.showSuggestionsInWorkout || isTimeBased || isRepsOnly) return null;
    if (planEx?.isWarmup) return null;  // Aufwärmsätze nie Progression/Deload anzeigen
    return calculateProgressionSuggestion(planEx, exercise, sessions||[], settings);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [planEx?.eid, planExIdx, sessions?.length, JSON.stringify(settings?.progressionSettings)]);

  // Editable override values shown in the suggestion box before applying
  const [sugWeight, setSugWeight] = React.useState(null); // null = use suggestion value
  const [sugReps,   setSugReps]   = React.useState(null);

  // When suggestion changes, reset the edit fields
  React.useEffect(() => {
    setSugWeight(null);
    setSugReps(null);
  }, [suggestion?.suggestedWeight, suggestion?.suggestedReps]);

  // Apply suggestion to all sets of this exercise
  // Apply suggestion: update weight for all undone sets in one batched call.
  // If deload with set reduction (suggestedSets), also trim excess undone sets.
  const applySuggestion = () => {
    if (!suggestion) return;
    const ikey_ = instKey(planEx.eid, planExIdx);
    // Use edited values if the user adjusted them, otherwise fall back to suggestion
    const finalWeight = sugWeight !== null ? Number(sugWeight) : suggestion.suggestedWeight;
    const finalReps   = sugReps   !== null ? Number(sugReps)   : null; // reps editing optional
    setSets(prev => {
      const curSets  = prev[ikey_] || [];
      let updated    = curSets.map(s =>
        s.done ? s : {
          ...s,
          weight: finalWeight > 0 ? finalWeight : s.weight,
          ...(finalReps !== null && finalReps > 0 ? {reps: finalReps} : {}),
        }
      );
      // For deload with set reduction: keep done sets + trim undone sets to target count
      if (suggestion.isDeload && suggestion.suggestedSets != null) {
        const doneSets  = updated.filter(s => s.done);
        const undoneSets= updated.filter(s => !s.done);
        const keepUndone= Math.max(0, suggestion.suggestedSets - doneSets.length);
        updated = [...doneSets, ...undoneSets.slice(0, keepUndone)];
        // Always keep at least 1 set total
        if (updated.length === 0 && curSets.length > 0) updated = [curSets[0]];
      }
      return { ...prev, [ikey_]: updated };
    });
  };


  return (
    <Card key={ikey} style={{marginTop:12}}
      accent={allDone ? T.accentDim : isThisTimerActive ? T.blue : T.border}>

      {/* ── Header – always visible ─────────────────────────── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:collapsed?0:6}}>
        <div style={{flex:1}} onClick={()=>{
          if(collapsed){setCollapsed(false);setManuallyOpened(true);}
        }} style={{flex:1,cursor:collapsed?"pointer":"default"}}>
          <div style={{fontSize:15,fontWeight:700,color:allDone?T.accentDim:T.text,display:"flex",gap:6,alignItems:"center"}}>
            {resolved.name||"?"}
            {allDone && <span style={{fontSize:11,color:T.accentDim}}>✓</span>}
            {isThisTimerActive && <span style={{fontSize:11,color:T.blue,fontWeight:800}}>●</span>}
          </div>
          <div style={{fontSize:11,color:T.sub}}>
            {resolved.cat}{resolved.eq?` · ${resolved.eq}`:""}
            {planEx.rest>0&&` · ${planEx.rest}s Pause`}
            {/* Punkt 9: progress when collapsed */}
            {collapsed && exSets.length>0 && (
              <span style={{marginLeft:8,color:T.accentDim,fontWeight:700}}>
                {doneCount}/{exSets.length} Sätze
              </span>
            )}
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {hasExpandableInfo&&!collapsed&&(
            <button onClick={()=>setShowInfo(v=>!v)} style={{
              background:showInfo?T.blue+"33":T.bgAlt,
              border:`1px solid ${showInfo?T.blue+"88":T.border}`,
              borderRadius:7,padding:"3px 8px",cursor:"pointer",
              color:showInfo?T.blue:T.muted,fontSize:11,fontWeight:700,
            }}>ℹ</button>
          )}
          {/* Collapse toggle */}
          <button onClick={()=>{
            if(collapsed){setCollapsed(false);setManuallyOpened(true);}
            else setCollapsed(true);
          }} style={{background:"none",border:"none",cursor:"pointer",
            color:T.muted,fontSize:16,padding:"2px 4px",lineHeight:1}}>
            {collapsed?"▼":"▲"}
          </button>
          <Badge color={CAT_COLOR_EXT[resolved.cat]||T.accent}>{resolved.cat||"?"}</Badge>
        </div>
      </div>

      {/* ── Collapsible body ────────────────────────────────── */}
      {!collapsed && (<>

        {/* Trainingsnotiz */}
        {resolved.trainingsnotiz&&(
          <div style={{fontSize:11,color:T.teal,marginBottom:6,padding:"4px 8px",
            background:T.teal+"15",borderRadius:6,border:`1px solid ${T.teal}33`}}>
            Notiz: {resolved.trainingsnotiz}
          </div>
        )}
        {planEx.isWarmup&&(
          <div style={{fontSize:10,color:T.orange,fontWeight:700,marginBottom:4}}>
            Warm-up-Satz
          </div>
        )}
        {/* Deload ↓ bar – compact, only during active deload for weight exercises */}
        {deloadActive && !isWarmup && !isTimeBased && !isRepsOnly && deloadWeight !== null && (
          <div style={{
            display:"flex", alignItems:"center", gap:8, marginBottom:8,
            padding:"7px 10px", borderRadius:9,
            background:T.orange+"18", border:`1px solid ${T.orange}44`,
          }}>
            <span style={{fontSize:12,color:T.orange,fontWeight:800,whiteSpace:"nowrap"}}>Deload ↓</span>
            <input
              type="number"
              value={deloadWeightEdit !== null ? deloadWeightEdit : (deloadWeight || "")}
              onChange={e => setDeloadWeightEdit(e.target.value)}
              style={{
                width:62, padding:"4px 6px", textAlign:"center",
                borderRadius:7, border:`1.5px solid ${T.orange}88`,
                background:T.orange+"14", color:T.orange,
                fontSize:15, fontWeight:800,
              }}
            />
            <span style={{fontSize:12,color:T.orange,fontWeight:700}}>kg</span>
            <button
              onClick={() => {
                const finalW = parseFloat(deloadWeightEdit !== null ? deloadWeightEdit : deloadWeight);
                if (!finalW || finalW <= 0) return;
                const ikey_ = instKey(planEx.eid, planExIdx);
                const cur = sets[ikey_] || [];
                // Only update: non-warmup, not done, weight-based sets
                cur.forEach((s, si) => {
                  if (!s.isWarmup && !s.done && !isTimeBased) {
                    upd(ikey_, si, "weight", finalW);
                  }
                });
                setDeloadWeightEdit(null);
                if (onDeloadApplied) onDeloadApplied();
              }}
              style={{
                marginLeft:"auto", flexShrink:0,
                background:T.orange, color:"#07070F", border:"none",
                borderRadius:8, padding:"5px 12px", fontSize:12, fontWeight:800, cursor:"pointer",
              }}
            >Übernehmen</button>
          </div>
        )}

        {/* Warm-up sets section – rendered inline before work sets */}
        {warmupEntries.length > 0 && warmupEntries.map(({planEx:wex, planExIdx:wIdx}) => {
          const wikey = instKey(wex.eid, wIdx);
          const wSets = sets[wikey]||[];
          const unitTypeW = resolved.unitType || "reps+kg";
          const isTimeW = unitTypeW==="secs"||unitTypeW==="mins";
          return (
            <div key={wikey} style={{marginBottom:8}}>
              <div style={{fontSize:10,color:T.orange,fontWeight:600,marginBottom:4}}>Warm-up</div>
              {wSets.map((s, si) => (
                <div key={si} style={{
                  display:"grid",
                  gridTemplateColumns: isTimeW ? "1fr 36px" : "1fr 20px 1fr 36px",
                  gap:5, alignItems:"center", marginBottom:5,
                }}>
                  {isTimeW ? (
                    <div style={{display:"flex",alignItems:"center",gap:4}}>
                      <input type="number" inputMode="numeric" value={s.reps}
                        onChange={e=>upd(wikey,si,"reps",e.target.value)}
                        style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:7,
                          padding:"6px 4px",color:T.text,fontSize:14,fontWeight:700,
                          textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                      <span style={{fontSize:11,color:T.sub,fontWeight:700}}>{unitTypeW==="secs"?"Sek":"Min"}</span>
                    </div>
                  ) : (<>
                    <div style={{display:"flex",alignItems:"center",gap:4}}>
                      <input type="number" inputMode="decimal" value={s.weight}
                        onChange={e=>upd(wikey,si,"weight",e.target.value)}
                        style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:7,
                          padding:"6px 4px",color:T.text,fontSize:14,fontWeight:700,
                          textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                      <span style={{fontSize:11,color:T.sub,fontWeight:700}}>kg</span>
                    </div>
                    <span style={{textAlign:"center",color:T.muted,fontSize:12}}>×</span>
                    <div style={{display:"flex",alignItems:"center",gap:4}}>
                      <input type="number" inputMode="numeric" value={s.reps}
                        onChange={e=>upd(wikey,si,"reps",e.target.value)}
                        style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:7,
                          padding:"6px 4px",color:T.text,fontSize:14,fontWeight:700,
                          textAlign:"center",width:"100%",boxSizing:"border-box"}}/>
                      <span style={{fontSize:11,color:T.sub,fontWeight:700}}>Wdh</span>
                    </div>
                  </>)}
                  <button onClick={()=>toggle(wikey,si,(settings?.restRules?.warmup ?? wex.rest ?? 30))}
                    style={{width:36,height:32,borderRadius:9,border:"none",cursor:"pointer",
                      background:s.done?T.orange+"44":T.bgAlt,
                      color:s.done?T.orange:T.sub, fontSize:14,fontWeight:700}}>
                    {s.done?"✓":"○"}
                  </button>
                </div>
              ))}
              {workEntries.length>0&&<div style={{height:1,background:T.border,margin:"8px 0"}}/>}
            </div>
          );
        })}

        {/* Set progress bar */}
        {workEntries.length > 0 && exSets.length > 0 && (
          <div style={{marginBottom:6}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
              <span style={{fontSize:10,color:T.sub}}>
                {exSets.filter(s=>s.done).length} / {planEx.sets||exSets.length} Sätze
              </span>
              {allDone && <span style={{fontSize:10,color:T.accent,fontWeight:700}}>✓ Fertig</span>}
            </div>
            <div style={{height:3,background:T.border,borderRadius:99,overflow:"hidden"}}>
              <div style={{
                height:3, borderRadius:99, background:allDone?T.accent:T.teal,
                width:`${(exSets.filter(s=>s.done).length/(planEx.sets||exSets.length))*100}%`,
                transition:"width 0.4s",
              }}/>
            </div>
          </div>
        )}
        {planEx.note&&(
          <div style={{fontSize:10,color:T.muted,marginBottom:6}}>{planEx.note}</div>
        )}

        {/* ── Progression hint – compact single line ── */}
        {suggestion && !deloadActive && (()=>{
          const accent = suggestion.action==="increase" ? T.teal : T.muted;
          if (suggestion.action !== "increase") return null;
          return (
            <div style={{
              display:"flex", alignItems:"center", justifyContent:"space-between",
              marginBottom:6, padding:"6px 10px", borderRadius:8,
              background:T.teal+"14", border:`1px solid ${T.teal}33`,
            }}>
              <span style={{fontSize:11,color:T.teal,fontWeight:800}}>↑ {suggestion.suggestedWeight} kg möglich</span>
              <button onClick={applySuggestion} style={{
                background:T.teal,color:"#07070F",border:"none",borderRadius:6,
                padding:"4px 10px",fontSize:11,fontWeight:800,cursor:"pointer",
              }}>Übernehmen</button>
            </div>
          );
        })()}

        {/* Extra info badges */}
        {hasExtraInfo&&(
          <div style={{display:"flex",gap:5,marginBottom:6,flexWrap:"wrap"}}>
            {resolved.img&&<span style={{fontSize:10,color:T.purple,background:T.purple+"18",border:`1px solid ${T.purple}44`,borderRadius:5,padding:"1px 6px",fontWeight:700}}>Bild</span>}
            {resolved.desc&&<span style={{fontSize:10,color:T.blue,background:T.blue+"18",border:`1px solid ${T.blue}44`,borderRadius:5,padding:"1px 6px",fontWeight:700}}>Info</span>}
            {resolved.link&&<span style={{fontSize:10,color:T.teal,background:T.teal+"18",border:`1px solid ${T.teal}44`,borderRadius:5,padding:"1px 6px",fontWeight:700}}>Video</span>}
          </div>
        )}

        {/* Expandable info panel */}
        {showInfo&&(
          <div style={{marginBottom:10,padding:"10px 12px",background:T.bgAlt,borderRadius:10,border:`1px solid ${T.border}`}}>
            {resolved.img&&<img src={resolved.img} alt={resolved.name} style={{width:"100%",borderRadius:8,maxHeight:160,objectFit:"cover",marginBottom:8}}/>}
            {resolved.desc&&<div style={{fontSize:12,color:T.sub,lineHeight:1.6,marginBottom:resolved.link?8:0}}>{resolved.desc}</div>}
            {resolved.link&&<a href={resolved.link} target="_blank" rel="noreferrer"
              style={{display:"flex",alignItems:"center",gap:6,padding:"7px 10px",background:T.bgCard,borderRadius:8,color:T.blue,fontSize:12,fontWeight:700,textDecoration:"none",marginTop:resolved.desc?6:0}}>
              Anleitungsvideo
            </a>}
          </div>
        )}

        {/* ── Set rows (Points 2,3,4,5,6,7) ──────────────── */}
        {exSets.map((s,i)=>{
          // Point 4: track extra (user-added) sets by planEx.sets
          const isExtra = i >= (planEx.sets || 0);
          const startTimer = () => {
            const targetSecs = unitType==="mins" ? (s.reps||1)*60 : (s.reps||30);
            setExTimer({ikey, setIdx:i, targetSecs, restSecs:planEx.rest||0});
          };
          const handleDone = () => {
            if (isTimeBased && !s.done) startTimer();
            else toggle(ikey, i, planEx.rest);
          };
          return (
            <div key={i} style={{
              display:"grid",
              // Point 2+3: no summary column, no left check – just [num] [fields…] [✓]
              gridTemplateColumns: (isTimeBased || isRepsOnly) ? "30px 1fr 38px" : "30px 1fr 24px 1fr 38px",
              alignItems:"center", gap:5, marginBottom:7,
              opacity:s.done ? 0.45 : 1,
            }}>

              {/* Set number badge – no click handler (Point 3: left check removed) */}
              <div style={{
                width:30, height:34, borderRadius:8,
                background: s.done ? T.accent+"22"
                  : isThisTimerActive && exTimer?.setIdx===i ? T.blue+"33"
                  : T.bgInput,
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:12, fontWeight:800,
                color: s.done ? T.accentDim
                  : isThisTimerActive && exTimer?.setIdx===i ? T.blue
                  : T.muted,
                border:`1px solid ${s.done ? T.accent+"44" : T.border}`,
              }}>
                {s.done ? "✓" : isThisTimerActive && exTimer?.setIdx===i ? "▶" : i+1}
              </div>

              {isTimeBased ? (
                /* Point 7: time exercises – editable number input with Sek/Min unit label */
                <div style={{display:"flex", alignItems:"center", gap:4}}>
                  <input
                    type="number"
                    value={s.reps}
                    onChange={e => upd(ikey, i, "reps", e.target.value)}
                    style={{
                      background:T.bgInput, border:`1px solid ${T.teal}55`,
                      borderRadius:8, padding:"8px 6px",
                      color:T.teal, fontSize:15, fontWeight:700,
                      textAlign:"center", width:"100%", boxSizing:"border-box",
                    }}
                  />
                  <span style={{fontSize:11, color:T.teal, fontWeight:700, whiteSpace:"nowrap"}}>
                    {unitType==="mins" ? "Min" : "Sek"}
                  </span>
                </div>
              ) : isRepsOnly ? (
                /* Nur Wiederholungen, kein Gewicht */
                <div style={{display:"flex", alignItems:"center", gap:4}}>
                  <input
                    type="number"
                    value={s.reps}
                    onChange={e => upd(ikey, i, "reps", e.target.value)}
                    style={{
                      background:T.bgInput, border:`1px solid ${T.border}`,
                      borderRadius:8, padding:"8px 6px",
                      color:T.text, fontSize:15, fontWeight:700,
                      textAlign:"center", width:"100%", boxSizing:"border-box",
                    }}
                  />
                  <span style={{fontSize:11, color:T.sub, fontWeight:700, whiteSpace:"nowrap"}}>Wdh</span>
                </div>
              ) : (
                /* Standard: Gewicht × Wiederholungen */
                <>
                  {/* Weight field – direct input, no +/- buttons */}
                  <div style={{display:"flex", alignItems:"center", gap:4}}>
                    <input
                      type="number"
                      inputMode="decimal"
                      value={s.weight}
                      onChange={e => upd(ikey, i, "weight", e.target.value)}
                      style={{
                        background:T.bgInput, border:`1px solid ${T.border}`,
                        borderRadius:8, padding:"8px 4px",
                        color:T.text, fontSize:15, fontWeight:700,
                        textAlign:"center", width:"100%", boxSizing:"border-box",
                      }}
                    />
                    <span style={{fontSize:12, color:T.sub, fontWeight:700, whiteSpace:"nowrap"}}>kg</span>
                  </div>
                  <span style={{textAlign:"center", color:T.muted, fontSize:12}}>×</span>
                  {/* Reps field with "Wdh" label */}
                  <div style={{display:"flex", alignItems:"center", gap:3}}>
                    <input
                      type="number"
                      value={s.reps}
                      onChange={e => upd(ikey, i, "reps", e.target.value)}
                      style={{
                        background:T.bgInput, border:`1px solid ${T.border}`,
                        borderRadius:8, padding:"8px 4px",
                        color:T.text, fontSize:15, fontWeight:700,
                        textAlign:"center", width:"100%", boxSizing:"border-box",
                      }}
                    />
                    <span style={{fontSize:11, color:T.sub, fontWeight:700, whiteSpace:"nowrap"}}>Wdh</span>
                  </div>
                </>
              )}

              {/* Point 3+5: right done/start button only, slightly larger touch target */}
              <button
                onClick={handleDone}
                style={{
                  width:38, height:38, borderRadius:9, border:"none", cursor:"pointer",
                  background: s.done ? T.accent+"44"
                    : isTimeBased ? T.blue+"44"
                    : T.bgAlt,
                  color: s.done ? T.accent
                    : isTimeBased ? T.blue
                    : T.sub,
                  fontSize:16, fontWeight:700,
                }}
              >
                {s.done ? "✓" : isTimeBased ? "▶" : "○"}
              </button>

            </div>
          );
        })}

        {/* Point 4+6: + Satz button (left, prominent) + delete extra set button */}
        {(()=>{
          const extraSets = exSets.filter((_,i) => i >= (planEx.sets||0));
          const hasExtra  = extraSets.length > 0;
          return (
            <div style={{display:"flex", gap:6, marginTop:4}}>
              <button
                onClick={()=>addSet(ikey, planEx)}
                style={{
                  background:T.accent+"22", border:`1px solid ${T.accent}55`,
                  borderRadius:8, padding:"7px 14px",
                  color:T.accent, fontSize:12, fontWeight:700,
                  cursor:"pointer", flexShrink:0,
                }}
              >+ Satz</button>
              {hasExtra && (
                <button
                  onClick={()=>{
                    // Remove last extra (undone preferred, else last)
                    setSets(prev => {
                      const cur = [...(prev[ikey]||[])];
                      // Find last undone extra set index
                      let target = -1;
                      for (let i=cur.length-1; i>=(planEx.sets||0); i--) {
                        if (!cur[i].done) { target=i; break; }
                      }
                      if (target === -1) target = cur.length - 1; // fallback: last set
                      if (target < (planEx.sets||0)) return prev;  // safety: never delete planned
                      const next = cur.filter((_,i)=>i!==target);
                      return {...prev, [ikey]: next};
                    });
                  }}
                  style={{
                    background:T.red+"22", border:`1px solid ${T.red}55`,
                    borderRadius:8, padding:"7px 10px",
                    color:T.red, fontSize:12, fontWeight:700,
                    cursor:"pointer", flexShrink:0,
                  }}
                >− Zusatz</button>
              )}
            </div>
          );
        })()}

      </>)}
    </Card>
  );
};
// ═══════════════════════════════════════════════════════
// WORKOUT SCREEN  – mit localStorage Session-Recovery
// ═══════════════════════════════════════════════════════
const WS_KEY = "ft5_active_workout";

function saveWorkoutDraft(draft) {
  try { localStorage.setItem(WS_KEY, JSON.stringify(draft)); } catch {}
}
function loadWorkoutDraft() {
  try {
    const v = localStorage.getItem(WS_KEY);
    if (!v) return null;
    const d = JSON.parse(v);
    // Fix 6 migration: old drafts used eid as key (no "__"), discard them
    if (d?.sets && Object.keys(d.sets).some(k => !k.includes("__"))) {
      localStorage.removeItem(WS_KEY);
      return null;
    }
    return d;
  } catch { return null; }
}
function clearWorkoutDraft() {
  try { localStorage.removeItem(WS_KEY); } catch {}
}

const WorkoutScreen = ({plans, allExercises, exerciseOverrides, settings, sessions, onSave, preselectedPlanId, globalRest, setGlobalRest}) => {
  // Fix 3: only non-archived plans
  const activePlans = useMemo(() => (plans||[]).filter(p => !p.archived), [plans]);

  const draft = useMemo(() => loadWorkoutDraft(), []);
  const hasDraft = draft && draft.phase === "active";

  const [phase,setPhase]   = useState(() => hasDraft ? "active" : preselectedPlanId ? "preselect" : "select");
  const [planId,setPlanId] = useState(() => hasDraft ? draft.planId : (preselectedPlanId||null));
  const [dayId,setDayId]   = useState(() => hasDraft ? draft.dayId  : null);
  const [sets,setSets]     = useState(() => hasDraft ? (draft.sets||{}) : {});
  const [note,setNote]     = useState(() => hasDraft ? (draft.note||"") : "");
  const [deloadApplied, setDeloadApplied] = useState(false); // true when Übernehmen was clicked
  // rest timer is lifted to App via globalRest/setGlobalRest so it persists across tabs
  const rest    = globalRest;
  const setRest = setGlobalRest;
  // ExerciseTimer state: {ikey, setIdx, targetSecs} or null
  const [exTimer, setExTimer] = useState(null);
  const [warnEmpty,setWarnEmpty] = useState(false);
  // "confirm" phase: plan+day selected, user sees overview before officially starting
  const [confirmPlanId, setConfirmPlanId] = useState(null);
  const [confirmDayId,  setConfirmDayId]  = useState(null);

  const t0Ref    = useRef(null);
  const [elapsed,setElapsed] = useState(() => hasDraft ? (draft.elapsed||0) : 0);

  // Fix 2: sync preselectedPlanId prop changes without wiping active training
  const prevPreRef = useRef(preselectedPlanId);
  useEffect(() => {
    if (preselectedPlanId === prevPreRef.current) return;
    prevPreRef.current = preselectedPlanId;
    if (phase === "active" || phase === "done") return;
    if (preselectedPlanId) { setPlanId(preselectedPlanId); setPhase("preselect"); }
    else { setPhase("select"); }
  }, [preselectedPlanId]); // eslint-disable-line

  useEffect(() => {
    if (phase === "active" && t0Ref.current === null) {
      t0Ref.current = Date.now() - (elapsed * 1000);
    }
  }, [phase]);

  useEffect(() => {
    if (phase !== "active") return;
    const iv = setInterval(() => setElapsed(Math.floor((Date.now()-t0Ref.current)/1000)), 1000);
    return () => clearInterval(iv);
  }, [phase]);

  useEffect(() => {
    if (phase !== "active") return;
    saveWorkoutDraft({ phase:"active", planId, dayId, sets, note, elapsed });
  }, [phase, sets, note, elapsed, planId, dayId]);

  const start = (pId, dId) => {
    t0Ref.current = Date.now();
    setElapsed(0); setWarnEmpty(false);
    setPlanId(pId); setDayId(dId);
    const day = activePlans.find(p=>p.id===pId)?.days.find(d=>d.id===dId);
    if (!day) return;

    // Find the most recent session for this exact plan day to carry over per-set reps+weight
    const lastMatchSession = (sessions||[]).find(s => s.planId===pId && s.dayId===dId);

    const init = {};
    day.exercises.forEach((ex, exIdx) => {
      const key = instKey(ex.eid, exIdx);

      // Collect last session's sets for this exact exercise instance.
      // Match by planExIdx (same position in plan) so warmup and work entries
      // don't bleed into each other. Fall back to eid-only if planExIdx missing.
      const lastSets = lastMatchSession
        ? (lastMatchSession.sets||[]).filter(s =>
            s.eid === ex.eid &&
            s.done !== false &&
            (s.planExIdx !== undefined ? s.planExIdx === exIdx : true)
          )
        : [];

      // Build per-set reps + weight:
      // Priority: 1) last session values (per planExIdx), 2) plan setRows, 3) plan reps/weight
      const planRows = ex.setRows || [];
      init[key] = Array.from({length: ex.sets}, (_, i) => {
        const prev    = lastSets[i];
        const planRow = planRows[i];
        return {
          setN:     i+1,
          reps:     prev ? prev.reps   : (planRow?.reps   ?? ex.reps),
          weight:   prev ? prev.weight : (planRow?.weight ?? ex.weight),
          done:     false,
          planNote:  ex.note || null,
          planExIdx: exIdx,
          isWarmup:  planRow?.isWarmup ?? (i === 0 && !!ex.isWarmup),
        };
      });
    });
    setSets(init); setPhase("active");
  };

  // Select a day → go to confirm screen first
  const selectDay = (pId, dId) => {
    setConfirmPlanId(pId);
    setConfirmDayId(dId);
    setPhase("confirm");
  };

  // Fix 1: ikey = instKey(eid, planExIdx) – unique per occurrence
  const toggle = (ikey, idx, restSecs) => setSets(prev => {
    if (!prev[ikey]?.[idx]) return prev;
    const upd = {...prev, [ikey]: prev[ikey].map((s,i) => i===idx ? {...s,done:!s.done} : s)};
    if (!prev[ikey][idx].done && restSecs>0) setRest({secs:restSecs});
    return upd;
  });
  const upd    = (ikey,idx,f,v) => setSets(p=>({...p,[ikey]:(p[ikey]||[]).map((s,i)=>i===idx?{...s,[f]:parseFloat(v)||0}:s)}));
  const addSet = (ikey,tmpl)    => setSets(p=>({...p,[ikey]:[...(p[ikey]||[]),{setN:(p[ikey]||[]).length+1,reps:tmpl.reps,weight:tmpl.weight,done:false}]}));

  const discardDraft = () => {
    if (!window.confirm(
      "Unterbrochenes Training verwerfen?\n\n" +
      "Alle bisher eingetragenen Sätze dieses Trainings gehen dabei verloren."
    )) return;
    clearWorkoutDraft(); t0Ref.current = null;
    setPlanId(preselectedPlanId||null);
    setDayId(null); setSets({}); setNote(""); setElapsed(0);
    setPhase(preselectedPlanId ? "preselect" : "select");
  };

  const finish = () => {
    const day = activePlans.find(p=>p.id===planId)?.days.find(d=>d.id===dayId);
    if (!day) return;
    const allSets = [];
    day.exercises.forEach((ex, exIdx) => {
      const key = instKey(ex.eid, exIdx);
      (sets[key]||[]).filter(s=>s.done).forEach(s => allSets.push({eid:ex.eid,...s}));
    });
    if (allSets.length === 0) { setWarnEmpty(true); return; }
    setWarnEmpty(false); clearWorkoutDraft();

    // Determine deload flags
    const deloadCurrentlyActive = isDeloadActive(settings);
    let sessionIsDeload   = deloadCurrentlyActive;
    let sessionDeloadApplied = deloadApplied; // set to true when Übernehmen was clicked

    // If deload is active but Übernehmen was NOT used, ask the user
