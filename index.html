  <meta name="theme-color" content="#07070F"/>
  <title>FitTrack</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{background:#07070F;height:100%;overscroll-behavior:none;}
    #root{height:100%;}
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
    input[type=number]{-moz-appearance:textfield;}
    input,button,select{font-family:-apple-system,'Helvetica Neue',sans-serif;}
    ::-webkit-scrollbar{display:none;}
    body{-webkit-font-smoothing:antialiased;}
  </style>
</head>
<body>
  <!-- Loading screen shown BEFORE Babel parses the JSX (can take 2-4s on mobile) -->
  <div id="boot-screen" style="
    position:fixed;inset:0;background:#07070F;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,Helvetica Neue,sans-serif;z-index:99999;
    transition:opacity 0.4s;">
    <div style="font-size:48px;margin-bottom:16px;">🏋</div>
    <div style="color:#C8FF00;font-size:22px;font-weight:900;letter-spacing:2px;margin-bottom:8px;">FITTRACK</div>
    <div style="color:#444466;font-size:13px;">Lädt…</div>
  </div>

  <div id="parse-error" style="
    display:none;position:fixed;inset:0;background:#07070F;
    padding:40px 24px;font-family:-apple-system,sans-serif;color:#E8E8F0;

const uid     = () => `${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
// Unique key per plan-exercise instance (fixes duplicate-exercise bug)
// Format: "eid__planIndex" e.g. "e36__0" and "e36__4" for warmup vs. worksets
const instKey = (eid, idx) => `${eid}__${idx}`;
const fmt     = s  => `${Math.floor(s/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;
const fmtD    = d  => new Date(d).toLocaleDateString("de-DE",{day:"numeric",month:"short",year:"numeric"});
const fmtDShort=d  => new Date(d).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
const dayKey  = d  => new Date(d).toDateString();

// [FIX 3] Zentrale ISO-Wochenfunktion (Montag-Start), genutzt überall
function isoWeekKey(date) {
  const dt = new Date(date);
  // ISO: Wochentag 1=Mo..7=So
  const dayOfWeek = dt.getDay() || 7;
  // Donnerstag dieser Woche → bestimmt das Jahr
  dt.setDate(dt.getDate() + 4 - dayOfWeek);
  const year = dt.getFullYear();
  const jan4 = new Date(year, 0, 4);
  const weekNum = Math.ceil(((dt - jan4) / 86400000 + 1) / 7);
  return `${year}-W${String(weekNum).padStart(2,"0")}`;
}

const isDone = s => s != null && s.done !== false;

// Central warmup detector – used by vol, getPRs, getWeeklySets, history, etc.
// Returns true when a set (and its exercise) represents a warmup/mobility set
// that must NOT influence strength stats, PRs or progression calculations.
function isWarmupSet(set, exercise) {
  const noteLC = (set?.planNote || set?.note || "").toLowerCase();
  if (noteLC.includes("eingewöhnung") || noteLC.includes("aufwärm") || noteLC.includes("warm")) return true;
  if (set?.isWarmup === true) return true;
  const cat = exercise?.cat || "";
  if (cat === "Aufwärmen" || cat === "Dehnung") return true;
  return false;
}

// vol() sums weight×reps for strength work-sets only (excludes warmup sets)
const vol = (sets, allExercises) => (Array.isArray(sets) ? sets : [])
  .filter(x => {
    if (!isDone(x) || (x.weight||0) <= 0) return false;
    const ex = allExercises ? (allExercises||[]).find(e=>e.id===x.eid) : null;
    return !isWarmupSet(x, ex);
  })
  .reduce((sum, x) => sum + (x.weight||0) * (x.reps||0), 0);

const calcKcal = (type, durationMin, bodyWeightKg) =>
  Math.round((CARDIO_MET[type]||5) * ((bodyWeightKg||75)/60) * (durationMin/60) * 60);

function calcStreak(sessions, cardio=[]) {
  const _sess = Array.isArray(sessions) ? sessions : [];
  const _card = Array.isArray(cardio)   ? cardio   : [];
  const allDates = [..._sess.map(s=>s.date), ..._card.map(c=>c.date)];
  if (!allDates.length) return 0;
  const days = [...new Set(allDates.map(d=>dayKey(d)))].sort((a,b)=>new Date(b)-new Date(a));
  let streak=0, cur=new Date(); cur.setHours(0,0,0,0);
  for (const d of days) {
    const dd=new Date(d); dd.setHours(0,0,0,0);
    if (Math.round((cur-dd)/86400000) <= 1) { streak++; cur=dd; } else break;
  }
  return streak;
}

// [FIX 3] Wochenstart Montag (DE/ISO)
function getWeekActivities(sessions, cardio=[]) {
  if (!Array.isArray(sessions)) return {sessions:[], cardio:[]};
  const now = new Date();
  const dow = now.getDay(); // 0=So
  const daysFromMon = dow === 0 ? 6 : dow - 1;
  const ws = new Date(now);
  ws.setDate(now.getDate() - daysFromMon);
  ws.setHours(0,0,0,0);
  return {
    sessions: sessions.filter(s => new Date(s.date) >= ws),
    cardio:   cardio.filter(c => new Date(c.date) >= ws),
  };
}

// getPRs – excludes warmup sets from personal records
function getPRs(sessions, allExercises) {
  const p = {};
  if (!Array.isArray(sessions)) return p;
  sessions.forEach(s => s.sets.forEach(x => {
    const ex = allExercises ? (allExercises||[]).find(e=>e.id===x.eid) : null;
    if (isDone(x) && x.weight > 0 && !isWarmupSet(x, ex) && (!p[x.eid] || x.weight > p[x.eid]))
      p[x.eid] = x.weight;
  }));
  return p;
}

// Muscle group membership by exercise category
const MUSCLE_GROUPS = {
  Brust:     { label:"Brust",    push:true,  upper:true,  targetSets:10 },
  Rücken:    { label:"Rücken",   pull:true,  upper:true,  targetSets:10 },
  Beine:     { label:"Beine",    push:false, upper:false, targetSets:10 },
  Schultern: { label:"Schultern",push:true,  upper:true,  targetSets:8  },
  Arme:      { label:"Arme",     push:false, upper:true,  targetSets:6  },
  Core:      { label:"Core",     core:true,  upper:false, targetSets:6  },
  Aufwärmen: { label:"Aufwärmen",mobility:true,           targetSets:0  },
  Dehnung:   { label:"Dehnung",  mobility:true,           targetSets:0  },
};

// Estimated 1RM using Epley formula
function calc1RM(weight, reps) {
  if (!weight || weight <= 0 || !reps || reps <= 0) return 0;
  return +(weight * (1 + reps / 30)).toFixed(1);
}

// Get all strength (weight>0, non-time) history for one exercise
function getExHistory(sessions, eid, allExercises) {
  const rows = [];
  const exercise = allExercises ? (allExercises||[]).find(e => e.id === eid) : null;
  sessions.forEach(s => {
    s.sets.filter(x =>
      isDone(x) && x.eid===eid && x.weight>0 && !isWarmupSet(x, exercise)
    ).forEach(x => {
      rows.push({ date:s.date, weight:x.weight, reps:x.reps,
                  vol:x.weight*x.reps, rm1:calc1RM(x.weight,x.reps) });
    });
  });
  return rows.sort((a,b)=>new Date(a.date)-new Date(b.date));
}

// Get time-exercise history (unitType secs/mins) for one exercise
function getTimeExHistory(sessions, eid) {
  const rows = [];
  sessions.forEach(s => {
    s.sets.filter(x => isDone(x) && x.eid===eid && x.reps>0 && (!x.weight||x.weight===0)).forEach(x => {
      rows.push({ date:s.date, reps:x.reps });
    });
  });
  return rows.sort((a,b)=>new Date(a.date)-new Date(b.date));
}

// Linear trend slope (positive = improving)
function calcTrend(values) {
  if (values.length < 2) return 0;
  const n = values.length;
  const xMean = (n-1)/2;
  const yMean = values.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  values.forEach((y,x)=>{ num+=(x-xMean)*(y-yMean); den+=(x-xMean)**2; });
  return den===0 ? 0 : num/den;
}

// % change between first and last value
function pctChange(arr) {
  if (arr.length < 2 || arr[0]===0) return null;
  return +((arr[arr.length-1]-arr[0])/arr[0]*100).toFixed(1);
}

// Best set for an exercise
function getBestSet(sessions, eid, allExercises) {
  let best = null;
  sessions.forEach(s => s.sets.filter(x => {
    if (!isDone(x) || x.eid !== eid || (x.weight||0) <= 0) return false;
    const ex = (allExercises||[]).find(e=>e.id===x.eid);
    return !isWarmupSet(x, ex);
  }).forEach(x => {
    if (!best || x.weight > best.weight) best = {...x, date:s.date};
  }));
  return best;
}

// Weekly set count per muscle group (last N weeks) – excludes warmup sets
function getWeeklySets(sessions, allExercises, weeksBack=1) {
  if (!Array.isArray(sessions)) return {};
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - weeksBack*7);
  const counts = {};
  Object.keys(MUSCLE_GROUPS).forEach(k => { counts[k]=0; });
  sessions
    .filter(s => new Date(s.date) >= cutoff)
    .forEach(s => s.sets.filter(isDone).forEach(x => {
      const ex = (allExercises||[]).find(e=>e.id===x.eid);
      if (isWarmupSet(x, ex)) return;           // exclude warmup/mobility
      const cat = ex?.cat;
      if (cat && counts[cat]!==undefined) counts[cat]++;
    }));
  return counts;
}

// Muscle status label
function getMuscleStatus(sets, target) {
  if (target===0) return null;
  const ratio = sets/target;
  if (ratio >= 1.4) return { label:"Sehr hoch", color:T.orange };
  if (ratio >= 0.8) return { label:"Optimal",   color:T.green  };
  if (ratio >= 0.4) return { label:"Niedrig",   color:T.blue   };
  return               { label:"Vernachlässigt",color:T.red    };
}

// Push/Pull/Upper/Lower ratios
function getPushPullRatio(sets) {
  const push = (sets.Brust||0) + (sets.Schultern||0);
  const pull = sets.Rücken||0;
  const total = push+pull;
  if (total===0) return null;
  return { push:+(push/total*100).toFixed(0), pull:+(pull/total*100).toFixed(0) };
}

// Days since each muscle group was last trained
function getLastTrainedDays(sessions, allExercises) {
  const last = {};
  [...sessions]
    .sort((a,b)=>new Date(b.date)-new Date(a.date))
    .forEach(s => s.sets.filter(isDone).forEach(x => {
      const ex = (allExercises||[]).find(e=>e.id===x.eid);
      if (isWarmupSet(x, ex)) return;   // Bug 2: exclude warmup from recovery tracking
      const cat = ex?.cat;
      if (cat && last[cat]===undefined) {
        const d = Math.floor((Date.now()-new Date(s.date))/86400000);
        last[cat] = d;
      }
    }));
  return last;
}

// Recovery status per muscle group
function getRecoveryStatus(daysSince) {
  if (daysSince === undefined) return { label:"Nicht trainiert", color:T.muted };
  if (daysSince < 1) return { label:"Heute trainiert – erholen",  color:T.orange };
  if (daysSince < 2) return { label:"Gestern – Erholung läuft",   color:T.blue   };
  if (daysSince < 4) return { label:"Bereit für nächste Einheit", color:T.green  };
  return                    { label:"Lange nicht trainiert",       color:T.red    };
}

// Weekly summary: volume, sessions, top muscle, records, cardio time
function buildWeeklySummary(sessions, cardio, allExercises) {
  if (!Array.isArray(sessions)) return {weekVol:0,weekTime:0,cardioMin:0,topMuscle:null,neglected:[],mobilityMins:0};
  const { sessions:ws, cardio:wc } = getWeekActivities(sessions, cardio);
  const weekVol   = ws.reduce((s,x)=>s+vol(x.sets,allExercises),0);
  const weekTime  = ws.reduce((s,x)=>s+(x.duration||0),0);
  const cardioMin = wc.reduce((s,c)=>s+(c.duration||0),0);
  const setCounts = getWeeklySets(sessions, allExercises, 1);
  const topMuscle = Object.entries(setCounts)
    .filter(([k])=>MUSCLE_GROUPS[k]&&!MUSCLE_GROUPS[k].mobility)
    .sort((a,b)=>b[1]-a[1])[0];
  const neglected = Object.entries(setCounts)
    .filter(([k,v])=>MUSCLE_GROUPS[k]&&!MUSCLE_GROUPS[k].mobility&&MUSCLE_GROUPS[k].targetSets>0&&v===0)
    .map(([k])=>k);
  const mobilityMins = ws.reduce((s,sess)=>{
    return s + sess.sets.filter(isDone).reduce((a,x)=>{
      const ex=(allExercises||[]).find(e=>e.id===x.eid);
      if(ex?.cat==="Dehnung"||ex?.cat==="Aufwärmen") return a+(x.reps||0);
      return a;
    },0);
  },0) / 60; // Fix 4: divide ONCE after outer reduce (secs→mins)
  return { weekVol, weekTime, cardioMin, topMuscle:topMuscle?.[0]||null,
           neglected, mobilityMins:+mobilityMins.toFixed(1),
           sessionCount:ws.length };
}

// Motivational recommendations (Punkt 10)
function buildRecommendations(sessions, cardio, allExercises, streak) {
  const tips = [];
  const sets4w = getWeeklySets(sessions, allExercises, 4);
  const { sessions:ws } = getWeekActivities(sessions, cardio);

  // Muscle imbalance
  const pushSets  = (sets4w.Brust||0)+(sets4w.Schultern||0);
  const pullSets  = sets4w.Rücken||0;
  if (pushSets > pullSets*1.5 && pullSets > 0)
    tips.push({ icon:"⚠️", text:"Du trainierst Push-Muskeln deutlich mehr als Pull. Mehr Rückenübungen wären ausgewogen." });
  else if (pullSets > pushSets*1.5 && pushSets > 0)
    tips.push({ icon:"⚠️", text:"Viel Rücken-Training – mehr Brust/Schulter würde das Gleichgewicht verbessern." });

  if ((sets4w.Beine||0) === 0 && sessions.length > 3)
    tips.push({ icon:"🦵", text:"Beine wurden kaum trainiert. Ein Bein-Tag würde die Balance deutlich verbessern." });

  if (streak >= 7)
    tips.push({ icon:"🔥", text:`${streak} Tage Serie – Ausnahme Konsistenz! Weiter so.` });
  else if (streak >= 3)
    tips.push({ icon:"⚡", text:`${streak} Tage am Stück – starker Start. Dranbleiben!` });

  if (ws.length >= 4)
    tips.push({ icon:"💪", text:"Sehr gute Woche – Wochenziel bereits erreicht oder übertroffen." });

  const cardioMin = cardio.filter(c=>{
    const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-7);
    return new Date(c.date)>=cutoff;
  }).reduce((s,c)=>s+(c.duration||0),0);
  if (cardioMin >= 90)
    tips.push({ icon:"🏃", text:`${cardioMin} Minuten Cardio diese Woche – top Ausdauerarbeit.` });
  else if (cardioMin === 0 && sessions.length > 2)
    tips.push({ icon:"🏃", text:"Kein Cardio diese Woche. Schon 20 Minuten verbessern Regeneration und Ausdauer." });

  if (tips.length === 0)
    tips.push({ icon:"✅", text:"Starke Trainingsbasis. Bleib konstant und steigere das Gewicht schrittweise." });

  return tips.slice(0,4);
}

// Newly unlocked badges (for overlay after session save)
function getNewlyUnlockedBadges(prevSessions, newSessions, metrics, streak, cardio, allDefs, allExercises=[]) {
  const before = new Set(allDefs.filter(a=>a.check(prevSessions,metrics,streak,cardio,allExercises)).map(a=>a.id));
  return allDefs.filter(a=>!before.has(a.id) && a.check(newSessions,metrics,streak,cardio,allExercises));
}

// PROGRESSION & DELOAD HELPERS
// ═══════════════════════════════════════════════════════

// Return merged progressionSettings with safe defaults
function getProgressionSettings(settings) {
  return {
    ...DEFAULT_SETTINGS.progressionSettings,
    ...(settings?.progressionSettings || {}),
    defaultRepRange: {
      ...DEFAULT_SETTINGS.progressionSettings.defaultRepRange,
      ...(settings?.progressionSettings?.defaultRepRange || {}),
    },
    incrementRules: {
      ...DEFAULT_SETTINGS.progressionSettings.incrementRules,
      ...(settings?.progressionSettings?.incrementRules || {}),
    },
  };
}

// Weight increment for an exercise based on its equipment
function getIncrementForExercise(exercise, settings) {
  const ps = getProgressionSettings(settings);
  const eq = exercise?.eq || "";
  if (eq === "Maschine")      return ps.incrementRules.machine;
  if (eq === "Kabel")         return ps.incrementRules.cable;
  if (eq === "Kurzhantel")    return ps.incrementRules.dumbbell;
  if (eq === "Langhantel")    return ps.incrementRules.barbell;
  if (eq === "Körpergewicht") return ps.incrementRules.bodyweight;
  return ps.incrementRules.default;
}

// Rep range for a given plan exercise (uses plan override or global settings)
function getRepRangeForPlanExercise(planExercise, settings) {
  const ps = getProgressionSettings(settings);
  return {
    min: planExercise?.repRangeMin ?? ps.defaultRepRange.min,
    max: planExercise?.repRangeMax ?? ps.defaultRepRange.max,
  };
}

// Round weight to nearest increment (e.g. 41.3 → 41.5 for 2.5 increment)
function roundWeight(weight, increment) {
  if (!increment || increment <= 0) return weight;
  return Math.round(weight / increment) * increment;
}

// Apply deload percentage to a weight
function applyDeloadToWeight(weight, settings, exercise) {
  const ps = getProgressionSettings(settings);
  if (!weight || weight <= 0) return 0;
  const factor = 1 - (ps.deloadPercent / 100);
  // Use device-specific increment when exercise is provided, else fall back to default
  const inc = exercise
    ? getIncrementForExercise(exercise, settings)
    : (ps.incrementRules?.default || 2.5);
  return roundWeight(weight * factor, inc);
}

// Central set-reduction for deload strategy "sets" and "both"
// Returns new set count, minimum 1.
function applyDeloadToSets(originalSets, reductionPercent) {
  if (!originalSets || originalSets < 1) return 1;
  const reduced = Math.floor(originalSets * (1 - reductionPercent / 100));
  return Math.max(1, reduced);
}

// Start a deload: sets lastDeloadDate + activeDeloadUntil in settings
// Returns the partial settings update to pass to onUpdate
function startDeload(settings) {
  const now = new Date();
  const until = new Date(now);
  until.setDate(until.getDate() + 7);
  return {
    lastDeloadDate:    now.toISOString(),
    activeDeloadUntil: until.toISOString(),
  };
}

// End a deload early
function endDeload() {
  return {
    activeDeloadUntil: null,
  };
}

// Is a deload currently active?
function isDeloadActive(settings) {
  if (!settings?.activeDeloadUntil) return false;
  return new Date(settings.activeDeloadUntil) > new Date();
}

// How many days remain in an active deload (0 if none)
function deloadDaysRemaining(settings) {
  if (!isDeloadActive(settings)) return 0;
  const ms = new Date(settings.activeDeloadUntil) - new Date();
  return Math.max(0, Math.ceil(ms / 86400000));
}

// Get strength history for one exercise – EXCLUDES warmup sets.
// Warmup detection (two independent guards – both must be absent to include a set):
//   1. planNote contains "eingewöhnung" or "warm" (copied from planEx.note in start())
//   2. Old sessions without planNote: sets whose weight is clearly the lowest weight
//      for that exercise in the same session are treated as warmup (heuristic).
function getExercisePerformanceHistory(eid, sessions, allExercises) {
  if (!eid || !sessions?.length) return [];
  const history = [];
  // Resolve the exercise object once for cat-based warmup detection
  const exercise = allExercises ? (allExercises||[]).find(e => e.id === eid) : null;

  [...sessions]
    .sort((a,b) => new Date(a.date) - new Date(b.date))
    .forEach(sess => {
      const allEidSets = sess.sets.filter(s => isDone(s) && s.eid === eid && (s.weight||0) > 0);
      if (!allEidSets.length) return;

      // Use isWarmupSet with resolved exercise for full warmup detection (note + cat)
      const workSets = allEidSets.filter(s => !isWarmupSet(s, exercise));

      if (workSets.length > 0) {
        history.push({
          date: sess.date,
          sets: workSets.map(s => ({ weight:s.weight, reps:s.reps||0 })),
        });
      }
    });

  return history;
}

// Core algorithm: calculate progression suggestion for one exercise
// Returns: { action, suggestedWeight, suggestedReps, reason, isDeload, confidence }
function calculateProgressionSuggestion(planExercise, exercise, sessions, settings, allExercises) {
  const ps = getProgressionSettings(settings);
  if (!ps.enabled) return null;

  const unitType = exercise?.unitType || "reps";
  // Only for strength (rep-based) exercises
  if (unitType !== "reps") return null;
  // Skip if the plan position itself is marked as warmup
  const planNoteLC = (planExercise?.note || "").toLowerCase();
  if (planNoteLC.includes("eingewöhnung") || planNoteLC.match(/warm.?up|aufwärm/)) return null;
  // Skip bodyweight exercises (increment = 0)
  const increment = getIncrementForExercise(exercise, settings);
  const repRange  = getRepRangeForPlanExercise(planExercise, settings);
  const eid       = planExercise?.eid;
  if (!eid) return null;

  const history = getExercisePerformanceHistory(eid, sessions, allExercises);
  if (history.length < (ps.minSessionsBeforeSuggestion || 2)) return null;

  // Check if deload is active
  if (isDeloadActive(settings) && ps.deloadEnabled) {
    const strategy   = ps.deloadStrategy || "weight";
    // Use last known weight from history if planExercise.weight is 0
    const history_   = getExercisePerformanceHistory(eid, sessions, allExercises);
    const baseWeight = (planExercise?.weight || 0) > 0
      ? planExercise.weight
      : (history_.length > 0 ? (history_[history_.length-1].sets[0]?.weight || 0) : 0);
    const deloadWt   = (strategy === "sets")
      ? baseWeight                                        // sets strategy: weight unchanged
      : applyDeloadToWeight(baseWeight, settings, exercise);        // weight / both: reduce weight
    const deloadSets = (strategy === "weight")
      ? (planExercise?.sets || 3)                         // weight strategy: sets unchanged
      : applyDeloadToSets(planExercise?.sets || 3, ps.volumeDeloadPercent || 30);
    const strategyLabel =
      strategy === "weight" ? `-${ps.deloadPercent}% Gewicht` :
      strategy === "sets"   ? `-${ps.volumeDeloadPercent}% Sätze` :
                              `-${ps.deloadPercent}% Gewicht & weniger Sätze`;
    return {
      action:          "deload",
      suggestedWeight: deloadWt,
      suggestedReps:   repRange.min,
      suggestedSets:   deloadSets,
      reason:          `Entlastungswoche aktiv – ${strategyLabel}`,
      isDeload:        true,
      confidence:      "high",
    };
  }

  // Last session's work sets for this exercise
  const lastSession = history[history.length - 1];
  const lastSets    = lastSession.sets;
  if (!lastSets.length) return null;

  const lastWeight = lastSets[0].weight;
  const minReps    = Math.min(...lastSets.map(s => s.reps));
  const avgReps    = lastSets.reduce((a,s)=>a+s.reps,0) / lastSets.length;

  // Check stagnation (last 2–3 sessions same or declining weight)
  const stagnation = detectExerciseStagnation(eid, sessions, settings, allExercises);

  // ── DELOAD recommendation based on stagnation ──────────────
  if (stagnation?.stagnating && ps.deloadEnabled && ps.autoDeloadOnStagnation) {
    const strategy_  = ps.deloadStrategy || "weight";
    const deloadWt_  = strategy_ === "sets"
      ? lastWeight
      : (applyDeloadToWeight(lastWeight, settings, exercise) || lastWeight);
    const deloadSets_= strategy_ === "weight"
      ? (planExercise?.sets || 3)
      : applyDeloadToSets(planExercise?.sets || 3, ps.volumeDeloadPercent || 30);
    return {
      action:          "deload",
      suggestedWeight: deloadWt_,
      suggestedReps:   repRange.min,
      suggestedSets:   deloadSets_,
      reason:          "Leichte Woche empfohlen – frisch wieder einsteigen",
      isDeload:        true,
      confidence:      "medium",
    };
  }

  // ── PROGRESSION logic by mode ───────────────────────────────
  const mode = ps.mode || "normal";
  let readyToProgress = false;

  if (mode === "conservative") {
    // All sets must reach the upper rep range target
    readyToProgress = minReps >= repRange.max;
  } else if (mode === "aggressive") {
    // Most sets (≥ 60%) at or above lower rep range target
    const setsAboveMin = lastSets.filter(s => s.reps >= repRange.min).length;
    readyToProgress = setsAboveMin / lastSets.length >= 0.6 && avgReps >= repRange.min;
  } else {
    // normal: average reps ≥ upper range, minimum reps ≥ lower range
    readyToProgress = avgReps >= repRange.max && minReps >= repRange.min;
  }

  if (readyToProgress && increment > 0) {
    const newWeight = roundWeight(lastWeight + increment, increment);
    return {
      action:          "increase",
      suggestedWeight: newWeight,
      suggestedReps:   repRange.min,
      reason:          `Zielbereich erreicht – +${increment} kg bereit`,
      isDeload:        false,
      confidence:      "high",
    };
  }

  // Below rep range minimum – consider backing off slightly
  if (minReps < repRange.min - 2 && lastSets.length >= 2) {
    return {
      action:          "hold",
      suggestedWeight: lastWeight,
      suggestedReps:   repRange.min,
      reason:          "Gewicht halten – sauber ausführen",
      isDeload:        false,
      confidence:      "medium",
    };
  }

  // On track – hold weight
  return {
    action:          "hold",
    suggestedWeight: lastWeight,
    suggestedReps:   repRange.min,
    reason:          "Solide Leistung – weiter so",
    isDeload:        false,
    confidence:      "low",
  };
}

// Detect stagnation for one exercise over last N sessions
function detectExerciseStagnation(eid, sessions, settings, allExercises) {
  const history = getExercisePerformanceHistory(eid, sessions, allExercises);
  if (history.length < 3) return { stagnating: false };
  const last3 = history.slice(-3);
  // Check if weight stayed the same or declined across last 3 sessions
  const weights = last3.map(h => h.sets[0]?.weight || 0);
  const noProgress = weights[2] <= weights[0]; // not higher than 3 sessions ago
  // Check if min reps declined
  const minReps = last3.map(h => Math.min(...h.sets.map(s=>s.reps||0)));
  const repsDeclined = minReps[2] < minReps[0];
  return {
    stagnating: noProgress && repsDeclined,
    sessionsChecked: last3.length,
    weightTrend: weights[2] - weights[0],
  };
}

// Detect whether a global deload is recommended based on recent training load
function detectDeloadRecommendation(sessions, settings) {
  const ps = getProgressionSettings(settings);
  if (!ps.deloadEnabled) return null;

  // Already in active deload – confirm it (auto-expire handled by isDeloadActive)
  if (isDeloadActive(settings)) {
    const daysLeft = deloadDaysRemaining(settings);
    return {
      recommend: true,
      reason:    `Aktiver Deload – noch ${daysLeft} ${daysLeft===1?"Tag":"Tage"}`,
      urgency:   "active",
    };
  }

  const now = Date.now();
  // Periodic deload: time since last deload
  if (settings?.lastDeloadDate) {
    const weeksSince = (now - new Date(settings.lastDeloadDate)) / (7*86400000);
    if (weeksSince >= ps.deloadEveryWeeks) {
      return {
        recommend: true,
        reason:    `${Math.round(weeksSince)} Wochen seit letzter Entlastung`,
        urgency:   "scheduled",
      };
    }
  } else if ((sessions||[]).length >= ps.deloadEveryWeeks) {
    return {
      recommend: true,
      reason:    `${sessions.length} Trainings – erste Deload-Woche empfohlen`,
      urgency:   "scheduled",
    };
  }

  return null;
}

function calcAchievements(sessions, metrics, streak, cardio, allExercises=[]) {
  if (!Array.isArray(sessions)) return ACHIEVEMENT_DEFS.map(a=>({...a,unlocked:false}));
  return ACHIEVEMENT_DEFS.map(a => ({
    ...a,
    unlocked: a.check(sessions, metrics, streak, cardio, allExercises),
  }));
}

// Each exercise can declare unitType: "reps" | "secs" | "mins"
// Default = "reps".  Warm-up/Dehnung use "secs" or special.
const UNIT_LABELS = { reps:"Wdh", secs:"Sek", mins:"Min" };

function getUnitType(eid, allExercises) {
  const ex = allExercises?.find(e=>e.id===eid);
  if (!ex) return "reps";
  return ex.unitType || "reps";
}

// Format a reps/time value for display
function fmtRepsVal(val, unitType) {
  if (!val && val !== 0) return "—";
  switch(unitType) {
    case "secs": return `${val} Sek`;
    case "mins": return `${val} Min`;
    default:     return `${val} Wdh`;
  }
}

// Label for the field in WorkoutScreen
function repsFieldLabel(unitType) {
  return UNIT_LABELS[unitType] || "Wdh";
}

// Helper: return default rest (secs) for an exercise based on settings rules
function getDefaultRestForExercise(exercise, settings) {
  const rules = { ...DEFAULT_SETTINGS.restRules, ...(settings?.restRules || {}) };
  if (!exercise) return rules.default;
  const cat = exercise.cat || "";
  const eq  = exercise.eq  || "";
  if (cat === "Aufwärmen") return rules.warmup;
  if (cat === "Dehnung")   return rules.stretching;
  if (eq  === "Maschine")  return rules.machine;
  if (eq  === "Kabel")     return rules.cable;
  if (eq  === "Kurzhantel")return rules.dumbbell;
  if (eq  === "Langhantel")return rules.barbell;
  if (eq  === "Körpergewicht") return rules.bodyweight;
  return rules.default;
}

// Merge settings with defaults (for backward-compat with old backups)
function mergeWithDefaults(saved) {
  const ps = DEFAULT_SETTINGS.progressionSettings;
  return {
    ...DEFAULT_SETTINGS,
    ...saved,
    timerSettings: { ...DEFAULT_SETTINGS.timerSettings, ...(saved?.timerSettings || {}) },
    restRules:     { ...DEFAULT_SETTINGS.restRules,     ...(saved?.restRules     || {}) },
    progressionSettings: {
      ...ps,
      ...(saved?.progressionSettings || {}),
      defaultRepRange: { ...ps.defaultRepRange,  ...(saved?.progressionSettings?.defaultRepRange  || {}) },
      incrementRules:  { ...ps.incrementRules,   ...(saved?.progressionSettings?.incrementRules   || {}) },
    },
  };
}

// IMAGE COMPRESSION (Fix 5)
// Canvas-based resize to max 400px, JPEG quality 0.72
// ═══════════════════════════════════════════════════════
function compressImage(dataUrl, maxPx=400, quality=0.72) {
  return new Promise((resolve) => {
    try {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const ratio  = Math.min(maxPx/img.width, maxPx/img.height, 1);
        canvas.width  = Math.round(img.width  * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => resolve(dataUrl); // fallback: original
      img.src = dataUrl;
    } catch {
      resolve(dataUrl);
    }
  });
}

// ═══════════════════════════════════════════════════════
// BACKUP SANITIZERS – called on import AND lsGet
// ═══════════════════════════════════════════════════════

function sanitizeSettings(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return mergeWithDefaults({});
  return mergeWithDefaults({...raw, onboarded: true});
}

function sanitizeSessions(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter(s =>
    s && typeof s === "object" &&
    typeof s.id   === "string" && s.id &&
    typeof s.date === "string" && s.date &&
    Array.isArray(s.sets)
  ).map(s => ({
    ...s,
    sets: s.sets.filter(x => x && typeof x === "object" &&
                              typeof x.eid === "string" && x.eid),
  }));
}

function sanitizePlans(raw, fallback) {
  if (!Array.isArray(raw)) return fallback || [];
  const valid = raw.filter(p =>
    p && typeof p === "object" &&
    typeof p.id   === "string" && p.id &&
    typeof p.name === "string" && p.name &&
    Array.isArray(p.days)
  ).map(p => ({
    ...p,
    days: (p.days||[]).filter(d =>
      d && typeof d === "object" && Array.isArray(d.exercises)
    ).map(d => ({
      ...d,
      exercises: (d.exercises||[]).filter(e =>
        e && typeof e === "object" && typeof e.eid === "string" && e.eid
      ),
    })),
  }));
  return valid.length ? valid : (fallback || []);
}

function sanitizeCardio(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter(c =>
    c && typeof c === "object" &&
    typeof c.id   === "string" && c.id &&
    typeof c.date === "string" && c.date
  );
}

function sanitizeMetrics(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter(m =>
    m && typeof m === "object" &&
    typeof m.id   === "string" && m.id &&
    typeof m.date === "string" && m.date
  );
}

function sanitizeCustomExercises(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter(cx =>
    cx && typeof cx === "object" &&
    typeof cx.id   === "string" && cx.id &&
    typeof cx.name === "string" && cx.name
  );
}

function sanitizeExerciseOverrides(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return {};
  const out = {};
  Object.entries(raw).forEach(([k,v]) => {
    if (v && typeof v === "object" && !Array.isArray(v)) out[k] = v;
  });
  return out;
}

// Central entry point used by BOTH import handlers
function sanitizeBackup(raw) {
  if (!raw || typeof raw !== "object") throw new Error("Kein gültiges JSON-Objekt");
  if (!raw._fittrack_version)          throw new Error("Keine FitTrack-Backup-Datei");
  return {
    settings:          sanitizeSettings(raw.settings),
    sessions:          sanitizeSessions(raw.sessions),
    plans:             sanitizePlans(raw.plans, MY_PLANS),
    cardio:            sanitizeCardio(raw.cardio),
    metrics:           sanitizeMetrics(raw.metrics),
    customExercises:   sanitizeCustomExercises(raw.customExercises),
    exerciseOverrides: sanitizeExerciseOverrides(raw.exerciseOverrides),
  };
}

const LS_PREFIX = "ft5_";

function lsGet(key, fallback) {
  try {
    const v = localStorage.getItem(LS_PREFIX + key);
    if (v == null) return fallback;
    const parsed = JSON.parse(v);
    if (parsed == null) return fallback;
    // Per-key sanitization so corrupt localStorage never crashes the app
    if (key === "settings")          return sanitizeSettings(parsed);
    if (key === "sessions")          return sanitizeSessions(parsed);
    if (key === "plans")             return sanitizePlans(parsed, fallback);
    if (key === "cardio")            return sanitizeCardio(parsed);
    if (key === "metrics")           return sanitizeMetrics(parsed);
    if (key === "customExercises")   return sanitizeCustomExercises(parsed);
    if (key === "exerciseOverrides") return sanitizeExerciseOverrides(parsed);
    return parsed;
  } catch(e) {
    console.warn("FitTrack: lsGet failed for", key, e?.message);
    return fallback;
  }
}

// Storage-quota notification state (module-level, shown once per session)
let _quotaWarningShown = false;

function lsSet(key, value) {
  try {
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    return true;
  } catch (e) {
    const isQuota = e?.name === "QuotaExceededError" ||
                    e?.name === "NS_ERROR_DOM_QUOTA_REACHED";
    console.warn("FitTrack: localStorage write failed:", key, e?.name);
    if (isQuota && !_quotaWarningShown) {
      _quotaWarningShown = true;
      // Show non-blocking toast if the DOM is ready
      setTimeout(() => {
        const d = document.createElement("div");
        d.textContent = "⚠️ Speicher voll – Bilder im Backup reduzieren";
        Object.assign(d.style, {
          position:"fixed", bottom:"80px", left:"50%",
          transform:"translateX(-50%)",
          background:"#FF6B35", color:"#fff",
          padding:"10px 20px", borderRadius:"10px",
          fontSize:"13px", fontWeight:"700",
          zIndex:"9999", boxShadow:"0 4px 20px rgba(0,0,0,0.5)",
          maxWidth:"300px", textAlign:"center",
        });
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 5000);
      }, 100);
    }
    return false;
  }
}

function usePersistedState(key, seed) {
  const [s, setS] = useState(() => lsGet(key, seed));
  const set = useCallback(u => {
    setS(prev => {
      const next = typeof u === "function" ? u(prev) : u;
      lsSet(key, next);
      return next;
    });
  }, [key]);
  return [s, set];
}

const LineChart = ({data, color=T.accent, height=72}) => {
  if (!data || data.length < 2) return (
    <div style={{height, display:"flex", alignItems:"center", justifyContent:"center", color:T.muted, fontSize:12}}>
      Zu wenig Daten
    </div>
  );
  const W=280, H=height, pad=8;
  const mn=Math.min(...data), mx=Math.max(...data), rng=mx-mn||0.1;
  const py = v => H-pad-((v-mn)/rng)*(H-pad*2);
  const pts = data.map((v,i) => `${(i/(data.length-1))*W},${py(v)}`).join(" ");
  const gid = `lc${color.replace(/[^a-z0-9]/gi,"")}${height}`;
  return (
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible"}}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.28"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon fill={`url(#${gid})`} points={`0,${H} ${pts} ${W},${H}`}/>
      <polyline fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points={pts}/>
      {data.map((v,i) => {

        return <circle key={i} cx={x} cy={y} r={last?5:2.5} fill={color} stroke={T.bg} strokeWidth={last?2:0}/>;
      })}
    </svg>
  );
};

// ─────────────────────────────────────────────────────────────────────
// AUDIO ENGINE – Web Audio API, offline, kein externes File
// ─────────────────────────────────────────────────────────────────────
const AudioEngine = (() => {
  let ctx = null;

  const getCtx = () => {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { return null; }
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  };

  // Einzelner Ton: freq Hz, dur Sekunden, vol 0-1
  const tone = (freq, dur, vol = 0.45, delay = 0) => {
    const c = getCtx(); if (!c) return;
    const t   = c.currentTime + delay;
    const osc = c.createOscillator();
    const g   = c.createGain();
    osc.connect(g); g.connect(c.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.05);
  };

  return {
    // Kurzer hoher Tick – 10-Sekunden-Countdown
    tick: () => tone(1050, 0.10, 0.38),

    // "Los!"-Gong wenn Pause vorbei (zwei Töne, leicht harmonisch)
    done: () => {
      tone(660, 0.30, 0.55, 0.0);
      tone(880, 0.45, 0.40, 0.08);
    },

    // Drei kurze Pieptöne – alle 30 Sekunden Erinnerung
    tripleTick: () => {
      tone(900, 0.09, 0.30, 0.00);
      tone(900, 0.09, 0.30, 0.15);
      tone(900, 0.09, 0.30, 0.30);
    },
  };
})();

// ─────────────────────────────────────────────────────────────────────
// REST TIMER – mit Ticks ab 10 Sek und Gong am Ende
// ─────────────────────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────────────
// RestTimer – compact top overlay (Punkt 5)
// tickStart: seconds before end where beeping begins (from settings)
// ─────────────────────────────────────────────────────────────────────
const RestTimer = ({seconds, onDone, onSkip, tickStart=10}) => {
  const [left, setLeft] = useState(seconds);
  const intervalRef = useRef(null);
  const ticked = useRef(new Set());

  const thirtyBeeps = useRef(new Set()); // track which 30s marks already beeped

  useEffect(() => {
    intervalRef.current = setInterval(() => {
      setLeft(prev => {
        const next   = prev - 1;
        const elapsed = seconds - next;        // how many seconds have passed

        // Every 30 seconds of running time: triple beep
        if (elapsed > 0 && elapsed % 30 === 0 && !thirtyBeeps.current.has(elapsed)) {
          thirtyBeeps.current.add(elapsed);
          AudioEngine.tripleTick();
        }

        // Final countdown ticks
        if (next > 0 && next <= tickStart && !ticked.current.has(next)) {
          ticked.current.add(next);
          AudioEngine.tick();
        }
        if (next <= 0) {
          clearInterval(intervalRef.current);
          AudioEngine.done();
          onDone();
          return 0;
        }
        return next;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  const adjust = delta => {
    setLeft(l => {
      const next = Math.max(0, l + delta);
      ticked.current = new Set([...ticked.current].filter(v => v > next));
      return next;
    });
  };

  const pct  = (left / seconds) * 100;
  const r    = 30;
  const circ = 2 * Math.PI * r;
  const m    = Math.floor(left / 60);
  const s    = left % 60;
  const nearEnd = left <= tickStart;

  // Punkt 1: larger compact overlay – big clock left (~45% width), stacked buttons right
  const sz   = 104;   // SVG canvas size
  const rr   = 44;    // ring radius – significantly larger than before
  const circR= 2 * Math.PI * rr;

  return (
    <div style={{
      position:"fixed", top:76, left:12, right:12,
      background:T.bgCard, borderRadius:20,
      border:`2px solid ${nearEnd ? T.orange : T.accent}77`,
      boxShadow:"0 10px 48px rgba(0,0,0,0.78)",
      zIndex:300, padding:"14px 14px 12px",
    }}>
      <div style={{display:"flex", alignItems:"center", gap:12}}>

        {/* ── Left: large circular timer ── */}
        <div style={{position:"relative", width:sz, height:sz, flexShrink:0}}>
          <svg width={sz} height={sz} style={{transform:"rotate(-90deg)"}}>
            <circle cx={sz/2} cy={sz/2} r={rr} fill="none" stroke={T.border} strokeWidth="7"/>
            <circle cx={sz/2} cy={sz/2} r={rr} fill="none"
              stroke={nearEnd ? T.orange : T.accent} strokeWidth="7"
              strokeDasharray={circR}
              strokeDashoffset={circR * (1 - Math.max(0, pct) / 100)}
              strokeLinecap="round"
              style={{transition:"stroke-dashoffset 1s linear, stroke 0.4s"}}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
            <div style={{fontSize:28,fontWeight:900,fontVariantNumeric:"tabular-nums",lineHeight:1,
              color:nearEnd?T.orange:T.accent}}>
              {m>0?`${m}:${s.toString().padStart(2,"0")}`:s}
            </div>
            <div style={{fontSize:10,color:T.muted,marginTop:2,letterSpacing:1}}>PAUSE</div>
          </div>
        </div>

        {/* ── Right: adjust + skip + done (stacked) ── */}
        <div style={{flex:1, display:"flex", flexDirection:"column", gap:6}}>
          <div style={{display:"flex",gap:5}}>
            {[-15,+15,+30].map(d=>(
              <button key={d} onClick={()=>adjust(d)} style={{
                flex:1, background:T.bgAlt,
                color:d<0?T.red:T.green,
                border:`1px solid ${d<0?T.red+"55":T.green+"55"}`,
                borderRadius:8, padding:"7px 0",
                fontWeight:700, fontSize:12, cursor:"pointer",
              }}>{d>0?"+":""}{d}s</button>
            ))}
          </div>
          <Btn v="ghost" onClick={onSkip}
            style={{padding:"7px 0",fontSize:13,width:"100%"}}>
            Überspringen
          </Btn>
          <Btn onClick={()=>{AudioEngine.done();onDone();}}
            style={{padding:"9px 0",fontSize:14,width:"100%",fontWeight:800}}>
            Fertig ✓
          </Btn>
        </div>

      </div>
    </div>
  );
};

// ─────────────────────────────────────────────────────────────────────
// ExerciseTimer – for unitType "secs"/"mins" exercises (Punkt 6+7)
// Counts DOWN to zero, then counts UP showing overtime.
// Does NOT auto-complete the set – user taps "Satz beenden".
// tickStart: seconds before zero where beeps start.
// ─────────────────────────────────────────────────────────────────────
const ExerciseTimer = ({targetSecs, onFinish, tickStart=10}) => {
  const [elapsed, setElapsed] = useState(0);
  const intervalRef = useRef(null);
  const ticked      = useRef(new Set());
  const donePlayed  = useRef(false);

  const thirtyBeeps = useRef(new Set()); // track 30s marks

  useEffect(() => {
    intervalRef.current = setInterval(() => {
      setElapsed(prev => {
        const next      = prev + 1;
        const remaining = targetSecs - next;

        // Every 30 seconds of elapsed time: triple beep
        if (next > 0 && next % 30 === 0 && !thirtyBeeps.current.has(next)) {
          thirtyBeeps.current.add(next);
          AudioEngine.tripleTick();
        }

        // Countdown ticks before target
        if (remaining > 0 && remaining <= tickStart && !ticked.current.has(remaining)) {
          ticked.current.add(remaining);
          AudioEngine.tick();
        }
        // Done sound exactly at target (once)
        if (next === targetSecs && !donePlayed.current) {
          donePlayed.current = true;
          AudioEngine.done();
        }
        return next;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  const remaining  = targetSecs - elapsed;
  const overtime   = elapsed > targetSecs;
  const displayVal = overtime ? elapsed - targetSecs : Math.abs(remaining);
  const dm = Math.floor(displayVal / 60);
  const ds = displayVal % 60;
  const timeStr = dm > 0
    ? `${dm}:${ds.toString().padStart(2,"0")}`
    : `${ds}`;
  const pct = Math.min(100, (elapsed / targetSecs) * 100);
  const r = 30, circ = 2*Math.PI*r;
  const nearEnd = remaining > 0 && remaining <= tickStart;

  return (
    <div style={{
      position:"fixed", top:80, left:16, right:16,
      background:T.bgCard, borderRadius:18,
      border:`2px solid ${overtime ? T.green : nearEnd ? T.orange : T.blue}66`,
      boxShadow:"0 8px 40px rgba(0,0,0,0.7)",
      zIndex:300, padding:"14px 16px 12px",
    }}>
      <div style={{display:"flex", alignItems:"center", gap:14}}>
        <div style={{position:"relative", width:72, height:72, flexShrink:0}}>
          <svg width="72" height="72" style={{transform:"rotate(-90deg)"}}>
            <circle cx="36" cy="36" r={r} fill="none" stroke={T.border} strokeWidth="5"/>
            <circle cx="36" cy="36" r={r} fill="none"
              stroke={overtime ? T.green : nearEnd ? T.orange : T.blue}
              strokeWidth="5" strokeDasharray={circ}
              strokeDashoffset={circ * (1 - pct / 100)}
              strokeLinecap="round"
              style={{transition:"stroke-dashoffset 0.9s linear, stroke 0.4s"}}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <div style={{fontSize:9,color:T.muted,lineHeight:1,marginBottom:1}}>
              {overtime?"OVER":"ÜBUNG"}
            </div>
            <div style={{fontSize:18,fontWeight:900,fontVariantNumeric:"tabular-nums",lineHeight:1,
              color: overtime ? T.green : nearEnd ? T.orange : T.blue}}>
              {overtime ? `+${timeStr}` : timeStr}
            </div>
          </div>
        </div>

        <div style={{flex:1}}>
          <div style={{fontSize:12,color:T.sub,marginBottom:6}}>
            Ziel: {fmtRepsVal(targetSecs,"secs")}
            {overtime && <span style={{color:T.green,marginLeft:8,fontWeight:700}}>Ziel erreicht ✓</span>}
          </div>
          <Btn onClick={onFinish}
            v={overtime ? "teal" : "secondary"}
            full style={{padding:"9px 0",fontSize:13}}>
            {overtime ? "Satz beenden ✓" : "Satz jetzt beenden"}
          </Btn>
        </div>
      </div>
    </div>
  );
};

          <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:12,paddingBottom:2}}>
            {CARDIO_TYPES.map(t=>(
              <button key={t} onClick={()=>setType(t)} style={{background:type===t?(CARDIO_COLOR[t]||T.accent):T.bgAlt,color:type===t?"#07070F":T.sub,border:`1px solid ${type===t?(CARDIO_COLOR[t]||T.accent):T.border}`,borderRadius:9,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
                {CARDIO_ICONS[t]} {t}
              </button>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><Lbl>DAUER (Minuten)</Lbl><Inp value={dur}  onChange={setDur}  placeholder="30" type="number"/></div>
            <div><Lbl>DISTANZ (km)</Lbl>   <Inp value={dist} onChange={setDist} placeholder="3.5" type="number"/></div>
          </div>
          <div style={{marginBottom:8}}><Lbl>DATUM & UHRZEIT</Lbl><Inp value={date} onChange={setDate} type="datetime-local"/></div>
          <div style={{marginBottom:12}}><Lbl>NOTIZ</Lbl><Inp value={note} onChange={setNote} placeholder="Strecke, Tempo, Wie war's?"/></div>
          {durNum>0 && (
            <div style={{padding:"10px 12px",background:T.accentGlow,borderRadius:10,marginBottom:12,fontSize:12,color:T.accentDim}}>
              Geschätzte Energie: <b>{calcKcal(type,durNum,settings.bodyWeight||75)} kcal</b>
              {pace && <span> · Tempo: ~{pace} min/km</span>}
            </div>
          )}
          <Btn onClick={save} disabled={!dur} full>{CARDIO_ICONS[type]} {type} speichern</Btn>
        </Card>
      </>}

      {view==="history" && <>
        <Lbl>{sortedCardio.length} AKTIVITÄTEN</Lbl>
        {sortedCardio.length===0 && (
          <div style={{textAlign:"center",padding:"40px",color:T.muted,border:`1px dashed ${T.border}`,borderRadius:16}}>Noch keine Aktivitäten. Los geht's!</div>
        )}
        {sortedCardio.map(c=>(
          <Card key={c.id} style={{marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                <div style={{width:40,height:40,borderRadius:12,background:`${CARDIO_COLOR[c.type]||T.green}22`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>
                  {CARDIO_ICONS[c.type]||"🏃"}
                </div>
                <div>
                  <div style={{fontSize:15,fontWeight:700,color:T.text}}>{c.type}</div>
                  <div style={{fontSize:12,color:T.sub,marginTop:2}}>{fmtDShort(c.date)}</div>
                  <div style={{display:"flex",gap:10,marginTop:4,fontSize:12,color:T.muted}}>
                    <span>⏱ {c.duration} min</span>
                    {c.distance&&<span>📍 {c.distance} km</span>}
                    {c.kcal&&<span>🔥 {c.kcal} kcal</span>}
                  </div>
                  {c.note&&<div style={{fontSize:11,color:T.sub,marginTop:4,fontStyle:"italic"}}>"{c.note}"</div>}
                </div>
              </div>
              {c.distance&&<Badge color={CARDIO_COLOR[c.type]||T.green}>{c.distance} km</Badge>}
            </div>
          </Card>
        ))}
      </>}

      {view==="stats" && <>
        {CARDIO_TYPES.filter(t=>cardio.some(c=>c.type===t)).map(t=>{
          const entries=cardio.filter(c=>c.type===t);
          const km=entries.reduce((s,c)=>s+(c.distance||0),0);
          const min=entries.reduce((s,c)=>s+(c.duration||0),0);
          const kcal=entries.reduce((s,c)=>s+(c.kcal||0),0);
          return (
            <Card key={t} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <span style={{fontSize:22}}>{CARDIO_ICONS[t]}</span>
                  <span style={{fontSize:16,fontWeight:700,color:T.text}}>{t}</span>
                </div>
                <Badge color={CARDIO_COLOR[t]||T.green}>{entries.length}×</Badge>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                {[{l:"km",v:km.toFixed(1),c:T.green},{l:"min",v:min,c:T.blue},{l:"kcal",v:Math.round(kcal),c:T.orange}].map(s=>(
                  <div key={s.l} style={{textAlign:"center",padding:"8px 4px",background:T.bgAlt,borderRadius:8}}>
                    <div style={{fontSize:16,fontWeight:800,color:s.c}}>{s.v}</div>
                    <div style={{fontSize:9,color:T.muted}}>{s.l}</div>
                  </div>
                ))}
              </div>
            </Card>
          );
        })}
        {!cardio.some(c=>CARDIO_TYPES.includes(c.type)) && (
          <div style={{textAlign:"center",padding:"40px",color:T.muted}}>Noch keine Daten.</div>
        )}
      </>}
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// EXERCISE DB SCREEN
// Eigene Übungen: vollständig neu erstellen (in customExercises)
// Basis-Übungen:  Beschreibung/Link/Bild ergänzen (in exerciseOverrides)
// ═══════════════════════════════════════════════════════
const ExerciseDBScreen = ({
  allExercises,
  customExercises, setCustomExercises,
  exerciseOverrides, setExerciseOverrides,
  onSelect, selectable, selected=[],
  initialDetailId,   // Fix 1: open directly on this exercise id
}) => {
  const [cat,setCat]   = useState("Alle");
  const [search,setSearch] = useState("");
  // Fix 1: honour initialDetailId on mount
  const [mode,setMode] = useState(() => initialDetailId ? "detail" : "list");
  const [activeId,setActiveId] = useState(initialDetailId || null);

  const [fName,setFName] = useState("");
  const [fCat,setFCat]   = useState("Brust");
  const [fEq,setFEq]     = useState("Maschine");
  const [fDesc,setFDesc] = useState("");
  const [fLink,setFLink] = useState("");
  const [fImg,setFImg]   = useState(null);
  const [fNote,setFNote] = useState(""); // Fix 5: Trainingsnotiz (Kurznotiz)
  const [imgLoading,setImgLoading] = useState(false);
  const fileRef = useRef(null);

  // Fix 1: Reset mode/activeId when the exercise no longer exists (avoid setter-during-render)
  useEffect(() => {
    if (mode === "detail" && activeId) {
      const stillExists = (allExercises||[]).some(e => e.id === activeId);
      if (!stillExists) { setMode("list"); setActiveId(null); }
    }
  }, [mode, activeId, allExercises]);

  // Resolve an exercise with any overrides applied
  const resolve = useCallback(ex => ({...ex, ...(exerciseOverrides?.[ex.id]||{})}), [exerciseOverrides]);

  // Fix 1: openEdit properly pre-fills form and sets activeId so back→detail works
  const openCreate = () => {
    setFName(""); setFCat("Brust"); setFEq("Maschine");
    setFDesc(""); setFLink(""); setFImg(null); setFNote("");
    setActiveId(null); setMode("create");
  };

  const openEdit = useCallback(ex => {
    const resolved = resolve(ex);
    setFName(resolved.name || "");
    setFCat(resolved.cat  || "Brust");
    setFEq(resolved.eq    || "Maschine");
    setFDesc(resolved.desc || "");
    setFLink(resolved.link || "");
    setFImg(resolved.img   || null);
    setFNote(resolved.trainingsnotiz || ""); // Fix 5
    setActiveId(ex.id);
    setMode("edit");
  }, [resolve]);

  const handleImg = e => {
    const f = e.target.files[0]; if (!f) return;
    setImgLoading(true);
    const r = new FileReader();
    r.onload = async ev => {
      try {
        const compressed = await compressImage(ev.target.result, 400, 0.72);
        setFImg(compressed);
      } catch {
        setFImg(ev.target.result); // fallback
      }
      setImgLoading(false);
    };
    r.onerror = () => setImgLoading(false);
    r.readAsDataURL(f);
  };

  const saveCreate = () => {
    if (!fName.trim()) return;
    const entry = {
      id:`cx${uid()}`, name:fName.trim(), cat:fCat, eq:fEq,
      muscle:fCat.toLowerCase(),
      desc:fDesc.trim()||null, link:fLink.trim()||null, img:fImg||null,
      trainingsnotiz: fNote.trim()||null, // Fix 5
      custom:true,
    };
    setCustomExercises(p=>[...p, entry]);
    setMode("list");
  };

  const saveEdit = () => {
    const ex = allExercises.find(e=>e.id===activeId);
    if (!ex) return;

    if (ex.custom) {
      // Custom exercise: all fields editable
      if (!fName.trim()) return;
      const updated = {
        ...ex, name:fName.trim(), cat:fCat, eq:fEq,
        muscle:fCat.toLowerCase(),
        desc:fDesc.trim()||null, link:fLink.trim()||null, img:fImg||null,
        trainingsnotiz: fNote.trim()||null, // Fix 5
      };
      setCustomExercises(p=>p.map(e=>e.id===activeId ? updated : e));
    } else {
      // Built-in exercise: store enrichment in overrides incl. trainingsnotiz
      const override = {
        desc: fDesc.trim()||null,
        link: fLink.trim()||null,
        img:  fImg||null,
        trainingsnotiz: fNote.trim()||null, // Fix 5
      };
      // Remove override entirely if all fields are empty (cleanup)
      // Fix 1: keep override if ANY field is set, including trainingsnotiz
      const hasAny = override.desc || override.link || override.img || override.trainingsnotiz;
      if (hasAny) {
        setExerciseOverrides(prev=>({...prev, [activeId]: override}));
      } else {
        setExerciseOverrides(prev=>{ const n={...prev}; delete n[activeId]; return n; });
      }
    }
    setMode("detail");
  };

  const deleteCustom = id => {
    setCustomExercises(p=>p.filter(e=>e.id!==id));
    setMode("list");
  };

  const clearOverride = id => {
    setExerciseOverrides(prev=>{
      const next={...prev};
      delete next[id];
      return next;
    });
  };

  // ── DETAIL VIEW ──────────────────────────────────────
  if (mode==="detail" && activeId) {
    const base = (allExercises||[]).find(e=>e.id===activeId);
    if (!base) return null; // useEffect above will reset mode
    const ex = resolve(base);
    const hasOverride = !base.custom && exerciseOverrides?.[base.id];

    return (
      <div style={{padding:"0 16px 24px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"20px 0 12px"}}>
          <Btn v="ghost" onClick={()=>setMode("list")} style={{padding:"8px 14px"}}>←</Btn>
          <div style={{flex:1,fontSize:18,fontWeight:900,color:T.text}}>{ex.name}</div>
          <Btn v="ghost" onClick={()=>openEdit(base)} style={{padding:"8px 14px"}}>✎ Bearbeiten</Btn>
        </div>

        {ex.img&&(
          <img src={ex.img} alt={ex.name}
            style={{width:"100%",borderRadius:14,marginBottom:12,objectFit:"cover",maxHeight:220}}/>
        )}

        <Card style={{marginBottom:10}}>
          <div style={{display:"flex",gap:8,marginBottom:ex.desc?12:4,flexWrap:"wrap"}}>
            <Badge color={CAT_COLOR_EXT[ex.cat]||T.accent}>{ex.cat}</Badge>
            <Badge color={T.sub}>{ex.eq}</Badge>
            {ex.custom&&<Badge color={T.purple}>Eigene Übung</Badge>}
            {hasOverride&&<Badge color={T.teal}>Ergänzt</Badge>}
          </div>
          {ex.trainingsnotiz&&(
            <div style={{fontSize:12,color:T.teal,marginBottom:8,padding:"6px 10px",
              background:T.teal+"15",borderRadius:8,border:`1px solid ${T.teal}33`}}>
              📌 Trainingsnotiz: {ex.trainingsnotiz}
            </div>
          )}
          {ex.desc&&(
            <div style={{fontSize:14,color:T.sub,lineHeight:1.7,marginBottom:ex.link?12:0}}>
              {ex.desc}
            </div>
          )}
          {ex.link&&(
            <a href={ex.link} target="_blank" rel="noreferrer"
              style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",
                background:T.bgAlt,borderRadius:10,color:T.blue,fontSize:13,
                fontWeight:700,textDecoration:"none",marginTop:ex.desc?0:4}}>
              🎥 Anleitungsvideo öffnen
            </a>
          )}
          {!ex.desc&&!ex.link&&!ex.img&&(
            <div style={{fontSize:13,color:T.muted,fontStyle:"italic"}}>
              Noch keine Beschreibung · tippe ✎ um Infos hinzuzufügen
            </div>
          )}
        </Card>

        {/* Actions */}
        {selectable&&(
          <Btn onClick={()=>{onSelect&&onSelect(base);setMode("list");}} full style={{marginBottom:10}}>
            + Zum Plan hinzufügen
          </Btn>
        )}
        {hasOverride&&(
          <Btn v="ghost" onClick={()=>{clearOverride(base.id);}} full style={{marginBottom:8,fontSize:12}}>
            Ergänzungen zurücksetzen
          </Btn>
        )}
        {ex.custom&&(
          <Btn v="danger" onClick={()=>deleteCustom(ex.id)} full>🗑 Übung löschen</Btn>
        )}
      </div>
    );
  }

  // ── CREATE / EDIT FORM ───────────────────────────────
  if (mode==="create" || mode==="edit") {
    const isCreate = mode==="create";
    const base = !isCreate ? allExercises.find(e=>e.id===activeId) : null;
    const isBuiltIn = base && !base.custom;
    const EQ_OPTS=["Langhantel","Kurzhantel","Kabel","Maschine","Körpergewicht","Sonstiges"];

    return (
      <div style={{padding:"0 16px 24px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"20px 0 14px"}}>
          <Btn v="ghost" onClick={()=>setMode(isCreate?"list":"detail")} style={{padding:"8px 14px"}}>←</Btn>
          <div style={{flex:1,fontSize:18,fontWeight:900,color:T.text}}>
            {isCreate?"Neue Übung":"Übung bearbeiten"}
          </div>
        </div>

        {isBuiltIn&&(
          <div style={{padding:"10px 14px",background:T.blue+"18",borderRadius:10,marginBottom:14,
            border:`1px solid ${T.blue}44`,fontSize:12,color:T.sub}}>
            ℹ️ <b style={{color:T.text}}>Basis-Übung:</b> Name, Kategorie und Gerät sind fest.
            Du kannst Beschreibung, Link und Bild ergänzen.
          </div>
        )}

        <Card>
          {/* Name + Cat + Eq only for custom */}
          {!isBuiltIn&&<>
            <div style={{marginBottom:10}}>
              <Lbl>NAME *</Lbl>
              <Inp value={fName} onChange={setFName} placeholder="z.B. Schrägbank Kurzhantel"/>
            </div>
            <div style={{marginBottom:10}}>
              <Lbl>KATEGORIE</Lbl>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {ALL_CATS.filter(c=>c!=="Alle").map(c=>(
                  <button key={c} onClick={()=>setFCat(c)} style={{
                    background:fCat===c?(CAT_COLOR_EXT[c]||T.accent):T.bgInput,
                    color:fCat===c?"#07070F":T.sub,
                    border:`1px solid ${fCat===c?(CAT_COLOR_EXT[c]||T.accent):T.border}`,
                    borderRadius:8,padding:"6px 11px",fontSize:11,fontWeight:700,cursor:"pointer",
                  }}>{c}</button>
                ))}
              </div>
            </div>
            <div style={{marginBottom:12}}>
              <Lbl>GERÄT</Lbl>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {EQ_OPTS.map(e=>(
                  <button key={e} onClick={()=>setFEq(e)} style={{
                    background:fEq===e?T.accent:T.bgInput,
                    color:fEq===e?"#07070F":T.sub,
                    border:`1px solid ${fEq===e?T.accent:T.border}`,
                    borderRadius:8,padding:"6px 11px",fontSize:11,fontWeight:700,cursor:"pointer",
                  }}>{e}</button>
                ))}
              </div>
            </div>
          </>}

          {/* Media fields – available for ALL exercises */}
          <div style={{marginBottom:10}}>
            <Lbl>BESCHREIBUNG</Lbl>
            {/* Fix 3: auto-resize */}
            <AutoTextarea value={fDesc} onChange={setFDesc}
              placeholder="Ausführung, Hinweise, Muskelgruppen..."/>
          </div>
          {/* Fix 5: Trainingsnotiz – kurze Notiz die beim Training immer sichtbar ist */}
          <div style={{marginBottom:10}}>
            <Lbl>TRAININGSNOTIZ (immer sichtbar)</Lbl>
            <Inp value={fNote} onChange={setFNote}
              placeholder="z.B. Sitzhöhe 4 · Griff eng · Lehne Stufe 3"/>
            <div style={{fontSize:10,color:T.muted,marginTop:4,lineHeight:1.5}}>
              Wird während jedes Trainings unter der Übung angezeigt.
            </div>
          </div>
          <div style={{marginBottom:12}}>
            <Lbl>VIDEO-LINK (YouTube, etc.)</Lbl>
            <Inp value={fLink} onChange={setFLink} placeholder="https://youtube.com/watch?v=..."/>
          </div>
          <div style={{marginBottom:16}}>
            <Lbl>BILD</Lbl>
            {fImg
              ? <div style={{position:"relative"}}>
                  <img src={fImg} alt="" style={{width:"100%",borderRadius:10,maxHeight:180,objectFit:"cover"}}/>
                  <button onClick={()=>setFImg(null)}
                    style={{position:"absolute",top:8,right:8,background:T.red,border:"none",
                      borderRadius:"50%",width:28,height:28,cursor:"pointer",color:"#fff",
                      fontWeight:900,fontSize:15}}>×</button>
                </div>
              : <div onClick={()=>!imgLoading&&fileRef.current?.click()}
                  style={{border:`1px dashed ${T.border}`,borderRadius:10,padding:"22px",
                    textAlign:"center",cursor:imgLoading?"default":"pointer",color:T.muted,fontSize:13}}>
                  {imgLoading ? "⏳ Komprimiere…" : "📷 Bild auswählen"}
                </div>
            }
            <input ref={fileRef} type="file" accept="image/*" onChange={handleImg} style={{display:"none"}}/>
          </div>

          <Btn onClick={isCreate?saveCreate:saveEdit}
            disabled={(!isBuiltIn&&!fName.trim())||imgLoading} full>
            {isCreate?"Übung erstellen":"Änderungen speichern"}
          </Btn>
        </Card>
      </div>
    );
  }

  // ── LIST VIEW ────────────────────────────────────────
  const filtered = allExercises.filter(e =>
    (cat==="Alle"||e.cat===cat) &&
    (e.name.toLowerCase().includes(search.toLowerCase())||
     e.eq.toLowerCase().includes(search.toLowerCase()))
  );

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"20px 0 12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:22,fontWeight:900,color:T.text}}>
            {selectable?"Übung wählen":"Übungsdatenbank"}
          </div>
          {!selectable&&(
            <Btn v="secondary" onClick={openCreate} style={{padding:"7px 14px",fontSize:12}}>+ Eigene</Btn>
          )}
        </div>
        <Inp value={search} onChange={setSearch} placeholder="🔍 Suchen..."/>
      </div>

      <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:10,paddingBottom:2}}>
        {ALL_CATS.map(c=>(
          <button key={c} onClick={()=>setCat(c)} style={{
            background:cat===c?(CAT_COLOR_EXT[c]||T.accent):T.bgCard,
            color:cat===c?"#07070F":T.sub,
            border:`1px solid ${cat===c?(CAT_COLOR_EXT[c]||T.accent):T.border}`,
            borderRadius:8,padding:"6px 12px",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",
          }}>{c}</button>
        ))}
      </div>

      <div style={{fontSize:11,color:T.muted,marginBottom:10}}>{filtered.length} Übungen</div>

      {filtered.map(ex=>{
        const resolved = resolve(ex);
        const sel = selected.includes(ex.id);
        const hasMedia = resolved.desc||resolved.link||resolved.img;
        const isEnriched = !ex.custom && exerciseOverrides?.[ex.id];
        return (
          <div key={ex.id} style={{
            display:"flex",alignItems:"center",gap:10,padding:"10px 12px",
            borderRadius:12,marginBottom:6,
            background:sel?T.accentGlow:T.bgCard,
            border:`1px solid ${sel?T.accent:T.border}`,
            transition:"all 0.12s",
          }}>
            <div style={{
              width:36,height:36,borderRadius:10,flexShrink:0,
              background:`${CAT_COLOR_EXT[ex.cat]||T.accent}22`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,
            }}>
              {{Brust:"🏋",Rücken:"🔙",Beine:"🦵",Schultern:"💪",Arme:"💪",Core:"⚡",Aufwärmen:"🔥",Dehnung:"🧘"}[ex.cat]||"•"}
            </div>

            {/* Main tap area */}
            <div style={{flex:1,minWidth:0,cursor:"pointer"}}
              onClick={()=>{
                if (selectable) { onSelect&&onSelect(ex); }
                else { setActiveId(ex.id); setMode("detail"); }
              }}>
              <div style={{fontSize:14,fontWeight:700,color:T.text,display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                {ex.name}
                {ex.custom&&<span style={{fontSize:9,color:T.purple,fontWeight:800,letterSpacing:0.3}}>EIGENE</span>}
                {isEnriched&&<span style={{fontSize:9,color:T.teal,fontWeight:800}}>+INFO</span>}
                {hasMedia&&!isEnriched&&!ex.custom&&<span style={{fontSize:11,color:T.muted}}>ℹ</span>}
              </div>
              <div style={{fontSize:11,color:T.sub,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                <span style={{color:CAT_COLOR_EXT[ex.cat]||T.accent}}>{ex.cat}</span> · {ex.eq}
              </div>
            </div>

            {/* Right side */}
            {selectable ? (
              <button onClick={()=>onSelect&&onSelect(ex)} style={{
                background:sel?T.accent:T.bgAlt,
                border:`1px solid ${sel?T.accent:T.border}`,
                borderRadius:8,width:32,height:32,cursor:"pointer",
                fontSize:16,color:sel?"#07070F":T.muted,flexShrink:0,
              }}>{sel?"✓":"+"}</button>
            ) : (
              <button onClick={()=>{setActiveId(ex.id);setMode("detail");}}
                style={{background:"none",border:"none",cursor:"pointer",color:T.muted,fontSize:18,padding:4}}>›</button>
            )}
          </div>
        );
      })}
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// PLAN EDITOR  – vollständig editierbar
// ═══════════════════════════════════════════════════════
const PlanEditor = ({plan, allExercises, exerciseOverrides, setExerciseOverrides, customExercises, setCustomExercises, onSave, onCancel, settings, sessions}) => {
  const [name,setName]=useState(plan?.name||"");
  const [desc,setDesc]=useState(plan?.desc||"");
  const [days,setDays]=useState(()=>JSON.parse(JSON.stringify(plan?.days||[])));
  const [activeDay,setActiveDay]=useState(0);
  const [showDB,setShowDB]=useState(false);
  // Which exercise ID is being info-edited from within the plan editor
  const [infoExId, setInfoExId] = useState(null);

  const addDay   = () => { setDays(d=>[...d,{id:uid(),name:`Tag ${d.length+1}`,exercises:[]}]); setActiveDay(days.length); };
  const remDay   = i  => { setDays(d=>d.filter((_,j)=>j!==i)); setActiveDay(a=>Math.max(0,a-1)); };
  const updDayName=(i,v)=> setDays(d=>d.map((x,j)=>j===i?{...x,name:v}:x));

  const addEx = ex => {
    // Punkt 4: auto-set rest from settings rules
    const defaultRest = getDefaultRestForExercise(ex, settings);
    setDays(d=>d.map((x,i)=>i===activeDay
      ?{...x,exercises:[...x.exercises,{eid:ex.id,sets:3,reps:10,weight:0,rest:defaultRest,note:""}]}
      :x));
    setShowDB(false);
  };
  // Punkt 4: apply rest rules to all exercises in current day
  const applyRestRules = () => {
    if(!window.confirm("Pausen aller Übungen dieses Tages nach den Einstellungen überschreiben?")) return;
    setDays(d=>d.map((day,i)=>i===activeDay?{
      ...day,
      exercises:day.exercises.map(ex=>{
        const exercise=(allExercises||[]).find(e=>e.id===ex.eid);
        return {...ex, rest:getDefaultRestForExercise(exercise, settings)};
      }),
    }:day));
  };
  // Progression anwenden: update planned weights based on last performance
  const applyProgression = () => {
    if (!window.confirm("Geplante Gewichte anhand deiner bisherigen Leistung aktualisieren?\n\nBestehende Einträge werden überschrieben.")) return;
    setDays(d=>d.map((day,i)=>i!==activeDay?day:{
      ...day,
      exercises:day.exercises.map(ex=>{
        const exercise=(allExercises||[]).find(e=>e.id===ex.eid);
        const suggestion=calculateProgressionSuggestion(ex, exercise, sessions||[], settings, allExercises);
        if(!suggestion||suggestion.suggestedWeight<=0) return ex;
        return {...ex, weight:suggestion.suggestedWeight};
      }),
    }));
  };

  const remEx    = (di,ei) => setDays(d=>d.map((x,i)=>i===di?{...x,exercises:x.exercises.filter((_,j)=>j!==ei)}:x));
  const updEx    = (di,ei,f,v) => setDays(d=>d.map((x,i)=>i===di?{
    ...x,exercises:x.exercises.map((e,j)=>j===ei?{...e,[f]:isNaN(Number(v))?v:Number(v)}:e)
  }:x));
  const updExNote= (di,ei,v) => setDays(d=>d.map((x,i)=>i===di?{
    ...x,exercises:x.exercises.map((e,j)=>j===ei?{...e,note:v}:e)
  }:x));
  // Move exercise up/down
  const moveEx = (di,ei,dir) => setDays(d=>d.map((day,i)=>{
    if(i!==di) return day;
    const exs=[...day.exercises];
    const to=ei+dir;
    if(to<0||to>=exs.length) return day;
    [exs[ei],exs[to]]=[exs[to],exs[ei]];
    return {...day,exercises:exs};
  }));

  // Fix 1: Info/Edit overlay – passes initialDetailId so ExerciseDBScreen opens directly on this exercise
  if (infoExId) return (
    <div>
      <div style={{padding:"16px 16px 0",display:"flex",alignItems:"center",gap:10}}>
        <Btn v="ghost" onClick={()=>setInfoExId(null)} style={{padding:"8px 14px"}}>← Zurück zum Plan</Btn>
      </div>
      <ExerciseDBScreen
        allExercises={allExercises}
        customExercises={customExercises} setCustomExercises={setCustomExercises}
        exerciseOverrides={exerciseOverrides} setExerciseOverrides={setExerciseOverrides}
        selectable={false}
        initialDetailId={infoExId}
      />
    </div>
  );

  if (showDB) return (
    <div>
      <div style={{padding:"16px 16px 0",display:"flex",alignItems:"center",gap:10}}>
        <Btn v="ghost" onClick={()=>setShowDB(false)} style={{padding:"8px 14px"}}>← Zurück</Btn>
        <div style={{fontSize:16,fontWeight:700,color:T.text}}>Übung hinzufügen</div>
      </div>
      <ExerciseDBScreen
        allExercises={allExercises}
        onSelect={addEx} selectable
        selected={days[activeDay]?.exercises.map(e=>e.eid)||[]}
      />
    </div>
  );

  return (
    <div style={{padding:"0 16px 24px"}}>
      <div style={{padding:"20px 0 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:20,fontWeight:900,color:T.text}}>{plan?"Bearbeiten":"Neuer Plan"}</div>
        <div style={{display:"flex",gap:8}}>
          <Btn v="ghost" onClick={onCancel} style={{padding:"8px 14px"}}>Abbruch</Btn>
          <Btn disabled={!name.trim()} onClick={()=>onSave({
            id:plan?.id||uid(), name, desc, days,
            archived:plan?.archived||false,
          })} style={{padding:"8px 18px"}}>Speichern</Btn>
        </div>
      </div>

      <div style={{marginBottom:10}}><Lbl>PLANNAME</Lbl><Inp value={name} onChange={setName} placeholder="Mein Plan"/></div>
      <div style={{marginBottom:14}}><Lbl>BESCHREIBUNG</Lbl><Inp value={desc} onChange={setDesc} placeholder="Kurze Beschreibung..."/></div>

      {/* Day tabs */}
      <div style={{display:"flex",gap:7,overflowX:"auto",marginBottom:14,paddingBottom:2}}>
        {days.map((day,i)=>(
          <button key={day.id} onClick={()=>setActiveDay(i)} style={{background:activeDay===i?T.accent:T.bgCard,color:activeDay===i?"#07070F":T.sub,border:`1px solid ${activeDay===i?T.accent:T.border}`,borderRadius:9,padding:"6px 14px",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{day.name}</button>
        ))}
        <button onClick={addDay} style={{background:T.bgAlt,color:T.accent,border:`1px dashed ${T.accent}`,borderRadius:9,padding:"6px 14px",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Tag</button>
      </div>

      {days[activeDay] && (
        <Card>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <input value={days[activeDay].name} onChange={e=>updDayName(activeDay,e.target.value)}
              style={{background:"transparent",border:"none",outline:"none",fontSize:16,fontWeight:700,color:T.accent,flex:1}}/>
            <button onClick={()=>remDay(activeDay)} style={{background:"none",border:"none",cursor:"pointer",color:T.red,fontSize:18,padding:4}}>🗑</button>
          </div>

          {days[activeDay].exercises.length===0&&(
            <div style={{textAlign:"center",padding:"20px 0",color:T.muted,fontSize:13,border:`1px dashed ${T.border}`,borderRadius:12,marginBottom:10}}>
              Noch keine Übungen
            </div>
          )}

          {days[activeDay].exercises.map((ex,j)=>{
            const e=allExercises.find(x=>x.id===ex.eid);
            return (
              <div key={`${ex.eid}-${j}`} style={{background:T.bgAlt,borderRadius:12,padding:12,marginBottom:8,border:`1px solid ${T.border}`}}>
                {/* Header */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:700,color:T.text}}>{e?.name||"Unbekannte Übung"}</div>
                    <div style={{fontSize:11,color:T.sub}}>{e?.cat} · {e?.eq}</div>
                  </div>
                  <div style={{display:"flex",gap:4,flexShrink:0}}>
                    {/* Info/Edit button – opens exercise detail editor */}
                    <button onClick={()=>setInfoExId(ex.eid)} title="Beschreibung / Video / Bild bearbeiten"
                      style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:6,
                        padding:"2px 8px",cursor:"pointer",color:T.blue,fontSize:12,fontWeight:700}}>ℹ</button>
                    <button onClick={()=>moveEx(activeDay,j,-1)} disabled={j===0}
                      style={{background:"none",border:`1px solid ${T.border}`,borderRadius:6,padding:"2px 7px",cursor:"pointer",color:j===0?T.muted:T.sub,fontSize:12}}>↑</button>
                    <button onClick={()=>moveEx(activeDay,j,+1)} disabled={j===days[activeDay].exercises.length-1}
                      style={{background:"none",border:`1px solid ${T.border}`,borderRadius:6,padding:"2px 7px",cursor:"pointer",color:j===days[activeDay].exercises.length-1?T.muted:T.sub,fontSize:12}}>↓</button>
                    <button onClick={()=>remEx(activeDay,j)}
                      style={{background:"none",border:"none",cursor:"pointer",color:T.red,fontSize:16,padding:"2px 4px"}}>✕</button>
                  </div>
                </div>
                {/* Set fields */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:8}}>
                  {[{l:"Sätze",f:"sets",v:ex.sets},{l:(()=>{const e=(allExercises||[]).find(x=>x.id===ex.eid);const ut=e?.unitType||"reps";return ut==="secs"?"Sek":ut==="mins"?"Min":"Wdh";})(),f:"reps",v:ex.reps},{l:"kg",f:"weight",v:ex.weight},{l:"Pause (s)",f:"rest",v:ex.rest}].map(fi=>(
                    <div key={fi.f}>
                      <div style={{fontSize:9,color:T.muted,textAlign:"center",marginBottom:3}}>{fi.l}</div>
                      <input type="number" value={fi.v} onChange={e=>updEx(activeDay,j,fi.f,e.target.value)}
                        style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,padding:"6px 4px",color:T.text,fontSize:14,fontWeight:700,width:"100%",textAlign:"center",boxSizing:"border-box"}}/>
                    </div>
                  ))}
                </div>
                {/* Note */}
                <input value={ex.note||""} onChange={e=>updExNote(activeDay,j,e.target.value)}
                  placeholder="Notiz (optional)"
                  style={{background:T.bgInput,border:`1px solid ${T.border}`,borderRadius:8,padding:"6px 10px",color:T.text,fontSize:12,width:"100%",boxSizing:"border-box",outline:"none"}}/>
              </div>
            );
          })}
          <div style={{display:"flex",gap:8,marginTop:6}}>
            <Btn v="secondary" onClick={()=>setShowDB(true)} style={{flex:2}}>+ Übung hinzufügen</Btn>
            <Btn v="ghost" onClick={applyRestRules} style={{flex:1,fontSize:11,padding:"8px 4px"}}
              title="Pausen aller Übungen dieses Tages nach den Einstellungen setzen">
              ⏱ Pausen
            </Btn>
            {getProgressionSettings(settings).enabled&&(sessions||[]).length>=getProgressionSettings(settings).minSessionsBeforeSuggestion&&(
              <Btn v="ghost" onClick={applyProgression} style={{flex:1,fontSize:11,padding:"8px 4px"}}
                title="Gewichte anhand letzter Trainingsleistung aktualisieren">
                📈 Prog.
              </Btn>
            )}
          </div>
        </Card>
      )}
    </div>
  );
};

const ProgressionTip = ({plan}) => {
